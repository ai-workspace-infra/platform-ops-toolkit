name: Release Quality
description: Run repository release security checks.

runs:
  using: composite
  steps:
    - name: Install gitleaks
      shell: bash
      run: ${{ github.action_path }}/scripts/install-gitleaks.sh

    - name: Run gitleaks detect
      shell: bash
      run: ${{ github.action_path }}/scripts/run-gitleaks-detect.sh
