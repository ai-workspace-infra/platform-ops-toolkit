name: Configure GCP OIDC credentials
description: Login to Vault with GitHub JWT and exchange GitHub OIDC through Google STS/WIF.

inputs:
  environment:
    description: Target deployment environment.
    required: true
  credential_environment:
    description: Vault environment path containing the GCP OIDC record. Defaults to the deployment environment.
    required: false
    default: ""
  account_id:
    description: Stable GCP account identifier used in the Vault role and path.
    required: true
  vault_addr:
    description: Vault address.
    required: false
    default: https://vault.svc.plus
  vault_role:
    description: Optional narrowly-scoped Vault JWT role override for a non-Terraform GCP service stage.
    required: false
    default: ''
  load_state_contract:
    description: Whether this caller needs the S3-compatible Terraform state credentials.
    required: false
    default: 'true'

outputs:
  project_id:
    description: GCP project ID from the environment-scoped OIDC record.
    value: ${{ steps.identity.outputs.project_id }}
  provider:
    description: GCP Workload Identity Provider resource name.
    value: ${{ steps.identity.outputs.provider }}
  service_account:
    description: GCP deploy Service Account email.
    value: ${{ steps.identity.outputs.service_account }}
  state_endpoint:
    description: Shared S3-compatible Terraform state endpoint.
    value: ${{ steps.identity.outputs.state_endpoint }}
  state_bucket:
    description: Shared Terraform state bucket.
    value: ${{ steps.identity.outputs.state_bucket }}
  state_access_key:
    description: Short-lived Terraform state access key.
    value: ${{ steps.identity.outputs.state_access_key }}
  state_secret_key:
    description: Short-lived Terraform state secret key.
    value: ${{ steps.identity.outputs.state_secret_key }}
  state_region:
    description: Terraform state backend region.
    value: ${{ steps.identity.outputs.state_region }}

runs:
  using: composite
  steps:
    - name: Load the environment-authorized GCP identity from Vault
      id: identity
      uses: ./.github/actions/load-gcp-cloud-identity
      with:
        environment: ${{ inputs.environment }}
        credential_environment: ${{ inputs.credential_environment }}
        account_id: ${{ inputs.account_id }}
        vault_addr: ${{ inputs.vault_addr }}
        vault_role: ${{ inputs.vault_role }}
        load_state_contract: ${{ inputs.load_state_contract }}

    - name: Exchange GitHub OIDC token through Google STS
      uses: ./iac_modules/.github/actions/auth-gcp-cloud
      with:
        provider: ${{ steps.identity.outputs.provider }}
        service-account: ${{ steps.identity.outputs.service_account }}
        audience: ${{ steps.identity.outputs.audience }}
        reconcile: 'false'
        cleanup-credentials: 'true'
        load-state-contract: ${{ inputs.load_state_contract }}
        state-endpoint: ${{ steps.identity.outputs.state_endpoint }}
        state-bucket: ${{ steps.identity.outputs.state_bucket }}
        state-access-key: ${{ steps.identity.outputs.state_access_key }}
        state-secret-key: ${{ steps.identity.outputs.state_secret_key }}
        state-region: ${{ steps.identity.outputs.state_region }}
