name: Load authorized GCP identity
description: >-
  Select the environment-scoped Vault role and return the authorized GCP WIF
  and optional Terraform state contracts without invoking a cloud provider.

inputs:
  environment:
    description: Target deployment environment
    required: true
  credential_environment:
    description: Vault environment containing the GCP OIDC record; defaults to the deployment environment
    required: false
    default: ''
  account_id:
    description: Stable GCP account identifier used in the Vault role and path
    required: true
  identity_path:
    description: Optional exact Vault KV v2 data path selected by a reviewed declaration
    required: false
    default: ''
  vault_addr:
    description: Vault address
    required: false
    default: https://vault.svc.plus
  vault_role:
    description: Optional narrowly-scoped Vault JWT role override
    required: false
    default: ''
  load_state_contract:
    description: Whether the caller needs the S3-compatible Terraform state contract
    required: false
    default: 'true'

outputs:
  project_id:
    description: GCP project ID from the environment-scoped OIDC record
    value: ${{ steps.vault.outputs.GCP_PROJECT_ID }}
  provider:
    description: GCP Workload Identity Provider resource name
    value: ${{ steps.vault.outputs.GCP_WORKLOAD_IDENTITY_PROVIDER }}
  service_account:
    description: GCP deploy service account email
    value: ${{ steps.vault.outputs.GCP_SERVICE_ACCOUNT_EMAIL }}
  audience:
    description: GCP WIF audience
    value: ${{ steps.vault.outputs.GCP_OIDC_AUDIENCE }}
  state_endpoint:
    description: Shared S3-compatible Terraform state endpoint
    value: ${{ steps.state.outputs.TF_STATE_ENDPOINT }}
  state_bucket:
    description: Shared Terraform state bucket
    value: ${{ steps.state.outputs.TF_STATE_BUCKET }}
  state_access_key:
    description: Short-lived Terraform state access key
    value: ${{ steps.state.outputs.TF_STATE_ACCESS_KEY }}
  state_secret_key:
    description: Short-lived Terraform state secret key
    value: ${{ steps.state.outputs.TF_STATE_SECRET_KEY }}
  state_region:
    description: Terraform state backend region
    value: ${{ steps.state.outputs.TF_STATE_REGION }}

runs:
  using: composite
  steps:
    - name: Login to Vault with GitHub OIDC JWT
      id: vault
      uses: hashicorp/vault-action@v4
      with:
        url: ${{ inputs.vault_addr }}
        method: jwt
        role: ${{ inputs.vault_role || format('github-actions-platform-ops-toolkit-{0}-gcp-oidc-{1}', inputs.environment, inputs.account_id) }}
        jwtGithubAudience: vault
        exportToken: false
        secrets: |
          ${{ inputs.identity_path || format('kv/data/{0}/platform/oidc/{1}', inputs.credential_environment || inputs.environment, inputs.account_id) }} gcp_workload_identity_provider | GCP_WORKLOAD_IDENTITY_PROVIDER ;
          ${{ inputs.identity_path || format('kv/data/{0}/platform/oidc/{1}', inputs.credential_environment || inputs.environment, inputs.account_id) }} deploy_service_account | GCP_SERVICE_ACCOUNT_EMAIL ;
          ${{ inputs.identity_path || format('kv/data/{0}/platform/oidc/{1}', inputs.credential_environment || inputs.environment, inputs.account_id) }} gcp_oidc_audience | GCP_OIDC_AUDIENCE ;
          ${{ inputs.identity_path || format('kv/data/{0}/platform/oidc/{1}', inputs.credential_environment || inputs.environment, inputs.account_id) }} project_id | GCP_PROJECT_ID ;

    - name: Load S3-compatible Terraform state contract
      id: state
      if: inputs.load_state_contract != 'false'
      uses: hashicorp/vault-action@v4
      with:
        url: ${{ inputs.vault_addr }}
        method: jwt
        role: ${{ inputs.vault_role || format('github-actions-platform-ops-toolkit-{0}-gcp-oidc-{1}', inputs.environment, inputs.account_id) }}
        jwtGithubAudience: vault
        exportToken: false
        secrets: |
          kv/data/CICD/${{ inputs.environment }}/iac_state TF_STATE_ENDPOINT | TF_STATE_ENDPOINT ;
          kv/data/CICD/${{ inputs.environment }}/iac_state TF_STATE_BUCKET | TF_STATE_BUCKET ;
          kv/data/CICD/${{ inputs.environment }}/iac_state TF_STATE_ACCESS_KEY | TF_STATE_ACCESS_KEY ;
          kv/data/CICD/${{ inputs.environment }}/iac_state TF_STATE_SECRET_KEY | TF_STATE_SECRET_KEY ;
          kv/data/CICD/${{ inputs.environment }}/iac_state TF_STATE_REGION | TF_STATE_REGION
