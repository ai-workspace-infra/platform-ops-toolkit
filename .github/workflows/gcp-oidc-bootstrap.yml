name: Compatibility / gcp-oidc-bootstrap
'on':
  workflow_dispatch:
    inputs:
      environment:
        description: GCP environment to bootstrap
        type: choice
        required: true
        default: uat
        options:
          - uat
          - prod
          - shared
      action:
        description: plan validates the declaration; apply reconciles GCP WIF and IAM.
        type: choice
        required: true
        default: plan
        options:
          - plan
          - apply
      gcp_oidc_manifest:
        description: Optional GitOps OIDC declaration path for a concrete shared GCP account.
        type: string
        required: false
        default: ''
      target_manifest:
        description: Reviewed IaCPipelineTargets path; missing/ambiguous legacy identity fails closed
        type: string
        required: false
        default: ''
      iac_ref:
        description: Owner code/module revision
        type: string
        required: false
        default: ''
      gitops_ref:
        description: Fixed declaration revision or explicitly selected ref
        type: string
        required: false
        default: ''
      bootstrap_mode:
        description: verify existing identity or explicitly reconcile using one-time credential
        type: string
        required: false
        default: reconcile
  workflow_call:
    inputs:
      environment:
        type: string
        required: false
        default: uat
      action:
        type: string
        required: false
        default: plan
      gcp_oidc_manifest:
        type: string
        required: false
        default: ''
      target_manifest:
        description: Reviewed IaCPipelineTargets path; missing/ambiguous legacy identity fails closed
        type: string
        required: false
        default: ''
      iac_ref:
        description: Owner code/module revision
        type: string
        required: false
        default: ''
      gitops_ref:
        description: Fixed declaration revision or explicitly selected ref
        type: string
        required: false
        default: ''
      bootstrap_mode:
        description: verify existing identity or explicitly reconcile using one-time credential
        type: string
        required: false
        default: reconcile
permissions:
  contents: read
  id-token: write
  actions: read
jobs:
  resolve:
    runs-on: ubuntu-latest
    outputs:
      target_manifest: ${{ steps.normalize.outputs.target_manifest }}
      selectors: ${{ steps.normalize.outputs.selectors }}
      action: ${{ steps.normalize.outputs.action }}
      environment: ${{ steps.normalize.outputs.environment }}
      gitops_sha: ${{ steps.normalize.outputs.gitops_sha }}
      iac_sha: ${{ steps.normalize.outputs.iac_sha }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: ai-workspace-infra/iac_modules
          ref: ${{ inputs.iac_ref || 'be8456282f7495e098170e0894e742605a94dae6' }}
          path: iac_modules
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: ai-workspace-infra/gitops
          ref: ${{ inputs.gitops_ref || '4e052f34675a218df0179677088266c6e7f57f6c' }}
          path: gitops
          persist-credentials: false
      - id: normalize
        uses: ./iac_modules/.github/actions/iac-legacy-inputs
        with:
          inputs-json: ${{ toJSON(inputs) }}
          stage: bootstrap
          provider: gcp-cloud
          iac-root: ${{ github.workspace }}/iac_modules
          gitops-root: ${{ github.workspace }}/gitops
  pipeline:
    needs: resolve
    if: ${{ !cancelled() && needs.resolve.result == 'success' }}
    uses: ./.github/workflows/iac-pipeline-multi-cloud-master.yaml
    with:
      action: ${{ needs.resolve.outputs.action }}
      environment: ${{ needs.resolve.outputs.environment }}
      target_manifest: ${{ needs.resolve.outputs.target_manifest }}
      gitops_ref: ${{ needs.resolve.outputs.gitops_sha }}
      iac_ref: ${{ needs.resolve.outputs.iac_sha }}
      stage_scope: bootstrap
      bootstrap_mode: ${{ inputs.bootstrap_mode }}
      selectors: ${{ needs.resolve.outputs.selectors }}
      correlation_id: ${{ github.run_id }}:${{ github.run_attempt }}:compat
    secrets: inherit
