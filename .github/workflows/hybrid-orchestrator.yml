name: Hybrid Orchestrator

# The parent owns ordering only. Terraform, serverless, and existing inventory
# mutations remain in their child workflows. `all` is eight ordered lanes.

permissions:
  id-token: write
  contents: read
  actions: write

on:
  workflow_dispatch:
    inputs:
      operation:
        description: 'plan=child plans; apply=Terraform apply plus serverless plan; deploy=full child deployment'
        required: true
        default: plan
        type: choice
        options: [plan, apply, deploy]
      target_domains:
        description: 'UAT scope; all runs the versioned eight-resource matrix'
        required: true
        default: all
        type: choice
        options: [all]
      deploy_tag:
        description: 'Immutable UAT daily-build tag; required for deploy'
        required: false
        default: ''
        type: string
      source_ref:
        description: 'Shared Toolkit/IaC/Playbooks ref'
        required: false
        default: main
        type: string
      runner_type:
        description: 'Runner for parent and children'
        required: false
        default: ubuntu-latest
        type: choice
        options: [ubuntu-latest, self-hosted]
      vault_env_path:
        description: 'Target Vault environment'
        required: true
        default: uat
        type: choice
        options: [uat]
      target_domain_base:
        description: 'UAT application domain suffix'
        required: true
        default: onwalk.net
        type: string
      observability_endpoint:
        description: 'Central observability endpoint'
        required: true
        default: https://observability.svc.plus
        type: string
      akamai_account:
        description: 'Concrete Akamai account name, not an alias'
        required: true
        default: manbuzhe2026
        type: string
      aws_account:
        description: 'Concrete AWS account ID for JP'
        required: true
        type: string
      gcp_account:
        description: 'Concrete GCP account/project identity'
        required: true
        type: string
      existing_account:
        description: 'Concrete external inventory account name'
        required: true
        default: ucloud-ulighthost
        type: string
      routing_mode:
        description: 'Cloudflare Pages/Workers routing policy'
        required: true
        default: selfhost-first
        type: choice
        options: [selfhost-first, selfhost-only, cloud-run-first, cloud-run-only]
      vault_addr:
        description: 'Optional Vault address override'
        required: false
        default: https://vault.svc.plus
        type: string
      xconnect_gateway_ref:
        description: 'Configurable XConnect Gateway record'
        required: true
        default: tw-xconnect.svc.plus
        type: string

concurrency:
  group: hybrid-uat-${{ inputs.target_domains || 'all' }}-${{ inputs.operation || 'plan' }}
  cancel-in-progress: false

jobs:
  preflight:
    name: '[0] Prepare | eight-resource contract'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Validate matrix contract
        run: ./.github/scripts/tests/hybrid_uat_matrix_contract_test.sh
      - name: Checkout GitOps hybrid topology
        uses: actions/checkout@v7
        with:
          repository: ai-workspace-infra/gitops
          ref: main
          path: gitops
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            topology/uat/hybrid/runtime-topology.yaml
            topology/uat/serverless/runtime-topology.yaml
      - name: Validate hybrid routing contract
        run: |
          ./.github/scripts/serverless/prepare_gitops_routing_config.sh
          python3 scripts/serverless_uat/validate_cloudflare_boundaries.py
          GITOPS_ROUTING_YAML="${GITHUB_WORKSPACE}/gitops/topology/uat/serverless/runtime-topology.yaml" \
            GITOPS_ROUTING_OUTPUT="${RUNNER_TEMP}/serverless-routing.json" \
            ./.github/scripts/serverless/prepare_gitops_routing_config.sh
          SERVERLESS_CONFIG="${RUNNER_TEMP}/serverless-routing.json" \
            python3 scripts/serverless_uat/validate_cloudflare_boundaries.py
        env:
          GITOPS_ROUTING_YAML: ${{ github.workspace }}/gitops/topology/uat/hybrid/runtime-topology.yaml
          GITOPS_ROUTING_OUTPUT: ${{ runner.temp }}/hybrid-routing.json
          CLOUDFLARE_BOUNDARY_CONFIG: ${{ runner.temp }}/hybrid-routing.json
          REQUIRED_RUNTIME_MODE: hybrid

  resource_orchestration:
    name: '[1] Execute | eight ordered resource lanes'
    needs: preflight
    if: ${{ needs.preflight.result == 'success' }}
    runs-on: ${{ inputs.runner_type || 'ubuntu-latest' }}
    environment: uat
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.ref_name }}
      - name: Dispatch and wait for resource lanes
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          MATRIX_FILE: ${{ github.workspace }}/.github/hybrid/uat-resource-matrix.json
          OPERATION: ${{ inputs.operation }}
          CHILD_REF: ${{ github.ref_name }}
          VAULT_ENV_PATH: ${{ inputs.vault_env_path }}
          TARGET_DOMAIN_BASE: ${{ inputs.target_domain_base }}
          OBSERVABILITY_ENDPOINT: ${{ inputs.observability_endpoint }}
          AKAMAI_ACCOUNT: ${{ inputs.akamai_account }}
          AWS_ACCOUNT: ${{ inputs.aws_account }}
          GCP_ACCOUNT: ${{ inputs.gcp_account }}
          EXISTING_ACCOUNT: ${{ inputs.existing_account }}
          RUNNER_TYPE: ${{ inputs.runner_type }}
          SOURCE_REF: ${{ inputs.source_ref }}
          DEPLOY_TAG: ${{ inputs.deploy_tag }}
          VAULT_ADDR: ${{ inputs.vault_addr }}
          XCONNECT_GATEWAY_REF: ${{ inputs.xconnect_gateway_ref }}
        run: ./.github/scripts/platform-ops/provision/platform-ops_dispatch-hybrid-uat-matrix.sh

  # This remains a visible concurrency boundary for the existing public-state
  # contract. The Serverless child owns the actual Pages/Workers deployment.
  edge_gateway:
    name: '[2] Edge handoff | ${{ matrix.boundary }} | delegated to Serverless child'
    needs: resource_orchestration
    if: ${{ needs.resource_orchestration.result == 'success' }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        boundary: [auth, admin, core]
    concurrency:
      group: edge-gateway-${{ inputs.vault_env_path || 'uat' }}-${{ matrix.boundary }}
      cancel-in-progress: false
    steps:
      - name: Confirm edge ownership
        run: echo 'Cloudflare Pages/Workers are deployed by serverless-orchestrator.'

  verify:
    name: '[3] Verify | routing summary'
    needs: [preflight, resource_orchestration, edge_gateway]
    if: ${{ always() && needs.preflight.result == 'success' && needs.resource_orchestration.result == 'success' && needs.edge_gateway.result == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/checkout@v7
        with:
          repository: ai-workspace-infra/gitops
          ref: main
          path: gitops
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            topology/uat/hybrid/runtime-topology.yaml
            topology/uat/serverless/runtime-topology.yaml
      - name: Verify hybrid routing
        run: |
          ./.github/scripts/serverless/prepare_gitops_routing_config.sh
          python3 scripts/serverless_uat/validate_cloudflare_boundaries.py
          GITOPS_ROUTING_YAML="${GITHUB_WORKSPACE}/gitops/topology/uat/serverless/runtime-topology.yaml" \
            GITOPS_ROUTING_OUTPUT="${RUNNER_TEMP}/serverless-routing.json" \
            ./.github/scripts/serverless/prepare_gitops_routing_config.sh
          SERVERLESS_CONFIG="${RUNNER_TEMP}/serverless-routing.json" \
            python3 scripts/serverless_uat/validate_cloudflare_boundaries.py
          ./.github/scripts/serverless/verify_hybrid_contract.sh
        env:
          GITOPS_ROUTING_YAML: ${{ github.workspace }}/gitops/topology/uat/hybrid/runtime-topology.yaml
          GITOPS_ROUTING_OUTPUT: ${{ runner.temp }}/hybrid-routing.json
          CLOUDFLARE_BOUNDARY_CONFIG: ${{ runner.temp }}/hybrid-routing.json
          REQUIRED_RUNTIME_MODE: hybrid
          HYBRID_CONFIG: ${{ runner.temp }}/hybrid-routing.json
          SERVERLESS_CONFIG: ${{ runner.temp }}/serverless-routing.json
