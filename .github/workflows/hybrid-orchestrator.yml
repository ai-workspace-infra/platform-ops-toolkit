name: Hybrid Orchestrator

# The parent owns ordering only. Terraform, serverless, and existing inventory
# mutations remain in their child workflows. `all` is an eight-row inventory;
# routine `deploy` runs only business-scoped rows, while shared infrastructure
# rows remain available for explicit plan/apply maintenance.

permissions:
  id-token: write
  contents: read
  actions: write

on:
  workflow_dispatch:
    inputs:
      operation:
        description: 'plan=child plans; apply=Terraform apply plus serverless plan; deploy=full child deployment; destroy=ephemeral Terraform/serverless resources only'
        required: true
        default: plan
        type: choice
        options: [plan, apply, deploy, destroy]
      target_domains:
        description: 'UAT scope; all runs the versioned eight-row inventory (deploy skips shared infrastructure)'
        required: true
        default: all
        type: choice
        options: [all]
      deploy_tag:
        description: 'Immutable UAT daily-build tag; required for deploy'
        required: false
        default: ''
        type: string
      source_ref:
        description: 'Shared Toolkit/IaC/Playbooks ref'
        required: false
        default: main
        type: string
      runner_type:
        description: 'Runner for parent and children'
        required: false
        default: ubuntu-latest
        type: choice
        options: [ubuntu-latest, self-hosted]
      vault_env_path:
        description: 'Target Vault environment'
        required: true
        default: uat
        type: choice
        options: [uat]
      target_domain_base:
        description: 'UAT application domain suffix'
        required: true
        default: onwalk.net
        type: string
      observability_endpoint:
        description: 'Central observability endpoint'
        required: true
        default: https://observability.svc.plus
        type: string
      akamai_account:
        description: 'Concrete Akamai account name, not an alias'
        required: false
        default: manbuzhe2026
        type: string
      aws_account:
        description: 'Concrete AWS account ID for JP; UAT default account'
        required: false
        default: '081434641398'
        type: string
      gcp_account:
        description: 'Concrete GCP account/project identity'
        required: false
        default: ''
        type: string
      vultr_account:
        description: 'Concrete Vultr account identity'
        required: false
        default: ''
        type: string
      ucloud_account:
        description: 'Concrete UCloud account identity when its Terraform adapter is selected'
        required: false
        default: ''
        type: string
      existing_account:
        description: 'Concrete external inventory account name'
        required: false
        default: ucloud-ulighthost
        type: string
      routing_mode:
        description: 'Cloudflare Pages/Workers routing policy'
        required: true
        default: selfhost-first
        type: choice
        options: [selfhost-first, selfhost-only, cloud-run-first, cloud-run-only]
      vault_addr:
        description: 'Optional Vault address override'
        required: false
        default: https://vault.svc.plus
        type: string
      xconnect_gateway_ref:
        description: 'Configurable XConnect Gateway record'
        required: true
        default: tw-xconnect.svc.plus
        type: string
      xconnect_migration:
        description: 'Explicitly enroll the protected legacy observability One from the migration source record; keep false for normal UAT deploys'
        required: true
        default: false
        type: boolean
      data_config_json:
        description: 'Optional explicit data operation JSON with mode; empty for normal deploys; never include secrets'
        type: string
        default: '{}'
      adopt_accounts_baseline:
        description: 'UAT-only: adopt the reviewed expand-only Accounts baseline before the web-saas deployment'
        required: false
        default: false
        type: boolean
      apply_accounts_schema_migration:
        description: 'UAT-only: apply one reviewed Accounts migration before the web-saas deployment'
        required: false
        default: false
        type: boolean
      accounts_schema_expected_version:
        description: 'UAT schema_migrations version before the reviewed migration'
        required: false
        default: ''
        type: string
      accounts_schema_target_version:
        description: 'Exact target version of the reviewed Accounts migration'
        required: false
        default: ''
        type: string
      accounts_schema_sha256:
        description: 'SHA-256 of the reviewed Accounts migration file'
        required: false
        default: ''
        type: string

concurrency:
  group: hybrid-uat-${{ inputs.target_domains || 'all' }}-${{ inputs.operation || 'plan' }}
  cancel-in-progress: false

jobs:
  preflight:
    name: '[0] Prepare | eight-resource contract'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Checkout GitOps hybrid topology
        uses: actions/checkout@v7
        with:
          repository: ai-workspace-infra/gitops
          ref: main
          path: gitops
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            topology/uat/hybrid/runtime-topology.yaml
            topology/uat/hybrid/resource-matrix.yaml
            resources/onwalk.net/uat/gcp/open-platform.yaml
            resources/onwalk.net/uat/gcp/web-saas.yaml
            resources/svc.plus/uat/gcp/ai-workspace.yaml
            resources/svc.plus/uat/gcp/agent-proxy-us.yaml
            topology/uat/serverless/runtime-topology.yaml
      - name: Validate GitOps resource matrix contract
        env:
          GITOPS_MATRIX_FILE: ${{ github.workspace }}/gitops/topology/uat/hybrid/resource-matrix.yaml
          GITOPS_OPEN_PLATFORM_FILE: ${{ github.workspace }}/gitops/resources/onwalk.net/uat/gcp/open-platform.yaml
          GITOPS_RESOURCE_ROOTS: ${{ github.workspace }}/gitops/resources/onwalk.net/uat/gcp:${{ github.workspace }}/gitops/resources/svc.plus/uat/gcp
        run: ./.github/scripts/tests/hybrid_uat_matrix_contract_test.sh
      - name: Validate hybrid routing contract
        run: |
          ./.github/scripts/gitops/prepare_gitops_routing_config.sh
          python3 scripts/serverless_uat/validate_cloudflare_boundaries.py
          GITOPS_ROUTING_YAML="${GITHUB_WORKSPACE}/gitops/topology/uat/serverless/runtime-topology.yaml" \
            GITOPS_ROUTING_OUTPUT="${RUNNER_TEMP}/serverless-routing.json" \
            ./.github/scripts/gitops/prepare_gitops_routing_config.sh
          SERVERLESS_CONFIG="${RUNNER_TEMP}/serverless-routing.json" \
            python3 scripts/serverless_uat/validate_cloudflare_boundaries.py
        env:
          GITOPS_ROUTING_YAML: ${{ github.workspace }}/gitops/topology/uat/hybrid/runtime-topology.yaml
          GITOPS_ROUTING_OUTPUT: ${{ runner.temp }}/hybrid-routing.json
          CLOUDFLARE_BOUNDARY_CONFIG: ${{ runner.temp }}/hybrid-routing.json
          REQUIRED_RUNTIME_MODE: hybrid

  data_operations:
    name: '[1] Delegate | environment data operation'
    needs: preflight
    if: ${{ fromJSON(inputs.data_config_json).mode }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Dispatch and wait for data result
        run: python3 .github/scripts/environment-upgrade/dispatch.py
        env:
          GH_TOKEN: ${{ github.token }}
          DATA_ENVIRONMENT: ${{ inputs.vault_env_path }}
          DATA_OPERATION: ${{ fromJSON(inputs.data_config_json).mode }}
          DATA_CONFIG_JSON: ${{ inputs.data_config_json }}
          RELEASE_TAG: ${{ inputs.deploy_tag }}
          ACCOUNTS_REF: ${{ inputs.deploy_tag || 'main' }}

  resource_orchestration:
    name: '[1] Execute | eight ordered resource lanes'
    needs: [preflight, data_operations]
    if: ${{ always() && needs.preflight.result == 'success' && (needs.data_operations.result == 'success' || needs.data_operations.result == 'skipped') }}
    runs-on: ${{ inputs.runner_type || 'ubuntu-latest' }}
    environment: uat
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.ref_name }}
      - name: Checkout GitOps resource matrix
        uses: actions/checkout@v7
        with:
          repository: ai-workspace-infra/gitops
          ref: main
          path: gitops
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            topology/uat/hybrid/resource-matrix.yaml
      - name: Render resource matrix for the frozen dispatcher
        uses: ./.github/actions/gitops-yaml-json
        with:
          source: ${{ github.workspace }}/gitops/topology/uat/hybrid/resource-matrix.yaml
          output: ${{ runner.temp }}/hybrid-resource-matrix.json
      - name: Dispatch and wait for resource lanes
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          MATRIX_FILE: ${{ runner.temp }}/hybrid-resource-matrix.json
          REGISTRY_FILE: ${{ github.workspace }}/config/iac_provider_registry.json
          OPERATION: ${{ inputs.operation }}
          # Dispatch every child from the explicitly selected shared ref. The
          # parent run may be started from a feature branch, while the
          # operator-selected source_ref is the contract for Toolkit,
          # Playbooks, and IaC revisions used by all child workflows.
          CHILD_REF: ${{ inputs.source_ref || 'main' }}
          VAULT_ENV_PATH: ${{ inputs.vault_env_path }}
          TARGET_DOMAIN_BASE: ${{ inputs.target_domain_base }}
          OBSERVABILITY_ENDPOINT: ${{ inputs.observability_endpoint }}
          AKAMAI_ACCOUNT: ${{ inputs.akamai_account }}
          AWS_ACCOUNT: ${{ inputs.aws_account }}
          GCP_ACCOUNT: ${{ inputs.gcp_account }}
          VULTR_ACCOUNT: ${{ inputs.vultr_account }}
          UCLOUD_ACCOUNT: ${{ inputs.ucloud_account }}
          EXISTING_ACCOUNT: ${{ inputs.existing_account }}
          RUNNER_TYPE: ${{ inputs.runner_type }}
          SOURCE_REF: ${{ inputs.source_ref }}
          DEPLOY_TAG: ${{ inputs.deploy_tag }}
          VAULT_ADDR: ${{ inputs.vault_addr }}
          XCONNECT_GATEWAY_REF: ${{ inputs.xconnect_gateway_ref }}
          XCONNECT_MIGRATION: ${{ inputs.xconnect_migration }}
          ADOPT_ACCOUNTS_BASELINE: ${{ inputs.adopt_accounts_baseline }}
          APPLY_ACCOUNTS_SCHEMA_MIGRATION: ${{ inputs.apply_accounts_schema_migration }}
          ACCOUNTS_SCHEMA_EXPECTED_VERSION: ${{ inputs.accounts_schema_expected_version }}
          ACCOUNTS_SCHEMA_TARGET_VERSION: ${{ inputs.accounts_schema_target_version }}
          ACCOUNTS_SCHEMA_SHA256: ${{ inputs.accounts_schema_sha256 }}
          UAT_ARTIFACT_DIR: ${{ runner.temp }}/uat-artifacts
        run: ./.github/scripts/platform-ops/provision/platform-ops_dispatch-hybrid-uat-matrix.sh
      # The UAT verdict and the exact images it accepted travel together; a
      # PROD promotion consumes only this manifest (plan §7, GAP-16).
      - name: Upload the UAT artifact manifest
        uses: actions/upload-artifact@v7
        with:
          name: uat-artifact-manifest
          path: ${{ runner.temp }}/uat-artifacts/uat-artifact-manifest.json
          if-no-files-found: ignore

  # This remains a visible concurrency boundary for the existing public-state
  # contract. The Serverless child owns the actual Pages/Workers deployment.
  edge_gateway:
    name: '[2] Edge handoff | ${{ matrix.boundary }} | delegated to Serverless child'
    needs: resource_orchestration
    if: ${{ always() && needs.resource_orchestration.result == 'success' }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        boundary: [auth, admin, core]
    concurrency:
      group: edge-gateway-${{ inputs.vault_env_path || 'uat' }}-${{ matrix.boundary }}
      cancel-in-progress: false
    steps:
      - name: Confirm edge ownership
        run: echo 'Cloudflare Pages/Workers are deployed by serverless-orchestrator.'

  verify:
    name: '[3] Verify | routing summary'
    needs: [preflight, resource_orchestration, edge_gateway]
    if: ${{ always() && needs.preflight.result == 'success' && needs.resource_orchestration.result == 'success' && needs.edge_gateway.result == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/checkout@v7
        with:
          repository: ai-workspace-infra/gitops
          ref: main
          path: gitops
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            topology/uat/hybrid/runtime-topology.yaml
            topology/uat/serverless/runtime-topology.yaml
      - name: Verify hybrid routing
        run: |
          ./.github/scripts/gitops/prepare_gitops_routing_config.sh
          python3 scripts/serverless_uat/validate_cloudflare_boundaries.py
          GITOPS_ROUTING_YAML="${GITHUB_WORKSPACE}/gitops/topology/uat/serverless/runtime-topology.yaml" \
            GITOPS_ROUTING_OUTPUT="${RUNNER_TEMP}/serverless-routing.json" \
            ./.github/scripts/gitops/prepare_gitops_routing_config.sh
          SERVERLESS_CONFIG="${RUNNER_TEMP}/serverless-routing.json" \
            python3 scripts/serverless_uat/validate_cloudflare_boundaries.py
          ./.github/scripts/serverless/verify_hybrid_contract.sh
        env:
          GITOPS_ROUTING_YAML: ${{ github.workspace }}/gitops/topology/uat/hybrid/runtime-topology.yaml
          GITOPS_ROUTING_OUTPUT: ${{ runner.temp }}/hybrid-routing.json
          CLOUDFLARE_BOUNDARY_CONFIG: ${{ runner.temp }}/hybrid-routing.json
          REQUIRED_RUNTIME_MODE: hybrid
          HYBRID_CONFIG: ${{ runner.temp }}/hybrid-routing.json
          SERVERLESS_CONFIG: ${{ runner.temp }}/serverless-routing.json
