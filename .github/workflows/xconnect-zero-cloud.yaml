name: XConnect Zero Cloud Lab
on:
  workflow_dispatch:
    inputs:
      mode:
        type: choice
        options: [dry-run, apply, cleanup]
        default: dry-run
      iac_ref:
        description: Advanced override - reviewed iac_modules commit SHA
        type: string
        required: false
        default: '9dd120ee027ea999b41d15b80ead20878c1ff468'
      gitops_ref:
        description: Advanced override - reviewed gitops commit SHA
        type: string
        required: false
        default: '5b908e22ea541192e29946a630cf49123bd314f8'
      playbooks_ref:
        description: Advanced override - reviewed playbooks commit SHA
        type: string
        required: false
        default: '47154b7c19d752081ddf2229467f3b0b667fde47'
      cli_release_tag:
        description: Advanced override - XConnect-One GitHub Release tag
        type: string
        required: false
        default: 'v0.1.11'
      gateway_release_tag:
        description: Advanced override - XConnect-Gateway GitHub Release tag
        type: string
        required: false
        default: 'v0.1.5'
      xray_release_tag:
        description: Advanced override - XTLS/Xray-core Release tag
        type: string
        required: false
        default: 'v26.3.27'
      gateway_provider:
        description: Gateway mode; external reuses the persistent TW Gateway from Vault
        type: choice
        options: [external, aws-spot]
        required: false
        default: external
      external_gateway_id:
        description: Stable Gateway identity for the external non-IaC node
        type: string
        required: false
        default: 'gw-uat-tw-xconnect'
      external_network_id:
        description: Stable Zero network identity for the external Gateway
        type: string
        required: false
        default: 'net_uat'
      external_gateway_server_name:
        description: TLS SNI name for the external Gateway
        type: string
        required: false
        default: 'tw-xconnect.svc.plus'
      gateway_wireguard_address:
        description: Optional Gateway WireGuard IPv4 /32 override inside the GitOps overlay CIDR
        type: string
        required: false
        default: ''
      allow_release_overrides:
        description: Explicitly allow this run to use One/Gateway tags different from the GitOps declaration
        type: boolean
        required: false
        default: false
      cleanup_run:
        description: Cleanup only - exact xcl-RUN_ID-ATTEMPT from a previous run
        type: string
        default: ''
      ssh_debug_ingress_cidrs:
        description: Optional temporary operator SSH IPv4 /32 list, comma-separated; defaults to the current operator egress and is not stored in GitOps
        type: string
        required: false
        default: '35.79.83.48/32'
      gateway_transport_ingress_cidrs:
        description: Temporary controlled-node IPv4 /32 allowlist for the public Gateway VLESS/XHTTP TCP 443 entrypoint; not stored in GitOps
        type: string
        required: false
        default: '35.79.83.48/32'
permissions:
  contents: read
  id-token: write
env:
  XCONNECT_VAULT_ROLE: github-actions-platform-ops-toolkit-uat-xconnect-cloud-lab
concurrency:
  group: xconnect-cloud-lab
  cancel-in-progress: false
jobs:
  lab:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      MODE: ${{ inputs.mode }}
      IAC_REF: ${{ inputs.iac_ref || '9dd120ee027ea999b41d15b80ead20878c1ff468' }}
      GITOPS_REF: ${{ inputs.gitops_ref || '5b908e22ea541192e29946a630cf49123bd314f8' }}
      PLAYBOOKS_REF: ${{ inputs.playbooks_ref || '47154b7c19d752081ddf2229467f3b0b667fde47' }}
      CLI_RELEASE_TAG: ${{ inputs.cli_release_tag || 'v0.1.11' }}
      GATEWAY_RELEASE_TAG: ${{ inputs.gateway_release_tag || 'v0.1.5' }}
      XRAY_RELEASE_TAG: ${{ inputs.xray_release_tag || 'v26.3.27' }}
      GATEWAY_PROVIDER: ${{ inputs.gateway_provider || 'external' }}
      EXTERNAL_GATEWAY_ID: ${{ inputs.external_gateway_id || 'gw-uat-tw-xconnect' }}
      EXTERNAL_NETWORK_ID: ${{ inputs.external_network_id || 'net_uat' }}
      EXTERNAL_GATEWAY_SERVER_NAME: ${{ inputs.external_gateway_server_name || 'tw-xconnect.svc.plus' }}
      ALLOW_XCONNECT_RELEASE_OVERRIDES: ${{ inputs.allow_release_overrides || false }}
      CLEANUP_RUN: ${{ inputs.cleanup_run }}
      SSH_DEBUG_INGRESS_CIDRS: ${{ inputs.ssh_debug_ingress_cidrs || '35.79.83.48/32' }}
      GATEWAY_TRANSPORT_INGRESS_CIDRS: ${{ inputs.gateway_transport_ingress_cidrs || '35.79.83.48/32' }}
      GATEWAY_WIREGUARD_ADDRESS: ${{ inputs.gateway_wireguard_address }}
      # Cleanup-only runs must not request an observation lease. Apply runs
      # retain the reviewed one-hour observation window; cleanup resolves to
      # zero before it reads or destroys the exact prior state.
      NODE_OBSERVATION_INPUT: ${{ inputs.mode == 'apply' && 'until-expiry' || '0' }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Validate immutable references
        run: |
          echo "LAB_DIR=$RUNNER_TEMP/xconnect-lab" >> "$GITHUB_ENV"
          LAB_DIR="$RUNNER_TEMP/xconnect-lab" bash .github/scripts/xconnect-lab/run.sh validate
      - name: Authenticate CI to Vault via GitHub JWT
        id: bootstrap
        uses: hashicorp/vault-action@v4
        with:
          url: https://vault.svc.plus
          method: jwt
          role: ${{ env.XCONNECT_VAULT_ROLE }}
          jwtGithubAudience: vault
          exportEnv: false
          secrets: |
            kv/data/CICD/github-app/daily-snapshot app_private_key | APP_PRIVATE_KEY
      - name: Infra repository access
        id: infra-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: Iv23liNwStpQIiXajhpb
          private-key: ${{ steps.bootstrap.outputs.APP_PRIVATE_KEY }}
          owner: ai-workspace-infra
          repositories: iac_modules,gitops,playbooks
      - uses: actions/checkout@v7
        with:
          repository: ai-workspace-infra/iac_modules
          ref: ${{ env.IAC_REF }}
          token: ${{ steps.infra-token.outputs.token }}
          path: iac_modules
          persist-credentials: false
      - uses: actions/checkout@v7
        with:
          repository: ai-workspace-infra/gitops
          ref: ${{ env.GITOPS_REF }}
          token: ${{ steps.infra-token.outputs.token }}
          path: gitops
          persist-credentials: false
      - uses: actions/checkout@v7
        with:
          repository: ai-workspace-infra/playbooks
          ref: ${{ env.PLAYBOOKS_REF }}
          token: ${{ steps.infra-token.outputs.token }}
          path: playbooks
          persist-credentials: false
      - name: Resolve the UAT declaration
        id: topology
        run: bash .github/scripts/xconnect-lab/run.sh topology
      - name: Verify formal Accounts and deployed Portal BFF boundary
        if: inputs.mode != 'cleanup'
        run: python3 .github/scripts/xconnect-lab/probe-control-plane.py gitops/vpn-overlay/uat/xconnect-lab.json
      - name: Private CLI release access
        if: inputs.mode != 'cleanup'
        id: cli-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: Iv23liNwStpQIiXajhpb
          private-key: ${{ steps.bootstrap.outputs.APP_PRIVATE_KEY }}
          owner: ai-workspace-xstream
          repositories: XConnect-One,XConnect-Gateway
      - name: Download and verify project release artifacts
        if: inputs.mode != 'cleanup'
        env:
          CLI_RELEASE_TOKEN: ${{ steps.cli-token.outputs.token }}
          GITHUB_TOKEN: ${{ github.token }}
        run: bash .github/scripts/xconnect-lab/run.sh download
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.9.5
          terraform_wrapper: false
      - name: Offline topology and Terraform preflight
        run: bash .github/scripts/xconnect-lab/run.sh preflight
      - name: Infrastructure credentials from UAT Vault role
        if: inputs.mode != 'dry-run'
        uses: hashicorp/vault-action@v4
        with:
          url: ${{ steps.topology.outputs.vault_address }}
          method: jwt
          role: ${{ steps.topology.outputs.vault_role }}
          jwtGithubAudience: vault
          secrets: |
            kv/data/CICD/uat TF_STATE_ENDPOINT | TF_STATE_ENDPOINT ;
            kv/data/CICD/uat TF_STATE_BUCKET | TF_STATE_BUCKET ;
            kv/data/CICD/uat TF_STATE_ACCESS_KEY | TF_STATE_ACCESS_KEY ;
            kv/data/CICD/uat TF_STATE_SECRET_KEY | TF_STATE_SECRET_KEY ;
            kv/data/CICD/uat TF_STATE_REGION | TF_STATE_REGION
      - name: Runtime credentials from dedicated Vault path
        if: inputs.mode == 'apply'
        uses: hashicorp/vault-action@v4
        with:
          url: ${{ steps.topology.outputs.vault_address }}
          method: jwt
          role: ${{ steps.topology.outputs.vault_role }}
          jwtGithubAudience: vault
          secrets: |
            kv/data/uat/xconnect-one VLESS_ID | LAB_VLESS_ID ;
            kv/data/uat/xconnect-one ZERO_SERVICE_TOKEN | ZERO_SERVICE_TOKEN ;
            kv/data/uat/xconnect-one ZERO_OWNER_EMAIL | ZERO_OWNER_EMAIL ;
            kv/data/CICD/domains/svc.plus tls_fullchain_pem_b64 | XCONNECT_GATEWAY_TLS_FULLCHAIN_PEM_B64 ;
            kv/data/CICD/domains/svc.plus tls_key_pem_b64 | XCONNECT_GATEWAY_TLS_KEY_PEM_B64 ;
            kv/data/CICD/domains/svc.plus tls_trust_bundle_pem_b64 | XCONNECT_GATEWAY_TLS_TRUST_BUNDLE_PEM_B64 ;
            kv/data/CICD/domains/svc.plus tls_ca_pem_b64 | XCONNECT_GATEWAY_TLS_CA_PEM_B64 ;
            kv/data/prod/ulighthost-xconnect/tw-xconnect.svc.plus host | EXTERNAL_GATEWAY_HOST ;
            kv/data/prod/ulighthost-xconnect/tw-xconnect.svc.plus user | EXTERNAL_GATEWAY_USER ;
            kv/data/prod/ulighthost-xconnect/tw-xconnect.svc.plus ssh_private_key_b64 | EXTERNAL_GATEWAY_SSH_PRIVATE_KEY_B64 ;
            kv/data/CICD/observability user | OBSERVABILITY_USER ;
            kv/data/CICD/observability password | OBSERVABILITY_PASSWORD
      - name: Stable Gateway DNS credentials from UAT Vault
        if: inputs.mode == 'apply' && inputs.gateway_provider == 'external'
        uses: hashicorp/vault-action@v4
        with:
          url: ${{ steps.topology.outputs.vault_address }}
          method: jwt
          role: ${{ steps.topology.outputs.vault_role }}
          jwtGithubAudience: vault
          secrets: |
            kv/data/uat/serverless/cloudflare CLOUDFLARE_ACCOUNT_ID | CLOUDFLARE_ACCOUNT_ID ;
            kv/data/uat/serverless/cloudflare CLOUDFLARE_API_TOKEN | CLOUDFLARE_API_TOKEN
      - name: Reconcile stable Gateway DNS in Cloudflare
        if: inputs.mode == 'apply' && inputs.gateway_provider == 'external'
        env:
          XCONNECT_GATEWAY_DNS_NAME: ${{ env.EXTERNAL_GATEWAY_SERVER_NAME }}
          XCONNECT_GATEWAY_DNS_TARGET: ${{ env.EXTERNAL_GATEWAY_HOST }}
        run: bash .github/scripts/xconnect-lab/reconcile-gateway-dns.sh
      - name: AWS short-lived OIDC credentials
        if: inputs.mode != 'dry-run'
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ steps.topology.outputs.aws_role }}
          aws-region: ${{ steps.topology.outputs.aws_region }}
          audience: sts.amazonaws.com
      - name: Prepare isolated state and inspect account prerequisites
        id: prepare
        if: inputs.mode != 'dry-run'
        run: bash .github/scripts/xconnect-lab/run.sh prepare
      - name: Provision the two isolated Spot nodes
        if: inputs.mode == 'apply'
        run: bash .github/scripts/xconnect-lab/run.sh apply
      - name: Install released runtimes and create the Gateway local identity
        if: inputs.mode == 'apply'
        run: bash .github/scripts/xconnect-lab/run.sh setup
      - name: Real Accounts - provision network and one-use Gateway/One invitations
        if: inputs.mode == 'apply'
        run: bash .github/scripts/xconnect-lab/run.sh bootstrap
      - name: Deploy formal Gateway using its invitation and signed config
        if: inputs.mode == 'apply'
        run: bash .github/scripts/xconnect-lab/run.sh gateway
      - name: Join Linux One using its formal invitation and reconcile Gateway
        if: inputs.mode == 'apply'
        run: bash .github/scripts/xconnect-lab/run.sh one
      - name: Install Ansible controller for XConnect observability
        if: inputs.mode == 'apply'
        run: |
          python3 -m pip install --user 'ansible-core==2.17.7'
          echo "$(python3 -m site --user-base)/bin" >> "$GITHUB_PATH"
      - name: Register Gateway and One base metrics with Observability
        if: inputs.mode == 'apply'
        env:
          OBSERVABILITY_ENDPOINT: ${{ steps.topology.outputs.observability_endpoint }}
          OBSERVABILITY_QUERY_PATH: ${{ steps.topology.outputs.observability_query_path }}
          OBSERVABILITY_ENVIRONMENT: ${{ steps.topology.outputs.observability_environment }}
        run: bash .github/scripts/xconnect-lab/run.sh observability
      - name: Verify signed sync/ACK, services, exact-peer handshake and private ping/HTTP
        if: inputs.mode == 'apply'
        run: bash .github/scripts/xconnect-lab/run.sh verify
      - name: Publish non-secret desktop handoff
        if: inputs.mode == 'apply' && inputs.gateway_provider != 'external'
        uses: actions/upload-artifact@v4
        with:
          name: xconnect-desktop-handoff-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ env.LAB_DIR }}/desktop-public
          if-no-files-found: error
          retention-days: 1
      - name: Keep verified Gateway/Linux One Spot until lease expiry
        if: inputs.mode == 'apply'
        run: bash .github/scripts/xconnect-lab/run.sh node-observation
      - name: Refresh short-lived AWS OIDC credentials before explicit cleanup
        if: inputs.mode == 'cleanup' && steps.prepare.outcome == 'success'
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ steps.topology.outputs.aws_role }}
          aws-region: ${{ steps.topology.outputs.aws_region }}
          audience: sts.amazonaws.com
          unset-current-credentials: true
      - name: Destroy only the explicitly selected lab state
        if: inputs.mode == 'cleanup'
        run: bash .github/scripts/xconnect-lab/run.sh cleanup
