name: Deploy Environment & Provision Infrastructure

# =============================================================================
# IaC 环境交付与应用部署流水线 (Environment Provisioning & Deployment)
# 1. 动态 Provision (基于 Terraform 创建新环境 platform-ops-toolkit)
# 2. 部署基础服务与业务服务 (Bootstrap Node 与全域业务服务部署)
# 3. 可选 DNS 流量接管与发布 (Cloudflare DNS Cutover)
# =============================================================================

on:
  # Branches select a delivery profile. pull_request and branch/tag pushes
  # always run the provision stage, but only workflow_dispatch can request an
  # actual apply/deploy run.
  pull_request:
    types: [opened, synchronize, reopened]
    paths-ignore:
      - '.github/workflows/deploy-action-runner-iac.yaml'
  push:
    branches:
    - main
    - 'release/**'
    tags:
    - 'v*'
    paths-ignore:
      - '.github/workflows/deploy-action-runner-iac.yaml'
  workflow_dispatch:
    inputs:
      runner_type:
        description: "选择 Runner 环境 (ubuntu-latest 或 self-hosted)"
        required: true
        default: "ubuntu-latest"
        type: choice
        options:
        - ubuntu-latest
        - self-hosted
      deploy_tag:
        description: "应用部署的不可变镜像版本 (例如 daily-build-2026.07.30-r1)，作为源码拉取与部署的统一基准。必填，拦截 main/latest。"
        required: true
        type: string
      infra_ref:
        description: "iac_modules 仓库的 Git Ref；留空则默认使用 main 分支"
        required: false
        default: ""
        type: string
      playbooks_ref:
        description: "playbooks 仓库的 Git Ref；留空则默认使用 main 分支"
        required: false
        default: ""
        type: string
      gitops_ref:
        description: "gitops 仓库的 Git Ref；留空则默认使用 main 分支"
        required: false
        default: ""
        type: string
      toolkit_ref:
        description: "platform-ops-toolkit 仓库的 Git Ref；留空则默认使用 main 分支"
        required: false
        default: ""
        type: string
      console_ref:
        description: "xworkspace-console 仓库的 Git Ref；留空则回退到 deploy_tag"
        required: false
        default: ""
        type: string
      offline_mode:
        description: "on-host 离线包模式: off=在线拉最新(默认); auto=离线加速; force=强制离线"
        required: false
        default: "off"
        type: choice
        options: ["off", "auto", "force"]
      source_host:
        description: "源环境 IP 或域名 (用于导出数据)"
        required: true
        default: "install.svc.plus"
        type: string
      source_domain_base:
        description: "源环境域名后缀 (例如 svc.plus)"
        required: true
        default: "svc.plus"
        type: string
      target_domain_base:
        description: "新环境域名后缀 (用于参数化替换，如 onwalk.net)"
        required: true
        default: "onwalk.net"
        type: string
      observability_endpoint:
        description: "监控数据上报网关 (默认 https://observability.svc.plus)，支持覆盖"
        required: false
        default: "https://observability.svc.plus"
        type: string
      xray_exporter_release_repository:
        description: "xray-exporter 发布仓库；留空时 UAT 自动使用 ai-workspace-xstream/xray-exporter，生产使用 compassvpn/xray-exporter"
        required: false
        default: ""
        type: string
      xray_exporter_version:
        description: "xray-exporter 发布 tag；留空时 UAT 跟随 deploy_tag，生产使用 v0.6.0"
        required: false
        default: ""
        type: string
      run_full_stack:
        description: "一键整套初始化: 申请 IaC 资源 -> 部署业务应用 -> 发布 DNS。勾选后强制打开下面两个开关与 DNS 发布, 用于从零拉起一个 sit/uat/prod 副本"
        required: false
        default: false
        type: boolean
      run_infrastructure:
        description: "是否执行 Terraform Provision / Apply / Destroy。只建基础设施与 CMDB, 不部署任何业务服务"
        required: false
        default: false
        type: boolean
      run_application_deploy:
        description: "Terraform Apply 之后是否执行 Bootstrap Node 与各业务域的全部应用服务部署。必须同时 run_infrastructure=true, 因为部署所用的 inventory 由 provision 阶段生成"
        required: false
        default: false
        type: boolean
      target_domains:
        description: "选择要执行的业务域 (Business Domain)"
        required: true
        default: "all"
        type: choice
        options:
        - all
        - ai-workspace
        - web-saas
        - infra-platform
        - agent-proxy
        - web-saas + agent-proxy
      cloud_provider:
        description: "云服务商 (多云选项为预留; 目前这条环境副本链路实际能跑的是 vultr-vps, 选择其它云会在 provision 阶段明确失败)"
        required: true
        default: "vultr-vps"
        type: choice
        options:
        - aws-cloud
        - gcp-cloud
        - azure-cloud
        - vultr-vps
      instance_plan:
        description: "选择 VPS 规格 (全域建议 4C8G，单域支持 2C4G 矩阵，agent-proxy 默认 1C2G)"
        required: true
        default: "4C8G"
        type: choice
        options:
        - 4C8G
        - 2C4G
        - 1C2G
      action:
        description: "执行动作 (destroy 将自动执行 Terraform 销毁，不受 run_infrastructure 开关影响)"
        required: true
        default: "deploy"
        type: choice
        options: [deploy, resize, destroy, migrate, backup, restore]
      confirm_dns_switch:
        description: "危险: 勾选此项将在最后一步接管原域名的生产流量 (仅真实灾备启用)"
        required: false
        default: false
        type: boolean
      uat_dns_update:
        description: "仅 UAT: 幂等更新 billing/console/accounts/agent-proxy 的目标域 A 记录；不会触碰 svc.plus"
        required: false
        default: false
        type: boolean
      vault_env_path:
        description: "Vault 环境路径 (如 sit, uat, prod)，用于动态 secrets 的读写"
        required: true
        default: "uat"
        type: choice
        options:
        - sit
        - uat
        - prod
      vault_addr:
        description: "Vault 服务地址 (可选，覆盖默认的 https://vault.svc.plus)"
        required: false
        type: string
      # 注意: 这里曾有一个 vault_token 输入作为 "JWT 异常时的兜底"。已移除。
      # workflow_dispatch 输入不脱敏且长期留在 run metadata 里, 任何有仓库读
      # 权限的人都能看到; 且 method:token 会绕过 role 上全部 bound_claims 绑定,
      # 等于给整套 OIDC 开一个常驻后门。JWT 认证有问题就修 role 绑定, 不要旁路。

permissions:
  contents: read
  id-token: write

concurrency:
  group: deploy-env-migration
  cancel-in-progress: false

env:
  VAULT_ADDR: ${{ github.event.inputs.vault_addr || 'https://vault.svc.plus' }}
  # Branches select a complete deployment profile:
  # - pull_request -> sit
  # - main / release/* -> uat
  # - tags (v*) -> prod
  DEPLOY_ENV: ${{ github.event_name == 'pull_request' && 'sit' || startsWith(github.ref, 'refs/tags/v') && 'prod' || github.event.inputs.vault_env_path || 'uat' }}
  VAULT_ENV_PATH: ${{ github.event_name == 'pull_request' && 'sit' || startsWith(github.ref, 'refs/tags/v') && 'prod' || github.event.inputs.vault_env_path || 'uat' }}
  VAULT_ROLE: github-actions-platform-ops-toolkit-${{ github.event_name == 'pull_request' && 'sit' || startsWith(github.ref, 'refs/tags/v') && 'prod' || github.event.inputs.vault_env_path || 'uat' }}
  # 公共服务 secret: 三个环境共读、只读不可改 (GHCR 镜像拉取凭据等)。
  # 拉的是同一批镜像, 不存在环境维度, 不拆分。
  VAULT_KV: kv/data/CICD
  # 基础凭据: 按环境拆分, 各 role 只读自己那份。
  # VULTR_API_KEY / TF_STATE_* / SSH_PRIVATE_DEPLOY_KEY_B64 授予的是"控制基础
  # 设施"和"登录主机"的能力, 是提权的实际载体, 必须隔离 —— sit 失陷不应拿到
  # prod 的云账号与主机私钥。
  VAULT_KV_BASE: kv/data/CICD/${{ github.event_name == 'pull_request' && 'sit' || startsWith(github.ref, 'refs/tags/v') && 'prod' || github.event.inputs.vault_env_path || 'uat' }}
  VAULT_KV_OPENCLAW: kv/data/openclaw
  VAULT_KV_WEB_SAAS: kv/data/WEB_SAAS
  VAULT_KV_DATABASES: kv/data/${{ github.event_name == 'pull_request' && 'sit' || startsWith(github.ref, 'refs/tags/v') && 'prod' || github.event.inputs.vault_env_path || 'uat' }}/databases
  VAULT_KV_AGENT_PROXY: kv/data/${{ github.event_name == 'pull_request' && 'sit' || startsWith(github.ref, 'refs/tags/v') && 'prod' || github.event.inputs.vault_env_path || 'uat' }}/agent-proxy
  VPS_ROOT: infra/iac_modules/terraform-hcl-standard/${{ github.event.inputs.cloud_provider || 'vultr-vps' }}
  # 指向 platform-ops-toolkit 的 Terraform 目录
  ENV_DIR: infra/iac_modules/terraform-hcl-standard/${{ github.event.inputs.cloud_provider || 'vultr-vps' }}/envs/platform-ops-toolkit
  PLAYBOOKS_DIR: infra/playbooks

jobs:
  # GitHub Actions renders jobs as a dependency graph.  Keep every job and
  # dependency intact, but use four stable visual stages in job names so the
  # matrix fan-out remains readable: Prepare, Bootstrap, Workloads, Gate.
  provision:
    name: "[0] Prepare | profile + infra"
    runs-on: ${{ github.event.inputs.runner_type || 'ubuntu-latest' }}
    # Static job-level env: inputs known at job start (no step output refs allowed here)
    env:
      INPUT_CLOUD_PROVIDER:        ${{ github.event.inputs.cloud_provider }}
      INPUT_VAULT_ENV_PATH:        ${{ github.event.inputs.vault_env_path }}
      INPUT_TARGET_DOMAINS:        ${{ github.event.inputs.target_domains }}
      INPUT_RUN_FULL_STACK:        ${{ github.event.inputs.run_full_stack }}
      INPUT_RUN_INFRASTRUCTURE:    ${{ github.event.inputs.run_infrastructure }}
      INPUT_RUN_APPLICATION_DEPLOY:     ${{ github.event.inputs.run_application_deploy }}
      INPUT_INSTANCE_PLAN:          ${{ inputs.instance_plan || github.event.inputs.instance_plan || '4C8G' }}
      INPUT_ACTION:                ${{ github.event.inputs.action }}
      INPUT_DEPLOY_REF:            
      INPUT_TOOLKIT_REF:           ${{ github.event.inputs.toolkit_ref }}
      INPUT_INFRA_REF:             ${{ github.event.inputs.infra_ref }}
      INPUT_PLAYBOOKS_REF:         ${{ github.event.inputs.playbooks_ref }}
      INPUT_GITOPS_REF:            ${{ github.event.inputs.gitops_ref }}
      INPUT_CONSOLE_REF:           ${{ github.event.inputs.console_ref }}
      INPUT_OFFLINE_MODE:          ${{ github.event.inputs.offline_mode }}
      INPUT_SOURCE_HOST:           ${{ github.event.inputs.source_host }}
      INPUT_SOURCE_DOMAIN_BASE:    ${{ github.event.inputs.source_domain_base }}
      INPUT_TARGET_DOMAIN_BASE:    ${{ github.event.inputs.target_domain_base }}
      INPUT_CONFIRM_DNS_SWITCH:    ${{ github.event.inputs.confirm_dns_switch }}
      INPUT_UAT_DNS_UPDATE:        ${{ github.event.inputs.uat_dns_update }}
      INPUT_DEPLOY_TAG:            ${{ github.event.inputs.deploy_tag }}
    outputs:
      deployment_env:           ${{ steps.route.outputs.deployment_env }}
      resource_file:            ${{ steps.route.outputs.resource_file }}
      terraform_workspace:      ${{ steps.route.outputs.terraform_workspace }}
      state_key:                ${{ steps.route.outputs.state_key }}
      run_infrastructure:       ${{ steps.route.outputs.run_infrastructure }}
      run_application_deploy:        ${{ steps.route.outputs.run_application_deploy }}
      target_domains:           ${{ steps.route.outputs.target_domains }}
      deploy_tag:               ${{ steps.route.outputs.deploy_tag }}
      terraform_action:         ${{ steps.route.outputs.terraform_action }}
      toolkit_action:           ${{ steps.route.outputs.toolkit_action }}
      toolkit_ref:              ${{ steps.route.outputs.toolkit_ref }}
      infra_ref:                ${{ steps.route.outputs.infra_ref }}
      playbooks_ref:            ${{ steps.route.outputs.playbooks_ref }}
      gitops_ref:               ${{ steps.route.outputs.gitops_ref }}
      console_ref:              ${{ steps.route.outputs.console_ref }}
      offline_mode:             ${{ steps.route.outputs.offline_mode }}
      source_host:              ${{ steps.route.outputs.source_host }}
      source_domain_base:       ${{ steps.route.outputs.source_domain_base }}
      target_domain_base:       ${{ steps.route.outputs.target_domain_base }}
      env_suffix:               ${{ steps.route.outputs.env_suffix }}
      confirm_dns_switch:       ${{ steps.route.outputs.confirm_dns_switch }}
      uat_dns_update:           ${{ steps.route.outputs.uat_dns_update }}
      vault_env_path:           ${{ steps.route.outputs.vault_env_path }}
      cloud_provider:           ${{ steps.route.outputs.cloud_provider }}
      hosts:              ${{ steps.matrix.outputs.hosts         || '[]' }}
      hosts_web_saas:     ${{ steps.matrix.outputs.hosts_web_saas     || '[]' }}
      hosts_ai_workspace: ${{ steps.matrix.outputs.hosts_ai_workspace || '[]' }}
      hosts_infra_platform: ${{ steps.matrix.outputs.hosts_infra_platform || '[]' }}
      hosts_agent_proxy:  ${{ steps.matrix.outputs.hosts_agent_proxy  || '[]' }}
      count:              ${{ steps.matrix.outputs.count || '0' }}
    steps:
    - name: Checkout repository
      uses: actions/checkout@v7
      with:
        # Manual destroy must use the workflow code from the selected branch.
        # Falling back to deploy_ref can silently load an older tag without
        # the current destroy routing fix.
        ref: ${{ github.event.inputs.toolkit_ref || 'main' }}

    - name: Validate cloud_provider
      # 仅支持已接线的云厂商
      if: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.cloud_provider != '' && github.event.inputs.cloud_provider != 'vultr-vps' && github.event.inputs.cloud_provider != 'aws-cloud' }}
      run: |
        echo "::error::cloud_provider='${{ github.event.inputs.cloud_provider }}' is reserved but not wired for this environment-replica workflow yet. Use 'vultr-vps' or 'aws-cloud' for now." >&2
        exit 1

    - name: Route ref to an explicit profile
      id: route
      # env block inherited from job level — no repetition needed here
      run: |-
        ${{ github.workspace }}/.github/scripts/platform-ops_provision_route-ref-to-an-explicit-profile.sh

    - name: Load Vault secrets
      if: steps.route.outputs.run_infrastructure == 'true'
      id: vault
      uses: hashicorp/vault-action@v4
      with:
        url: ${{ env.VAULT_ADDR }}
        method: jwt
        role: ${{ env.VAULT_ROLE }}
        jwtGithubAudience: vault
        ignoreNotFound: true
        exportToken: true
        secrets: |
          ${{ env.VAULT_KV_BASE }} VULTR_API_KEY     | VULTR_API_KEY ;
          ${{ env.VAULT_KV_BASE }} TF_STATE_ENDPOINT | TF_STATE_ENDPOINT ;
          ${{ env.VAULT_KV_BASE }} TF_STATE_BUCKET   | TF_STATE_BUCKET ;
          ${{ env.VAULT_KV_BASE }} TF_STATE_ACCESS_KEY | TF_STATE_ACCESS_KEY ;
          ${{ env.VAULT_KV_BASE }} TF_STATE_SECRET_KEY | TF_STATE_SECRET_KEY ;
          ${{ env.VAULT_KV_BASE }} TF_STATE_REGION   | TF_STATE_REGION

    - name: Configure AWS Credentials (OIDC)
      if: steps.route.outputs.run_infrastructure == 'true' && steps.route.outputs.cloud_provider == 'aws-cloud'
      uses: aws-actions/configure-aws-credentials@v4
      with:
        aws-region: ap-northeast-1
        role-to-assume: arn:aws:iam::950604983695:role/GithubAction_IAC_Deploy_Role

    - name: Configure GCP Credentials (OIDC)
      if: steps.route.outputs.run_infrastructure == 'true' && steps.route.outputs.cloud_provider == 'gcp-cloud'
      uses: google-github-actions/auth@v2
      with:
        workload_identity_provider: 'projects/123456789/locations/global/workloadIdentityPools/my-pool/providers/my-provider'
        service_account: 'my-service-account@my-project.iam.gserviceaccount.com'

    - name: Configure Azure Credentials (OIDC)
      if: steps.route.outputs.run_infrastructure == 'true' && steps.route.outputs.cloud_provider == 'azure-cloud'
      uses: azure/login@v2
      with:
        client-id: '00000000-0000-0000-0000-000000000000'
        tenant-id: '00000000-0000-0000-0000-000000000000'
        subscription-id: '00000000-0000-0000-0000-000000000000'

    # Export Vault-sourced credentials into GITHUB_ENV so all subsequent steps
    # inherit them automatically — eliminates per-step env repetition.
    - name: Export Terraform credentials
      if: steps.route.outputs.run_infrastructure == 'true'
      run: |
        if [ "${{ steps.route.outputs.cloud_provider }}" == "vultr-vps" ]; then
          echo "AWS_ACCESS_KEY_ID=${{ steps.vault.outputs.TF_STATE_ACCESS_KEY }}"   >> "$GITHUB_ENV"
          echo "AWS_SECRET_ACCESS_KEY=${{ steps.vault.outputs.TF_STATE_SECRET_KEY }}" >> "$GITHUB_ENV"
          echo "TF_VAR_vultr_api_key=${{ steps.vault.outputs.VULTR_API_KEY }}"      >> "$GITHUB_ENV"
        fi
        echo "TF_STATE_ENDPOINT=${{ steps.vault.outputs.TF_STATE_ENDPOINT }}"     >> "$GITHUB_ENV"
        echo "TF_STATE_BUCKET=${{ steps.vault.outputs.TF_STATE_BUCKET }}"         >> "$GITHUB_ENV"
        echo "TF_STATE_REGION=${{ steps.vault.outputs.TF_STATE_REGION }}"         >> "$GITHUB_ENV"

    - name: Checkout iac_modules
      if: steps.route.outputs.run_infrastructure == 'true'
      uses: actions/checkout@v7
      with:
        repository: ai-workspace-infra/iac_modules
        ref: ${{ steps.route.outputs.infra_ref }}
        path: infra/iac_modules

    - uses: hashicorp/setup-terraform@v4
      if: steps.route.outputs.run_infrastructure == 'true'
      with:
        terraform_version: "1.9.8"

    - uses: actions/setup-python@v6
      if: steps.route.outputs.run_infrastructure == 'true'
      with:
        python-version: "3.12"

    - name: Install render deps
      if: steps.route.outputs.run_infrastructure == 'true'
      run: ${{ github.workspace }}/.github/scripts/platform-ops_provision_install-render-deps.sh

    - name: Map Instance Plan
      if: steps.route.outputs.run_infrastructure == 'true'
      id: plan
      env:
        INPUT_DOMAIN_____ALL_:         ${{ github.event.inputs.target_domains || 'all' }}
        INPUT_INSTANCE_PLAN:             ${{ env.INPUT_INSTANCE_PLAN }}
        INPUT_CLOUD_PROVIDER:          ${{ steps.route.outputs.cloud_provider }}
      run: |-
        ${{ github.workspace }}/.github/scripts/platform-ops_provision_map-instance-plan.sh

    - name: generate.py render
      if: steps.route.outputs.run_infrastructure == 'true'
      working-directory: ${{ env.VPS_ROOT }}
      env:
        TARGET_DOMAIN:      ${{ steps.route.outputs.target_domains }}
        INSTANCE_PLAN_API:  ${{ steps.plan.outputs.api }}
        TF_WORKSPACE_PREFIX: env
        TARGET_DOMAIN_BASE: ${{ steps.route.outputs.target_domain_base }}
        # TF_STATE_* and AWS_* already in env via "Export Terraform credentials"
      run: python3 scripts/generate.py render --resources ${{ steps.route.outputs.resource_files_full }} --workdir envs/platform-ops-toolkit

    - name: Terraform init
      if: steps.route.outputs.run_infrastructure == 'true'
      working-directory: ${{ env.ENV_DIR }}
      env:
        ENV_STEPS_ROUTE_OUTPUTS_STATE_KEY: ${{ steps.route.outputs.state_key }}
        # AWS_ACCESS_KEY_ID / AWS_SECRET_ACCESS_KEY / TF_STATE_* from GITHUB_ENV
      run: |-
        ${{ github.workspace }}/.github/scripts/platform-ops_provision_terraform-init.sh

    - name: Adopt replacement instance into Terraform state
      if: steps.route.outputs.run_infrastructure == 'true' && github.event_name == 'workflow_dispatch' && inputs.action == 'resize' && needs.resize.outputs.direction == 'downgrade'
      working-directory: ${{ env.ENV_DIR }}
      env:
        ENV_STEPS_ROUTE_OUTPUTS_TERRAFORM_WORKSPACE: ${{ steps.route.outputs.terraform_workspace }}
        SOURCE_INSTANCE_ID:      ${{ inputs.resize_instance_id }}
        REPLACEMENT_INSTANCE_ID: ${{ needs.resize.outputs.replacement_id }}
        # AWS_* / TF_VAR_vultr_api_key from GITHUB_ENV
      run: |-
        ${{ github.workspace }}/.github/scripts/platform-ops_provision_adopt-resize-replacement.sh

    - name: Terraform Plan / Apply / Destroy
      if: steps.route.outputs.run_infrastructure == 'true'
      working-directory: ${{ env.ENV_DIR }}
      env:
        ENV_STEPS_ROUTE_OUTPUTS_TERRAFORM_ACTION:    ${{ steps.route.outputs.terraform_action }}
        ENV_STEPS_ROUTE_OUTPUTS_TERRAFORM_WORKSPACE: ${{ steps.route.outputs.terraform_workspace }}
        # AWS_* / TF_VAR_vultr_api_key from GITHUB_ENV
      run: |-
        ${{ github.workspace }}/.github/scripts/platform-ops_provision_terraform-apply-destroy.sh

    - name: generate.py inventory
      if: steps.route.outputs.run_infrastructure == 'true' && steps.route.outputs.terraform_action == 'apply'
      working-directory: ${{ env.VPS_ROOT }}
      env:
        TARGET_DOMAIN_BASE: ${{ steps.route.outputs.target_domain_base }}
        INSTANCE_PLAN_API: ${{ steps.plan.outputs.api }}
        # AWS_* from GITHUB_ENV
      run: python3 scripts/generate.py inventory --resources ${{ steps.route.outputs.resource_files_full }} --workdir envs/platform-ops-toolkit

    - name: Build deploy matrix
      id: matrix
      if: steps.route.outputs.run_infrastructure == 'true' && steps.route.outputs.terraform_action == 'apply'
      working-directory: ${{ env.ENV_DIR }}
      run: |-
        ${{ github.workspace }}/.github/scripts/platform-ops_provision_build-deploy-matrix.sh


    - name: Initialize Databases Credentials
      # 随机数据库口令是业务部署的准备工作, 不属于基础设施阶段 —— 只建 VPS
      # 时不该顺手在 Vault 里生成一批没人会用的口令。
      if: >-
        ${{ steps.route.outputs.run_application_deploy == 'true' &&
        steps.route.outputs.terraform_action == 'apply' }}
      env:
        VAULT_ENV_PATH: ${{ steps.route.outputs.vault_env_path }}
      run: |-
        ${{ github.workspace }}/.github/scripts/platform-ops_provision_initialize-databases-credentials.sh

    - name: Initialize Agent Proxy Credentials
      # 仅当目标域真的包含 agent-proxy 时才初始化, 避免只建 web-saas 时
      # 无条件写入无关业务域的凭据。
      if: >-
        ${{ steps.route.outputs.run_application_deploy == 'true' &&
        steps.route.outputs.terraform_action == 'apply' &&
        contains(fromJSON('["all","agent-proxy","web-saas + agent-proxy"]'), steps.route.outputs.target_domains) }}
      env:
        VAULT_ENV_PATH: ${{ steps.route.outputs.vault_env_path }}
      run: |-
        ${{ github.workspace }}/.github/scripts/platform-ops_provision_initialize-agent-proxy-credentials.sh


    - name: Upload CMDB artifact
      if: steps.route.outputs.run_infrastructure == 'true' && steps.route.outputs.terraform_action == 'apply'
      uses: actions/upload-artifact@v7
      with:
        name: platform-ops-toolkit-cmdb
        path: |
          ${{ env.ENV_DIR }}/cmdb.json
          ${{ env.ENV_DIR }}/inventory.ini



  # ---------------------------------------------------------------------------
  # 步骤 2: 基础环境安装 (Bootstrap Deploy)
  # ---------------------------------------------------------------------------
  deploy_base:
    name: "[1] Bootstrap | ${{ matrix.host }}"
    # 只初始化节点；服务安装由后续 deploy_* jobs 负责。
    needs: provision
    if: >-
      ${{ !cancelled() &&
      needs.provision.result == 'success' &&
      needs.provision.outputs.run_application_deploy == 'true' &&
      needs.provision.outputs.terraform_action == 'apply' &&
      needs.provision.outputs.count != '0' &&
      needs.provision.outputs.hosts != '[]' &&
      needs.provision.outputs.hosts != '' }}
    runs-on: ${{ github.event.inputs.runner_type || 'ubuntu-latest' }}
    strategy:
      fail-fast: false
      matrix:
        host: ${{ fromJSON(needs.provision.outputs.hosts) }}
    env:
      MATRIX_HOST:              ${{ matrix.host }}
      ANSIBLE_HOST_KEY_CHECKING: "False"
      ANSIBLE_SSH_ARGS:         "-o IdentityFile=~/.ssh/id_deploy -o StrictHostKeyChecking=no"
      TARGET_DOMAIN_BASE:       ${{ needs.provision.outputs.target_domain_base }}
      TARGET_DOMAINS:            ${{ needs.provision.outputs.target_domains }}
    steps:
    - name: Checkout repository
      uses: actions/checkout@v7
      with:
        ref: ${{ needs.provision.outputs.toolkit_ref }}

    - name: Checkout playbooks
      uses: actions/checkout@v7
      with:
        repository: ai-workspace-infra/playbooks
        ref: ${{ needs.provision.outputs.playbooks_ref }}
        path: playbooks

    - name: Download CMDB
      uses: actions/download-artifact@v8
      with:
        name: platform-ops-toolkit-cmdb
        path: cmdb

    - name: Resolve agent-proxy source CIDRs for Billing Caddy
      env:
        CMDB_FILE: cmdb/cmdb.json
      run: ${{ github.workspace }}/.github/scripts/platform-ops_deploy_base_resolve-billing-agent-cidrs.sh

    - name: Load Vault secrets
      id: vault
      uses: hashicorp/vault-action@v4
      with:
        url: ${{ env.VAULT_ADDR }}
        method: jwt
        role: ${{ env.VAULT_ROLE }}
        jwtGithubAudience: vault
        ignoreNotFound: true
        secrets: |
          ${{ env.VAULT_KV_BASE }} SSH_PRIVATE_DEPLOY_KEY_B64 | ANSIBLE_SSH_KEY_B64 ;
          ${{ env.VAULT_KV }} ROOT_BOOTSTRAP_PASSWORD | ROOT_BOOTSTRAP_PASSWORD ;
          ${{ env.VAULT_KV_DATABASES }} account_pg_password | ACCOUNT_PG_PASSWORD ;
          ${{ env.VAULT_KV }} AI_WORKSPACE_AUTH_TOKEN | AI_WORKSPACE_AUTH_TOKEN ;
          ${{ env.VAULT_KV }} GHCR_USERNAME | GHCR_USERNAME ;
          ${{ env.VAULT_KV }} GHCR_TOKEN | GHCR_PASSWORD ;
          ${{ env.VAULT_KV_DATABASES }} postgres_root_password | WEB_SAAS_POSTGRES_PASSWORD ;
          ${{ env.VAULT_KV_DATABASES }} account_pg_password | WEB_SAAS_ACCOUNT_PG_PASSWORD ;
          ${{ env.VAULT_KV_WEB_SAAS }} AUTH_TOKEN_PUBLIC_TOKEN | WEB_SAAS_AUTH_TOKEN_PUBLIC_TOKEN ;
          ${{ env.VAULT_KV_WEB_SAAS }} AUTH_TOKEN_REFRESH_SECRET | WEB_SAAS_AUTH_TOKEN_REFRESH_SECRET ;
          ${{ env.VAULT_KV_WEB_SAAS }} AUTH_TOKEN_ACCESS_SECRET | WEB_SAAS_AUTH_TOKEN_ACCESS_SECRET ;
          ${{ env.VAULT_KV_WEB_SAAS }} STUNNEL_CA_CERT_B64 | WEB_SAAS_STUNNEL_CA_CERT_B64 ;
          ${{ env.VAULT_KV_WEB_SAAS }} STUNNEL_SERVER_CERT_B64 | WEB_SAAS_STUNNEL_SERVER_CERT_B64 ;
          ${{ env.VAULT_KV_WEB_SAAS }} STUNNEL_SERVER_KEY_B64 | WEB_SAAS_STUNNEL_SERVER_KEY_B64 ;
          ${{ env.VAULT_KV }} CLOUDFLARE_DNS_API_TOKEN | CLOUDFLARE_DNS_API_TOKEN

    # OAUTH_* / INTERNAL_SERVICE_TOKEN 是真正可选的(不影响是否能起服务),
    # 但 vault-action 的 ignoreNotFound 只在整个 KV 路径 404 时生效 —— 路径
    # 存在而某个键缺失照样硬失败。放到独立脚本里自己读、缺则空。
    # 脚本自己走 GitHub OIDC -> Vault JWT role 认证(与 vault-action 内部
    # 做的事一样), 不依赖上一步导出的静态 token —— 那只是别处场景下的可选
    # fallback, 不该在这里造出一条"依赖前一步是否恰好导出了 token"的隐式
    # 耦合。ACTIONS_ID_TOKEN_REQUEST_URL/TOKEN 由 id-token: write 权限
    # (workflow 顶层已声明)自动注入, 无需在此显式传递。
    - name: Load optional web-saas secrets
      run: ${{ github.workspace }}/.github/scripts/platform-ops_deploy_base_load-optional-web-saas.sh

    - name: Configure SSH Key
      env:
        VAULT_ANSIBLE_SSH_KEY_B64: ${{ steps.vault.outputs.ANSIBLE_SSH_KEY_B64 }}
      run: |-
        ${{ github.workspace }}/.github/scripts/common_configure_ssh_key.sh

    - name: Wait for host SSH
      run: |-
        ${{ github.workspace }}/.github/scripts/common_wait_for_host_ssh.sh

    - name: Install Ansible
      run: ${{ github.workspace }}/.github/scripts/common_install_ansible.sh

    # 证书持久化。主机重建会把 caddy_data 卷一起丢掉, 于是每次重建都重新签发,
    # 撞上 Let's Encrypt "同一组域名 5 次/周" 的限流 —— 2026-07-28 console-uat
    # 就是这么挂的(HTTP 429, retry after 20:38 UTC), 而且没有任何代码能修, 只能等。
    #
    # 顺序: 先恢复(bootstrap 之后、Doco-CD 把 caddy 拉起来之前), 让 caddy 一起来
    # 就发现证书已在, 根本不调 ACME; 部署末尾再备份, 把这一轮可能新签的证书存回去。
    - name: Restore domain TLS state from Vault before Caddy can issue
      if: ${{ contains(needs.provision.outputs.target_domains, 'web-saas') || needs.provision.outputs.target_domains == 'all' }}
      env:
        VAULT_ROLE: ${{ env.VAULT_ROLE }}
        VAULT_CADDY_PATH: kv/data/CICD/domains/${{ needs.provision.outputs.target_domain_base }}
        # Public wildcard PEM is separate from web-saas/certs/, which belongs
        # to stunnel's internal CA. Non-Caddy consumers use current/{fullchain,
        # cert,key,ca}.pem below; `current` flips atomically after validation.
        DOMAIN_TLS_DIR: /etc/xcontrol/tls/${{ needs.provision.outputs.target_domain_base }}
      run: ${{ github.workspace }}/.github/scripts/platform-ops_deploy_base_restore-caddy-certs.sh

    - name: Bootstrap node according to CMDB role
      working-directory: playbooks
      env:
        # vault-action exportToken: true writes VAULT_TOKEN to GITHUB_ENV.
        # Do not overwrite it with the non-existent vault_token output.
        # MATRIX_HOST / ANSIBLE_HOST_KEY_CHECKING / ANSIBLE_SSH_ARGS / TARGET_DOMAIN_BASE from job env
        #
        # web_saas_host_config 角色读这些环境变量渲染主机侧配置(见
        # playbooks roles/vhosts/web_saas_host_config/defaults/main.yml)。
        # 只在 web_saas 组的主机上才会用到 —— 其他域的 bootstrap 脚本
        # 会忽略它们。空值时角色自己的断言会给出指名道姓的错误, 而不是
        # 静默渲染出一个能起来但连不上的服务。
        WEB_SAAS_POSTGRES_PASSWORD:        ${{ steps.vault.outputs.WEB_SAAS_POSTGRES_PASSWORD }}
        ACCOUNT_PG_PASSWORD:               ${{ steps.vault.outputs.WEB_SAAS_ACCOUNT_PG_PASSWORD }}
        # Billing and Accounts share account/account_user. Keep the compose
        # compatibility variable, but source it from the canonical account
        # credential rather than a separate billing secret.
        BILLING_DB_PASSWORD:               ${{ steps.vault.outputs.WEB_SAAS_ACCOUNT_PG_PASSWORD }}
        ROOT_BOOTSTRAP_PASSWORD:           ${{ steps.vault.outputs.ROOT_BOOTSTRAP_PASSWORD }}
        AUTH_TOKEN_PUBLIC_TOKEN:           ${{ steps.vault.outputs.WEB_SAAS_AUTH_TOKEN_PUBLIC_TOKEN }}
        AUTH_TOKEN_REFRESH_SECRET:         ${{ steps.vault.outputs.WEB_SAAS_AUTH_TOKEN_REFRESH_SECRET }}
        AUTH_TOKEN_ACCESS_SECRET:          ${{ steps.vault.outputs.WEB_SAAS_AUTH_TOKEN_ACCESS_SECRET }}
        # Billing consumes the explicit multi-source exporter contract from
        # Vault. It must be reachable from web-saas; never use a loopback URL
        # for an exporter running on agent-proxy.
        # The optional-web-saas loader exports EXPORTER_SOURCES_JSON through
        # GITHUB_ENV. It uses Vault when present and a UAT-only default when
        # the non-secret source routing key has not been initialized yet.
        # OAUTH_GITHUB_CLIENT_ID / OAUTH_GITHUB_CLIENT_SECRET / OAUTH_GOOGLE_CLIENT_ID /
        # OAUTH_GOOGLE_CLIENT_SECRET / INTERNAL_SERVICE_TOKEN 由上面 "Load optional
        # web-saas secrets" 写进 GITHUB_ENV, 此处不再重复声明 —— 它们已经是这个
        # step 的环境变量, 重复写只会用同名 env 覆盖同名 env, 没有意义。
        WEB_SAAS_STUNNEL_CA_CERT_B64:      ${{ steps.vault.outputs.WEB_SAAS_STUNNEL_CA_CERT_B64 }}
        WEB_SAAS_STUNNEL_SERVER_CERT_B64:  ${{ steps.vault.outputs.WEB_SAAS_STUNNEL_SERVER_CERT_B64 }}
        WEB_SAAS_STUNNEL_SERVER_KEY_B64:   ${{ steps.vault.outputs.WEB_SAAS_STUNNEL_SERVER_KEY_B64 }}
        # Doco-CD 角色用这两个做 docker login, 生成 /root/.docker/config.json ——
        # compose 把那个文件挂进容器好拉私有镜像。不传的话 Docker 会用一个
        # 自动创建的空目录顶上, Doco-CD 照样 healthy, 但每次轮询都以
        # "failed to pull images: unauthorized" 结束, 从容器状态上看不出来。
        GHCR_USERNAME:                     ${{ steps.vault.outputs.GHCR_USERNAME }}
        GHCR_PASSWORD:                     ${{ steps.vault.outputs.GHCR_PASSWORD }}
        WEB_SAAS_CONSOLE_DOMAIN:           console-${{ env.DEPLOY_ENV }}.${{ needs.provision.outputs.target_domain_base }}
        WEB_SAAS_ACCOUNTS_DOMAIN:          accounts-${{ env.DEPLOY_ENV }}.${{ needs.provision.outputs.target_domain_base }}
        WEB_SAAS_BILLING_DOMAIN:            ${{ needs.provision.outputs.deployment_env == 'uat' && format('billing-uat.{0}', needs.provision.outputs.target_domain_base) || '' }}
        AGENT_CONTROLLER_URL:              https://accounts-${{ env.DEPLOY_ENV }}.${{ needs.provision.outputs.target_domain_base }}
        AGENT_REPO_VERSION:                ${{ needs.provision.outputs.deploy_tag }}
        AGENT_SVC_PLUS_MANAGE_SOURCE_CHECKOUT: "true"
        AGENT_SVC_PLUS_BUILD_ON_TARGET:    "true"
        # 给了它 web_saas_host_config 就渲染 DNS-01 + *.<base> 泛域名 Caddyfile,
        # 没给就退回逐域名 HTTP-01。HTTP-01 要求 A 记录已经指向本机, 而交付顺序
        # 是"先部署新主机、最后才切 DNS" —— 切换之前签不出证书。
        CLOUDFLARE_DNS_API_TOKEN:          ${{ steps.vault.outputs.CLOUDFLARE_DNS_API_TOKEN }}
      run: ${{ github.workspace }}/.github/scripts/platform-ops_deploy_base_bootstrap-node.sh

    # 恢复步骤只能保证"证书写到磁盘了", 用不用它取决于上一步渲染出来的
    # Caddyfile。两者之间没有强制关系, 于是出现过"每一步都成功、合起来什么也
    # 没做成"的情况(run 30623661870)。这里在渲染之后做一次真正会失败的检查:
    # 有证书却没被引用就是配置错了, 必须当场红, 而不是等到 observe 那里以
    # "TLS handshake failed" 这种毫无指向性的形式暴露。
    - name: Assert Caddy actually serves the restored certificate
      if: ${{ contains(needs.provision.outputs.target_domains, 'web-saas') || needs.provision.outputs.target_domains == 'all' }}
      env:
        DOMAIN_TLS_DIR: /etc/xcontrol/tls/${{ needs.provision.outputs.target_domain_base }}
      run: ${{ github.workspace }}/.github/scripts/platform-ops_deploy_base_assert-caddy-uses-restored-cert.sh

  # ---------------------------------------------------------------------------
  # 步骤 2.5: 自动推进 GitOps 版本
  # 如果用户在触发流程时显式指定了 deploy_tag，我们将替用户自动把新的 tag 写入
  # ai-workspace-infra/gitops 并提交，以打通 CI 到 Pull-Only CD 的闭环。
  # ---------------------------------------------------------------------------
  update_gitops_tags:
    name: "[1] GitOps | deploy tags"
    needs: [provision]
    if: >-
      ${{ !cancelled() &&
      needs.provision.result == 'success' &&
      needs.provision.outputs.run_application_deploy == 'true' &&
      needs.provision.outputs.terraform_action == 'apply' &&
      needs.provision.outputs.deploy_tag != '' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout playbook scripts
        uses: actions/checkout@v4
        with:
          repository: ai-workspace-infra/playbooks
          ref: main

      - name: Load GitHub App private key from Vault
        id: vault
        uses: hashicorp/vault-action@v4
        with:
          url: https://vault.svc.plus
          method: jwt
          role: ${{ env.VAULT_ROLE }}
          jwtGithubAudience: vault
          secrets: |
            kv/data/CICD/github-app/daily-snapshot app_private_key | APP_PRIVATE_KEY

      - name: Create GitHub App installation token
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: Iv23liNwStpQIiXajhpb
          private-key: ${{ steps.vault.outputs.APP_PRIVATE_KEY }}
          owner: ai-workspace-infra

      - name: Checkout GitOps repository
        uses: actions/checkout@v4
        with:
          repository: ai-workspace-infra/gitops
          ref: ${{ needs.provision.outputs.gitops_ref }}
          token: ${{ steps.app-token.outputs.token }}
          path: gitops

      # web-saas 域更新
      - name: Update web-saas tags
        if: ${{ contains(needs.provision.outputs.target_domains, 'web-saas') || needs.provision.outputs.target_domains == 'all' }}
        env:
          DOMAIN: web-saas
          DEPLOY_ENV: ${{ needs.provision.outputs.deployment_env }}
          DEPLOY_TAG: ${{ needs.provision.outputs.deploy_tag }}
          MANAGED_IMAGES: ACCOUNTS_IMAGE BILLING_IMAGE CONSOLE_IMAGE
        run: bash .github/scripts/gitops-update-tags.sh

      # open-platform 域更新 (根据需要可以补充 MANAGED_IMAGES)
      - name: Update open-platform tags
        if: ${{ contains(needs.provision.outputs.target_domains, 'open-platform') || needs.provision.outputs.target_domains == 'all' }}
        env:
          DOMAIN: open-platform
          DEPLOY_ENV: ${{ needs.provision.outputs.deployment_env }}
          DEPLOY_TAG: ${{ needs.provision.outputs.deploy_tag }}
          # 假设 open-platform 也有管理的镜像，暂时放空或根据实际情况填写
          MANAGED_IMAGES: ''
        run: |
          if [ -n "${MANAGED_IMAGES}" ]; then
            bash .github/scripts/gitops-update-tags.sh
          fi

      - name: Commit and push changes
        working-directory: gitops
        run: |
          if ! git diff --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git commit -am "chore(cd): auto-update tags to ${{ needs.provision.outputs.deploy_tag }} for ${{ needs.provision.outputs.deployment_env }}"
            git push
            echo "GitOps repository updated successfully."
          else
            echo "No changes to GitOps configuration."
          fi

  # ---------------------------------------------------------------------------
  # 步骤 2b: Web SaaS 域服务部署 (postgresql / stunnel / accounts / billing / console)
  # 单机部署: 所有 web-saas 服务都跑在同一台 provision 出来的主机上, 所以需要先
  # 补上生产环境里各服务各自假设"已经存在"的共享前置条件:
  #   - cn-toolkit-shared Docker 网络 (没有任何 playbook 会创建它, 全靠约定已存在)
  #   - stunnel 自签证书 (postgresql_service 角色如果证书缺失会直接 fail)
  #   - account 库 / account_user 账号 (全新 Postgres 实例, 需要先建库建用户)
  # web-saas 业务密钥集中放在 kv/data/WEB_SAAS (人工维护, 不再自动生成/
  # 写回): POSTGRES_ROOT_PASSWORD, ACCOUNT_DB_PASSWORD, BILLING_DATABASE_URL,
  # INTERNAL_SERVICE_TOKEN。accounts 的系统 admin 引导密码是跨部署链路的
  # CI/CD 凭据，固定放在 kv/data/CICD 的 ROOT_BOOTSTRAP_PASSWORD。
  # GHCR 私有镜像凭据不在 WEB_SAAS, 而是跟其它 CI 通用凭据一起放在
  # kv/data/CICD: GHCR_USERNAME 直接同名取, 密码键名是 GHCR_TOKEN, 映射为
  # 各脚本统一消费的 GHCR_PASSWORD。
  # ---------------------------------------------------------------------------
  # 2026-07-28: 这个 job 原来排在 deploy_web_saas 之后, deploy_web_saas 原来
  # 只做 validate/confirm-pull-only, 从不真正检查容器是否起来, 所以顺序反了
  # 也从来没人发现。playbooks#200 给 deploy_web_saas 加了 observe_urls 健康
  # 检查后, 这个反序在任何一台*新*主机上都会死锁: accounts 容器要连
  # account 库才能起, 库要这个 job 来建, 而这个 job 又要等 deploy_web_saas
  # 先成功 —— deploy_web_saas 永远等不到健康的 accounts, 于是永远失败,
  # 这个 job 也永远不会跑。#164 和 #200 各自都对, 合在一起才第一次暴露
  # 这个耦合(见 run 30358343199, Bootstrap 成功但 Deploy Web SaaS Services
  # 报 "no HTTP response" / "HTTP 502" 全部 fail)。
  # 把建库挪到 observe 检查之前修复, 不是撤销任何一个 fix。
  initialize_web_saas_databases:
    name: "[2] DB Init | ${{ matrix.host }}"
    needs: [provision, deploy_base]
    if: >-
      ${{ !cancelled() &&
      needs.provision.result == 'success' &&
      needs.deploy_base.result == 'success' &&
      needs.provision.outputs.run_application_deploy == 'true' &&
      needs.provision.outputs.terraform_action == 'apply' &&
      needs.provision.outputs.count != '0' &&
      contains(fromJSON('["all","web-saas","web-saas + agent-proxy"]'), needs.provision.outputs.target_domains) &&
      needs.provision.outputs.hosts_web_saas != '[]' &&
      needs.provision.outputs.hosts_web_saas != '' }}
    runs-on: ${{ github.event.inputs.runner_type || 'ubuntu-latest' }}
    strategy:
      fail-fast: false
      matrix:
        host: ${{ fromJSON(needs.provision.outputs.hosts_web_saas) }}
    env:
      MATRIX_HOST: ${{ matrix.host }}
      ANSIBLE_HOST_KEY_CHECKING: "False"
      ANSIBLE_SSH_ARGS: "-o IdentityFile=~/.ssh/id_deploy -o StrictHostKeyChecking=no"
      VAULT_ENV_PATH: ${{ needs.provision.outputs.vault_env_path }}
    steps:
    - name: Checkout repository
      uses: actions/checkout@v7
      with:
        # The helper script is part of the workflow commit. The deployment tag
        # may predate the helper and must not control this checkout.
        ref: ${{ github.sha }}

    - name: Checkout playbooks
      uses: actions/checkout@v7
      with:
        repository: ai-workspace-infra/playbooks
        ref: ${{ needs.provision.outputs.playbooks_ref }}
        path: playbooks

    - name: Download CMDB
      uses: actions/download-artifact@v8
      with:
        name: platform-ops-toolkit-cmdb
        path: cmdb

    - name: Load Vault secrets
      id: vault
      uses: hashicorp/vault-action@v4
      with:
        url: ${{ env.VAULT_ADDR }}
        method: jwt
        role: ${{ env.VAULT_ROLE }}
        jwtGithubAudience: vault
        exportToken: true
        secrets: |
          ${{ env.VAULT_KV_BASE }} SSH_PRIVATE_DEPLOY_KEY_B64 | ANSIBLE_SSH_KEY_B64 ;
          ${{ env.VAULT_KV }} ROOT_BOOTSTRAP_PASSWORD | ROOT_BOOTSTRAP_PASSWORD ;

    - name: Configure SSH Key
      env:
        VAULT_ANSIBLE_SSH_KEY_B64: ${{ steps.vault.outputs.ANSIBLE_SSH_KEY_B64 }}
      run: ${{ github.workspace }}/.github/scripts/common_configure_ssh_key.sh

    - name: Wait for host SSH
      run: ${{ github.workspace }}/.github/scripts/common_wait_for_host_ssh.sh

    - name: Install Ansible
      run: ${{ github.workspace }}/.github/scripts/common_install_ansible.sh

    # 0 主机命中仍 exit 0 是本仓 workplan 的陷阱 #12。守卫脚本一直躺在
    # .github/scripts/里但没有任何 workflow 引用它, 于是这一步 2026-07-28
    # 在 run 30339933681 里报绿而一个库都没建。
    - name: Assert the Ansible target resolves to a reachable host
      working-directory: playbooks
      run: >-
        ${{ github.workspace }}/.github/scripts/common_assert_ansible_host.sh
        ../cmdb/inventory.ini "${MATRIX_HOST}"

    # 这一步此前跑的是 deploy_accounts_svc_plus.yml —— 那是"部署 accounts
    # 服务"的 playbook, 与步骤名(建库建角色)对不上, 而且容器栈本就该由
    # Doco-CD 拉 gitops 来部署, 这里再部署一遍是重复的第二条路径。
    #
    # 更要命的是它的 hosts 默认值是 accounts 组, 而 CMDB 给 web-saas 主机打
    # 的组是 web_saas/debian/database, 根本没有 accounts 组 —— --limit 与
    # hosts 求交为空, ansible 打印 "skipping: no hosts matched" 后 exit 0。
    # 于是 account/billing 两个库从没被创建, accounts 容器起来就报
    # 'database "account" does not exist' 反复重启, Caddy 对外表现成 502。
    #
    # create_databases_and_users.yml 才是建库的那个(hosts: all, 与 --limit
    # 求交正好命中本机), 它自己会探测 web-saas-postgresql 容器, 探测不到会
    # 显式 fail 而不是静默跳过。
    - name: Create Web SaaS databases and roles
      working-directory: playbooks
      env:
        ROOT_BOOTSTRAP_PASSWORD: ${{ steps.vault.outputs.ROOT_BOOTSTRAP_PASSWORD }}
        # Pass the exact credentials used by the application deployment into
        # the idempotent role reconciliation. This removes the implicit
        # database-Vault fallback and makes the DB-init/app contract explicit.
        ACCOUNT_PG_PASSWORD: ${{ steps.vault.outputs.ACCOUNT_PG_PASSWORD }}
        VAULT_ENV_PATH: ${{ needs.provision.outputs.vault_env_path }}
        POSTGRESQL_DEPLOY_MODE: compose
      run: >-
        ansible-playbook -i ../cmdb/inventory.ini create_databases_and_users.yml
        --limit "${MATRIX_HOST}"

    # 建库只建库和角色, 不建表。accounts 自己只会自动建 7 张表, users /
    # sessions / identities / rbac_* 这套 baseline 必须外部灌入, 否则 accounts
    # 起来就是 relation "users" does not exist 无限重启, 对外 502 ——
    # 2026-07-28 每一台新主机都栽在这一步的缺失上。
    # 幂等: users 表在就跳过, 所以每次部署都跑是安全的。
    - name: Initialize Web SaaS baseline schemas
      working-directory: playbooks
      env:
        # schema 跟着部署的版本走, 不跟 main 走 —— 用 main 的表结构配一个旧
        # tag 的镜像, 是"表比代码新"的经典事故。
        ACCOUNTS_SCHEMA_REF: ${{ needs.provision.outputs.deploy_tag || needs.provision.outputs.deploy_ref || 'main' }}
      run: >-
        ansible-playbook -i ../cmdb/inventory.ini initialize-web-saas-schemas.yml
        --limit "${MATRIX_HOST}"

  # deploy_web_saas (stateless containers) 和 initialize_web_saas_databases (DB init)
  # 并行运行 —— 两者都只依赖 deploy_base, 互相不阻塞。
  # switch_dns 等待两者都完成才切流量(最后一步流量门)。
  # observe 在 switch_dns 之后的 deploy_web_saas 中完成(DNS 此时已就位)。
  deploy_web_saas:
    name: "[2] Web SaaS | ${{ matrix.host }}"
    needs: [provision, deploy_base]
    if: >-
      ${{ !cancelled() &&
      needs.provision.result == 'success' &&
      needs.deploy_base.result == 'success' &&
      needs.provision.outputs.run_application_deploy == 'true' &&
      needs.provision.outputs.terraform_action == 'apply' &&
      needs.provision.outputs.count != '0' &&
      contains(fromJSON('["all","web-saas","web-saas + agent-proxy"]'), needs.provision.outputs.target_domains) &&
      needs.provision.outputs.hosts_web_saas != '[]' &&
      needs.provision.outputs.hosts_web_saas != '' }}
    strategy:
      fail-fast: false
      matrix:
        host: ${{ fromJSON(needs.provision.outputs.hosts_web_saas) }}
    uses: ai-workspace-infra/playbooks/.github/workflows/web-saas-domain-cd.yaml@main
    with:
      target_host: ${{ matrix.host }}
      deploy_env: ${{ needs.provision.outputs.deployment_env }}
      deploy_tag: ${{ needs.provision.outputs.deploy_tag }}
      # observe_urls 留空: 此时容器可能还没被 Doco-CD 拉起, 且 DNS 未必指向
      # 本次这台机器。真正的验收由下面的 observe_web_saas 做(把域名钉到本次
      # 部署的 IP 上, 不依赖 DNS 是否已切)。
      observe_urls: ''

  # 每次部署都必须验收, 不能只在切流量时验收。
  #
  # switch_dns 里那个 observe 挂在 confirm_dns_switch == 'true' 上, 而这个输入
  # default: false 且描述写着"仅真实灾备启用" —— 也就是常规部署里 switch_dns
  # 整个被 skip, 那个 observe 一次都不会跑。结果是 playbooks#200 想堵的假绿在
  # 最常见的路径上又回来了: 容器没起来, 流水线照样全绿。
  #
  # 这个 job 不看 confirm_dns_switch, 只要部署跑了就验收; 并用
  # OBSERVE_RESOLVE_IP 把域名钉到本次部署的主机, 这样 DNS 还没切(或者还指着
  # 一台已经销毁的老机器)时, 量到的依然是"我刚部署的这台"。
  observe_web_saas:
    name: "[3] Observe | ${{ matrix.host }}"
    needs: [provision, deploy_base, deploy_web_saas, initialize_web_saas_databases]
    if: >-
      ${{ !cancelled() &&
      needs.provision.result == 'success' &&
      needs.deploy_base.result == 'success' &&
      needs.deploy_web_saas.result == 'success' &&
      needs.initialize_web_saas_databases.result == 'success' &&
      needs.provision.outputs.run_application_deploy == 'true' &&
      needs.provision.outputs.terraform_action == 'apply' &&
      needs.provision.outputs.count != '0' &&
      contains(fromJSON('["all","web-saas","web-saas + agent-proxy"]'), needs.provision.outputs.target_domains) &&
      needs.provision.outputs.hosts_web_saas != '[]' &&
      needs.provision.outputs.hosts_web_saas != '' }}
    runs-on: ${{ github.event.inputs.runner_type || 'ubuntu-latest' }}
    strategy:
      fail-fast: false
      matrix:
        host: ${{ fromJSON(needs.provision.outputs.hosts_web_saas) }}
    env:
      MATRIX_HOST: ${{ matrix.host }}
    steps:
    # 本仓的脚本(证书备份 / SSH key)在 workspace 根, playbooks 的 observe 脚本
    # 在 playbooks/ 子目录 —— 两个都要 checkout。
    - name: Checkout repository
      uses: actions/checkout@v7
      with:
        ref: ${{ github.sha }}

    - name: Checkout playbooks
      uses: actions/checkout@v7
      with:
        repository: ai-workspace-infra/playbooks
        ref: ${{ needs.provision.outputs.playbooks_ref }}
        path: playbooks

    - name: Download CMDB
      uses: actions/download-artifact@v8
      with:
        name: platform-ops-toolkit-cmdb
        path: cmdb

    - name: Load Vault secrets
      id: vault
      uses: hashicorp/vault-action@v4
      with:
        url: ${{ env.VAULT_ADDR }}
        method: jwt
        role: ${{ env.VAULT_ROLE }}
        jwtGithubAudience: vault
        exportToken: true
        secrets: |
          ${{ env.VAULT_KV_BASE }} SSH_PRIVATE_DEPLOY_KEY_B64 | ANSIBLE_SSH_KEY_B64

    # CMDB 是本次 provision 产出的, 里面的 IP 一定是这次部署的那台机器 ——
    # 比 dig 域名可靠, 因为域名可能还没切过来。
    - name: Resolve host IP from CMDB
      id: hostip
      run: |
        set -euo pipefail
        ip="$(jq -r --arg h "${MATRIX_HOST}" '.[$h].ip // empty' cmdb/cmdb.json)"
        if [ -z "${ip}" ]; then
          echo "::error::host '${MATRIX_HOST}' has no ip in cmdb/cmdb.json" >&2
          exit 1
        fi
        echo "ip=${ip}" >> "$GITHUB_OUTPUT"
        echo "Observing ${MATRIX_HOST} at ${ip}"

    - name: Observe Web SaaS endpoints
      env:
        DOMAIN: web-saas
        DEPLOY_ENV: ${{ needs.provision.outputs.deployment_env }}
        OBSERVE_RESOLVE_IP: ${{ steps.hostip.outputs.ip }}
        OBSERVE_URLS: >-
          https://console-${{ needs.provision.outputs.deployment_env }}.${{ needs.provision.outputs.target_domain_base }}/
          https://accounts-${{ needs.provision.outputs.deployment_env }}.${{ needs.provision.outputs.target_domain_base }}/
      run: bash playbooks/.github/scripts/domain-cd-observe-endpoints.sh

    # 备份排在 observe 之后, 因为此刻证书要么是恢复来的、要么是本轮新签的,
    # observe 刚刚用它握过手 —— 优先存一份验证过的。
    #
    # 但**不能**只在 observe 成功时才备份, 否则这套持久化永远启动不了:
    #   证书不在 Vault -> Caddy 只能找 ACME 签 -> 撞 429 拿不到证书
    #   -> observe 因为没有 TLS 而失败 -> 备份被 skip -> 证书还是不在 Vault
    # 这是个自锁的环, 2026-07-31 run 30617227887 就卡在这里: Caddy 明明已经
    # 从 staging 拿到过证书, 却因为 observe 红了而一次都没存进 Vault。
    #
    # 所以只要主机上有证书就存, 与站点是否已经健康无关 —— 那是两件事:
    # "证书能不能复用" 和 "服务起没起来"。备份脚本自己会判断有没有东西可存、
    # 以及是不是已经过期, 失败也只 warning, 不会把 job 拖红。
    - name: Configure SSH Key
      if: ${{ !cancelled() }}
      env:
        VAULT_ANSIBLE_SSH_KEY_B64: ${{ steps.vault.outputs.ANSIBLE_SSH_KEY_B64 }}
      run: ${{ github.workspace }}/.github/scripts/common_configure_ssh_key.sh

    - name: Back up Caddy certificates to Vault
      if: ${{ !cancelled() }}
      continue-on-error: true
      env:
        VAULT_ROLE: ${{ env.VAULT_ROLE }}
        VAULT_CADDY_PATH: kv/data/CICD/domains/${{ needs.provision.outputs.target_domain_base }}
        CMDB_FILE: cmdb/cmdb.json
      run: ${{ github.workspace }}/.github/scripts/platform-ops_observe_backup-caddy-certs.sh

  switch_dns:
    name: "[3] DNS Gate | switch + observe"
    # 等核心业务 job 都完成才切流量 —— 这是流量门。
    needs: [
      provision,
      deploy_base,
      deploy_web_saas,
      initialize_web_saas_databases,
      observe_web_saas,
      update_gitops_tags,
      deploy_infra_platform,
      deploy_agent_proxy,
      deploy_ai_workspace
    ]
    if: >-
      ${{ always() && !cancelled() &&
      needs.provision.result == 'success' &&
      needs.deploy_base.result == 'success' &&
      (needs.update_gitops_tags.result == 'success' || needs.update_gitops_tags.result == 'skipped') &&
      (needs.deploy_web_saas.result == 'success' || !contains(fromJSON('["all","web-saas","web-saas + agent-proxy"]'), needs.provision.outputs.target_domains)) &&
      (needs.initialize_web_saas_databases.result == 'success' || !contains(fromJSON('["all","web-saas","web-saas + agent-proxy"]'), needs.provision.outputs.target_domains)) &&
      (needs.observe_web_saas.result == 'success' || !contains(fromJSON('["all","web-saas","web-saas + agent-proxy"]'), needs.provision.outputs.target_domains)) &&
      needs.deploy_infra_platform.result != 'failure' &&
      (needs.deploy_agent_proxy.result == 'success' || !contains(fromJSON('["all","agent-proxy","web-saas + agent-proxy"]'), needs.provision.outputs.target_domains)) &&
      needs.deploy_ai_workspace.result != 'failure' &&
      needs.provision.outputs.terraform_action == 'apply' &&
      needs.provision.outputs.confirm_dns_switch == 'true' &&
      needs.provision.outputs.uat_dns_update != 'true' }}
    runs-on: ${{ github.event.inputs.runner_type || 'ubuntu-latest' }}
    environment: production
    env:
      PROVISION_TARGET_DOMAIN_BASE:  ${{ needs.provision.outputs.target_domain_base }}
      PROVISION_SOURCE_DOMAIN_BASE:  ${{ needs.provision.outputs.source_domain_base }}
      INPUT_RUN_INFRASTRUCTURE:      ${{ needs.provision.outputs.run_infrastructure }}
      DEPLOY_ENV:                    ${{ needs.provision.outputs.deployment_env }}
      DNS_SERVICE_NAMES:             console accounts billing
    steps:
    - name: Checkout repository
      uses: actions/checkout@v7
      with:
        ref: ${{ needs.provision.outputs.toolkit_ref }}

    - name: Download CMDB
      # 与上传条件保持一致: artifact 只在基础设施阶段 apply 时产生。
      if: >-
        ${{ needs.provision.outputs.run_infrastructure == 'true' &&
        needs.provision.outputs.terraform_action == 'apply' }}
      uses: actions/download-artifact@v8
      with:
        name: platform-ops-toolkit-cmdb
        path: cmdb

    - name: Checkout playbooks
      uses: actions/checkout@v7
      with:
        repository: ai-workspace-infra/playbooks
        ref: ${{ needs.provision.outputs.playbooks_ref }}
        path: playbooks

    - name: Install Ansible
      run: ${{ github.workspace }}/.github/scripts/common_install_ansible.sh

    - name: Load Vault secrets for DNS
      id: vault
      uses: hashicorp/vault-action@v4
      with:
        url: ${{ env.VAULT_ADDR }}
        method: jwt
        role: ${{ env.VAULT_ROLE }}
        jwtGithubAudience: vault
        ignoreNotFound: true
        secrets: |
          ${{ env.VAULT_KV_BASE }} SSH_PRIVATE_DEPLOY_KEY_B64 | ANSIBLE_SSH_KEY_B64 ;
          ${{ env.VAULT_KV }} CLOUDFLARE_DNS_API_TOKEN | CLOUDFLARE_DNS_API_TOKEN ;
          ${{ env.VAULT_KV_AGENT_PROXY }} xray_uuid | XRAY_UUID

    - name: Configure SSH Key for post-DNS cleanup
      env:
        VAULT_ANSIBLE_SSH_KEY_B64: ${{ steps.vault.outputs.ANSIBLE_SSH_KEY_B64 }}
      run: ${{ github.workspace }}/.github/scripts/common_configure_ssh_key.sh

    - name: Switch Cloudflare DNS Records
      env:
        CLOUDFLARE_DNS_API_TOKEN: ${{ steps.vault.outputs.CLOUDFLARE_DNS_API_TOKEN }}
      run: |-
        ${{ github.workspace }}/.github/scripts/platform-ops_switch_dns_switch-cloudflare-dns-records.sh

    - name: Remove temporary agent controller host pin
      if: >-
        ${{ contains(fromJSON('["all","agent-proxy","web-saas + agent-proxy"]'),
        needs.provision.outputs.target_domains) }}
      run: ${{ github.workspace }}/.github/scripts/platform-ops_switch_dns_remove-temporary-agent-controller-host.sh

    - name: Observe Web SaaS endpoints (post-DNS)
      # DNS 已切换, 现在轮询公网 URL 验证服务真正可达。
      env:
        DOMAIN: web-saas
        DEPLOY_ENV: ${{ needs.provision.outputs.deployment_env }}
        OBSERVE_URLS: >-
          https://console-${{ needs.provision.outputs.deployment_env }}.${{ needs.provision.outputs.target_domain_base }}/
          https://accounts-${{ needs.provision.outputs.deployment_env }}.${{ needs.provision.outputs.target_domain_base }}/
      run: bash playbooks/.github/scripts/domain-cd-observe-endpoints.sh

  update_uat_dns:
    name: Reconcile UAT DNS Records & Observe
    # This job is deliberately separate from the production cutover job. The
    # route script and the reconciler both enforce the UAT-only boundary.
    needs: [
      provision,
      deploy_base,
      deploy_web_saas,
      initialize_web_saas_databases,
      observe_web_saas,
      update_gitops_tags,
      deploy_infra_platform,
      deploy_agent_proxy,
      deploy_ai_workspace
    ]
    if: >-
      ${{ always() && !cancelled() &&
      needs.provision.result == 'success' &&
      needs.provision.outputs.uat_dns_update == 'true' &&
      needs.deploy_base.result == 'success' &&
      (needs.update_gitops_tags.result == 'success' || needs.update_gitops_tags.result == 'skipped') &&
      (needs.deploy_web_saas.result == 'success' || !contains(fromJSON('["all","web-saas","web-saas + agent-proxy"]'), needs.provision.outputs.target_domains)) &&
      (needs.initialize_web_saas_databases.result == 'success' || !contains(fromJSON('["all","web-saas","web-saas + agent-proxy"]'), needs.provision.outputs.target_domains)) &&
      (needs.observe_web_saas.result == 'success' || !contains(fromJSON('["all","web-saas","web-saas + agent-proxy"]'), needs.provision.outputs.target_domains)) &&
      needs.deploy_infra_platform.result != 'failure' &&
      (needs.deploy_agent_proxy.result == 'success' || !contains(fromJSON('["all","agent-proxy","web-saas + agent-proxy"]'), needs.provision.outputs.target_domains)) &&
      needs.deploy_ai_workspace.result != 'failure' &&
      needs.provision.outputs.deployment_env == 'uat' &&
      needs.provision.outputs.terraform_action == 'apply' }}
    runs-on: ${{ github.event.inputs.runner_type || 'ubuntu-latest' }}
    env:
      # Keep the DNS reconciler UAT-only, but render the zone and names from
      # the resolved deployment parameters instead of pinning onwalk.net.
      VAULT_ADDR: https://vault.svc.plus
      VAULT_ROLE: github-actions-platform-ops-toolkit-uat
      VAULT_KV: kv/data/CICD
      DEPLOY_ENV: ${{ needs.provision.outputs.deployment_env }}
      SOURCE_DOMAIN_BASE: ${{ needs.provision.outputs.source_domain_base }}
      TARGET_DOMAIN_BASE: ${{ needs.provision.outputs.target_domain_base }}
      CMDB_FILE: cmdb/cmdb.json
    steps:
    - name: Checkout repository
      uses: actions/checkout@v7
      with:
        ref: ${{ needs.provision.outputs.toolkit_ref }}

    - name: Download CMDB
      uses: actions/download-artifact@v8
      with:
        name: platform-ops-toolkit-cmdb
        path: cmdb

    - name: Checkout playbooks for endpoint observation
      uses: actions/checkout@v7
      with:
        repository: ai-workspace-infra/playbooks
        ref: ${{ needs.provision.outputs.playbooks_ref }}
        path: playbooks

    - name: Load UAT DNS token from Vault
      id: vault
      uses: hashicorp/vault-action@v4
      with:
        url: ${{ env.VAULT_ADDR }}
        method: jwt
        role: ${{ env.VAULT_ROLE }}
        jwtGithubAudience: vault
        ignoreNotFound: true
        secrets: |
          ${{ env.VAULT_KV }} CLOUDFLARE_DNS_API_TOKEN | CLOUDFLARE_DNS_API_TOKEN ;

    - name: Reconcile parameterized UAT DNS records
      id: uat_dns
      env:
        CLOUDFLARE_DNS_API_TOKEN: ${{ steps.vault.outputs.CLOUDFLARE_DNS_API_TOKEN }}
      run: ${{ github.workspace }}/.github/scripts/platform-ops_uat_dns_reconcile.sh

    - name: Observe UAT Web SaaS endpoints
      env:
        DOMAIN: web-saas
        DEPLOY_ENV: ${{ needs.provision.outputs.deployment_env }}
        OBSERVE_RESOLVE_IP: ${{ steps.uat_dns.outputs.web_saas_ip }}
        OBSERVE_URLS: >-
          https://billing-${{ needs.provision.outputs.deployment_env }}.${{ needs.provision.outputs.target_domain_base }}/
          https://console-${{ needs.provision.outputs.deployment_env }}.${{ needs.provision.outputs.target_domain_base }}/
          https://accounts-${{ needs.provision.outputs.deployment_env }}.${{ needs.provision.outputs.target_domain_base }}/
      run: bash playbooks/.github/scripts/domain-cd-observe-endpoints.sh

  deploy_infra_platform:
    name: "[2] Infra | ${{ matrix.host }}"
    needs: [provision, deploy_base]
    if: >-
      ${{ !cancelled() &&
      needs.provision.result == 'success' &&
      needs.deploy_base.result == 'success' &&
      needs.provision.outputs.run_application_deploy == 'true' &&
      needs.provision.outputs.terraform_action == 'apply' &&
      needs.provision.outputs.count != '0' &&
      contains(fromJSON('["all","infra-platform"]'), needs.provision.outputs.target_domains) &&
      needs.provision.outputs.hosts_infra_platform != '[]' &&
      needs.provision.outputs.hosts_infra_platform != '' }}
    strategy:
      fail-fast: false
      matrix:
        host: ${{ fromJSON(needs.provision.outputs.hosts_infra_platform) }}
    uses: ai-workspace-infra/playbooks/.github/workflows/open-platform-domain-cd.yaml@main
    with:
      target_host: ${{ matrix.host }}
      deploy_env: ${{ needs.provision.outputs.deployment_env }}
      deploy_tag: ${{ needs.provision.outputs.deploy_tag }}

  deploy_agent_proxy:
    name: "[3] Agent Proxy | ${{ matrix.host }}"
    # A fresh agent needs Accounts to be serving before its first sync can
    # generate the Xray runtime configs.  For an agent-only delivery there is
    # no local Web SaaS observe job, so a skipped observe is still valid; for
    # web-saas + agent-proxy this makes the dependency explicit.
    needs: [provision, deploy_base, observe_web_saas]
    if: >-
      ${{ always() && !cancelled() &&
      needs.provision.result == 'success' &&
      needs.deploy_base.result == 'success' &&
      (needs.observe_web_saas.result == 'success' || needs.observe_web_saas.result == 'skipped') &&
      needs.provision.outputs.run_application_deploy == 'true' &&
      needs.provision.outputs.terraform_action == 'apply' &&
      needs.provision.outputs.count != '0' &&
      contains(fromJSON('["all","agent-proxy","web-saas + agent-proxy"]'), needs.provision.outputs.target_domains) &&
      needs.provision.outputs.hosts_agent_proxy != '[]' &&
      needs.provision.outputs.hosts_agent_proxy != '' }}
    strategy:
      fail-fast: false
      matrix:
        host: ${{ fromJSON(needs.provision.outputs.hosts_agent_proxy) }}
    runs-on: ${{ github.event.inputs.runner_type || 'ubuntu-latest' }}
    env:
      MATRIX_HOST: ${{ matrix.host }}
      ANSIBLE_HOST_KEY_CHECKING: "False"
      ANSIBLE_SSH_ARGS: "-o IdentityFile=~/.ssh/id_deploy -o StrictHostKeyChecking=no"
      VAULT_ENV_PATH: ${{ needs.provision.outputs.vault_env_path }}
    steps:
    - name: Checkout repository
      uses: actions/checkout@v7
      with:
        ref: ${{ github.sha }}

    - name: Checkout playbooks
      uses: actions/checkout@v7
      with:
        repository: ai-workspace-infra/playbooks
        ref: ${{ needs.provision.outputs.playbooks_ref }}
        path: playbooks

    - name: Download CMDB
      uses: actions/download-artifact@v8
      with:
        name: platform-ops-toolkit-cmdb
        path: cmdb

    - name: Resolve current Web SaaS controller IP
      id: controller
      env:
        CMDB_FILE: cmdb/cmdb.json
      run: ${{ github.workspace }}/.github/scripts/platform-ops_deploy_agent_proxy_resolve-controller-ip.sh

    - name: Load agent-proxy secrets
      id: vault
      uses: hashicorp/vault-action@v4
      with:
        url: ${{ env.VAULT_ADDR }}
        method: jwt
        role: ${{ env.VAULT_ROLE }}
        jwtGithubAudience: vault
        exportToken: true
        secrets: |
          ${{ env.VAULT_KV_BASE }} SSH_PRIVATE_DEPLOY_KEY_B64 | ANSIBLE_SSH_KEY_B64 ;
          ${{ env.VAULT_KV_WEB_SAAS }} INTERNAL_SERVICE_TOKEN | INTERNAL_SERVICE_TOKEN

    - name: Configure SSH Key
      env:
        VAULT_ANSIBLE_SSH_KEY_B64: ${{ steps.vault.outputs.ANSIBLE_SSH_KEY_B64 }}
      run: ${{ github.workspace }}/.github/scripts/common_configure_ssh_key.sh

    - name: Wait for host SSH
      run: ${{ github.workspace }}/.github/scripts/common_wait_for_host_ssh.sh

    - name: Install Ansible
      run: ${{ github.workspace }}/.github/scripts/common_install_ansible.sh

    - name: Assert the Ansible target resolves to a reachable host
      working-directory: playbooks
      run: >-
        ${{ github.workspace }}/.github/scripts/common_assert_ansible_host.sh
        ../cmdb/inventory.ini "${MATRIX_HOST}"

    - name: Deploy native agent-proxy services
      working-directory: playbooks
      env:
        INTERNAL_SERVICE_TOKEN: ${{ steps.vault.outputs.INTERNAL_SERVICE_TOKEN }}
        AGENT_CONTROLLER_URL: https://accounts-${{ needs.provision.outputs.deployment_env }}.${{ needs.provision.outputs.target_domain_base }}
        AGENT_CONTROLLER_IP: ${{ steps.controller.outputs.ip }}
        AGENT_REPO_VERSION: ${{ needs.provision.outputs.deploy_tag }}
        AGENT_ID: ${{ matrix.host }}
        AGENT_PROXY_DOMAIN: ${{ matrix.host }}
        AGENT_DOMAIN_TLS_DIR: /etc/xcontrol/tls/${{ needs.provision.outputs.target_domain_base }}
        BILLING_SERVICE_BASE_URL: ${{ needs.provision.outputs.deployment_env == 'uat' && format('https://billing-uat.{0}', needs.provision.outputs.target_domain_base) || 'http://127.0.0.1:8081' }}
        AGENT_XRAY_ENABLED: "true"
        # UAT billing is fed by Exporter -> Vector -> Billing. Keep the
        # legacy agent-side collect/reconcile trigger enabled only outside
        # UAT so this deployment cannot reintroduce Billing direct-pull.
        AGENT_BILLING_ENABLED: ${{ needs.provision.outputs.deployment_env != 'uat' && 'true' || 'false' }}
        EXPORTER_ENV: ${{ needs.provision.outputs.deployment_env }}
        ACCOUNTS_BASE_URL: https://accounts-${{ needs.provision.outputs.deployment_env }}.${{ needs.provision.outputs.target_domain_base }}
        # A UAT snapshot tag is published by the fork, not by the upstream
        # compatibility repository. Derive both values from the resolved
        # deployment unless the operator explicitly overrides them.
        XRAY_EXPORTER_RELEASE_REPOSITORY: ${{ github.event.inputs.xray_exporter_release_repository || (needs.provision.outputs.deployment_env == 'uat' && 'ai-workspace-xstream/xray-exporter' || 'compassvpn/xray-exporter') }}
        XRAY_EXPORTER_VERSION: ${{ github.event.inputs.xray_exporter_version || (needs.provision.outputs.deployment_env == 'uat' && needs.provision.outputs.deploy_tag || 'v0.6.0') }}
        XRAY_EXPORTER_LISTEN_ADDR: ${{ needs.provision.outputs.deployment_env == 'uat' && '0.0.0.0:8080' || '127.0.0.1:8080' }}
        XRAY_EXPORTER_TCP_LISTEN_ADDR: ${{ needs.provision.outputs.deployment_env == 'uat' && '0.0.0.0:8081' || '127.0.0.1:8081' }}
        # UAT keeps the exporter -> local Vector hand-off on the agent host.
        # Production remains on the upstream-compatible default unless a
        # production delivery explicitly opts into a separate contract.
        VECTOR_SNAPSHOT_URL: ${{ needs.provision.outputs.deployment_env == 'uat' && 'http://127.0.0.1:8686' || '' }}
      run: >-
        ansible-playbook -i ../cmdb/inventory.ini setup-agent-proxy-domain.yml
        --limit "${MATRIX_HOST}"
        -e agent_service_hosts=agent_proxy
        -e xray_exporter_hosts=agent_proxy
        -e agent_svc_plus_manage_source_checkout=true
        -e agent_svc_plus_build_on_target=true
        -e agent_billing_enabled="${AGENT_BILLING_ENABLED}"

    - name: Verify native agent-proxy services
      working-directory: playbooks
      run: >-
        ansible agent_proxy -i ../cmdb/inventory.ini --limit "${MATRIX_HOST}"
        -m ansible.builtin.shell
        -a "systemctl is-active caddy agent-svc-plus xray xray-tcp xray-exporter-xhttp xray-exporter-tcp"
        --become

  deploy_ai_workspace:
    name: "[2] AI Workspace | ${{ matrix.host }}"
    needs: [provision, deploy_base]
    if: >-
      ${{ !cancelled() &&
      needs.provision.result == 'success' &&
      needs.deploy_base.result == 'success' &&
      needs.provision.outputs.run_application_deploy == 'true' &&
      needs.provision.outputs.terraform_action == 'apply' &&
      needs.provision.outputs.count != '0' &&
      contains(fromJSON('["all","ai-workspace"]'), needs.provision.outputs.target_domains) &&
      needs.provision.outputs.hosts_ai_workspace != '[]' &&
      needs.provision.outputs.hosts_ai_workspace != '' }}
    strategy:
      fail-fast: false
      matrix:
        host: ${{ fromJSON(needs.provision.outputs.hosts_ai_workspace) }}
    uses: ai-workspace-infra/playbooks/.github/workflows/ai-workspace-domain-cd.yaml@main
    with:
      target_host: ${{ matrix.host }}
      deploy_env: ${{ needs.provision.outputs.deployment_env }}
      deploy_tag: ${{ needs.provision.outputs.deploy_tag }}

  deploy_monitor_agent:
    name: "[2] Monitor Agent"
    needs: [provision, deploy_base]
    if: >-
      ${{ !cancelled() &&
      needs.provision.result == 'success' &&
      needs.deploy_base.result == 'success' &&
      needs.provision.outputs.run_application_deploy == 'true' &&
      needs.provision.outputs.terraform_action == 'apply' &&
      needs.provision.outputs.count != '0' &&
      needs.provision.outputs.hosts != '[]' &&
      needs.provision.outputs.hosts != '' }}
    runs-on: ${{ github.event.inputs.runner_type || 'ubuntu-latest' }}
    strategy:
      fail-fast: false
      matrix:
        host: ${{ fromJSON(needs.provision.outputs.hosts) }}
    env:
      MATRIX_HOST: ${{ matrix.host }}
      ANSIBLE_HOST_KEY_CHECKING: "False"
      ANSIBLE_SSH_ARGS: "-o IdentityFile=~/.ssh/id_deploy -o StrictHostKeyChecking=no"
      VAULT_ENV_PATH: ${{ needs.provision.outputs.vault_env_path }}
      OBSERVABILITY_ENDPOINT: ${{ github.event.inputs.observability_endpoint || 'https://observability.svc.plus' }}
    steps:
    - name: Checkout repository
      uses: actions/checkout@v7

    - name: Checkout playbooks
      uses: actions/checkout@v7
      with:
        repository: ai-workspace-infra/playbooks
        ref: ${{ needs.provision.outputs.playbooks_ref }}
        path: playbooks

    - name: Download CMDB
      uses: actions/download-artifact@v8
      with:
        name: platform-ops-toolkit-cmdb
        path: cmdb

    - name: Load Vault secrets
      id: vault
      uses: hashicorp/vault-action@v4
      with:
        url: ${{ env.VAULT_ADDR }}
        method: jwt
        role: ${{ env.VAULT_ROLE }}
        jwtGithubAudience: vault
        ignoreNotFound: true
        secrets: |
          ${{ env.VAULT_KV_BASE }} SSH_PRIVATE_DEPLOY_KEY_B64 | ANSIBLE_SSH_KEY_B64 ;
          ${{ env.VAULT_KV_WEB_SAAS }} INTERNAL_SERVICE_TOKEN | INTERNAL_SERVICE_TOKEN ;
          kv/data/CICD/observability user | VECTOR_AUTH_USER ;
          kv/data/CICD/observability password | VECTOR_AUTH_PASSWORD

    - name: Configure SSH Key
      env:
        VAULT_ANSIBLE_SSH_KEY_B64: ${{ steps.vault.outputs.ANSIBLE_SSH_KEY_B64 }}
      run: |-
        ${{ github.workspace }}/.github/scripts/common_configure_ssh_key.sh

    - name: Wait for host SSH
      run: |-
        ${{ github.workspace }}/.github/scripts/common_wait_for_host_ssh.sh

    - name: Install Ansible
      run: ${{ github.workspace }}/.github/scripts/common_install_ansible.sh

    - name: Deploy Observability Agent
      working-directory: playbooks
      env:
        VECTOR_AUTH_USER: ${{ steps.vault.outputs.VECTOR_AUTH_USER }}
        VECTOR_AUTH_PASSWORD: ${{ steps.vault.outputs.VECTOR_AUTH_PASSWORD }}
        INTERNAL_SERVICE_TOKEN: ${{ steps.vault.outputs.INTERNAL_SERVICE_TOKEN }}
        # The billing fan-out is deliberately UAT-only and is enabled only
        # when this delivery includes agent-proxy. Vector keeps the local
        # HTTP source and pushes to the authenticated Billing ingress.
        VECTOR_BILLING_INGEST_ENABLED: ${{ needs.provision.outputs.deployment_env == 'uat' && contains(fromJSON('["all","agent-proxy","web-saas + agent-proxy"]'), needs.provision.outputs.target_domains) && 'true' || 'false' }}
        VECTOR_BILLING_INGEST_ADDRESS: 127.0.0.1:8686
        VECTOR_BILLING_INGEST_URL: https://billing-${{ needs.provision.outputs.deployment_env }}.${{ needs.provision.outputs.target_domain_base }}/v1/ingest/snapshots
        VECTOR_SNAPSHOT_URL: ${{ needs.provision.outputs.deployment_env == 'uat' && contains(fromJSON('["all","agent-proxy","web-saas + agent-proxy"]'), needs.provision.outputs.target_domains) && 'http://127.0.0.1:8686' || '' }}
      run: ${{ github.workspace }}/.github/scripts/platform-ops_deploy_monitor_agent.sh
