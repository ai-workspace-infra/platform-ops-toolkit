name: Vault server

# Single entry point for a Vault server deployment. The cloud adapter selected
# here only creates nodes (IaC) and opens short-lived SSH; the node stage
# itself (Vault, monitoring, migration, XConnect) is provider-neutral and
# reads the environment, nodes, network, Vault paths and connection mode from
# reviewed GitOps.
#
# Run one node stage per dispatch; each stage checks live node state first,
# so manual Vault init/unseal can happen between dispatches. This was
# previously split into this entry plus a reusable vault-shared-iac.yml; that
# reusable workflow had exactly one caller, so the split added indirection
# (duplicated GitOps resolution, a second Actions entry) without a second
# consumer to justify it. Its jobs are inlined below.

on:
  workflow_dispatch:
    inputs:
      cloud_provider:
        description: Provider adapter. It creates nodes and opens short-lived SSH; the node stage itself is provider-neutral.
        type: choice
        required: true
        default: gcp-cloud
        options: [gcp-cloud]
      deploy_action:
        description: IaC action. Ignored when dns_action is selected; none runs only a node stage.
        type: choice
        required: true
        default: plan
        options: [none, plan, apply]
      service_stage:
        description: 'One stage per dispatch. node-*/vault-*: both paths; fresh-*: new cluster; migrate-*: move the existing vault.svc.plus (migrate-auto picks the next step). Each checks live state first.'
        type: choice
        required: true
        default: none
        options: [none, node-preflight, node-operator-prep, node-process-metrics, vault-raft-verify, vault-snapshot, vault-service-verify, xconnect-gateway-frontend, vault-public-frontend, xconnect-gateway, xconnect-one, xconnect-operator-invite, fresh-leader, fresh-peers, migrate-auto, migrate-preflight, migrate-convert, migrate-rollback, migrate-join, migrate-cutover, migrate-remove]
      dns_action:
        description: Verify public Vault endpoints, switch to the three GCP A records, or restore the legacy A record.
        type: choice
        required: true
        default: none
        options: [none, verify, switch, rollback]
      gitops_repo_ref:
        description: GitOps ref containing the reviewed Vault resource declaration.
        type: string
        required: true
        default: main
      service_manifest:
        description: Provider-neutral Vault service declaration inside GitOps.
        type: string
        required: true
        default: resources/svc.plus/shared/vault/server.yaml
      provider_manifest:
        description: Provider-specific node and network declaration inside GitOps.
        type: string
        required: true
        default: resources/svc.plus/shared/gcp/open-platform-shared-vault.yaml
      iac_ref:
        description: Reviewed iac_modules commit containing the GCP Vault renderer and VM modules.
        type: string
        required: true
        default: 9570b01959396e1d0e20331205b5cb5718f5c588
      confirm:
        description: Confirmation phrase for live Vault stages or DNS switch/rollback (SWITCH-VAULT-DNS / ROLLBACK-VAULT-DNS).
        type: string
        required: false
        default: ''
      playbooks_ref:
        description: Immutable Playbooks owner commit; overrides are rejected by the node-stage checkout contract.
        type: string
        required: true
        default: 2d326409ccfbd5f6e862c3dc08660e0ae12fb51d

permissions:
  contents: read
  id-token: write

concurrency:
  group: vault-server-${{ inputs.service_manifest }}
  cancel-in-progress: false

env:
  # Disposable Vault used only for the snapshot restore drill on the runner;
  # the same release the playbooks install on the nodes (vhosts/vault).
  VAULT_DRILL_VERSION: 1.21.4

jobs:
  declaration:
    name: Resolve declaration and stage plan
    runs-on: ubuntu-latest
    outputs:
      environment: ${{ steps.declaration.outputs.environment }}
      github_environment: ${{ steps.declaration.outputs.github_environment }}
      account_id: ${{ steps.declaration.outputs.account_id }}
      vault_addr: ${{ steps.declaration.outputs.vault_addr }}
      monitoring_role: ${{ steps.declaration.outputs.monitoring_role }}
      monitoring_secret_path: ${{ steps.declaration.outputs.monitoring_secret_path }}
      xconnect_role: ${{ steps.declaration.outputs.xconnect_role }}
      xconnect_secret_path: ${{ steps.declaration.outputs.xconnect_secret_path }}
      xconnect_topology: ${{ steps.declaration.outputs.xconnect_topology }}
      provider_config: ${{ steps.declaration.outputs.provider_config }}
      migration: ${{ steps.declaration.outputs.migration }}
      legacy_config: ${{ steps.declaration.outputs.legacy_config }}
      source_provider: ${{ steps.declaration.outputs.source_provider }}
      source_provider_config: ${{ steps.declaration.outputs.source_provider_config }}
      raft_operator_role: ${{ steps.declaration.outputs.raft_operator_role }}
      snapshot_role: ${{ steps.declaration.outputs.snapshot_role }}
      backup_config: ${{ steps.declaration.outputs.backup_config }}
      observation: ${{ steps.declaration.outputs.observation }}
      open_new: ${{ steps.access.outputs.open_new }}
      open_legacy: ${{ steps.access.outputs.open_legacy }}
    steps:
      - name: Checkout toolkit
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Checkout reviewed GitOps declaration
        uses: actions/checkout@v4
        with:
          repository: ai-workspace-infra/gitops
          ref: ${{ inputs.gitops_repo_ref }}
          path: gitops
          persist-credentials: false

      - name: Reject dispatch combinations that cannot run
        env:
          DEPLOY_ACTION: ${{ inputs.deploy_action }}
          SERVICE_STAGE: ${{ inputs.service_stage }}
          DNS_ACTION: ${{ inputs.dns_action }}
        run: |
          set -euo pipefail
          if [[ "${DNS_ACTION}" != none ]]; then
            [[ "${SERVICE_STAGE}" == none && "${DEPLOY_ACTION}" != apply ]] || {
              echo '::error::Run DNS separately from node stages and IaC apply' >&2
              exit 1
            }
            exit 0
          fi
          if [[ "${DEPLOY_ACTION}" == plan && "${SERVICE_STAGE}" != none ]]; then
            echo '::error::A node stage needs deploy_action=apply or deploy_action=none, not plan' >&2
            exit 1
          fi
          if [[ "${DEPLOY_ACTION}" == none && "${SERVICE_STAGE}" == none ]]; then
            echo '::error::Nothing to do: choose an IaC action or a node stage' >&2
            exit 1
          fi

      - name: Resolve environment, Vault paths and connection mode from GitOps
        id: declaration
        env:
          SERVICE_MANIFEST: ${{ inputs.service_manifest }}
          PROVIDER_MANIFEST: ${{ inputs.provider_manifest }}
          CLOUD_PROVIDER: ${{ inputs.cloud_provider }}
          CONNECTION_MODE: bootstrap-public
        run: |
          set -euo pipefail
          python3 -m pip install --disable-pip-version-check 'pyyaml==6.0.2'
          python3 scripts/node_deploy/resolve_vault_server_declaration.py \
            --gitops-root gitops --service-manifest "${SERVICE_MANIFEST}" \
            --provider-manifest "${PROVIDER_MANIFEST}" --provider "${CLOUD_PROVIDER}" \
            --output "${GITHUB_OUTPUT}"
          declared_mode="$(grep '^ssh_access_mode=' "${GITHUB_OUTPUT}" | tail -n 1 | cut -d= -f2-)"
          [[ "${declared_mode}" == "${CONNECTION_MODE}" ]] || {
            echo "::error::connection_mode=${CONNECTION_MODE} does not match reviewed GitOps (${declared_mode})" >&2
            exit 1
          }

      - name: Resolve the stage plan
        id: plan
        if: ${{ inputs.service_stage != 'none' }}
        env:
          DEPLOY_STAGE: ${{ inputs.service_stage }}
          CONFIRM: ${{ inputs.confirm }}
          MIGRATION: ${{ steps.declaration.outputs.migration }}
        run: |
          python3 scripts/node_deploy/stage_plan.py "${DEPLOY_STAGE}" \
            --confirm "${CONFIRM}" --migration "${MIGRATION}" --github-output "${GITHUB_OUTPUT}"

      - name: Select node access for the stage
        id: access
        if: ${{ inputs.service_stage != 'none' }}
        env:
          SSH_SCOPE: ${{ steps.plan.outputs.ssh }}
          MIGRATION: ${{ steps.declaration.outputs.migration }}
        run: |
          set -euo pipefail
          open_new=false
          open_legacy=false
          case "${SSH_SCOPE}" in
            new) open_new=true ;;
            legacy) open_legacy=true ;;
            all) open_new=true; open_legacy=true ;;
            cluster) open_new=true; open_legacy="${MIGRATION}" ;;
            none) ;;
            *) echo "::error::unknown ssh scope ${SSH_SCOPE}" >&2; exit 1 ;;
          esac
          echo "open_new=${open_new}" >> "${GITHUB_OUTPUT}"
          echo "open_legacy=${open_legacy}" >> "${GITHUB_OUTPUT}"

  gcp-shared:
    needs: declaration
    if: ${{ inputs.dns_action == 'none' && inputs.cloud_provider == 'gcp-cloud' && inputs.deploy_action != 'none' }}
    uses: ./.github/workflows/gcp-iac-pipeline.yml
    with:
      deploy_action: ${{ inputs.deploy_action }}
      vault_env_path: ${{ needs.declaration.outputs.environment }}
      github_environment: ${{ needs.declaration.outputs.github_environment }}
      gcp_account_id: ${{ needs.declaration.outputs.account_id }}
      gcp_resource_manifest: ${{ inputs.provider_manifest }}
      gitops_repo_name: https://github.com/ai-workspace-infra/gitops.git
      gitops_repo_ref: ${{ inputs.gitops_repo_ref }}
      iac_ref: ${{ inputs.iac_ref }}
    secrets: inherit

  node-stage:
    name: Node stage (${{ inputs.service_stage }})
    needs: [declaration, gcp-shared]
    # Keep production mutation restricted to main/main.  Read-only verification
    # may run from a reviewed codex ref against a reviewed GitOps declaration.
    if: ${{ always() && needs.declaration.result == 'success' && inputs.service_stage != 'none' && ((inputs.deploy_action == 'apply' && needs.gcp-shared.result == 'success') || (inputs.deploy_action == 'none' && needs.gcp-shared.result == 'skipped')) && (github.ref == 'refs/heads/main' || (inputs.deploy_action == 'none' && startsWith(github.ref, 'refs/heads/codex/'))) && (inputs.gitops_repo_ref == 'main' || (inputs.deploy_action == 'none' && startsWith(inputs.gitops_repo_ref, 'codex/'))) }}
    runs-on: ubuntu-latest
    timeout-minutes: 70
    environment: ${{ needs.declaration.outputs.github_environment }}
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Set runner-private paths
        shell: bash
        run: |
          echo "NODE_ACCESS_DIR=${RUNNER_TEMP}/node-access" >> "${GITHUB_ENV}"
          echo "SSH_KNOWN_HOSTS=${RUNNER_TEMP}/node-known-hosts" >> "${GITHUB_ENV}"

      - name: Checkout toolkit
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Checkout fixed IaC GCP node-access owner
        uses: actions/checkout@v4
        with:
          repository: ai-workspace-infra/iac_modules
          ref: ${{ inputs.iac_ref }}
          path: iac_modules
          persist-credentials: false
          sparse-checkout: |
            .github/actions/auth-gcp-cloud
            .github/actions/node-access-gcp
            scripts/node_deploy
            scripts/pipeline

      - name: Checkout reviewed GitOps declaration
        uses: actions/checkout@v4
        with:
          repository: ai-workspace-infra/gitops
          ref: ${{ inputs.gitops_repo_ref }}
          path: gitops
          persist-credentials: false

      - name: Checkout reviewed service playbooks
        uses: actions/checkout@v4
        with:
          repository: ai-workspace-infra/playbooks
          ref: 2d326409ccfbd5f6e862c3dc08660e0ae12fb51d
          path: playbooks
          persist-credentials: false

      - name: Require the immutable Playbooks owner revision
        env:
          REQUESTED_PLAYBOOKS_REF: ${{ inputs.playbooks_ref }}
        run: |
          set -euo pipefail
          expected=2d326409ccfbd5f6e862c3dc08660e0ae12fb51d
          [[ "${REQUESTED_PLAYBOOKS_REF}" == "${expected}" ]] || {
            echo "::error::playbooks_ref must equal the reviewed owner SHA ${expected}" >&2
            exit 1
          }
          test "$(git -C playbooks rev-parse HEAD)" = "${expected}"

      - name: Prepare isolated Python and Ansible in the Playbooks owner
        uses: ai-workspace-infra/playbooks/.github/actions/setup-node-stage-runner@2d326409ccfbd5f6e862c3dc08660e0ae12fb51d
        with:
          venv_path: ${{ runner.temp }}/node-stage-python
          python: python3
          pyyaml_version: 6.0.2
          ansible_core_version: 2.17.14
          ansible_posix_version: 2.1.0

      - name: Create the one-run SSH key
        if: ${{ needs.declaration.outputs.open_new == 'true' || needs.declaration.outputs.open_legacy == 'true' }}
        shell: bash
        run: |
          set -euo pipefail
          install -d -m 700 "${NODE_ACCESS_DIR}"
          ssh-keygen -q -t ed25519 -N '' -C "vault-node-stage-${GITHUB_RUN_ID}" -f "${NODE_ACCESS_DIR}/id_ed25519"

      # Provider adapters: add one step per adapter. Each emits the same
      # contract/auth_adapter outputs for the shared one-run key and has a
      # close phase.
      - name: Load target GCP identity through the scoped Vault role
        id: gcp_identity
        if: ${{ needs.declaration.outputs.open_new == 'true' && inputs.cloud_provider == 'gcp-cloud' }}
        uses: ./.github/actions/load-gcp-cloud-identity
        with:
          environment: ${{ fromJSON(needs.declaration.outputs.provider_config).environment }}
          credential_environment: ${{ fromJSON(needs.declaration.outputs.provider_config).environment }}
          account_id: ${{ fromJSON(needs.declaration.outputs.provider_config).account_id }}
          identity_path: ${{ fromJSON(needs.declaration.outputs.provider_config).runtime_identity_path }}
          vault_addr: ${{ fromJSON(needs.declaration.outputs.provider_config).vault_addr }}
          vault_role: ${{ fromJSON(needs.declaration.outputs.provider_config).node_role }}
          load_state_contract: 'false'

      - name: Open node access through the GCP adapter
        id: gcp
        if: ${{ needs.declaration.outputs.open_new == 'true' && inputs.cloud_provider == 'gcp-cloud' }}
        uses: ./iac_modules/.github/actions/node-access-gcp
        with:
          phase: open
          contract_mode: target
          provider_config: ${{ needs.declaration.outputs.provider_config }}
          service_manifest: ${{ inputs.service_manifest }}
          provider_manifest: ${{ inputs.provider_manifest }}
          xconnect_topology: ${{ needs.declaration.outputs.xconnect_topology }}
          connection_mode: bootstrap-public
          work_dir: ${{ runner.temp }}/node-access/gcp
          ssh_key: ${{ runner.temp }}/node-access/id_ed25519
          identity_provider: ${{ steps.gcp_identity.outputs.provider }}
          service_account: ${{ steps.gcp_identity.outputs.service_account }}
          audience: ${{ steps.gcp_identity.outputs.audience }}
          credential_project_id: ${{ steps.gcp_identity.outputs.project_id }}

      - name: Open access to the existing vault.svc.plus node
        id: legacy
        if: ${{ needs.declaration.outputs.open_legacy == 'true' && needs.declaration.outputs.source_provider != 'gcp-cloud' }}
        uses: ./.github/actions/node-access-existing
        with:
          phase: open
          legacy_config: ${{ needs.declaration.outputs.legacy_config }}
          service_manifest: ${{ inputs.service_manifest }}
          ssh_key: ${{ runner.temp }}/node-access/id_ed25519

      - name: Load migration-source GCP identity through the scoped Vault role
        id: gcp_source_identity
        if: ${{ needs.declaration.outputs.open_legacy == 'true' && needs.declaration.outputs.source_provider == 'gcp-cloud' }}
        uses: ./.github/actions/load-gcp-cloud-identity
        with:
          environment: ${{ fromJSON(needs.declaration.outputs.source_provider_config).environment }}
          credential_environment: ${{ fromJSON(needs.declaration.outputs.source_provider_config).environment }}
          account_id: ${{ fromJSON(needs.declaration.outputs.source_provider_config).account_id }}
          identity_path: ${{ fromJSON(needs.declaration.outputs.source_provider_config).runtime_identity_path }}
          vault_addr: ${{ fromJSON(needs.declaration.outputs.source_provider_config).vault_addr }}
          vault_role: ${{ fromJSON(needs.declaration.outputs.source_provider_config).node_role }}
          load_state_contract: 'false'

      - name: Open access to the GCP migration source
        id: gcp_source
        if: ${{ needs.declaration.outputs.open_legacy == 'true' && needs.declaration.outputs.source_provider == 'gcp-cloud' }}
        uses: ./iac_modules/.github/actions/node-access-gcp
        with:
          phase: open
          contract_mode: source
          source_config: ${{ needs.declaration.outputs.source_provider_config }}
          provider_config: ${{ needs.declaration.outputs.source_provider_config }}
          connection_mode: bootstrap-public
          work_dir: ${{ runner.temp }}/node-access/gcp-source
          ssh_key: ${{ runner.temp }}/node-access/id_ed25519
          identity_provider: ${{ steps.gcp_source_identity.outputs.provider }}
          service_account: ${{ steps.gcp_source_identity.outputs.service_account }}
          audience: ${{ steps.gcp_source_identity.outputs.audience }}
          credential_project_id: ${{ steps.gcp_source_identity.outputs.project_id }}

      - name: Select the prepared adapters
        id: access
        if: ${{ needs.declaration.outputs.open_new == 'true' || needs.declaration.outputs.open_legacy == 'true' }}
        shell: bash
        env:
          GCP_CONTRACT: ${{ steps.gcp.outputs.contract }}
          GCP_ADAPTER: ${{ steps.gcp.outputs.auth_adapter }}
          GCP_SOURCE_CONTRACT: ${{ steps.gcp_source.outputs.contract }}
          GCP_SOURCE_ADAPTER: ${{ steps.gcp_source.outputs.auth_adapter }}
          LEGACY_CONTRACT: ${{ steps.legacy.outputs.contract }}
          LEGACY_ADAPTER: ${{ steps.legacy.outputs.auth_adapter }}
          OPEN_NEW: ${{ needs.declaration.outputs.open_new }}
          OPEN_LEGACY: ${{ needs.declaration.outputs.open_legacy }}
          SOURCE_PROVIDER: ${{ needs.declaration.outputs.source_provider }}
        run: |
          set -euo pipefail
          contracts=()
          adapters=()
          if [[ "${OPEN_NEW}" == true ]]; then
            [[ -s "${GCP_CONTRACT}" ]] || { echo '::error::No provider adapter prepared the new nodes' >&2; exit 1; }
            contracts+=("${GCP_CONTRACT}"); adapters+=("${GCP_ADAPTER}")
          fi
          if [[ "${OPEN_LEGACY}" == true ]]; then
            if [[ "${SOURCE_PROVIDER}" == gcp-cloud ]]; then
              [[ -s "${GCP_SOURCE_CONTRACT}" ]] || { echo '::error::The GCP migration source was not prepared' >&2; exit 1; }
              contracts+=("${GCP_SOURCE_CONTRACT}"); adapters+=("${GCP_SOURCE_ADAPTER}")
            else
              [[ -s "${LEGACY_CONTRACT}" ]] || { echo '::error::The existing node was not prepared' >&2; exit 1; }
              contracts+=("${LEGACY_CONTRACT}"); adapters+=("${LEGACY_ADAPTER}")
            fi
          fi
          contract="${NODE_ACCESS_DIR}/nodes.json"
          python3 playbooks/scripts/node_deploy/legacy_source.py merge "${contracts[@]}" --output "${contract}"
          echo "contract=${contract}" >> "${GITHUB_OUTPUT}"
          echo "ssh_private_key=${NODE_ACCESS_DIR}/id_ed25519" >> "${GITHUB_OUTPUT}"
          echo "auth_adapters=$(IFS=,; echo "${adapters[*]}")" >> "${GITHUB_OUTPUT}"

      - name: Verify live SSH host keys against GitOps pins
        if: ${{ steps.access.outcome == 'success' }}
        shell: bash
        env:
          NODE_CONTRACT: ${{ steps.access.outputs.contract }}
        run: |
          set -euo pipefail
          python3 playbooks/scripts/node_deploy/prepare_known_hosts.py \
            --contract "${NODE_CONTRACT}" --output "${SSH_KNOWN_HOSTS}"

      - name: Observe the automatic migration in the Playbooks owner
        id: migration_observation
        if: ${{ inputs.service_stage == 'migrate-auto' }}
        uses: ai-workspace-infra/playbooks/.github/actions/vault-migration-observation@2d326409ccfbd5f6e862c3dc08660e0ae12fb51d
        with:
          contract: ${{ steps.access.outputs.contract }}
          ssh_private_key: ${{ steps.access.outputs.ssh_private_key }}
          known_hosts: ${{ runner.temp }}/node-known-hosts
          vault_addr: ${{ needs.declaration.outputs.vault_addr }}
          backup_config: ${{ needs.declaration.outputs.backup_config }}
          observation: ${{ needs.declaration.outputs.observation }}
          gateway_state: /var/lib/xconnect-gateway/${{ needs.declaration.outputs.environment }}/state.json
          owner_root: ${{ github.workspace }}/playbooks

      # Playbooks observes live state above. Toolkit only validates and expands
      # the resulting recommendation through its pure stage plan.
      - name: Resolve the stage to run
        id: stage
        shell: bash
        env:
          SERVICE_STAGE: ${{ inputs.service_stage }}
          CONFIRM: ${{ inputs.confirm }}
          MIGRATION: ${{ needs.declaration.outputs.migration }}
          BACKUP_CONFIG: ${{ needs.declaration.outputs.backup_config }}
          RECOMMENDED_STAGE: ${{ steps.migration_observation.outputs.recommended_stage }}
          OBSERVATION_BLOCKED: ${{ steps.migration_observation.outputs.blocked }}
        run: |
          set -euo pipefail
          backup=true
          [[ "${BACKUP_CONFIG}" != '{}' ]] || backup=false
          if [[ "${SERVICE_STAGE}" == migrate-auto ]]; then
            if [[ -n "${RECOMMENDED_STAGE}" ]]; then
              python3 scripts/node_deploy/stage_plan.py migrate-auto \
                --confirm "${CONFIRM}" --migration "${MIGRATION}" --backup "${backup}" \
                --recommended-stage "${RECOMMENDED_STAGE}" --github-output "${GITHUB_OUTPUT}" >/dev/null
              echo "blocked=" >> "${GITHUB_OUTPUT}"
            else
              [[ -n "${OBSERVATION_BLOCKED}" ]] || {
                echo '::error::Playbooks observation returned neither a recommendation nor a manual gate' >&2
                exit 1
              }
              for value in \
                'stage=' "blocked=${OBSERVATION_BLOCKED}" 'snapshot_first=false' \
                'token=' 'action=' 'needs_observability=false'; do
                printf '%s\n' "${value}" >> "${GITHUB_OUTPUT}"
              done
            fi
          else
            python3 scripts/node_deploy/stage_plan.py "${SERVICE_STAGE}" \
              --confirm "${CONFIRM}" --migration "${MIGRATION}" --backup "${backup}" \
              --github-output "${GITHUB_OUTPUT}" >/dev/null
            echo "blocked=" >> "${GITHUB_OUTPUT}"
          fi

      - name: Report where migrate-auto stopped
        if: ${{ steps.stage.outputs.blocked != '' }}
        shell: bash
        env:
          BLOCKED: ${{ steps.stage.outputs.blocked }}
        run: |
          printf '**migrate-auto stopped:** %s\n' "${BLOCKED}" | tee -a "${GITHUB_STEP_SUMMARY}"

      - name: Read observability ingestion credentials
        if: ${{ steps.stage.outputs.needs_observability == 'true' }}
        id: observability
        uses: hashicorp/vault-action@v4
        with:
          url: ${{ needs.declaration.outputs.vault_addr }}
          method: jwt
          role: ${{ needs.declaration.outputs.monitoring_role }}
          jwtGithubAudience: vault
          exportToken: false
          secrets: |
            ${{ needs.declaration.outputs.monitoring_secret_path }} user | VECTOR_AUTH_USER ;
            ${{ needs.declaration.outputs.monitoring_secret_path }} password | VECTOR_AUTH_PASSWORD

      - name: Read the Gateway TLS certificate
        if: ${{ steps.stage.outputs.needs_tls == 'true' }}
        id: gateway_tls
        uses: hashicorp/vault-action@v4
        with:
          url: ${{ needs.declaration.outputs.vault_addr }}
          method: jwt
          role: ${{ needs.declaration.outputs.xconnect_role }}
          jwtGithubAudience: vault
          exportToken: false
          secrets: |
            kv/data/CICD/domains/svc.plus tls_fullchain_pem_b64 | VAULT_GATEWAY_TLS_FULLCHAIN_B64 ;
            kv/data/CICD/domains/svc.plus tls_key_pem_b64 | VAULT_GATEWAY_TLS_KEY_B64

      # XConnect enrollment: Zero service credentials, the public trust bundle
      # the Gateway hands to One, and the GitHub App key that reads the
      # private XConnect releases. All through the scoped xconnect role.
      - name: Read XConnect enrollment credentials
        if: ${{ steps.stage.outputs.xconnect != '' }}
        id: xconnect_secrets
        uses: hashicorp/vault-action@v4
        with:
          url: ${{ needs.declaration.outputs.vault_addr }}
          method: jwt
          role: ${{ needs.declaration.outputs.xconnect_role }}
          jwtGithubAudience: vault
          exportToken: false
          exportEnv: false
          secrets: |
            ${{ needs.declaration.outputs.xconnect_secret_path }} ZERO_SERVICE_TOKEN | ZERO_SERVICE_TOKEN ;
            ${{ needs.declaration.outputs.xconnect_secret_path }} ZERO_OWNER_EMAIL | ZERO_OWNER_EMAIL ;
            ${{ needs.declaration.outputs.xconnect_secret_path }} VLESS_ID | XCONNECT_VLESS_ID ;
            kv/data/CICD/domains/svc.plus tls_trust_bundle_pem_b64 | XCONNECT_TRUST_BUNDLE_B64 ;
            kv/data/CICD/github-app/daily-snapshot app_private_key | XCONNECT_APP_PRIVATE_KEY

      - name: Create a read-only XConnect release token
        if: ${{ steps.stage.outputs.xconnect == 'gateway' || steps.stage.outputs.xconnect == 'one' }}
        id: xconnect_release
        uses: actions/create-github-app-token@v3
        with:
          client-id: Iv23liNwStpQIiXajhpb
          private-key: ${{ steps.xconnect_secrets.outputs.XCONNECT_APP_PRIVATE_KEY }}
          owner: ai-workspace-xstream
          repositories: XConnect-One,XConnect-Gateway

      - name: Download the reviewed XConnect runtime
        if: ${{ steps.stage.outputs.xconnect == 'gateway' || steps.stage.outputs.xconnect == 'one' }}
        shell: bash
        env:
          XCONNECT_ROLE: ${{ steps.stage.outputs.xconnect }}
          XCONNECT_TOPOLOGY: gitops/${{ needs.declaration.outputs.xconnect_topology }}
          NODE_CONTRACT: ${{ steps.access.outputs.contract }}
          RELEASE_TOKEN: ${{ steps.xconnect_release.outputs.token }}
          GITHUB_TOKEN: ${{ github.token }}
          TRUST_BUNDLE_B64: ${{ steps.xconnect_secrets.outputs.XCONNECT_TRUST_BUNDLE_B64 }}
        run: |
          set -euo pipefail
          umask 077
          install -d -m 700 "${RUNNER_TEMP}/xconnect" "${RUNNER_TEMP}/xconnect/secrets"
          arch="$(python3 playbooks/scripts/node_deploy/xconnect_stage.py arch --role "${XCONNECT_ROLE}" \
            --contract "${NODE_CONTRACT}" --key "${NODE_ACCESS_DIR}/id_ed25519" --known-hosts "${SSH_KNOWN_HOSTS}")"
          eval "$(python3 - "${XCONNECT_TOPOLOGY}" <<'PY'
          import shlex, sys, yaml
          runtime = yaml.safe_load(open(sys.argv[1], encoding="utf-8"))["spec"]["runtime"]
          for name, key in (("GATEWAY_RELEASE_TAG", "gateway_release"), ("ONE_RELEASE_TAG", "cli_release"), ("XRAY_RELEASE_TAG", "xray_release")):
              print(f"export {name}={shlex.quote(str(runtime.get(key, '')))}")
          PY
          )"
          components=one
          [[ "${XCONNECT_ROLE}" == gateway ]] && components=gateway
          bash playbooks/scripts/node_deploy/xconnect_artifacts.sh "${RUNNER_TEMP}/xconnect/bin" "${arch}" "${components}"
          printf '%s' "${TRUST_BUNDLE_B64}" | base64 --decode > "${RUNNER_TEMP}/xconnect/secrets/trust-bundle.pem"
          openssl x509 -in "${RUNNER_TEMP}/xconnect/secrets/trust-bundle.pem" -noout

      - name: Log in with the stage's scoped Vault role
        if: ${{ steps.stage.outputs.token != '' }}
        uses: hashicorp/vault-action@v4
        with:
          url: ${{ needs.declaration.outputs.vault_addr }}
          method: jwt
          role: ${{ steps.stage.outputs.token == 'snapshot' && needs.declaration.outputs.snapshot_role || steps.stage.outputs.token == 'xconnect' && needs.declaration.outputs.xconnect_role || needs.declaration.outputs.raft_operator_role }}
          jwtGithubAudience: vault
          exportToken: true

      - name: Read off-site backup credentials
        id: backup
        if: ${{ steps.stage.outputs.action == 'snapshot' }}
        uses: hashicorp/vault-action@v4
        with:
          url: ${{ needs.declaration.outputs.vault_addr }}
          method: jwt
          role: ${{ needs.declaration.outputs.snapshot_role }}
          jwtGithubAudience: vault
          exportToken: false
          # The standalone snapshot stage runs with this snapshot-only token.
          outputToken: true
          secrets: |
            ${{ fromJSON(needs.declaration.outputs.backup_config).credentials_path }} access_key_id | BACKUP_ACCESS_KEY_ID ;
            ${{ fromJSON(needs.declaration.outputs.backup_config).credentials_path }} secret_access_key | BACKUP_SECRET_ACCESS_KEY

      - name: Take, encrypt and upload a Raft snapshot
        if: ${{ steps.stage.outputs.action == 'snapshot' }}
        shell: bash
        env:
          VAULT_ADDR: ${{ needs.declaration.outputs.vault_addr }}
          VAULT_TOKEN: ${{ steps.backup.outputs.vault_token }}
          VAULT_DRILL_VERSION: ${{ env.VAULT_DRILL_VERSION }}
          BACKUP_AGE_RECIPIENT: ${{ fromJSON(needs.declaration.outputs.backup_config).age_recipient }}
          BACKUP_DESTINATION: ${{ fromJSON(needs.declaration.outputs.backup_config).destination }}
          BACKUP_ENDPOINT: ${{ fromJSON(needs.declaration.outputs.backup_config).endpoint }}
          AWS_REGION: ${{ fromJSON(needs.declaration.outputs.backup_config).region }}
          AWS_ACCESS_KEY_ID: ${{ steps.backup.outputs.BACKUP_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ steps.backup.outputs.BACKUP_SECRET_ACCESS_KEY }}
        run: |
          set -euo pipefail
          command -v age >/dev/null 2>&1 || sudo apt-get install -y -qq age >/dev/null
          bash playbooks/scripts/node_deploy/install_vault_drill.sh "${VAULT_DRILL_VERSION}" "${RUNNER_TEMP}/vault-drill-bin"
          VAULT_DRILL_BIN="${RUNNER_TEMP}/vault-drill-bin/vault" bash playbooks/scripts/node_deploy/vault_snapshot.sh

      - name: Execute provider-neutral Vault node stage
        id: node_deploy
        if: ${{ steps.access.outcome == 'success' && steps.stage.outputs.stage != '' }}
        uses: ai-workspace-infra/playbooks/.github/actions/vault-node-stage@2d326409ccfbd5f6e862c3dc08660e0ae12fb51d
        env:
          VECTOR_AUTH_USER: ${{ steps.observability.outputs.VECTOR_AUTH_USER }}
          VECTOR_AUTH_PASSWORD: ${{ steps.observability.outputs.VECTOR_AUTH_PASSWORD }}
          VAULT_GATEWAY_TLS_FULLCHAIN_B64: ${{ steps.gateway_tls.outputs.VAULT_GATEWAY_TLS_FULLCHAIN_B64 }}
          VAULT_GATEWAY_TLS_KEY_B64: ${{ steps.gateway_tls.outputs.VAULT_GATEWAY_TLS_KEY_B64 }}
          ZERO_SERVICE_TOKEN: ${{ steps.xconnect_secrets.outputs.ZERO_SERVICE_TOKEN }}
          ZERO_OWNER_EMAIL: ${{ steps.xconnect_secrets.outputs.ZERO_OWNER_EMAIL }}
          XCONNECT_VLESS_ID: ${{ steps.xconnect_secrets.outputs.XCONNECT_VLESS_ID }}
        with:
          contract: ${{ steps.access.outputs.contract }}
          stage: ${{ steps.stage.outputs.stage }}
          playbook: ${{ steps.stage.outputs.playbook }}
          tags: ${{ steps.stage.outputs.tags }}
          requires: ${{ steps.stage.outputs.requires }}
          confirms: ${{ steps.stage.outputs.confirms }}
          next_step: ${{ steps.stage.outputs.next }}
          playbooks_root: ${{ github.workspace }}/playbooks
          owner_root: ${{ github.workspace }}/playbooks
          ssh_private_key: ${{ steps.access.outputs.ssh_private_key }}
          known_hosts: ${{ runner.temp }}/node-known-hosts
          ready_adapters: ${{ steps.access.outputs.auth_adapters }}
          action: ${{ steps.stage.outputs.action }}
          vault_addr: ${{ needs.declaration.outputs.vault_addr }}
          observation: ${{ needs.declaration.outputs.observation }}
          one_node: ${{ steps.stage.outputs.one_node }}
          extra_vars: ${{ steps.stage.outputs.extra_vars }}
          xconnect_role: ${{ steps.stage.outputs.xconnect }}
          xconnect_topology: ${{ github.workspace }}/gitops/${{ needs.declaration.outputs.xconnect_topology }}
          xconnect_dir: ${{ runner.temp }}/xconnect
          gateway_state: /var/lib/xconnect-gateway/${{ needs.declaration.outputs.environment }}/state.json

      - name: Point the XConnect Gateway hostname at the prepared gateway
        if: ${{ inputs.service_stage == 'xconnect-gateway-frontend' && steps.node_deploy.outcome == 'success' && github.ref == 'refs/heads/main' && inputs.gitops_repo_ref == 'main' }}
        shell: bash
        env:
          NODE_CONTRACT: ${{ steps.access.outputs.contract }}
          XCONNECT_TOPOLOGY: ${{ github.workspace }}/gitops/${{ needs.declaration.outputs.xconnect_topology }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_DNS_API_TOKEN }}
        run: |
          set -euo pipefail
          : "${CLOUDFLARE_API_TOKEN:?CLOUDFLARE_DNS_API_TOKEN is required in the prod environment}"
          gateway_ip="$(jq -er '[.spec.nodes[] | select(.groups | index("xconnect_gateway")) | .address] | if length == 1 then .[0] else error("expected one gateway") end' "${NODE_CONTRACT}")"
          [[ "${gateway_ip}" =~ ^([0-9]{1,3}\.){3}[0-9]{1,3}$ ]] || { echo '::error::gateway has no public IPv4 address' >&2; exit 1; }
          domain="$(python3 - "${XCONNECT_TOPOLOGY}" <<'PY'
          import pathlib, sys, yaml
          topology = yaml.safe_load(pathlib.Path(sys.argv[1]).read_text(encoding='utf-8'))
          print(topology['spec']['network']['transport_profile']['host'])
          PY
          )"
          [[ "${domain}" == vault-xconnect.svc.plus ]] || { echo '::error::unexpected XConnect Gateway hostname' >&2; exit 1; }

          # The frontend must already present a valid certificate at the new
          # IP; its Xray backend is enrolled by the next stage.
          curl --silent --show-error --connect-timeout 10 --max-time 20 \
            --resolve "${domain}:443:${gateway_ip}" "https://${domain}/xconnect" \
            -o /dev/null

          zones="$(curl --fail-with-body --silent --show-error --retry 3 \
            -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
            'https://api.cloudflare.com/client/v4/zones?name=svc.plus&status=active&per_page=20')"
          zone_id="$(jq -er '.result | if length == 1 then .[0].id else error("expected one active svc.plus zone") end' <<<"${zones}")"
          records="$(curl --fail-with-body --silent --show-error --retry 3 \
            -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
            "https://api.cloudflare.com/client/v4/zones/${zone_id}/dns_records?type=A&name=${domain}&per_page=100")"
          record_id="$(jq -er '.result | if length == 1 then .[0].id else error("expected one existing gateway A record") end' <<<"${records}")"
          payload="$(jq -n --arg name "${domain}" --arg ip "${gateway_ip}" '{type:"A",name:$name,content:$ip,ttl:60,proxied:false}')"
          curl --fail-with-body --silent --show-error --retry 3 -X PATCH \
            -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
            -H 'Content-Type: application/json' \
            --data "${payload}" \
            "https://api.cloudflare.com/client/v4/zones/${zone_id}/dns_records/${record_id}" \
            | jq -e --arg ip "${gateway_ip}" '.success == true and .result.content == $ip and .result.proxied == false' >/dev/null
          printf 'XConnect Gateway DNS: %s -> %s\n' "${domain}" "${gateway_ip}" >> "${GITHUB_STEP_SUMMARY}"

      # C5: after the stage gates (access, gateway-enrolled) passed above.
      - name: Issue the operator device invitation into Vault
        if: ${{ steps.stage.outputs.stage == 'xconnect-operator-invite' }}
        shell: bash
        env:
          NODE_CONTRACT: ${{ steps.access.outputs.contract }}
          XCONNECT_TOPOLOGY: gitops/${{ needs.declaration.outputs.xconnect_topology }}
          GATEWAY_STATE: /var/lib/xconnect-gateway/${{ needs.declaration.outputs.environment }}/state.json
          INVITE_PATH: ${{ needs.declaration.outputs.xconnect_secret_path }}-operator-invite
          VAULT_ADDR: ${{ needs.declaration.outputs.vault_addr }}
          ZERO_SERVICE_TOKEN: ${{ steps.xconnect_secrets.outputs.ZERO_SERVICE_TOKEN }}
          ZERO_OWNER_EMAIL: ${{ steps.xconnect_secrets.outputs.ZERO_OWNER_EMAIL }}
          XCONNECT_VLESS_ID: ${{ steps.xconnect_secrets.outputs.XCONNECT_VLESS_ID }}
        run: |
          set -euo pipefail
          python3 playbooks/scripts/node_deploy/xconnect_stage.py operator-invite \
            --topology "${XCONNECT_TOPOLOGY}" --contract "${NODE_CONTRACT}" \
            --key "${NODE_ACCESS_DIR}/id_ed25519" --known-hosts "${SSH_KNOWN_HOSTS}" \
            --gateway-state "${GATEWAY_STATE}" --vault-path "${INVITE_PATH}" \
            | tee -a "${GITHUB_STEP_SUMMARY}"

      - name: Close access to the existing node
        if: ${{ always() && needs.declaration.outputs.open_legacy == 'true' && needs.declaration.outputs.source_provider != 'gcp-cloud' }}
        uses: ./.github/actions/node-access-existing
        with:
          phase: close
          legacy_config: ${{ needs.declaration.outputs.legacy_config }}
          ssh_key: ${{ runner.temp }}/node-access/id_ed25519

      - name: Close access to the GCP migration source
        if: ${{ always() && needs.declaration.outputs.open_legacy == 'true' && needs.declaration.outputs.source_provider == 'gcp-cloud' }}
        uses: ./iac_modules/.github/actions/node-access-gcp
        with:
          phase: close
          contract_mode: source
          provider_config: ${{ needs.declaration.outputs.source_provider_config }}
          connection_mode: bootstrap-public
          work_dir: ${{ runner.temp }}/node-access/gcp-source
          ssh_key: ${{ runner.temp }}/node-access/id_ed25519
          identity_provider: ${{ steps.gcp_source_identity.outputs.provider }}
          service_account: ${{ steps.gcp_source_identity.outputs.service_account }}
          audience: ${{ steps.gcp_source_identity.outputs.audience }}
          credential_project_id: ${{ steps.gcp_source_identity.outputs.project_id }}

      - name: Close node access through the GCP adapter
        if: ${{ always() && needs.declaration.outputs.open_new == 'true' && inputs.cloud_provider == 'gcp-cloud' }}
        uses: ./iac_modules/.github/actions/node-access-gcp
        with:
          phase: close
          contract_mode: target
          provider_config: ${{ needs.declaration.outputs.provider_config }}
          connection_mode: bootstrap-public
          work_dir: ${{ runner.temp }}/node-access/gcp
          ssh_key: ${{ runner.temp }}/node-access/id_ed25519
          identity_provider: ${{ steps.gcp_identity.outputs.provider }}
          service_account: ${{ steps.gcp_identity.outputs.service_account }}
          audience: ${{ steps.gcp_identity.outputs.audience }}
          credential_project_id: ${{ steps.gcp_identity.outputs.project_id }}

      - name: Remove runner-private node files
        if: ${{ always() }}
        shell: bash
        run: rm -rf -- "${NODE_ACCESS_DIR}" "${SSH_KNOWN_HOSTS}" "${RUNNER_TEMP}/xconnect"

  cleanup-node-access:
    name: Ensure temporary node access is closed
    needs: [declaration, node-stage]
    if: ${{ always() && needs.declaration.result == 'success' && needs.node-stage.result != 'skipped' && (needs.declaration.outputs.open_new == 'true' || needs.declaration.outputs.open_legacy == 'true') && inputs.cloud_provider == 'gcp-cloud' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: ${{ needs.declaration.outputs.github_environment }}
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout toolkit
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Checkout fixed IaC GCP node-access owner
        uses: actions/checkout@v4
        with:
          repository: ai-workspace-infra/iac_modules
          ref: ${{ inputs.iac_ref }}
          path: iac_modules
          persist-credentials: false
          sparse-checkout: |
            .github/actions/auth-gcp-cloud
            .github/actions/node-access-gcp
            scripts/node_deploy
            scripts/pipeline

      - name: Load target GCP identity through the scoped Vault role
        id: gcp_identity
        if: ${{ needs.declaration.outputs.open_new == 'true' }}
        uses: ./.github/actions/load-gcp-cloud-identity
        with:
          environment: ${{ fromJSON(needs.declaration.outputs.provider_config).environment }}
          credential_environment: ${{ fromJSON(needs.declaration.outputs.provider_config).environment }}
          account_id: ${{ fromJSON(needs.declaration.outputs.provider_config).account_id }}
          identity_path: ${{ fromJSON(needs.declaration.outputs.provider_config).runtime_identity_path }}
          vault_addr: ${{ fromJSON(needs.declaration.outputs.provider_config).vault_addr }}
          vault_role: ${{ fromJSON(needs.declaration.outputs.provider_config).node_role }}
          load_state_contract: 'false'

      - name: Close node access through the GCP adapter
        if: ${{ needs.declaration.outputs.open_new == 'true' }}
        uses: ./iac_modules/.github/actions/node-access-gcp
        with:
          phase: close
          contract_mode: target
          provider_config: ${{ needs.declaration.outputs.provider_config }}
          connection_mode: bootstrap-public
          work_dir: ${{ runner.temp }}/node-access/gcp
          ssh_key: ${{ runner.temp }}/node-access/id_ed25519
          identity_provider: ${{ steps.gcp_identity.outputs.provider }}
          service_account: ${{ steps.gcp_identity.outputs.service_account }}
          audience: ${{ steps.gcp_identity.outputs.audience }}
          credential_project_id: ${{ steps.gcp_identity.outputs.project_id }}

      - name: Load migration-source GCP identity through the scoped Vault role
        id: gcp_source_identity
        if: ${{ needs.declaration.outputs.open_legacy == 'true' && needs.declaration.outputs.source_provider == 'gcp-cloud' }}
        uses: ./.github/actions/load-gcp-cloud-identity
        with:
          environment: ${{ fromJSON(needs.declaration.outputs.source_provider_config).environment }}
          credential_environment: ${{ fromJSON(needs.declaration.outputs.source_provider_config).environment }}
          account_id: ${{ fromJSON(needs.declaration.outputs.source_provider_config).account_id }}
          identity_path: ${{ fromJSON(needs.declaration.outputs.source_provider_config).runtime_identity_path }}
          vault_addr: ${{ fromJSON(needs.declaration.outputs.source_provider_config).vault_addr }}
          vault_role: ${{ fromJSON(needs.declaration.outputs.source_provider_config).node_role }}
          load_state_contract: 'false'

      - name: Close GCP migration source access
        if: ${{ needs.declaration.outputs.open_legacy == 'true' && needs.declaration.outputs.source_provider == 'gcp-cloud' }}
        uses: ./iac_modules/.github/actions/node-access-gcp
        with:
          phase: close
          contract_mode: source
          provider_config: ${{ needs.declaration.outputs.source_provider_config }}
          connection_mode: bootstrap-public
          work_dir: ${{ runner.temp }}/node-access/gcp-source
          ssh_key: ${{ runner.temp }}/node-access/id_ed25519
          identity_provider: ${{ steps.gcp_source_identity.outputs.provider }}
          service_account: ${{ steps.gcp_source_identity.outputs.service_account }}
          audience: ${{ steps.gcp_source_identity.outputs.audience }}
          credential_project_id: ${{ steps.gcp_source_identity.outputs.project_id }}

  dns-discovery:
    name: Resolve reviewed Vault DNS targets
    needs: [declaration, gcp-shared, node-stage, cleanup-node-access]
    if: ${{ always() && inputs.dns_action != 'none' && needs.declaration.result == 'success' && needs.gcp-shared.result == 'skipped' && needs.node-stage.result == 'skipped' && needs.cleanup-node-access.result == 'skipped' }}
    runs-on: ubuntu-latest
    environment: prod
    permissions:
      contents: read
      id-token: write
    outputs:
      domain: ${{ steps.manifest.outputs.domain }}
      old_ip: ${{ steps.instances.outputs.old_ip }}
      matrix: ${{ steps.instances.outputs.matrix }}
      prod_0_ip: ${{ steps.instances.outputs.prod_0_ip }}
      prod_1_ip: ${{ steps.instances.outputs.prod_1_ip }}
      prod_2_ip: ${{ steps.instances.outputs.prod_2_ip }}
      gcp_targets: ${{ steps.instances.outputs.gcp_targets }}
      expected_cluster: ${{ steps.cluster.outputs.cluster_id }}
    steps:
      - name: Require a production DNS-only dispatch
        shell: bash
        env:
          SERVICE_STAGE: ${{ inputs.service_stage }}
          DEPLOY_ACTION: ${{ inputs.deploy_action }}
          GITOPS_REF: ${{ inputs.gitops_repo_ref }}
          WORKFLOW_REF: ${{ github.ref }}
        run: |
          set -euo pipefail
          [[ "${WORKFLOW_REF}" == refs/heads/main && "${GITOPS_REF}" == main ]] || {
            echo '::error::Vault DNS actions require main workflow and main GitOps declarations' >&2
            exit 1
          }
          [[ "${SERVICE_STAGE}" == none && "${DEPLOY_ACTION}" != apply ]] || {
            echo '::error::Run DNS separately from node stages and IaC apply' >&2
            exit 1
          }

      - name: Checkout reviewed GitOps declaration
        uses: actions/checkout@v4
        with:
          repository: ai-workspace-infra/gitops
          ref: main
          path: gitops
          persist-credentials: false

      - name: Resolve the Vault domain, roles and GCP identity
        id: manifest
        shell: bash
        env:
          SERVICE_MANIFEST: ${{ inputs.service_manifest }}
          PROVIDER_MANIFEST: ${{ inputs.provider_manifest }}
        run: |
          set -euo pipefail
          python3 -m pip install --disable-pip-version-check 'pyyaml==6.0.2'
          python3 - <<'PY'
          import json, os, pathlib, yaml
          root = pathlib.Path('gitops').resolve()
          def load(relative):
              path = (root / relative).resolve()
              if not path.is_relative_to(root):
                  raise SystemExit('manifest path escapes GitOps checkout')
              return yaml.safe_load(path.read_text(encoding='utf-8'))
          service = load(os.environ['SERVICE_MANIFEST'])['spec']
          provider = load(os.environ['PROVIDER_MANIFEST'])['spec']
          if service['service_domain'] != 'vault.svc.plus' or provider['project_id'] != 'open-platform-shared-510113':
              raise SystemExit('Vault DNS declaration does not match the production domain or project')
          leader = service['storage']['leader']
          names = [leader, *service['storage']['peers']]
          machines = {item['name']: item for item in provider['resources']['vault_nodes']}
          if len(names) not in (1, 3) or len(set(names)) != len(names) or set(names) != set(machines):
              raise SystemExit('Vault DNS requires the reviewed one-node or three-node Raft set')
          nodes = [{'name': name, 'zone': machines[name]['zone'],
                    'role': 'leader' if name == leader else 'standby'} for name in names]
          if not all(machines[name].get('public_ip') is True for name in names):
              raise SystemExit('Every Vault DNS target must have a public IP')
          values = {
              'domain': service['service_domain'],
              'old_host': service['migration']['source']['address'],
              'vault_addr': service['automation']['vault_addr'],
              'node_role': service['automation']['node_role'],
              'runtime_identity_path': service['automation']['runtime_identity_path'],
              'project_id': provider['project_id'],
              'network_name': provider['network_name'],
              'nodes_json': json.dumps(nodes, separators=(',', ':')),
          }
          with open(os.environ['GITHUB_OUTPUT'], 'a', encoding='utf-8') as out:
              for key, value in values.items():
                  print(f'{key}={value}', file=out)
          PY

      - name: Read the scoped GCP runtime identity
        id: identity
        uses: hashicorp/vault-action@v4
        with:
          url: ${{ steps.manifest.outputs.vault_addr }}
          method: jwt
          role: ${{ steps.manifest.outputs.node_role }}
          jwtGithubAudience: vault
          exportToken: false
          secrets: |
            ${{ steps.manifest.outputs.runtime_identity_path }} gcp_workload_identity_provider | GCP_WORKLOAD_IDENTITY_PROVIDER ;
            ${{ steps.manifest.outputs.runtime_identity_path }} deploy_service_account | GCP_SERVICE_ACCOUNT_EMAIL ;
            ${{ steps.manifest.outputs.runtime_identity_path }} gcp_oidc_audience | GCP_OIDC_AUDIENCE ;
            ${{ steps.manifest.outputs.runtime_identity_path }} project_id | GCP_PROJECT_ID

      - name: Authenticate to the declared GCP project
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ steps.identity.outputs.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ steps.identity.outputs.GCP_SERVICE_ACCOUNT_EMAIL }}
          audience: ${{ steps.identity.outputs.GCP_OIDC_AUDIENCE }}
          cleanup_credentials: true

      - name: Install Google Cloud CLI
        uses: google-github-actions/setup-gcloud@v2

      - name: Resolve the three live public IPv4 addresses
        id: instances
        shell: bash
        env:
          PROJECT_ID: ${{ steps.manifest.outputs.project_id }}
          VAULT_PROJECT_ID: ${{ steps.identity.outputs.GCP_PROJECT_ID }}
          NODES_JSON: ${{ steps.manifest.outputs.nodes_json }}
          OLD_HOST: ${{ steps.manifest.outputs.old_host }}
          NETWORK_NAME: ${{ steps.manifest.outputs.network_name }}
        run: |
          set -euo pipefail
          [[ "${PROJECT_ID}" == "${VAULT_PROJECT_ID}" ]] || { echo '::error::GCP identity belongs to another project' >&2; exit 1; }
          gcloud compute instances list --project "${PROJECT_ID}" --format=json > "${RUNNER_TEMP}/vault-instances.json"
          python3 - "${RUNNER_TEMP}/vault-instances.json" <<'PY'
          import ipaddress, json, os, pathlib, socket, sys
          instances = json.loads(pathlib.Path(sys.argv[1]).read_text(encoding='utf-8'))
          indexed = {(item['name'], item.get('zone', '').rsplit('/', 1)[-1]): item
                     for item in instances}
          nodes = json.loads(os.environ['NODES_JSON'])
          matrix = []
          values = {}
          for index, node in enumerate(nodes):
              instance = indexed.get((node['name'], node['zone']))
              if not instance or instance.get('status') != 'RUNNING':
                  raise SystemExit(f"{node['name']} is missing, stopped or in the wrong zone")
              ips = [config.get('natIP') for nic in instance.get('networkInterfaces', [])
                     if nic.get('network', '').endswith('/networks/' + os.environ['NETWORK_NAME'])
                     for config in nic.get('accessConfigs', []) if config.get('natIP')]
              if len(ips) != 1:
                  raise SystemExit(f"{node['name']} does not have exactly one public IPv4 address")
              ip = str(ipaddress.IPv4Address(ips[0]))
              matrix.append({'node': node['name'], 'role': node['role'], 'ip': ip})
              values[f'prod_{index}_ip'] = ip
          legacy_host = os.environ['OLD_HOST']
          try:
              legacy_ips = sorted({
                  str(info[4][0])
                  for info in socket.getaddrinfo(
                      legacy_host, None, socket.AF_INET, socket.SOCK_STREAM
                  )
              })
          except socket.gaierror as error:
              raise SystemExit(f"{legacy_host} does not resolve to an IPv4 address: {error}")
          if len(legacy_ips) != 1:
              raise SystemExit(f"{legacy_host} must resolve to exactly one IPv4 address, got {legacy_ips}")
          old_ip = str(ipaddress.IPv4Address(legacy_ips[0]))
          matrix.append({'node': 'vault-legacy', 'role': 'legacy-independent', 'ip': old_ip})
          values['matrix'] = json.dumps(matrix, separators=(',', ':'))
          values['gcp_targets'] = json.dumps([item['ip'] for item in matrix if item['node'] != 'vault-legacy'], separators=(',', ':'))
          values['old_ip'] = old_ip
          with open(os.environ['GITHUB_OUTPUT'], 'a', encoding='utf-8') as out:
              for key, value in values.items():
                  print(f'{key}={value}', file=out)
          PY

      - name: Read the expected cluster ID from the selected Vault endpoint
        id: cluster
        shell: bash
        env:
          ACTION: ${{ inputs.dns_action }}
          DOMAIN: ${{ steps.manifest.outputs.domain }}
          OLD_IP: ${{ steps.instances.outputs.old_ip }}
          PROD_0_IP: ${{ steps.instances.outputs.prod_0_ip }}
        run: |
          set -euo pipefail
          # Verification and cutover validate the current GCP node. Rollback
          # is the only operation that intentionally validates the retired
          # migration source.
          endpoint="${PROD_0_IP}"
          if [[ "${ACTION}" == rollback ]]; then endpoint="${OLD_IP}"; fi
          health="$(curl --fail-with-body --silent --show-error --connect-timeout 10 --max-time 20 \
            --resolve "${DOMAIN}:443:${endpoint}" \
            "https://${DOMAIN}/v1/sys/health?standbycode=200&perfstandbyok=true")"
          cluster_id="$(jq -er '.cluster_id' <<<"${health}")"
          [[ "${cluster_id}" =~ ^[a-f0-9-]{36}$ ]] || { echo '::error::invalid Vault cluster ID' >&2; exit 1; }
          echo "cluster_id=${cluster_id}" >> "${GITHUB_OUTPUT}"

  dns-validate-targets:
    name: Validate ${{ matrix.node }} (${{ matrix.role }})
    needs: dns-discovery
    if: ${{ always() && needs.dns-discovery.result == 'success' }}
    runs-on: ubuntu-latest
    strategy:
      # Report every endpoint in one run; the cutover job still waits for the
      # complete matrix to succeed before it can mutate DNS.
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.dns-discovery.outputs.matrix) }}
    env:
      ACTION: ${{ inputs.dns_action }}
      DOMAIN: ${{ needs.dns-discovery.outputs.domain }}
      EXPECTED_CLUSTER: ${{ needs.dns-discovery.outputs.expected_cluster }}
      EXPECTED_VERSION: '1.21.4'
    steps:
      - name: Validate the selected endpoint
        shell: bash
        env:
          NODE: ${{ matrix.node }}
          ROLE: ${{ matrix.role }}
          IP: ${{ matrix.ip }}
        run: |
          set -euo pipefail
          [[ "${DOMAIN}" =~ ^[A-Za-z0-9.-]+$ ]] || { echo '::error::invalid target_domain' >&2; exit 1; }
          [[ "${IP}" =~ ^([0-9]{1,3}\.){3}[0-9]{1,3}$ ]] || { echo "::error::${NODE} has an invalid IPv4 address" >&2; exit 1; }

          # Rollback validates the independent legacy endpoint. Verify/switch
          # validate the declared GCP nodes and skip the legacy row.
          if [[ "${ACTION}" == rollback && "${NODE}" != vault-legacy ]]; then
            echo "rollback: ${NODE} matrix row skipped"
            exit 0
          fi
          if [[ "${ACTION}" != rollback && "${NODE}" == vault-legacy ]]; then
            echo "${ACTION}: legacy matrix row skipped"
            exit 0
          fi

          health="$(mktemp)"
          trap 'rm -f -- "${health}"' EXIT
          curl --fail-with-body --silent --show-error --connect-timeout 10 --max-time 20 \
            --resolve "${DOMAIN}:443:${IP}" \
            "https://${DOMAIN}/v1/sys/health?standbycode=200&perfstandbyok=true" \
            -o "${health}"
          jq -e --arg cluster "${EXPECTED_CLUSTER}" \
                --arg version "${EXPECTED_VERSION}" \
                --arg role "${ROLE}" \
                '(.initialized == true) and (.sealed == false) and (.cluster_id == $cluster) and
                 (if $role == "leader" then .standby == false and .version == $version
                  elif $role == "standby" then .standby == true and .version == $version
                  else (.standby == true or .standby == false or .standby == null) end)' "${health}" >/dev/null || {
            echo "::error::${NODE} at ${IP} is not serving the expected Vault role/version/cluster" >&2
            jq '{initialized,sealed,standby,cluster_id,version}' "${health}" >&2
            exit 1
          }
          echo "${NODE} ${ROLE} ${IP}: Vault health verified"

  dns-cutover:
    name: Apply Vault DNS ${{ inputs.dns_action }}
    needs: [dns-discovery, dns-validate-targets]
    if: ${{ always() && needs.dns-discovery.result == 'success' && needs.dns-validate-targets.result == 'success' && (inputs.dns_action == 'switch' || inputs.dns_action == 'rollback') }}
    runs-on: ubuntu-latest
    environment: prod
    steps:
      - name: Validate mutation parameters
        shell: bash
        env:
          ACTION: ${{ inputs.dns_action }}
          ZONE_ID: ''
          CONFIRM: ${{ inputs.confirm }}
          TTL: '60'
          DOMAIN: ${{ needs.dns-discovery.outputs.domain }}
        run: |
          set -euo pipefail
          [[ "${DOMAIN}" == vault.svc.plus ]] || { echo '::error::only vault.svc.plus is allowed by this workflow' >&2; exit 1; }
          if [[ -n "${ZONE_ID}" ]]; then
            [[ "${ZONE_ID}" =~ ^[A-Za-z0-9_-]{8,64}$ ]] || { echo '::error::invalid Cloudflare zone ID' >&2; exit 1; }
          fi
          [[ "${TTL}" =~ ^[1-9][0-9]{0,4}$ ]] || { echo '::error::TTL must be a positive integer' >&2; exit 1; }
          expected="SWITCH-VAULT-DNS"
          [[ "${ACTION}" == rollback ]] && expected="ROLLBACK-VAULT-DNS"
          [[ "${CONFIRM}" == "${expected}" ]] || { echo "::error::confirm must equal ${expected}" >&2; exit 1; }

      - name: Reconcile Cloudflare A records
        shell: bash
        env:
          ACTION: ${{ inputs.dns_action }}
          DOMAIN: ${{ needs.dns-discovery.outputs.domain }}
          ZONE_ID_INPUT: ''
          TTL: '60'
          OLD_IP: ${{ needs.dns-discovery.outputs.old_ip }}
          PROD_0_IP: ${{ needs.dns-discovery.outputs.prod_0_ip }}
          PROD_1_IP: ${{ needs.dns-discovery.outputs.prod_1_ip }}
          PROD_2_IP: ${{ needs.dns-discovery.outputs.prod_2_ip }}
          GCP_TARGETS: ${{ needs.dns-discovery.outputs.gcp_targets }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_DNS_API_TOKEN }}
        run: |
          set -euo pipefail
          : "${CLOUDFLARE_API_TOKEN:?CLOUDFLARE_DNS_API_TOKEN must be configured in the prod environment}"
          case "${ACTION}" in
            switch) mapfile -t targets < <(jq -r '.[]' <<<"${GCP_TARGETS}") ;;
            rollback) targets=("${OLD_IP}") ;;
            *) echo '::error::DNS mutation received an unsupported action' >&2; exit 1 ;;
          esac

          if [[ -n "${ZONE_ID_INPUT}" ]]; then
            ZONE_ID="${ZONE_ID_INPUT}"
          else
            zone_name="${DOMAIN#*.}"
            zones="$(curl --fail-with-body --silent --show-error --retry 3 \
              -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
              "https://api.cloudflare.com/client/v4/zones?name=${zone_name}&status=active&per_page=20")"
            ZONE_ID="$(jq -er '.result | if length == 1 then .[0].id else error("expected exactly one active Cloudflare zone") end' <<<"${zones}")"
          fi

          response="$(curl --fail-with-body --silent --show-error --retry 3 \
            -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
            "https://api.cloudflare.com/client/v4/zones/${ZONE_ID}/dns_records?type=A&name=${DOMAIN}&per_page=100")"
          jq -e '.success == true' <<<"${response}" >/dev/null
          jq -e '.result | length > 0' <<<"${response}" >/dev/null || {
            echo '::error::no existing A record found for vault.svc.plus' >&2
            exit 1
          }

          # Publish every new target before removing the old address. A failed
          # create therefore leaves the existing DNS answer available.
          for target in "${targets[@]}"; do
            payload="$(jq -n --arg name "${DOMAIN}" --arg ip "${target}" --argjson ttl "${TTL}" \
              '{type:"A",name:$name,content:$ip,ttl:$ttl,proxied:false}')"
            mapfile -t matching_ids < <(jq -r --arg ip "${target}" '.result[] | select(.content == $ip) | .id' <<<"${response}")
            if ((${#matching_ids[@]} == 0)); then
              curl --fail-with-body --silent --show-error --retry 3 -X POST \
                  -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
                  -H 'Content-Type: application/json' \
                  --data "${payload}" "https://api.cloudflare.com/client/v4/zones/${ZONE_ID}/dns_records" \
                | jq -e '.success == true' >/dev/null
            else
              for record_id in "${matching_ids[@]}"; do
                curl --fail-with-body --silent --show-error --retry 3 -X PATCH \
                    -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
                    -H 'Content-Type: application/json' \
                    --data "${payload}" "https://api.cloudflare.com/client/v4/zones/${ZONE_ID}/dns_records/${record_id}" \
                  | jq -e '.success == true' >/dev/null
              done
            fi
          done

          response="$(curl --fail-with-body --silent --show-error --retry 3 \
            -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
            "https://api.cloudflare.com/client/v4/zones/${ZONE_ID}/dns_records?type=A&name=${DOMAIN}&per_page=100")"
          jq -e '.success == true' <<<"${response}" >/dev/null
          targets_json="$(printf '%s\n' "${targets[@]}" | jq -R . | jq -s .)"
          for target in "${targets[@]}"; do
            jq -e --arg ip "${target}" 'any(.result[]; .content == $ip and .proxied == false)' <<<"${response}" >/dev/null || {
              echo "::error::target A record ${target} was not published" >&2
              exit 1
            }
          done
          mapfile -t stale_ids < <(jq -r --argjson targets "${targets_json}" \
            '.result[] | select(.content as $ip | $targets | index($ip) | not) | .id' <<<"${response}")
          for record_id in "${stale_ids[@]}"; do
            curl --fail-with-body --silent --show-error --retry 3 -X DELETE \
              -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
              "https://api.cloudflare.com/client/v4/zones/${ZONE_ID}/dns_records/${record_id}" \
              | jq -e '.success == true' >/dev/null
          done
          printf 'DNS %s applied for %s: %s\n' "${ACTION}" "${DOMAIN}" "${targets[*]}" >> "${GITHUB_STEP_SUMMARY}"

  dns-verify:
    name: Verify DNS at resolver ${{ matrix.resolver }}
    needs: [dns-discovery, dns-validate-targets, dns-cutover]
    if: ${{ always() && needs.dns-discovery.result == 'success' && needs.dns-validate-targets.result == 'success' && needs.dns-cutover.result == 'success' && (inputs.dns_action == 'switch' || inputs.dns_action == 'rollback') }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        resolver: [1.1.1.1, 8.8.8.8, 9.9.9.9]
    env:
      ACTION: ${{ inputs.dns_action }}
      DOMAIN: ${{ needs.dns-discovery.outputs.domain }}
      OLD_IP: ${{ needs.dns-discovery.outputs.old_ip }}
      PROD_0_IP: ${{ needs.dns-discovery.outputs.prod_0_ip }}
      PROD_1_IP: ${{ needs.dns-discovery.outputs.prod_1_ip }}
      PROD_2_IP: ${{ needs.dns-discovery.outputs.prod_2_ip }}
      GCP_TARGETS: ${{ needs.dns-discovery.outputs.gcp_targets }}
    steps:
      - name: Wait for the expected A records
        shell: bash
        env:
          RESOLVER: ${{ matrix.resolver }}
        run: |
          set -euo pipefail
          if [[ "${ACTION}" == switch ]]; then mapfile -t expected < <(jq -r '.[]' <<<"${GCP_TARGETS}"); else expected=("${OLD_IP}"); fi
          for attempt in {1..18}; do
            mapfile -t actual < <(dig +short @"${RESOLVER}" "${DOMAIN}" A | sort -u)
            ok=true
            for ip in "${expected[@]}"; do printf '%s\n' "${actual[@]}" | grep -Fxq "${ip}" || ok=false; done
            printf 'resolver=%s attempt=%s records=%s\n' "${RESOLVER}" "${attempt}" "${actual[*]:-none}"
            if [[ "${ok}" == true ]] && { [[ "${ACTION}" == rollback ]] || ! printf '%s\n' "${actual[@]}" | grep -Fxq "${OLD_IP}"; }; then
              printf 'DNS %s verified at resolver %s\n' "${ACTION}" "${RESOLVER}" >> "${GITHUB_STEP_SUMMARY}"
              exit 0
            fi
            sleep 10
          done
          echo "::error::DNS ${ACTION} did not converge at resolver ${RESOLVER}" >&2
          exit 1
