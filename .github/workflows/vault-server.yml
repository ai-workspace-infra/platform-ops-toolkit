name: Vault server

# Single entry point for a Vault server deployment. The cloud adapter selected
# here only creates nodes (IaC) and opens short-lived SSH; the node stage
# itself (Vault, monitoring, migration, XConnect) is provider-neutral and
# reads the environment, nodes, network, Vault paths and connection mode from
# reviewed GitOps.
#
# Run one node stage per dispatch; each stage checks live node state first,
# so manual Vault init/unseal can happen between dispatches. This was
# previously split into this entry plus a reusable vault-shared-iac.yml; that
# reusable workflow had exactly one caller, so the split added indirection
# (duplicated GitOps resolution, a second Actions entry) without a second
# consumer to justify it. Its jobs are inlined below.

on:
  workflow_dispatch:
    inputs:
      cloud_provider:
        description: Provider adapter. It creates nodes and opens short-lived SSH; the node stage itself is provider-neutral.
        type: choice
        required: true
        default: gcp-cloud
        options: [gcp-cloud]
      deploy_action:
        description: IaC action. none runs only the selected node stage against existing nodes; plan cannot be combined with a node stage.
        type: choice
        required: true
        default: plan
        options: [none, plan, apply]
      service_stage:
        description: 'One stage per dispatch. node-*/vault-*: both paths; fresh-*: new cluster; migrate-*: move the existing vault.svc.plus (migrate-auto picks the next step). Each checks live state first.'
        type: choice
        required: true
        default: none
        options: [none, node-preflight, node-process-metrics, vault-raft-verify, vault-snapshot, xconnect-gateway-frontend, xconnect-gateway, xconnect-one, fresh-leader, fresh-peers, migrate-auto, migrate-preflight, migrate-convert, migrate-rollback, migrate-join, migrate-cutover, migrate-remove]
      connection_mode:
        description: Current supported SSH transport for the hosted installation job.
        type: choice
        required: true
        default: bootstrap-public
        options: [bootstrap-public]
      gitops_repo_ref:
        description: GitOps ref containing the reviewed Vault resource declaration.
        type: string
        required: true
        default: main
      service_manifest:
        description: Provider-neutral Vault service declaration inside GitOps.
        type: string
        required: true
        default: resources/svc.plus/shared/vault/server.yaml
      provider_manifest:
        description: Provider-specific node and network declaration inside GitOps.
        type: string
        required: true
        default: resources/xworktech.com/shared/gcp/vault-shared.yaml
      iac_ref:
        description: Reviewed iac_modules commit containing the GCP Vault renderer and VM modules.
        type: string
        required: true
        default: 815ad1c21dde0f2e579913d755bfe2d45da25e05
      confirm:
        description: Confirmation phrase for stages that change a live Vault (MIGRATE-VAULT-AUTO for migrate-auto; a missing phrase is named in the error).
        type: string
        required: false
        default: ''
      playbooks_ref:
        description: Reviewed playbooks commit for Vault node configuration.
        type: string
        required: true
        default: f226989802734f4106d8b6f268b4f02f4eb08a65

permissions:
  contents: read
  id-token: write

concurrency:
  group: vault-server-${{ inputs.service_manifest }}
  cancel-in-progress: false

jobs:
  declaration:
    name: Resolve declaration and stage plan
    runs-on: ubuntu-latest
    outputs:
      environment: ${{ steps.declaration.outputs.environment }}
      github_environment: ${{ steps.declaration.outputs.github_environment }}
      account_id: ${{ steps.declaration.outputs.account_id }}
      vault_addr: ${{ steps.declaration.outputs.vault_addr }}
      monitoring_role: ${{ steps.declaration.outputs.monitoring_role }}
      monitoring_secret_path: ${{ steps.declaration.outputs.monitoring_secret_path }}
      xconnect_role: ${{ steps.declaration.outputs.xconnect_role }}
      xconnect_secret_path: ${{ steps.declaration.outputs.xconnect_secret_path }}
      xconnect_topology: ${{ steps.declaration.outputs.xconnect_topology }}
      provider_config: ${{ steps.declaration.outputs.provider_config }}
      migration: ${{ steps.declaration.outputs.migration }}
      legacy_config: ${{ steps.declaration.outputs.legacy_config }}
      raft_operator_role: ${{ steps.declaration.outputs.raft_operator_role }}
      snapshot_role: ${{ steps.declaration.outputs.snapshot_role }}
      backup_config: ${{ steps.declaration.outputs.backup_config }}
      open_new: ${{ steps.access.outputs.open_new }}
      open_legacy: ${{ steps.access.outputs.open_legacy }}
    steps:
      - name: Checkout toolkit
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Checkout reviewed GitOps declaration
        uses: actions/checkout@v4
        with:
          repository: ai-workspace-infra/gitops
          ref: ${{ inputs.gitops_repo_ref }}
          path: gitops
          persist-credentials: false

      - name: Reject dispatch combinations that cannot run
        env:
          DEPLOY_ACTION: ${{ inputs.deploy_action }}
          SERVICE_STAGE: ${{ inputs.service_stage }}
        run: |
          set -euo pipefail
          if [[ "${DEPLOY_ACTION}" == plan && "${SERVICE_STAGE}" != none ]]; then
            echo '::error::A node stage needs deploy_action=apply or deploy_action=none, not plan' >&2
            exit 1
          fi
          if [[ "${DEPLOY_ACTION}" == none && "${SERVICE_STAGE}" == none ]]; then
            echo '::error::Nothing to do: choose an IaC action or a node stage' >&2
            exit 1
          fi

      - name: Resolve environment, Vault paths and connection mode from GitOps
        id: declaration
        env:
          SERVICE_MANIFEST: ${{ inputs.service_manifest }}
          PROVIDER_MANIFEST: ${{ inputs.provider_manifest }}
          CLOUD_PROVIDER: ${{ inputs.cloud_provider }}
          CONNECTION_MODE: ${{ inputs.connection_mode }}
        run: |
          set -euo pipefail
          python3 -m pip install --disable-pip-version-check 'pyyaml==6.0.2'
          python3 scripts/node_deploy/resolve_vault_server_declaration.py \
            --gitops-root gitops --service-manifest "${SERVICE_MANIFEST}" \
            --provider-manifest "${PROVIDER_MANIFEST}" --provider "${CLOUD_PROVIDER}" \
            --output "${GITHUB_OUTPUT}"
          declared_mode="$(grep '^ssh_access_mode=' "${GITHUB_OUTPUT}" | tail -n 1 | cut -d= -f2-)"
          [[ "${declared_mode}" == "${CONNECTION_MODE}" ]] || {
            echo "::error::connection_mode=${CONNECTION_MODE} does not match reviewed GitOps (${declared_mode})" >&2
            exit 1
          }

      - name: Resolve the stage plan
        id: plan
        if: ${{ inputs.service_stage != 'none' }}
        env:
          DEPLOY_STAGE: ${{ inputs.service_stage }}
          CONFIRM: ${{ inputs.confirm }}
          MIGRATION: ${{ steps.declaration.outputs.migration }}
        run: |
          python3 scripts/node_deploy/stage_plan.py "${DEPLOY_STAGE}" \
            --confirm "${CONFIRM}" --migration "${MIGRATION}" --github-output "${GITHUB_OUTPUT}"

      - name: Select node access for the stage
        id: access
        if: ${{ inputs.service_stage != 'none' }}
        env:
          SSH_SCOPE: ${{ steps.plan.outputs.ssh }}
          MIGRATION: ${{ steps.declaration.outputs.migration }}
        run: |
          set -euo pipefail
          open_new=false
          open_legacy=false
          case "${SSH_SCOPE}" in
            new) open_new=true ;;
            legacy) open_legacy=true ;;
            all) open_new=true; open_legacy=true ;;
            cluster) open_new=true; open_legacy="${MIGRATION}" ;;
            none) ;;
            *) echo "::error::unknown ssh scope ${SSH_SCOPE}" >&2; exit 1 ;;
          esac
          echo "open_new=${open_new}" >> "${GITHUB_OUTPUT}"
          echo "open_legacy=${open_legacy}" >> "${GITHUB_OUTPUT}"

  gcp-shared:
    needs: declaration
    if: ${{ inputs.cloud_provider == 'gcp-cloud' && inputs.deploy_action != 'none' }}
    uses: ./.github/workflows/gcp-iac-pipeline.yml
    with:
      deploy_action: ${{ inputs.deploy_action }}
      vault_env_path: ${{ needs.declaration.outputs.environment }}
      github_environment: ${{ needs.declaration.outputs.github_environment }}
      gcp_account_id: ${{ needs.declaration.outputs.account_id }}
      gcp_resource_manifest: ${{ inputs.provider_manifest }}
      gitops_repo_name: https://github.com/ai-workspace-infra/gitops.git
      gitops_repo_ref: ${{ inputs.gitops_repo_ref }}
      iac_ref: ${{ inputs.iac_ref }}
    secrets: inherit

  node-stage:
    name: Node stage (${{ inputs.service_stage }})
    needs: [declaration, gcp-shared]
    if: ${{ always() && needs.declaration.result == 'success' && inputs.service_stage != 'none' && ((inputs.deploy_action == 'apply' && needs.gcp-shared.result == 'success') || (inputs.deploy_action == 'none' && needs.gcp-shared.result == 'skipped')) && github.ref == 'refs/heads/main' && inputs.gitops_repo_ref == 'main' }}
    runs-on: ubuntu-latest
    timeout-minutes: 70
    environment: ${{ needs.declaration.outputs.github_environment }}
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Set runner-private paths
        shell: bash
        run: |
          echo "NODE_ACCESS_DIR=${RUNNER_TEMP}/node-access" >> "${GITHUB_ENV}"
          echo "SSH_KNOWN_HOSTS=${RUNNER_TEMP}/node-known-hosts" >> "${GITHUB_ENV}"

      - name: Checkout toolkit
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Checkout reviewed GitOps declaration
        uses: actions/checkout@v4
        with:
          repository: ai-workspace-infra/gitops
          ref: ${{ inputs.gitops_repo_ref }}
          path: gitops
          persist-credentials: false

      - name: Checkout reviewed service playbooks
        uses: actions/checkout@v4
        with:
          repository: ai-workspace-infra/playbooks
          ref: ${{ inputs.playbooks_ref }}
          path: playbooks
          persist-credentials: false

      - name: Prepare isolated Python and Ansible
        shell: bash
        run: |
          set -euo pipefail
          python3 -m venv "${RUNNER_TEMP}/node-stage-python"
          "${RUNNER_TEMP}/node-stage-python/bin/python" -m pip install --disable-pip-version-check 'pyyaml==6.0.2' 'ansible-core==2.17.14'
          "${RUNNER_TEMP}/node-stage-python/bin/ansible-galaxy" collection install 'ansible.posix:==2.1.0'
          echo "${RUNNER_TEMP}/node-stage-python/bin" >> "${GITHUB_PATH}"

      - name: Create the one-run SSH key
        if: ${{ needs.declaration.outputs.open_new == 'true' || needs.declaration.outputs.open_legacy == 'true' }}
        shell: bash
        run: |
          set -euo pipefail
          install -d -m 700 "${NODE_ACCESS_DIR}"
          ssh-keygen -q -t ed25519 -N '' -C "vault-node-stage-${GITHUB_RUN_ID}" -f "${NODE_ACCESS_DIR}/id_ed25519"

      # Provider adapters: add one step per adapter. Each emits the same
      # contract/auth_adapter outputs for the shared one-run key and has a
      # close phase.
      - name: Open node access through the GCP adapter
        id: gcp
        if: ${{ needs.declaration.outputs.open_new == 'true' && inputs.cloud_provider == 'gcp-cloud' }}
        uses: ./.github/actions/node-access-gcp
        with:
          phase: open
          provider_config: ${{ needs.declaration.outputs.provider_config }}
          service_manifest: ${{ inputs.service_manifest }}
          provider_manifest: ${{ inputs.provider_manifest }}
          xconnect_topology: ${{ needs.declaration.outputs.xconnect_topology }}
          connection_mode: ${{ inputs.connection_mode }}
          work_dir: ${{ runner.temp }}/node-access/gcp
          ssh_key: ${{ runner.temp }}/node-access/id_ed25519

      - name: Open access to the existing vault.svc.plus node
        id: legacy
        if: ${{ needs.declaration.outputs.open_legacy == 'true' }}
        uses: ./.github/actions/node-access-existing
        with:
          phase: open
          legacy_config: ${{ needs.declaration.outputs.legacy_config }}
          service_manifest: ${{ inputs.service_manifest }}
          ssh_key: ${{ runner.temp }}/node-access/id_ed25519

      - name: Select the prepared adapters
        id: access
        if: ${{ needs.declaration.outputs.open_new == 'true' || needs.declaration.outputs.open_legacy == 'true' }}
        shell: bash
        env:
          GCP_CONTRACT: ${{ steps.gcp.outputs.contract }}
          GCP_ADAPTER: ${{ steps.gcp.outputs.auth_adapter }}
          LEGACY_CONTRACT: ${{ steps.legacy.outputs.contract }}
          LEGACY_ADAPTER: ${{ steps.legacy.outputs.auth_adapter }}
          OPEN_NEW: ${{ needs.declaration.outputs.open_new }}
          OPEN_LEGACY: ${{ needs.declaration.outputs.open_legacy }}
        run: |
          set -euo pipefail
          contracts=()
          adapters=()
          if [[ "${OPEN_NEW}" == true ]]; then
            [[ -s "${GCP_CONTRACT}" ]] || { echo '::error::No provider adapter prepared the new nodes' >&2; exit 1; }
            contracts+=("${GCP_CONTRACT}"); adapters+=("${GCP_ADAPTER}")
          fi
          if [[ "${OPEN_LEGACY}" == true ]]; then
            [[ -s "${LEGACY_CONTRACT}" ]] || { echo '::error::The existing node was not prepared' >&2; exit 1; }
            contracts+=("${LEGACY_CONTRACT}"); adapters+=("${LEGACY_ADAPTER}")
          fi
          contract="${NODE_ACCESS_DIR}/nodes.json"
          python3 scripts/node_deploy/legacy_source.py merge "${contracts[@]}" --output "${contract}"
          echo "contract=${contract}" >> "${GITHUB_OUTPUT}"
          echo "ssh_private_key=${NODE_ACCESS_DIR}/id_ed25519" >> "${GITHUB_OUTPUT}"
          echo "auth_adapters=$(IFS=,; echo "${adapters[*]}")" >> "${GITHUB_OUTPUT}"

      - name: Verify live SSH host keys against GitOps pins
        if: ${{ steps.access.outcome == 'success' }}
        shell: bash
        env:
          NODE_CONTRACT: ${{ steps.access.outputs.contract }}
        run: |
          set -euo pipefail
          python3 scripts/node_deploy/prepare_known_hosts.py \
            --contract "${NODE_CONTRACT}" --output "${SSH_KNOWN_HOSTS}"

      # migrate-auto chooses the next step from live state here, once access
      # is open; every other stage resolves to itself.
      - name: Resolve the stage to run
        id: stage
        shell: bash
        env:
          SERVICE_STAGE: ${{ inputs.service_stage }}
          CONFIRM: ${{ inputs.confirm }}
          MIGRATION: ${{ needs.declaration.outputs.migration }}
          NODE_CONTRACT: ${{ steps.access.outputs.contract }}
          VAULT_ADDR: ${{ needs.declaration.outputs.vault_addr }}
          BACKUP_CONFIG: ${{ needs.declaration.outputs.backup_config }}
        run: |
          set -euo pipefail
          if [[ "${SERVICE_STAGE}" == migrate-auto ]]; then
            python3 scripts/node_deploy/auto_migration.py \
              --contract "${NODE_CONTRACT}" --key "${NODE_ACCESS_DIR}/id_ed25519" --known-hosts "${SSH_KNOWN_HOSTS}" \
              --vault-addr "${VAULT_ADDR}" --backup-config "${BACKUP_CONFIG}" --github-output "${GITHUB_OUTPUT}"
          else
            python3 scripts/node_deploy/stage_plan.py "${SERVICE_STAGE}" \
              --confirm "${CONFIRM}" --migration "${MIGRATION}" --github-output "${GITHUB_OUTPUT}" >/dev/null
            echo "snapshot_first=false" >> "${GITHUB_OUTPUT}"
            echo "blocked=" >> "${GITHUB_OUTPUT}"
          fi

      - name: Report where migrate-auto stopped
        if: ${{ steps.stage.outputs.blocked != '' }}
        shell: bash
        env:
          BLOCKED: ${{ steps.stage.outputs.blocked }}
        run: |
          printf '**migrate-auto stopped:** %s\n' "${BLOCKED}" | tee -a "${GITHUB_STEP_SUMMARY}"

      - name: Read observability ingestion credentials
        if: ${{ steps.stage.outputs.needs_observability == 'true' }}
        id: observability
        uses: hashicorp/vault-action@v4
        with:
          url: ${{ needs.declaration.outputs.vault_addr }}
          method: jwt
          role: ${{ needs.declaration.outputs.monitoring_role }}
          jwtGithubAudience: vault
          exportToken: false
          secrets: |
            ${{ needs.declaration.outputs.monitoring_secret_path }} user | VECTOR_AUTH_USER ;
            ${{ needs.declaration.outputs.monitoring_secret_path }} password | VECTOR_AUTH_PASSWORD

      - name: Read the Gateway TLS certificate
        if: ${{ steps.stage.outputs.needs_tls == 'true' }}
        id: gateway_tls
        uses: hashicorp/vault-action@v4
        with:
          url: ${{ needs.declaration.outputs.vault_addr }}
          method: jwt
          role: ${{ needs.declaration.outputs.xconnect_role }}
          jwtGithubAudience: vault
          exportToken: false
          secrets: |
            kv/data/CICD/domains/svc.plus tls_fullchain_pem_b64 | VAULT_GATEWAY_TLS_FULLCHAIN_B64 ;
            kv/data/CICD/domains/svc.plus tls_key_pem_b64 | VAULT_GATEWAY_TLS_KEY_B64

      # XConnect enrollment: Zero service credentials, the public trust bundle
      # the Gateway hands to One, and the GitHub App key that reads the
      # private XConnect releases. All through the scoped xconnect role.
      - name: Read XConnect enrollment credentials
        if: ${{ steps.stage.outputs.xconnect != '' }}
        id: xconnect_secrets
        uses: hashicorp/vault-action@v4
        with:
          url: ${{ needs.declaration.outputs.vault_addr }}
          method: jwt
          role: ${{ needs.declaration.outputs.xconnect_role }}
          jwtGithubAudience: vault
          exportToken: false
          exportEnv: false
          secrets: |
            ${{ needs.declaration.outputs.xconnect_secret_path }} ZERO_SERVICE_TOKEN | ZERO_SERVICE_TOKEN ;
            ${{ needs.declaration.outputs.xconnect_secret_path }} ZERO_OWNER_EMAIL | ZERO_OWNER_EMAIL ;
            ${{ needs.declaration.outputs.xconnect_secret_path }} VLESS_ID | XCONNECT_VLESS_ID ;
            kv/data/CICD/domains/svc.plus tls_trust_bundle_pem_b64 | XCONNECT_TRUST_BUNDLE_B64 ;
            kv/data/CICD/github-app/daily-snapshot app_private_key | XCONNECT_APP_PRIVATE_KEY

      - name: Create a read-only XConnect release token
        if: ${{ steps.stage.outputs.xconnect != '' }}
        id: xconnect_release
        uses: actions/create-github-app-token@v3
        with:
          client-id: Iv23liNwStpQIiXajhpb
          private-key: ${{ steps.xconnect_secrets.outputs.XCONNECT_APP_PRIVATE_KEY }}
          owner: ai-workspace-xstream
          repositories: XConnect-One,XConnect-Gateway

      - name: Download the reviewed XConnect runtime
        if: ${{ steps.stage.outputs.xconnect != '' }}
        shell: bash
        env:
          XCONNECT_ROLE: ${{ steps.stage.outputs.xconnect }}
          XCONNECT_TOPOLOGY: gitops/${{ needs.declaration.outputs.xconnect_topology }}
          NODE_CONTRACT: ${{ steps.access.outputs.contract }}
          RELEASE_TOKEN: ${{ steps.xconnect_release.outputs.token }}
          GITHUB_TOKEN: ${{ github.token }}
          TRUST_BUNDLE_B64: ${{ steps.xconnect_secrets.outputs.XCONNECT_TRUST_BUNDLE_B64 }}
        run: |
          set -euo pipefail
          umask 077
          install -d -m 700 "${RUNNER_TEMP}/xconnect" "${RUNNER_TEMP}/xconnect/secrets"
          arch="$(python3 scripts/node_deploy/xconnect_stage.py arch --role "${XCONNECT_ROLE}" \
            --contract "${NODE_CONTRACT}" --key "${NODE_ACCESS_DIR}/id_ed25519" --known-hosts "${SSH_KNOWN_HOSTS}")"
          eval "$(python3 - "${XCONNECT_TOPOLOGY}" <<'PY'
          import shlex, sys, yaml
          runtime = yaml.safe_load(open(sys.argv[1], encoding="utf-8"))["spec"]["runtime"]
          for name, key in (("GATEWAY_RELEASE_TAG", "gateway_release"), ("ONE_RELEASE_TAG", "cli_release"), ("XRAY_RELEASE_TAG", "xray_release")):
              print(f"export {name}={shlex.quote(str(runtime.get(key, '')))}")
          PY
          )"
          components=one
          [[ "${XCONNECT_ROLE}" == gateway ]] && components=gateway
          bash scripts/node_deploy/xconnect_artifacts.sh "${RUNNER_TEMP}/xconnect/bin" "${arch}" "${components}"
          printf '%s' "${TRUST_BUNDLE_B64}" | base64 --decode > "${RUNNER_TEMP}/xconnect/secrets/trust-bundle.pem"
          openssl x509 -in "${RUNNER_TEMP}/xconnect/secrets/trust-bundle.pem" -noout

      - name: Log in with the stage's scoped Vault role
        if: ${{ steps.stage.outputs.token != '' }}
        uses: hashicorp/vault-action@v4
        with:
          url: ${{ needs.declaration.outputs.vault_addr }}
          method: jwt
          role: ${{ steps.stage.outputs.token == 'snapshot' && needs.declaration.outputs.snapshot_role || needs.declaration.outputs.raft_operator_role }}
          jwtGithubAudience: vault
          exportToken: true

      - name: Read off-site backup credentials
        id: backup
        if: ${{ steps.stage.outputs.action == 'snapshot' || steps.stage.outputs.snapshot_first == 'true' }}
        uses: hashicorp/vault-action@v4
        with:
          url: ${{ needs.declaration.outputs.vault_addr }}
          method: jwt
          role: ${{ needs.declaration.outputs.snapshot_role }}
          jwtGithubAudience: vault
          exportToken: false
          secrets: |
            ${{ fromJSON(needs.declaration.outputs.backup_config).credentials_path }} access_key_id | BACKUP_ACCESS_KEY_ID ;
            ${{ fromJSON(needs.declaration.outputs.backup_config).credentials_path }} secret_access_key | BACKUP_SECRET_ACCESS_KEY

      - name: Take, encrypt and upload a Raft snapshot
        if: ${{ steps.stage.outputs.action == 'snapshot' || steps.stage.outputs.snapshot_first == 'true' }}
        shell: bash
        env:
          VAULT_ADDR: ${{ needs.declaration.outputs.vault_addr }}
          BACKUP_AGE_RECIPIENT: ${{ fromJSON(needs.declaration.outputs.backup_config).age_recipient }}
          BACKUP_DESTINATION: ${{ fromJSON(needs.declaration.outputs.backup_config).destination }}
          BACKUP_ENDPOINT: ${{ fromJSON(needs.declaration.outputs.backup_config).endpoint }}
          AWS_REGION: ${{ fromJSON(needs.declaration.outputs.backup_config).region }}
          AWS_ACCESS_KEY_ID: ${{ steps.backup.outputs.BACKUP_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ steps.backup.outputs.BACKUP_SECRET_ACCESS_KEY }}
        run: |
          set -euo pipefail
          command -v age >/dev/null 2>&1 || sudo apt-get install -y -qq age >/dev/null
          bash scripts/node_deploy/vault_snapshot.sh

      - name: Execute provider-neutral Vault node stage
        if: ${{ steps.access.outcome == 'success' && steps.stage.outputs.stage != '' }}
        uses: ./.github/actions/vault-node-stage
        env:
          VECTOR_AUTH_USER: ${{ steps.observability.outputs.VECTOR_AUTH_USER }}
          VECTOR_AUTH_PASSWORD: ${{ steps.observability.outputs.VECTOR_AUTH_PASSWORD }}
          VAULT_GATEWAY_TLS_FULLCHAIN_B64: ${{ steps.gateway_tls.outputs.VAULT_GATEWAY_TLS_FULLCHAIN_B64 }}
          VAULT_GATEWAY_TLS_KEY_B64: ${{ steps.gateway_tls.outputs.VAULT_GATEWAY_TLS_KEY_B64 }}
          ZERO_SERVICE_TOKEN: ${{ steps.xconnect_secrets.outputs.ZERO_SERVICE_TOKEN }}
          ZERO_OWNER_EMAIL: ${{ steps.xconnect_secrets.outputs.ZERO_OWNER_EMAIL }}
          XCONNECT_VLESS_ID: ${{ steps.xconnect_secrets.outputs.XCONNECT_VLESS_ID }}
        with:
          contract: ${{ steps.access.outputs.contract }}
          stage: ${{ steps.stage.outputs.stage }}
          playbook: ${{ steps.stage.outputs.playbook }}
          tags: ${{ steps.stage.outputs.tags }}
          requires: ${{ steps.stage.outputs.requires }}
          confirms: ${{ steps.stage.outputs.confirms }}
          next_step: ${{ steps.stage.outputs.next }}
          playbooks_root: ${{ github.workspace }}/playbooks
          ssh_private_key: ${{ steps.access.outputs.ssh_private_key }}
          known_hosts: ${{ runner.temp }}/node-known-hosts
          ready_adapters: ${{ steps.access.outputs.auth_adapters }}
          action: ${{ steps.stage.outputs.action }}
          vault_addr: ${{ needs.declaration.outputs.vault_addr }}
          extra_vars: ${{ steps.stage.outputs.extra_vars }}
          xconnect_role: ${{ steps.stage.outputs.xconnect }}
          xconnect_topology: ${{ github.workspace }}/gitops/${{ needs.declaration.outputs.xconnect_topology }}
          xconnect_dir: ${{ runner.temp }}/xconnect
          gateway_state: /var/lib/xconnect-gateway/${{ needs.declaration.outputs.environment }}/state.json

      - name: Close access to the existing node
        if: ${{ always() && needs.declaration.outputs.open_legacy == 'true' }}
        uses: ./.github/actions/node-access-existing
        with:
          phase: close
          legacy_config: ${{ needs.declaration.outputs.legacy_config }}
          ssh_key: ${{ runner.temp }}/node-access/id_ed25519

      - name: Close node access through the GCP adapter
        if: ${{ always() && needs.declaration.outputs.open_new == 'true' && inputs.cloud_provider == 'gcp-cloud' }}
        uses: ./.github/actions/node-access-gcp
        with:
          phase: close
          provider_config: ${{ needs.declaration.outputs.provider_config }}
          connection_mode: ${{ inputs.connection_mode }}
          work_dir: ${{ runner.temp }}/node-access/gcp
          ssh_key: ${{ runner.temp }}/node-access/id_ed25519

      - name: Remove runner-private node files
        if: ${{ always() }}
        shell: bash
        run: rm -rf -- "${NODE_ACCESS_DIR}" "${SSH_KNOWN_HOSTS}" "${RUNNER_TEMP}/xconnect"

  cleanup-node-access:
    name: Ensure temporary node access is closed
    needs: [declaration, node-stage]
    if: ${{ always() && needs.declaration.result == 'success' && needs.node-stage.result != 'skipped' && needs.declaration.outputs.open_new == 'true' && inputs.cloud_provider == 'gcp-cloud' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: ${{ needs.declaration.outputs.github_environment }}
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout toolkit
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Close node access through the GCP adapter
        uses: ./.github/actions/node-access-gcp
        with:
          phase: close
          provider_config: ${{ needs.declaration.outputs.provider_config }}
          connection_mode: ${{ inputs.connection_mode }}
          work_dir: ${{ runner.temp }}/node-access/gcp
          ssh_key: ${{ runner.temp }}/node-access/id_ed25519
