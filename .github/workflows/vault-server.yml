name: Vault server

# Entry point for a Vault server deployment. The cloud adapter selected here
# only creates nodes (IaC) and opens short-lived SSH; Vault, monitoring and
# XConnect installation run in the provider-neutral vault-shared-iac.yml.
# Run one node stage per dispatch; each stage checks live node state first,
# so manual Vault init/unseal can happen between dispatches.

on:
  workflow_dispatch:
    inputs:
      cloud_provider:
        description: Provider adapter. It creates nodes and opens short-lived SSH; the node stages themselves are provider-neutral.
        type: choice
        required: true
        default: gcp-cloud
        options: [gcp-cloud]
      deploy_action:
        description: IaC action. none runs only the selected node stage against existing nodes; plan cannot be combined with a node stage.
        type: choice
        required: true
        default: plan
        options: [none, plan, apply]
      service_stage:
        description: One node stage per dispatch (see docs/howto/Vault-Server-Migration.md). Each checks live state first.
        type: choice
        required: true
        default: none
        options: [none, node-preflight, node-process-metrics, vault-shared-leader, vault-shared-peers, vault-raft-verify, legacy-preflight, legacy-convert-raft, legacy-convert-rollback, vault-snapshot, vault-join-legacy, vault-cutover, vault-remove-legacy]
      connection_mode:
        description: Current supported SSH transport for the hosted installation job.
        type: choice
        required: true
        default: bootstrap-public
        options: [bootstrap-public]
      gitops_repo_ref:
        description: GitOps ref containing the reviewed Vault resource declaration.
        type: string
        required: true
        default: main
      service_manifest:
        description: Provider-neutral Vault service declaration inside GitOps.
        type: string
        required: true
        default: resources/svc.plus/shared/vault/server.yaml
      provider_manifest:
        description: Provider-specific node and network declaration inside GitOps.
        type: string
        required: true
        default: resources/xworktech.com/shared/gcp/vault-shared.yaml
      iac_ref:
        description: Reviewed iac_modules commit containing the GCP Vault renderer and VM modules.
        type: string
        required: true
        default: 815ad1c21dde0f2e579913d755bfe2d45da25e05
      confirm:
        description: Confirmation phrase for stages that change a live Vault (the stage names it when missing).
        type: string
        required: false
        default: ''
      playbooks_ref:
        description: Reviewed playbooks commit for Vault node configuration.
        type: string
        required: true
        default: 7affb1d53001a248c1266ca747f8ba22980281aa

permissions:
  contents: read
  id-token: write

concurrency:
  group: vault-server-${{ inputs.service_manifest }}
  cancel-in-progress: false

jobs:
  declaration:
    name: Validate Vault service and provider declarations
    runs-on: ubuntu-latest
    outputs:
      environment: ${{ steps.resolve.outputs.environment }}
      github_environment: ${{ steps.resolve.outputs.github_environment }}
      account_id: ${{ steps.resolve.outputs.account_id }}
    steps:
      - name: Checkout toolkit
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Checkout reviewed GitOps declaration
        uses: actions/checkout@v4
        with:
          repository: ai-workspace-infra/gitops
          ref: ${{ inputs.gitops_repo_ref }}
          path: gitops
          persist-credentials: false
      - name: Reject dispatch combinations that cannot run
        env:
          DEPLOY_ACTION: ${{ inputs.deploy_action }}
          SERVICE_STAGE: ${{ inputs.service_stage }}
        run: |
          set -euo pipefail
          if [[ "${DEPLOY_ACTION}" == plan && "${SERVICE_STAGE}" != none ]]; then
            echo '::error::A node stage needs deploy_action=apply or deploy_action=none, not plan' >&2
            exit 1
          fi
          if [[ "${DEPLOY_ACTION}" == none && "${SERVICE_STAGE}" == none ]]; then
            echo '::error::Nothing to do: choose an IaC action or a node stage' >&2
            exit 1
          fi
          if [[ "${SERVICE_STAGE}" != none ]]; then
            python3 scripts/node_deploy/stage_plan.py "${SERVICE_STAGE}" >/dev/null
          fi

      - name: Parse scoped Vault and provider declarations
        id: resolve
        env:
          SERVICE_MANIFEST: ${{ inputs.service_manifest }}
          PROVIDER_MANIFEST: ${{ inputs.provider_manifest }}
          CLOUD_PROVIDER: ${{ inputs.cloud_provider }}
        run: |
          python3 -m pip install --disable-pip-version-check 'pyyaml==6.0.2'
          python3 scripts/node_deploy/resolve_vault_server_declaration.py \
            --gitops-root gitops --service-manifest "${SERVICE_MANIFEST}" \
            --provider-manifest "${PROVIDER_MANIFEST}" --provider "${CLOUD_PROVIDER}" \
            --output "${GITHUB_OUTPUT}"

  gcp-shared:
    needs: declaration
    if: ${{ inputs.cloud_provider == 'gcp-cloud' && inputs.deploy_action != 'none' }}
    uses: ./.github/workflows/gcp-iac-pipeline.yml
    with:
      deploy_action: ${{ inputs.deploy_action }}
      vault_env_path: ${{ needs.declaration.outputs.environment }}
      github_environment: ${{ needs.declaration.outputs.github_environment }}
      gcp_account_id: ${{ needs.declaration.outputs.account_id }}
      gcp_resource_manifest: ${{ inputs.provider_manifest }}
      gitops_repo_name: https://github.com/ai-workspace-infra/gitops.git
      gitops_repo_ref: ${{ inputs.gitops_repo_ref }}
      iac_ref: ${{ inputs.iac_ref }}
    secrets: inherit

  node-stage:
    name: Node stage (${{ inputs.service_stage }})
    needs: [declaration, gcp-shared]
    if: ${{ always() && needs.declaration.result == 'success' && inputs.service_stage != 'none' && ((inputs.deploy_action == 'apply' && needs.gcp-shared.result == 'success') || (inputs.deploy_action == 'none' && needs.gcp-shared.result == 'skipped')) && github.ref == 'refs/heads/main' && inputs.gitops_repo_ref == 'main' }}
    uses: ./.github/workflows/vault-shared-iac.yml
    permissions:
      contents: read
      id-token: write
    with:
      stage: ${{ inputs.service_stage }}
      provider: ${{ inputs.cloud_provider }}
      service_manifest: ${{ inputs.service_manifest }}
      provider_manifest: ${{ inputs.provider_manifest }}
      connection_mode: ${{ inputs.connection_mode }}
      gitops_repo_ref: ${{ inputs.gitops_repo_ref }}
      playbooks_ref: ${{ inputs.playbooks_ref }}
      confirm: ${{ inputs.confirm }}
