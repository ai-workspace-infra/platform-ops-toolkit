name: Environment Upgrade Contract CI

on:
  pull_request:
    paths:
      - .github/workflows/environment-data-operations.yml
      - .github/workflows/*orchestrator.yml
      - scripts/vault/**
      - .github/workflows/environment-upgrade*.yml
      - .github/scripts/environment-upgrade/**
      - .github/scripts/tests/environment_upgrade_test.py
      - .github/scripts/tests/environment_data_operations_test.py
      - .github/scripts/snapshots/verify-promotion-manifest.py
      - .github/scripts/tests/fixtures/uat-upgrade-acceptance.jq
      - docs/data_migration/environment-upgrade.md
      - docs/data_migration/environment-data-operations.md
  push:
    branches: [main, feature/environment-upgrade, feature/environment-data-operations]
    paths:
      - .github/workflows/environment-data-operations.yml
      - .github/workflows/environment-upgrade*.yml
      - .github/scripts/environment-upgrade/**
      - .github/scripts/tests/environment_upgrade_test.py
      - .github/scripts/tests/environment_data_operations_test.py
      - .github/scripts/snapshots/verify-promotion-manifest.py
      - .github/scripts/tests/fixtures/uat-upgrade-acceptance.jq

permissions:
  contents: read

jobs:
  offline-rehearsal:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Falsify both environments and all phase gates without deployment credentials
        run: |
          python3 -m pip install PyYAML==6.0.3
          python3 .github/scripts/tests/environment_upgrade_test.py
          python3 .github/scripts/tests/environment_data_operations_test.py
