name: Daily Main Snapshot

on:
  schedule:
    # GitHub Actions cron uses UTC; 16:00 UTC is 00:00 Asia/Shanghai.
    - cron: "0 16 * * *"
  workflow_dispatch:
    inputs:
      snapshot_tag:
        description: "要发布的 tag：Prod 填新的 vYYYY.MM.DD[-rN] 或 vX.Y.Z[-rN]；SIT/UAT 填 daily-build-* 或 uat-daily-build-*。"
        required: false
        type: string
      snapshot_source_ref:
        description: "引用的 tag/ref：Prod 必须填写已验证的 v*、daily-build-* 或 uat-daily-build-*；SIT/UAT 留空才使用 main。"
        required: false
        default: ''
        type: string
      deploy_env:
        description: "目标环境：选择 sit、uat 或 prod。"
        required: true
        default: uat
        type: choice
        options:
          - sit
          - uat
          - prod
      repositories:
        description: "可选：精确仓库列表，逗号分隔，例如 ai-workspace-services/accounts"
        required: false
        type: string
      skip_stripe_catalog:
        description: "可选：跳过 Stripe 目录同步，仅验证核心 PROD 部署"
        required: false
        default: false
        type: boolean

permissions:
  contents: write
  actions: write
  id-token: write

concurrency:
  group: daily-main-snapshot-${{ inputs.deploy_env || 'uat' }}-${{ inputs.snapshot_tag || 'scheduled' }}
  cancel-in-progress: false

jobs:
  resolve-snapshot-tag:
    name: Resolve immutable snapshot tag
    runs-on: ubuntu-latest
    outputs:
      snapshot_tag: ${{ steps.resolve.outputs.snapshot_tag }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Load GitHub App private key from Vault
        id: vault
        uses: hashicorp/vault-action@v4
        with:
          url: https://vault.svc.plus
          method: jwt
          role: ${{ (inputs.deploy_env || 'uat') == 'prod' && 'github-actions-platform-ops-toolkit-prod-release' || format('github-actions-platform-ops-toolkit-{0}', inputs.deploy_env || 'uat') }}
          jwtGithubAudience: vault
          secrets: |
            kv/data/CICD/github-app/daily-snapshot app_private_key | APP_PRIVATE_KEY

      - name: Create GitHub App installation token for infra
        id: app-token-infra
        uses: actions/create-github-app-token@v3
        with:
          client-id: Iv23liNwStpQIiXajhpb
          private-key: ${{ steps.vault.outputs.APP_PRIVATE_KEY }}
          owner: ai-workspace-infra

      - name: Create GitHub App installation token for lab
        id: app-token-lab
        uses: actions/create-github-app-token@v3
        with:
          client-id: Iv23liNwStpQIiXajhpb
          private-key: ${{ steps.vault.outputs.APP_PRIVATE_KEY }}
          owner: ai-workspace-lab

      - name: Create GitHub App installation token for services
        id: app-token-services
        uses: actions/create-github-app-token@v3
        with:
          client-id: Iv23liNwStpQIiXajhpb
          private-key: ${{ steps.vault.outputs.APP_PRIVATE_KEY }}
          owner: ai-workspace-services
          # Keep the release-authoring token limited to the canonical build
          # inventory. Explicit permissions also make a missing installation
          # grant fail at token creation instead of halfway through tagging.
          repositories: |
            accounts
            billing-service
            content-service
            portal
            edge-gateway
            postgresql.svc.plus
          permission-contents: write
          permission-actions: write
          permission-workflows: write

      - name: Create GitHub App installation token for xstream
        id: app-token-xstream
        uses: actions/create-github-app-token@v3
        with:
          client-id: Iv23liNwStpQIiXajhpb
          private-key: ${{ steps.vault.outputs.APP_PRIVATE_KEY }}
          owner: ai-workspace-xstream

      - name: Resolve snapshot tag across all organizations
        id: resolve
        run: ./.github/scripts/snapshots/resolve-snapshot-tag.sh
        env:
          DEPLOY_ENV: ${{ inputs.deploy_env || 'uat' }}
          SNAPSHOT_TAG: ${{ inputs.snapshot_tag }}
          SNAPSHOT_SOURCE_REF: ${{ inputs.snapshot_source_ref }}
          SNAPSHOT_REF: ${{ inputs.snapshot_source_ref || 'main' }}
          SNAPSHOT_REPOS: ${{ inputs.repositories }}
          SNAPSHOT_TOKEN_AI_WORKSPACE_INFRA: ${{ steps.app-token-infra.outputs.token }}
          SNAPSHOT_TOKEN_AI_WORKSPACE_LAB: ${{ steps.app-token-lab.outputs.token }}
          SNAPSHOT_TOKEN_AI_WORKSPACE_SERVICES: ${{ steps.app-token-services.outputs.token }}
          SNAPSHOT_TOKEN_AI_WORKSPACE_XSTREAM: ${{ steps.app-token-xstream.outputs.token }}

  snapshot:
    name: Tag and build main snapshot
    needs: resolve-snapshot-tag
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        organization:
          - ai-workspace-infra
          - ai-workspace-lab
          - ai-workspace-services
          - ai-workspace-xstream
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Load GitHub App private key from Vault
        id: vault
        uses: hashicorp/vault-action@v4
        with:
          url: https://vault.svc.plus
          method: jwt
          # In prod, use the narrowly scoped authoring role: only this
          # workflow on protected main can read the tag-creation credential.
          # Downstream builds/deployments still authenticate on the v* tag.
          role: ${{ (inputs.deploy_env || 'uat') == 'prod' && 'github-actions-platform-ops-toolkit-prod-release' || format('github-actions-platform-ops-toolkit-{0}', inputs.deploy_env || 'uat') }}
          jwtGithubAudience: vault
          secrets: |
            kv/data/CICD/github-app/daily-snapshot app_private_key | APP_PRIVATE_KEY

      - name: Create GitHub App installation token
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: Iv23liNwStpQIiXajhpb
          private-key: ${{ steps.vault.outputs.APP_PRIVATE_KEY }}
          owner: ${{ matrix.organization }}
          repositories: ${{ matrix.organization == 'ai-workspace-services' && 'accounts,billing-service,content-service,portal,edge-gateway,postgresql.svc.plus' || '' }}
          permission-contents: write
          permission-actions: write
          permission-workflows: write

      - name: Create cross-repository main snapshot
        # The matrix owns one GitHub App token per organization. When an
        # explicit repository list is supplied, only the matrix entry that
        # owns at least one selected repository should invoke the snapshot
        # script; passing the full cross-organization list to every matrix
        # entry makes the script reject repositories owned by another org.
        if: ${{ inputs.repositories == '' || contains(inputs.repositories, matrix.organization) }}
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          DEPLOY_ENV: ${{ inputs.deploy_env || 'uat' }}
          SNAPSHOT_TAG: ${{ needs.resolve-snapshot-tag.outputs.snapshot_tag }}
          SNAPSHOT_ORGS: ${{ matrix.organization }}
          SNAPSHOT_REPOS: ${{ inputs.repositories }}
          SNAPSHOT_FILTER_BY_ORG: ${{ inputs.repositories != '' && 'true' || 'false' }}
          SNAPSHOT_REF: ${{ inputs.snapshot_source_ref || 'main' }}
          # Fail before the first tag if this installation cannot access one
          # of the selected repositories. This prevents partial snapshots.
          SNAPSHOT_VERIFY_INSTALLATION_ACCESS: true
          SNAPSHOT_STATUS_FILE: ${{ runner.temp }}/daily-snapshot-status/${{ matrix.organization }}.jsonl
        run: ${{ github.workspace }}/.github/scripts/snapshots/tag-daily-main-snapshot.sh

      - name: Upload snapshot status
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: daily-snapshot-status-${{ matrix.organization }}
          path: ${{ runner.temp }}/daily-snapshot-status/${{ matrix.organization }}.jsonl
          if-no-files-found: warn

  snapshot-summary:
    name: Summarize daily snapshot status
    needs: [resolve-snapshot-tag, snapshot]
    if: ${{ always() && needs.resolve-snapshot-tag.result == 'success' && needs.snapshot.result != 'skipped' }}
    environment: ${{ (inputs.deploy_env || 'uat') == 'prod' && 'production' || '' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Download all organization snapshot status artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: daily-snapshot-status-*
          path: ${{ runner.temp }}/daily-snapshot-status
          merge-multiple: true

      - name: Resolve immutable snapshot tag
        # Never derive a deploy tag from a partial or filtered snapshot.
        if: ${{ (inputs.deploy_env || 'uat') == 'uat' && needs.snapshot.result == 'success' && (inputs.repositories || '') == '' }}
        id: resolve_snapshot_tag
        run: ./.github/scripts/snapshots/resolve-daily-snapshot-tag.sh
        env:
          SNAPSHOT_STATUS_DIRECTORY: ${{ runner.temp }}/daily-snapshot-status
          SNAPSHOT_CANONICAL_ORGANIZATION: ai-workspace-services

      - name: Resolve production release tag
        if: ${{ (inputs.deploy_env || 'uat') == 'prod' && needs.snapshot.result == 'success' && (inputs.repositories || '') == '' }}
        id: resolve_release_tag
        run: |
          # This is the tag just created from SNAPSHOT_SOURCE_REF, not the
          # ref that was used to dispatch this workflow.
          release_tag="${{ needs.resolve-snapshot-tag.outputs.snapshot_tag }}"
          [[ "${release_tag}" =~ ^v([0-9]+\.[0-9]+\.[0-9]+|[0-9]{4}\.[0-9]{2}\.[0-9]{2})(-r[1-9][0-9]*)?$ ]] || {
            echo "::error::Prod snapshot_tag must be a controlled v* release tag." >&2
            exit 1
          }
          echo "release_tag=${release_tag}" >> "$GITHUB_OUTPUT"

      - name: Load GitHub App private key for UAT dispatch
        if: ${{ (inputs.deploy_env || 'uat') == 'uat' }}
        id: vault
        uses: hashicorp/vault-action@v4
        with:
          url: https://vault.svc.plus
          method: jwt
          role: github-actions-platform-ops-toolkit-uat
          jwtGithubAudience: vault
          secrets: |
            kv/data/CICD/github-app/daily-snapshot app_private_key | APP_PRIVATE_KEY

      - name: Create GitHub App installation token for UAT dispatch
        if: ${{ (inputs.deploy_env || 'uat') == 'uat' }}
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: Iv23liNwStpQIiXajhpb
          private-key: ${{ steps.vault.outputs.APP_PRIVATE_KEY }}
          owner: ai-workspace-infra

      - name: Dispatch UAT serverless and selfhost agent-proxy
        if: ${{ (inputs.deploy_env || 'uat') == 'uat' && (inputs.repositories || '') == '' && needs.snapshot.result == 'success' }}
        run: ./.github/scripts/snapshots/dispatch-uat-combined.sh
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          SNAPSHOT_TAG: ${{ steps.resolve_snapshot_tag.outputs.snapshot_tag }}
          # Serverless Accounts is the controller for the separately deployed
          # UAT Agent Proxy. This is a public endpoint, not a credential.
          AGENT_CONTROLLER_URL: https://accounts-serverless-uat.onwalk.net

      - name: Load GitHub App private key for production dispatch
        if: ${{ (inputs.deploy_env || 'uat') == 'prod' && (inputs.repositories || '') == '' && needs.snapshot.result == 'success' }}
        id: prod-vault
        uses: hashicorp/vault-action@v4
        with:
          url: https://vault.svc.plus
          method: jwt
          # Keep dispatch authorization in the same narrow release-authoring
          # boundary; deployment workflows run from protected main and receive
          # RELEASE_TAG as their immutable artifact input.
          role: github-actions-platform-ops-toolkit-prod-release
          jwtGithubAudience: vault
          secrets: |
            kv/data/CICD/github-app/daily-snapshot app_private_key | APP_PRIVATE_KEY

      - name: Create GitHub App installation token for production dispatch
        if: ${{ (inputs.deploy_env || 'uat') == 'prod' && (inputs.repositories || '') == '' && needs.snapshot.result == 'success' }}
        id: prod-app-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: Iv23liNwStpQIiXajhpb
          private-key: ${{ steps.prod-vault.outputs.APP_PRIVATE_KEY }}
          owner: ai-workspace-infra

      - name: Ensure control-plane production tag before dispatch
        if: ${{ (inputs.deploy_env || 'uat') == 'prod' && (inputs.repositories || '') == '' && needs.snapshot.result == 'success' }}
        run: ./.github/scripts/snapshots/ensure-prod-control-plane-tag.sh
        env:
          GH_TOKEN: ${{ steps.prod-app-token.outputs.token }}
          RELEASE_TAG: ${{ steps.resolve_release_tag.outputs.release_tag }}
          SKIP_STRIPE_CATALOG: ${{ inputs.skip_stripe_catalog || false }}
          CONTROL_PLANE_SHA: ${{ github.sha }}

      - name: Dispatch production serverless and selfhost deployment
        if: ${{ (inputs.deploy_env || 'uat') == 'prod' && (inputs.repositories || '') == '' && needs.snapshot.result == 'success' }}
        run: ./.github/scripts/snapshots/dispatch-prod-combined.sh
        env:
          GH_TOKEN: ${{ steps.prod-app-token.outputs.token }}
          RELEASE_TAG: ${{ steps.resolve_release_tag.outputs.release_tag }}

      - name: Publish unified snapshot matrix summary
        env:
          SNAPSHOT_STATUS_DIRECTORY: ${{ runner.temp }}/daily-snapshot-status
        run: ${{ github.workspace }}/.github/scripts/snapshots/aggregate-daily-snapshot-status.sh
