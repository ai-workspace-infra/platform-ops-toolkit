name: Daily Main Snapshot

on:
  schedule:
    # GitHub Actions cron uses UTC; 16:00 UTC is 00:00 Asia/Shanghai.
    - cron: "0 16 * * *"
  workflow_dispatch:
    inputs:
      snapshot_tag:
        description: "要发布的 tag：SIT/UAT 填 daily-build-* 或 uat-daily-build-*；PROD 填受保护的 v* 发布 tag。"
        required: false
        type: string
      snapshot_source_ref:
        description: "引用的 tag/ref：SIT/UAT 留空使用 main；PROD 必须填写已验证的 v* 或 UAT snapshot tag。"
        required: false
        default: ''
        type: string
      deploy_env:
        description: "目标环境：sit、uat 或 prod；PROD 使用受保护的 v* 发布链路。"
        required: true
        default: uat
        type: choice
        options:
          - sit
          - uat
          - prod
      repositories:
        description: "可选：精确仓库列表，逗号分隔，例如 ai-workspace-services/accounts"
        required: false
        type: string
      skip_stripe_catalog:
        description: "可选：跳过 Stripe 目录同步，仅验证核心 UAT/PROD 部署"
        required: false
        default: false
        type: boolean
      xconnect_one_release_tag:
        description: "可选：本次 UAT XConnect Lab 使用的 XConnect-One Release tag；留空则使用 GitOps 声明"
        required: false
        default: ''
        type: string
      xconnect_gateway_release_tag:
        description: "可选：本次 UAT XConnect Lab 使用的 XConnect-Gateway Release tag；留空则使用 GitOps 声明"
        required: false
        default: ''
        type: string
      shared_vault_endpoint:
        description: "只读 Shared Vault readiness endpoint；Daily 不会部署或修改 Shared"
        required: false
        default: https://vault.svc.plus
        type: string
      shared_observability_endpoint:
        description: "只读 Shared Observability readiness endpoint；Daily 不会部署或修改 Shared"
        required: false
        default: https://observability.svc.plus
        type: string
      shared_iam_endpoint:
        description: "只读 Shared IAM OIDC endpoint；Daily 不会部署或修改 Shared"
        required: false
        default: https://iam.svc.plus
        type: string
      shared_iam_issuer:
        description: "Shared IAM discovery 必须返回的 issuer"
        required: false
        default: https://iam.svc.plus
        type: string
      shared_readiness_timeout_seconds:
        description: "Shared readiness 单个探针超时（秒）"
        required: false
        default: '20'
        type: string
permissions:
  contents: write
  actions: write
  id-token: write

concurrency:
  group: daily-main-snapshot-${{ inputs.deploy_env || 'uat' }}-${{ inputs.snapshot_tag || 'scheduled' }}
  cancel-in-progress: false

jobs:
  resolve-snapshot-tag:
    name: Resolve immutable snapshot tag
    runs-on: ubuntu-latest
    outputs:
      snapshot_tag: ${{ steps.resolve.outputs.snapshot_tag }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Load GitHub App private key from Vault
        id: vault
        uses: hashicorp/vault-action@v4
        with:
          url: https://vault.svc.plus
          method: jwt
          role: ${{ format('github-actions-platform-ops-toolkit-{0}', inputs.deploy_env || 'uat') }}
          jwtGithubAudience: vault
          secrets: |
            kv/data/CICD/github-app/daily-snapshot app_private_key | APP_PRIVATE_KEY

      - name: Create GitHub App installation token for infra
        id: app-token-infra
        uses: actions/create-github-app-token@v3
        with:
          client-id: Iv23liNwStpQIiXajhpb
          private-key: ${{ steps.vault.outputs.APP_PRIVATE_KEY }}
          owner: ai-workspace-infra

      - name: Create GitHub App installation token for lab
        id: app-token-lab
        uses: actions/create-github-app-token@v3
        with:
          client-id: Iv23liNwStpQIiXajhpb
          private-key: ${{ steps.vault.outputs.APP_PRIVATE_KEY }}
          owner: ai-workspace-lab

      - name: Create GitHub App installation token for services
        id: app-token-services
        uses: actions/create-github-app-token@v3
        with:
          client-id: Iv23liNwStpQIiXajhpb
          private-key: ${{ steps.vault.outputs.APP_PRIVATE_KEY }}
          owner: ai-workspace-services
          # Keep the release-authoring token limited to the canonical build
          # inventory. Explicit permissions also make a missing installation
          # grant fail at token creation instead of halfway through tagging.
          repositories: |
            accounts
            billing-service
            content-service
            portal
            edge-gateway
            frontend-router
            postgresql
          permission-contents: write
          permission-actions: write
          permission-workflows: write

      - name: Create GitHub App installation token for xstream
        id: app-token-xstream
        uses: actions/create-github-app-token@v3
        with:
          client-id: Iv23liNwStpQIiXajhpb
          private-key: ${{ steps.vault.outputs.APP_PRIVATE_KEY }}
          owner: ai-workspace-xstream

      - name: Resolve snapshot tag across all organizations
        id: resolve
        run: ./.github/scripts/snapshots/resolve-snapshot-tag.sh
        env:
          DEPLOY_ENV: ${{ inputs.deploy_env || 'uat' }}
          SNAPSHOT_TAG: ${{ inputs.snapshot_tag }}
          SNAPSHOT_SOURCE_REF: ${{ inputs.snapshot_source_ref }}
          SNAPSHOT_REF: ${{ inputs.snapshot_source_ref || 'main' }}
          SNAPSHOT_REPOS: ${{ inputs.repositories }}
          SNAPSHOT_TOKEN_AI_WORKSPACE_INFRA: ${{ steps.app-token-infra.outputs.token }}
          SNAPSHOT_TOKEN_AI_WORKSPACE_LAB: ${{ steps.app-token-lab.outputs.token }}
          SNAPSHOT_TOKEN_AI_WORKSPACE_SERVICES: ${{ steps.app-token-services.outputs.token }}
          SNAPSHOT_TOKEN_AI_WORKSPACE_XSTREAM: ${{ steps.app-token-xstream.outputs.token }}

  snapshot:
    name: Tag and build main snapshot
    needs: resolve-snapshot-tag
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        organization:
          - ai-workspace-infra
          - ai-workspace-lab
          - ai-workspace-services
          - ai-workspace-xstream
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Load GitHub App private key from Vault
        id: vault
        uses: hashicorp/vault-action@v4
        with:
          url: https://vault.svc.plus
          method: jwt
          role: ${{ format('github-actions-platform-ops-toolkit-{0}', inputs.deploy_env || 'uat') }}
          jwtGithubAudience: vault
          secrets: |
            kv/data/CICD/github-app/daily-snapshot app_private_key | APP_PRIVATE_KEY

      - name: Create GitHub App installation token
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: Iv23liNwStpQIiXajhpb
          private-key: ${{ steps.vault.outputs.APP_PRIVATE_KEY }}
          owner: ${{ matrix.organization }}
          repositories: ${{ matrix.organization == 'ai-workspace-services' && 'accounts,billing-service,content-service,portal,edge-gateway,frontend-router,postgresql' || '' }}
          permission-contents: write
          permission-actions: write
          permission-workflows: write

      - name: Create cross-repository main snapshot
        # The matrix owns one GitHub App token per organization. When an
        # explicit repository list is supplied, only the matrix entry that
        # owns at least one selected repository should invoke the snapshot
        # script; passing the full cross-organization list to every matrix
        # entry makes the script reject repositories owned by another org.
        if: ${{ inputs.repositories == '' || contains(inputs.repositories, matrix.organization) }}
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          DEPLOY_ENV: ${{ inputs.deploy_env || 'uat' }}
          SNAPSHOT_TAG: ${{ needs.resolve-snapshot-tag.outputs.snapshot_tag }}
          SNAPSHOT_ORGS: ${{ matrix.organization }}
          SNAPSHOT_REPOS: ${{ inputs.repositories }}
          SNAPSHOT_FILTER_BY_ORG: ${{ inputs.repositories != '' && 'true' || 'false' }}
          SNAPSHOT_REF: ${{ inputs.snapshot_source_ref || 'main' }}
          # Fail before the first tag if this installation cannot access one
          # of the selected repositories. This prevents partial snapshots.
          SNAPSHOT_VERIFY_INSTALLATION_ACCESS: true
          SNAPSHOT_STATUS_FILE: ${{ runner.temp }}/daily-snapshot-status/${{ matrix.organization }}.jsonl
        run: ${{ github.workspace }}/.github/scripts/snapshots/tag-daily-main-snapshot.sh

      - name: Trigger XConnect multi-platform release
        if: ${{ success() && matrix.organization == 'ai-workspace-xstream' }}
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          # The installation token dispatches the child workflow. Artifact
          # download uses the current-run token because GitHub's artifact API
          # may reject an installation token even when dispatch succeeds.
          ARTIFACT_GH_TOKEN: ${{ github.token }}
          # xconnect-app is the release orchestrator and is not part of the
          # component snapshot tag set. Check out the requested source ref
          # there, while keeping the immutable component snapshot as the
          # published release tag.
          RELEASE_REF: ${{ inputs.snapshot_source_ref || 'main' }}
          RELEASE_TAG: ${{ needs.resolve-snapshot-tag.outputs.snapshot_tag }}
          DEPLOY_ENV: ${{ inputs.deploy_env || 'uat' }}
        run: |
          gh api --method POST \
            -H "Accept: application/vnd.github+json" \
            "/repos/ai-workspace-xstream/xconnect-app/dispatches" \
            -f event_type=xconnect-release \
            -f "client_payload[release_ref]=${RELEASE_REF}" \
            -f "client_payload[release_tag]=${RELEASE_TAG}" \
            -f "client_payload[deploy_env]=${DEPLOY_ENV}"

      - name: Upload snapshot status
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: daily-snapshot-status-${{ matrix.organization }}
          path: ${{ runner.temp }}/daily-snapshot-status/${{ matrix.organization }}.jsonl
          if-no-files-found: warn

  resolve-built-snapshot-tag:
    name: Resolve completed snapshot tag
    needs: [resolve-snapshot-tag, snapshot]
    if: >-
      ${{
      always() &&
      needs.resolve-snapshot-tag.result == 'success' &&
      needs.snapshot.result == 'success' &&
      (inputs.repositories || '') == ''
      }}
    runs-on: ubuntu-latest
    outputs:
      snapshot_tag: ${{ steps.resolve.outputs.snapshot_tag }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Download all organization snapshot status artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: daily-snapshot-status-*
          path: ${{ runner.temp }}/daily-snapshot-status
          merge-multiple: true

      - name: Resolve immutable completed snapshot tag
        id: resolve
        run: ./.github/scripts/snapshots/resolve-daily-snapshot-tag.sh
        env:
          SNAPSHOT_STATUS_DIRECTORY: ${{ runner.temp }}/daily-snapshot-status
          SNAPSHOT_CANONICAL_ORGANIZATION: ai-workspace-services
          DEPLOY_ENV: ${{ inputs.deploy_env || 'uat' }}

  shared-readiness:
    name: Check shared platform readiness
    needs: resolve-built-snapshot-tag
    if: ${{ always() && needs.resolve-built-snapshot-tag.result == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Check Shared platform readiness (read-only)
        run: ./.github/scripts/snapshots/check-shared-readiness.sh
        env:
          SHARED_VAULT_ENDPOINT: ${{ inputs.shared_vault_endpoint || 'https://vault.svc.plus' }}
          SHARED_OBSERVABILITY_ENDPOINT: ${{ inputs.shared_observability_endpoint || 'https://observability.svc.plus' }}
          SHARED_IAM_ENDPOINT: ${{ inputs.shared_iam_endpoint || 'https://iam.svc.plus' }}
          SHARED_IAM_ISSUER: ${{ inputs.shared_iam_issuer || 'https://iam.svc.plus' }}
          SHARED_READINESS_TIMEOUT_SECONDS: ${{ inputs.shared_readiness_timeout_seconds || '20' }}

  resolve-dispatch-environment:
    name: Select requested environment dispatch
    needs: [resolve-built-snapshot-tag, shared-readiness]
    if: >-
      ${{
      always() &&
      needs.resolve-built-snapshot-tag.result == 'success' &&
      needs.shared-readiness.result == 'success' &&
      (inputs.repositories || '') == ''
      }}
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.select.outputs.matrix }}
    steps:
      - name: Resolve environment dispatch mapping
        id: select
        env:
          DEPLOY_ENV: ${{ inputs.deploy_env || 'uat' }}
        run: |
          set -euo pipefail
          case "${DEPLOY_ENV}" in
            sit)
              name='Serverless Orchestrator'
              workflow='serverless-orchestrator.yml'
              operation='deploy'
              target_domains='web-saas'
              topology_mode='serverless'
              ;;
            uat)
              name='Hybrid Orchestrator'
              workflow='hybrid-orchestrator.yml'
              operation='deploy'
              target_domains='all'
              topology_mode='hybrid'
              ;;
            prod)
              name='Selfhost Orchestrator'
              workflow='selfhost-orchestrator.yml'
              operation='deploy'
              target_domains='web-saas'
              topology_mode='selfhost'
              ;;
            *)
              echo "Unsupported deploy_env: ${DEPLOY_ENV}" >&2
              exit 2
              ;;
          esac
          matrix_json="$(jq -cn \
            --arg environment "${DEPLOY_ENV}" \
            --arg name "${name}" \
            --arg workflow "${workflow}" \
            --arg operation "${operation}" \
            --arg target_domains "${target_domains}" \
            --arg topology_mode "${topology_mode}" \
            '{include:[{environment:$environment,name:$name,workflow:$workflow,operation:$operation,target_domains:$target_domains,topology_mode:$topology_mode}]}')"
          printf 'matrix=%s\n' "${matrix_json}" >> "$GITHUB_OUTPUT"

  dispatch-environment:
    name: ${{ matrix.environment }} ${{ matrix.name }}
    needs: [resolve-built-snapshot-tag, shared-readiness, resolve-dispatch-environment]
    if: >-
      ${{
      always() &&
      needs.resolve-built-snapshot-tag.result == 'success' &&
      needs.shared-readiness.result == 'success' &&
      needs.resolve-dispatch-environment.result == 'success'
      }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.resolve-dispatch-environment.outputs.matrix) }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Load GitHub App private key from Vault
        id: vault
        uses: hashicorp/vault-action@v4
        with:
          url: https://vault.svc.plus
          method: jwt
          role: ${{ format('github-actions-platform-ops-toolkit-{0}', matrix.environment) }}
          jwtGithubAudience: vault
          secrets: |
            kv/data/CICD/github-app/daily-snapshot app_private_key | APP_PRIVATE_KEY

      - name: Create GitHub App installation token
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: Iv23liNwStpQIiXajhpb
          private-key: ${{ steps.vault.outputs.APP_PRIVATE_KEY }}
          owner: ai-workspace-infra
          permission-contents: write
          permission-actions: write

      - name: Checkout selected GitOps topology
        uses: actions/checkout@v7
        with:
          repository: ai-workspace-infra/gitops
          ref: main
          path: gitops
          token: ${{ steps.app-token.outputs.token }}
          persist-credentials: false
          sparse-checkout: |
            topology/${{ matrix.environment }}/${{ matrix.topology_mode }}/runtime-topology.yaml

      - name: Resolve target domain from GitOps
        id: gitops
        env:
          GITOPS_TOPOLOGY_FILE: ${{ github.workspace }}/gitops/topology/${{ matrix.environment }}/${{ matrix.topology_mode }}/runtime-topology.yaml
          EXPECTED_ENVIRONMENT: ${{ matrix.environment }}
          EXPECTED_MODE: ${{ matrix.topology_mode }}
        run: ./.github/scripts/snapshots/resolve-dispatch-gitops-target.sh

      - name: Dispatch ${{ matrix.name }}
        id: dispatch
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          RUN_STATUS_TOKEN: ${{ github.token }}
          SNAPSHOT_TAG: ${{ needs.resolve-built-snapshot-tag.outputs.snapshot_tag }}
          DEPLOY_ENV: ${{ matrix.environment }}
          DISPATCH_WORKFLOW: ${{ matrix.workflow }}
          DISPATCH_OPERATION: ${{ matrix.operation }}
          DISPATCH_TARGET_DOMAINS: ${{ matrix.target_domains }}
          TARGET_DOMAIN_BASE: ${{ steps.gitops.outputs.target_domain_base }}
          SKIP_STRIPE_CATALOG: ${{ inputs.skip_stripe_catalog || false }}
        run: ./.github/scripts/snapshots/dispatch-environment-combined.sh

      - name: Write dispatch receipt
        if: always()
        env:
          SNAPSHOT_TAG: ${{ needs.resolve-built-snapshot-tag.outputs.snapshot_tag }}
          RUN_URL: ${{ steps.dispatch.outputs.run_url }}
        run: |
          mkdir -p "$RUNNER_TEMP/environment-dispatch"
          jq -n \
            --arg environment "${{ matrix.environment }}" \
            --arg operation "${{ matrix.operation }}" \
            --arg workflow "${{ matrix.workflow }}" \
            --arg tag "$SNAPSHOT_TAG" \
            --arg url "${RUN_URL:-}" \
            --arg result "${{ job.status }}" \
            '{schema:1,environment:$environment,operation:$operation,workflow:$workflow,snapshot_tag:$tag,run_url:$url,result:$result}' \
            > "$RUNNER_TEMP/environment-dispatch/${{ matrix.environment }}.json"

      - name: Upload dispatch receipt
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: environment-dispatch-${{ matrix.environment }}
          path: ${{ runner.temp }}/environment-dispatch/${{ matrix.environment }}.json
          if-no-files-found: error

  snapshot-summary:
    name: Summarize daily snapshot status
    needs: [resolve-snapshot-tag, snapshot, resolve-built-snapshot-tag, shared-readiness, resolve-dispatch-environment, dispatch-environment]
    if: >-
      ${{
      always() &&
      needs.resolve-snapshot-tag.result == 'success' &&
      needs.snapshot.result != 'skipped' &&
      needs.resolve-built-snapshot-tag.result != 'failure' &&
      needs.shared-readiness.result != 'failure' &&
      needs.resolve-dispatch-environment.result != 'failure' &&
      needs.dispatch-environment.result != 'failure'
      }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Download all organization snapshot status artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: daily-snapshot-status-*
          path: ${{ runner.temp }}/daily-snapshot-status
          merge-multiple: true

      - name: Publish unified snapshot matrix summary
        env:
          SNAPSHOT_STATUS_DIRECTORY: ${{ runner.temp }}/daily-snapshot-status
          DEPLOY_ENV: ${{ inputs.deploy_env || 'uat' }}
          SNAPSHOT_STATUS_OUTPUT: ${{ runner.temp }}/daily-snapshot-summary.json
        run: ${{ github.workspace }}/.github/scripts/snapshots/aggregate-daily-snapshot-status.sh

      - name: Download environment dispatch receipts
        if: ${{ needs.dispatch-environment.result != 'skipped' }}
        uses: actions/download-artifact@v8
        with:
          pattern: environment-dispatch-*
          path: ${{ runner.temp }}/environment-dispatch
          merge-multiple: true

      - name: Publish environment dispatch summary
        if: ${{ needs.dispatch-environment.result != 'skipped' }}
        env:
          DISPATCH_STATUS_DIRECTORY: ${{ runner.temp }}/environment-dispatch
          DEPLOY_ENV: ${{ inputs.deploy_env || 'uat' }}
          DISPATCH_STATUS_OUTPUT: ${{ runner.temp }}/environment-dispatch-summary.json
        run: ./.github/scripts/snapshots/aggregate-environment-dispatch-status.sh

      - name: Upload environment snapshot summary
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: daily-snapshot-summary-${{ inputs.deploy_env || 'uat' }}
          path: |
            ${{ runner.temp }}/daily-snapshot-summary.json
            ${{ runner.temp }}/environment-dispatch-summary.json
          if-no-files-found: warn

      - name: Fail when the selected environment dispatch failed
        if: >-
          ${{
            needs.snapshot.result == 'failure' ||
            needs.shared-readiness.result == 'failure' ||
            needs.resolve-dispatch-environment.result == 'failure' ||
            needs.dispatch-environment.result == 'failure'
          }}
        run: exit 1
