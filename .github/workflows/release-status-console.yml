name: Publish Release Status Console
on:
  workflow_run:
    workflows: [Daily Main Snapshot, Serverless Orchestrator]
    types: [completed]
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: release-status-console
  cancel-in-progress: false
jobs:
  publish:
    if: >-
      ${{ github.repository == 'ai-workspace-infra/platform-ops-toolkit' &&
      (github.event_name != 'workflow_run' ||
      (github.event.workflow_run.head_repository.full_name == github.repository &&
      github.event.workflow_run.head_branch == 'main')) }}
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: write
    steps:
      # Never checkout or execute the workflow_run head SHA.
      - uses: actions/checkout@v7
        with:
          ref: main
          persist-credentials: false
      - name: Collect and publish sanitized release evidence
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/release_status/collect.py --days 30 --output "$RUNNER_TEMP/releases.json" --publish
