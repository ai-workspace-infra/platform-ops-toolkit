name: Serverless Orchestrator

permissions:
  id-token: write
  contents: read
  # Read the UAT Hybrid run a PROD promotion manifest names.
  actions: read

on:
  workflow_dispatch:
    inputs:
      operation:
        description: '执行范围：plan 校验；init-schema 初始化；deploy/upgrade 部署；migrate 数据迁移；deploy+migrate 部署+迁移；repair-schema 仅修复已审阅 r3 UAT schema（不部署、不切 DNS）；destroy 销毁（Prod 禁止）'
        required: true
        default: 'deploy'
        type: choice
        options:
          - plan
          - init-schema
          - deploy
          - upgrade
          - migrate
          - deploy+migrate
          - repair-schema
          - destroy
      target_domains:
        description: '选择要执行的业务域 (Business Domain)。serverless 仅部署 web-saas；默认 all 在 serverless 中解析为 web-saas，其它业务域走 cloud_provider 环境副本链路。'
        required: false
        default: 'all'
        type: choice
        options:
          - all
          - ai-workspace
          - web-saas
          - infra-platform
          - agent-proxy
          - web-saas + agent-proxy
      cloud_provider:
        description: '混合环境关联的云服务商；serverless 运行时仍由 Cloud Run/Cloudflare 承载，资源创建由对应 IaC workflow 负责'
        required: false
        default: 'gcp-cloud'
        type: choice
        options:
          - aws-cloud
          - gcp-cloud
          - azure-cloud
          - vultr-vps
          - akamai-cloud
      vault_env_path:
        description: 'Target environment'
        required: false
        default: 'uat'
        type: choice
        options:
          - sit
          - uat
          - prod
      tag_ref:
        description: 'Unified immutable tag for Cloud Run images, portal, and edge-gateway (for example daily-build-2026.08.17-r1)'
        required: false
        type: string
      accounts_schema_ref:
        description: 'Accounts source ref containing sql/schema.sql; used only by init-schema'
        required: false
        default: 'main'
        type: string
      apply_accounts_schema_migration:
        description: 'UAT only: apply one reviewed Accounts sql/migrations change before Cloud Run deployment'
        required: false
        default: false
        type: boolean
      adopt_accounts_baseline:
        description: 'UAT only: adopt the reviewed expand-only Accounts baseline before Cloud Run deployment'
        required: false
        default: false
        type: boolean
      accounts_schema_expected_version:
        description: 'UAT current schema_migrations version before applying the change'
        required: false
        type: string
      accounts_schema_target_version:
        description: 'Target version of the one Accounts .up.sql migration'
        required: false
        type: string
      accounts_schema_sha256:
        description: 'Expected SHA-256 of the target Accounts .up.sql migration'
        required: false
        type: string
      probe_accounts_schema:
        description: 'UAT plan only: inspect schema_migrations version and lifecycle readiness without changes'
        required: false
        default: false
        type: boolean
      deploy_cloudflare:
        description: 'Deploy Cloudflare SSR Workers, edge gateway, and Pages static assets'
        required: false
        default: true
        type: boolean
      deploy_cloud_run:
        description: 'Deploy backend services to GCP Cloud Run'
        required: false
        default: true
        type: boolean
      cloud_run_service:
        description: 'Optional single Cloud Run service to deploy; empty deploys the backend service set'
        required: false
        default: ''
        type: choice
        options:
          - ''
          - accounts
          - content-service
          - billing-service
      skip_stripe_catalog:
        description: 'Skip optional Stripe catalog synchronization without blocking core deployment'
        required: false
        default: false
        type: boolean
      dns_mode:
        description: 'DNS 行为：none 不发布；uat-records 更新 SIT/UAT canonical；prod-cutover 接管生产 canonical（普通部署不会改 canonical）'
        required: false
        default: 'none'
        type: choice
        options:
          - none
          - uat-records
          - prod-cutover
      accounts_source_backend:
        description: '仅 migrate/deploy+migrate：Accounts 数据迁移源端：supabase（PROD Supabase 云直连）或 vps（传统 VPS 容器 SSH）'
        required: false
        default: 'supabase'
        type: choice
        options:
          - supabase
          - vps
      supabase_source_tunnel_host:
        description: '仅 migrate/deploy+migrate (vps 源)：PROD 源 PostgreSQL SSH 主机；在 postgresql-svc-plus 容器内执行只读导出'
        required: false
        default: 'console.svc.plus'
        type: string
      supabase_target_existing_strategy:
        description: 'Supabase UAT public 非空时的策略：reject、replace_public 或 accounts_merge'
        required: false
        # UAT is refreshed continuously and already contains the initialized
        # public schema. Preserve those rows by default; destructive replacement
        # remains opt-in and requires the explicit confirmation below.
        default: 'accounts_merge'
        type: choice
        options: [reject, replace_public, accounts_merge]
      supabase_target_confirm_replace:
        description: 'replace_public 清空 Supabase UAT public 前的显式确认'
        required: false
        default: false
        type: boolean
      runner_type:
        description: '迁移这一段跑在哪种 Runner 上（ubuntu-latest 或 self-hosted）'
        required: false
        default: 'ubuntu-latest'
        type: string
      promotion_manifest:
        description: '仅 PROD：Daily 校验过的 UAT 制品清单（JSON）。PROD Cloud Run 按 digest 晋级，不从源码重建'
        required: false
        default: ''
        type: string
jobs:
  preflight:
    name: Validate / Dispatch inputs
    environment: ${{ inputs.vault_env_path == 'prod' && 'production' || '' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout platform toolkit
        uses: actions/checkout@v7

      - name: Checkout GitOps serverless runtime topology
        uses: actions/checkout@v7
        with:
          repository: ai-workspace-infra/gitops
          ref: main
          path: gitops
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            topology/${{ inputs.vault_env_path || 'uat' }}/serverless/runtime-topology.yaml

      - name: Checkout Portal runtime configuration
        uses: actions/checkout@v7
        with:
          repository: ai-workspace-services/portal
          ref: ${{ inputs.tag_ref || 'main' }}
          path: portal-runtime-config
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            src/config/runtime-service-config.${{ inputs.vault_env_path || 'uat' }}.yaml

      - name: Render GitOps serverless runtime topology
        run: ./.github/scripts/gitops/prepare_gitops_routing_config.sh
        env:
          GITOPS_ROUTING_YAML: ${{ github.workspace }}/gitops/topology/${{ inputs.vault_env_path || 'uat' }}/serverless/runtime-topology.yaml
          GITOPS_ROUTING_OUTPUT: ${{ runner.temp }}/edge-routing.json

      - name: Validate Portal and GitOps public domains
        run: ./.github/scripts/serverless/validate_portal_runtime_domains.sh
        env:
          CLOUDFLARE_BOUNDARY_CONFIG: ${{ runner.temp }}/edge-routing.json
          PORTAL_DIR: ${{ github.workspace }}/portal-runtime-config
          PORTAL_ENV: ${{ inputs.vault_env_path || 'uat' }}

      - name: Validate serverless GitOps contract
        run: python3 scripts/serverless_uat/validate_cloudflare_boundaries.py
        env:
          CLOUDFLARE_BOUNDARY_CONFIG: ${{ runner.temp }}/edge-routing.json
          REQUIRED_RUNTIME_MODE: serverless

      - name: Validate serverless dispatch
        run: ./.github/scripts/serverless/validate_dispatch_inputs.sh
        env:
          OPERATION: ${{ inputs.operation || 'plan' }}
          TARGET_DOMAINS: ${{ inputs.target_domains || 'all' }}
          CLOUD_PROVIDER: ${{ inputs.cloud_provider || 'vultr-vps' }}
          VAULT_ENV_PATH: ${{ inputs.vault_env_path || 'uat' }}
          TAG_REF: ${{ inputs.tag_ref }}
          DEPLOY_CLOUDFLARE: ${{ inputs.deploy_cloudflare }}
          DEPLOY_CLOUD_RUN: ${{ inputs.deploy_cloud_run }}
          SERVERLESS_DNS_MODE: ${{ inputs.dns_mode || 'none' }}
          APPLY_ACCOUNTS_SCHEMA_MIGRATION: ${{ inputs.apply_accounts_schema_migration || false }}
          ADOPT_ACCOUNTS_BASELINE: ${{ inputs.adopt_accounts_baseline || false }}
          ACCOUNTS_SCHEMA_EXPECTED_VERSION: ${{ inputs.accounts_schema_expected_version }}
          ACCOUNTS_SCHEMA_TARGET_VERSION: ${{ inputs.accounts_schema_target_version }}
          ACCOUNTS_SCHEMA_SHA256: ${{ inputs.accounts_schema_sha256 }}
          PROBE_ACCOUNTS_SCHEMA: ${{ inputs.probe_accounts_schema || false }}

      # PROD Cloud Run promotes the digests a successful UAT Hybrid run
      # accepted and never rebuilds from source (plan §7, GAP-16, TC-10).
      - name: Validate the PROD promotion manifest
        run: ./.github/scripts/serverless/validate_promotion_manifest.sh
        env:
          GH_TOKEN: ${{ github.token }}
          VAULT_ENV_PATH: ${{ inputs.vault_env_path || 'uat' }}
          DEPLOYS_CLOUD_RUN: ${{ inputs.deploy_cloud_run == true && contains(fromJSON('["deploy","upgrade","deploy+migrate"]'), inputs.operation) }}
          PROMOTION_MANIFEST: ${{ inputs.promotion_manifest }}
          RELEASE_TAG: ${{ inputs.tag_ref }}

  supabase:
    name: Supabase / xworktech
    needs: preflight
    outputs:
      durable_checkpoint_verified: ${{ steps.checkpoint.outputs.durable_checkpoint_verified }}
    # Deployment paths verify the existing Supabase service before Cloud Run
    # and migration start. Schema initialization is a separate manual workflow.
    if: ${{ contains(fromJSON('["deploy","upgrade","deploy+migrate","repair-schema"]'), inputs.operation) }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout platform toolkit
        uses: actions/checkout@v7

      - name: Install Vault CLI
        run: ./.github/scripts/serverless/install_vault_cli.sh

      - name: Authenticate to Vault with GitHub OIDC
        uses: hashicorp/vault-action@v4
        with:
          url: ${{ vars.VAULT_ADDR || 'https://vault.svc.plus' }}
          method: jwt
          role: github-actions-platform-ops-toolkit-${{ inputs.vault_env_path || 'uat' }}
          jwtGithubAudience: vault
          exportToken: true

      - name: Run Supabase task
        run: ./.github/scripts/serverless/run_supabase_task.sh
        env:
          VAULT_ADDR: ${{ vars.VAULT_ADDR || 'https://vault.svc.plus' }}
          VAULT_ENV_PATH: ${{ inputs.vault_env_path || 'uat' }}
          INITIALIZE_SUPABASE: 'false'
          VERIFY_SUPABASE: 'true'

      - name: Load Supabase credentials from Vault for checkpoint
        id: vault_checkpoint
        uses: hashicorp/vault-action@v4
        with:
          url: ${{ vars.VAULT_ADDR || 'https://vault.svc.plus' }}
          method: jwt
          role: github-actions-platform-ops-toolkit-${{ inputs.vault_env_path || 'uat' }}
          jwtGithubAudience: vault
          secrets: |
            kv/data/${{ inputs.vault_env_path || 'uat' }}/serverless/supabase DATABASE_SESSION_POOLER_URL | TARGET_DSN ;

      - name: Load UAT-only durable checkpoint credentials
        id: vault_uat_checkpoint
        if: ${{ inputs.apply_accounts_schema_migration == true && inputs.vault_env_path == 'uat' }}
        uses: hashicorp/vault-action@v4
        with:
          url: ${{ vars.VAULT_ADDR || 'https://vault.svc.plus' }}
          method: jwt
          role: github-actions-platform-ops-toolkit-uat
          jwtGithubAudience: vault
          ignoreNotFound: true
          secrets: |
            kv/data/CICD/uat/iac_state TF_STATE_BUCKET | S3_BUCKET ;
            kv/data/CICD/uat/iac_state TF_STATE_ACCESS_KEY | AWS_ACCESS_KEY_ID ;
            kv/data/CICD/uat/iac_state TF_STATE_SECRET_KEY | AWS_SECRET_ACCESS_KEY ;
            kv/data/CICD/uat/iac_state TF_STATE_REGION | S3_REGION ;
            kv/data/CICD/uat/iac_state TF_STATE_ENDPOINT | S3_ENDPOINT ;
            kv/data/uat/serverless/database-backup BACKUP_ENCRYPTION_PASS | BACKUP_ENCRYPTION_PASS

      - name: Create release checkpoint before deployment
        id: checkpoint
        run: ./.github/scripts/database/create_release_checkpoint.sh
        env:
          RELEASE_TAG: ${{ inputs.tag_ref || github.sha }}
          DATABASE_BACKEND: supabase
          DATABASE_ENV: ${{ inputs.vault_env_path || 'uat' }}
          TARGET_DSN: ${{ steps.vault_checkpoint.outputs.TARGET_DSN }}
          GIT_SHA: ${{ github.sha }}
          REQUIRE_DURABLE_CHECKPOINT: ${{ inputs.apply_accounts_schema_migration || false }}
          S3_BUCKET: ${{ steps.vault_uat_checkpoint.outputs.S3_BUCKET }}
          AWS_ACCESS_KEY_ID: ${{ steps.vault_uat_checkpoint.outputs.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ steps.vault_uat_checkpoint.outputs.AWS_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: ${{ steps.vault_uat_checkpoint.outputs.S3_REGION }}
          S3_REGION: ${{ steps.vault_uat_checkpoint.outputs.S3_REGION }}
          S3_ENDPOINT: ${{ steps.vault_uat_checkpoint.outputs.S3_ENDPOINT }}
          S3_PREFIX: database-checkpoints
          BACKUP_ENCRYPTION_PASS: ${{ steps.vault_uat_checkpoint.outputs.BACKUP_ENCRYPTION_PASS }}

      - name: Upload non-sensitive checkpoint manifest
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: database-checkpoint-manifest-${{ inputs.vault_env_path || 'uat' }}-${{ github.run_id }}
          path: ${{ runner.temp }}/database-checkpoints/**/manifest.json
          if-no-files-found: ignore
          retention-days: 7

  init_schema:
    name: Supabase / xworktech schema initialization
    needs: preflight
    if: ${{ inputs.operation == 'init-schema' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout platform toolkit
        uses: actions/checkout@v7

      - name: Checkout Accounts schema
        uses: actions/checkout@v7
        with:
          repository: ai-workspace-services/accounts
          ref: ${{ inputs.accounts_schema_ref || 'main' }}
          path: accounts
          sparse-checkout: |
            sql/schema.sql

      - name: Install Vault CLI
        run: ./.github/scripts/serverless/install_vault_cli.sh

      - name: Authenticate to Vault with GitHub OIDC
        uses: hashicorp/vault-action@v4
        with:
          url: ${{ vars.VAULT_ADDR || 'https://vault.svc.plus' }}
          method: jwt
          role: github-actions-platform-ops-toolkit-${{ inputs.vault_env_path || 'uat' }}
          jwtGithubAudience: vault
          exportToken: true

      - name: Initialize and verify Supabase account schema
        run: ./.github/scripts/serverless/run_supabase_task.sh
        env:
          VAULT_ADDR: ${{ vars.VAULT_ADDR || 'https://vault.svc.plus' }}
          VAULT_ENV_PATH: ${{ inputs.vault_env_path || 'uat' }}
          INITIALIZE_SUPABASE: 'true'
          VERIFY_SUPABASE: 'true'
          ACCOUNT_SCHEMA_FILE: ${{ github.workspace }}/accounts/sql/schema.sql

  uat_accounts_schema_probe:
    name: Supabase / Accounts schema read-only probe
    needs: preflight
    if: ${{ inputs.probe_accounts_schema == true && inputs.operation == 'plan' && inputs.vault_env_path == 'uat' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout platform toolkit
        uses: actions/checkout@v7

      - name: Load UAT Supabase database identity and connection
        id: vault
        uses: hashicorp/vault-action@v4
        with:
          url: ${{ vars.VAULT_ADDR || 'https://vault.svc.plus' }}
          method: jwt
          role: github-actions-platform-ops-toolkit-uat
          jwtGithubAudience: vault
          secrets: |
            kv/data/uat/serverless/supabase DATABASE_SESSION_POOLER_URL | TARGET_DSN ;
            kv/data/uat/serverless/supabase PROJECT_REF | PROJECT_REF ;

      - name: Inspect UAT Accounts schema without writes
        run: ./.github/scripts/serverless/probe_accounts_schema.sh
        env:
          VAULT_ENV_PATH: uat
          TARGET_DSN: ${{ steps.vault.outputs.TARGET_DSN }}
          PROJECT_REF: ${{ steps.vault.outputs.PROJECT_REF }}

  uat_accounts_baseline:
    name: Supabase / Accounts expand-only baseline
    needs: [preflight, supabase]
    if: ${{ always() && needs.preflight.result == 'success' && needs.supabase.result == 'success' && inputs.adopt_accounts_baseline == true && inputs.vault_env_path == 'uat' && inputs.operation == 'deploy' }}
    runs-on: ubuntu-latest
    concurrency:
      group: uat-accounts-schema
      cancel-in-progress: false
    steps:
      - name: Checkout platform toolkit
        uses: actions/checkout@v7

      - name: Load UAT Supabase database identity and connection
        id: vault
        uses: hashicorp/vault-action@v4
        with:
          url: ${{ vars.VAULT_ADDR || 'https://vault.svc.plus' }}
          method: jwt
          role: github-actions-platform-ops-toolkit-uat
          jwtGithubAudience: vault
          secrets: |
            kv/data/uat/serverless/supabase DATABASE_SESSION_POOLER_URL | TARGET_DSN ;
            kv/data/uat/serverless/supabase PROJECT_REF | PROJECT_REF ;

      - name: Adopt reviewed UAT Accounts baseline
        run: ./.github/scripts/serverless/adopt_accounts_uat_baseline.sh
        env:
          VAULT_ENV_PATH: uat
          TARGET_DSN: ${{ steps.vault.outputs.TARGET_DSN }}
          PROJECT_REF: ${{ steps.vault.outputs.PROJECT_REF }}

  uat_accounts_schema_migration:
    name: Supabase / Accounts additive schema migration
    concurrency:
      group: uat-accounts-schema
      cancel-in-progress: false
    needs: [preflight, supabase]
    if: ${{ always() && needs.preflight.result == 'success' && needs.supabase.result == 'success' && inputs.apply_accounts_schema_migration == true && inputs.vault_env_path == 'uat' && contains(fromJSON('["deploy","repair-schema"]'), inputs.operation) }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout platform toolkit
        uses: actions/checkout@v7

      - name: Checkout immutable Accounts migration source
        uses: actions/checkout@v7
        with:
          repository: ai-workspace-services/accounts
          ref: ${{ inputs.tag_ref }}
          path: accounts

      - name: Set up Go for migratectl
        uses: actions/setup-go@v6
        with:
          go-version-file: accounts/go.mod

      - name: Verify immutable repair source
        if: ${{ inputs.operation == 'repair-schema' }}
        run: test "$(git -C accounts rev-parse HEAD)" = c2c343fe2c91bb31e7f7f9b4fa60512a66e2b4c9

      - name: Checkout GitOps repair target
        if: ${{ inputs.operation == 'repair-schema' }}
        uses: actions/checkout@v7
        with:
          repository: ai-workspace-infra/gitops
          ref: main
          path: gitops
          sparse-checkout-cone-mode: false
          sparse-checkout: resources/xworktech.com/uat/gcp/open-platform-uat.yaml

      - name: Read GitOps repair target
        id: repair_target
        if: ${{ inputs.operation == 'repair-schema' }}
        run: ruby ./.github/scripts/gitops/read_gcp_gitops_target.rb
        env:
          GCP_GITOPS_MANIFEST: ${{ github.workspace }}/gitops/resources/xworktech.com/uat/gcp/open-platform-uat.yaml

      - name: Load UAT serving identity credentials
        id: repair_gcp
        if: ${{ inputs.operation == 'repair-schema' }}
        uses: hashicorp/vault-action@v4
        with:
          url: ${{ vars.VAULT_ADDR || 'https://vault.svc.plus' }}
          method: jwt
          role: github-actions-platform-ops-toolkit-uat
          jwtGithubAudience: vault
          secrets: |
            kv/data/uat/serverless/gcp GCP_WORKLOAD_IDENTITY_PROVIDER | GCP_WORKLOAD_IDENTITY_PROVIDER ;
            kv/data/uat/serverless/gcp GCP_SERVICE_ACCOUNT_EMAIL | GCP_SERVICE_ACCOUNT_EMAIL ;

      - name: Authenticate for read-only Cloud Run verification
        if: ${{ inputs.operation == 'repair-schema' }}
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ steps.repair_gcp.outputs.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ steps.repair_gcp.outputs.GCP_SERVICE_ACCOUNT_EMAIL }}

      - name: Set up SDK for read-only serving verification
        if: ${{ inputs.operation == 'repair-schema' }}
        uses: google-github-actions/setup-gcloud@v2

      - name: Load UAT Supabase database identity and connection
        id: vault
        uses: hashicorp/vault-action@v4
        with:
          url: ${{ vars.VAULT_ADDR || 'https://vault.svc.plus' }}
          method: jwt
          role: github-actions-platform-ops-toolkit-uat
          jwtGithubAudience: vault
          secrets: |
            kv/data/uat/serverless/supabase DATABASE_SESSION_POOLER_URL | TARGET_DSN ;
            kv/data/uat/serverless/supabase PROJECT_REF | PROJECT_REF ;

      - name: Verify serving identity and capture private repair baseline
        if: ${{ inputs.operation == 'repair-schema' }}
        run: python3 .github/scripts/serverless/uat_schema_repair_evidence.py before --state "$RUNNER_TEMP/uat-repair-private.json" --report "$RUNNER_TEMP/uat-schema-repair-report.json"
        env:
          VAULT_ENV_PATH: uat
          TARGET_DSN: ${{ steps.vault.outputs.TARGET_DSN }}
          PROJECT_REF: ${{ steps.vault.outputs.PROJECT_REF }}
          GCP_PROJECT_ID: ${{ steps.repair_target.outputs.project_id }}
          GCP_REGION: ${{ steps.repair_target.outputs.region }}

      - name: Apply reviewed UAT Accounts schema migration
        id: migration_apply
        run: ./.github/scripts/serverless/apply_accounts_incremental_schema.sh
        env:
          VAULT_ENV_PATH: uat
          SNAPSHOT_TAG: ${{ inputs.tag_ref }}
          ACCOUNTS_DIR: ${{ github.workspace }}/accounts
          TARGET_DSN: ${{ steps.vault.outputs.TARGET_DSN }}
          PROJECT_REF: ${{ steps.vault.outputs.PROJECT_REF }}
          ACCOUNTS_SCHEMA_EXPECTED_VERSION: ${{ inputs.accounts_schema_expected_version }}
          ACCOUNTS_SCHEMA_TARGET_VERSION: ${{ inputs.accounts_schema_target_version }}
          ACCOUNTS_SCHEMA_SHA256: ${{ inputs.accounts_schema_sha256 }}
          RELEASE_CHECKPOINT_VERIFIED: ${{ needs.supabase.outputs.durable_checkpoint_verified || 'false' }}

      - name: Verify retained data and serving health after repair
        if: ${{ inputs.operation == 'repair-schema' }}
        run: python3 .github/scripts/serverless/uat_schema_repair_evidence.py after --state "$RUNNER_TEMP/uat-repair-private.json" --report "$RUNNER_TEMP/uat-schema-repair-report.json"
        env:
          VAULT_ENV_PATH: uat
          TARGET_DSN: ${{ steps.vault.outputs.TARGET_DSN }}
          PROJECT_REF: ${{ steps.vault.outputs.PROJECT_REF }}
          GCP_PROJECT_ID: ${{ steps.repair_target.outputs.project_id }}
          GCP_REGION: ${{ steps.repair_target.outputs.region }}
          OFFICIAL_MIGRATOR_REPEAT_VERIFIED: ${{ steps.migration_apply.outputs.official_migrator_repeat_verified }}

      - name: Upload aggregate schema repair evidence only
        if: ${{ inputs.operation == 'repair-schema' && success() }}
        uses: actions/upload-artifact@v4
        with:
          name: uat-schema-repair-${{ github.run_id }}
          path: ${{ runner.temp }}/uat-schema-repair-report.json
          if-no-files-found: error
          retention-days: 7

  cloud_run:
    name: Cloud Run / ${{ matrix.service }}
    needs: [preflight, uat_accounts_baseline, uat_accounts_schema_migration]
    if: ${{ always() && needs.preflight.result == 'success' && (!inputs.adopt_accounts_baseline || needs.uat_accounts_baseline.result == 'success') && (!inputs.apply_accounts_schema_migration || needs.uat_accounts_schema_migration.result == 'success') && contains(fromJSON('["deploy","upgrade","deploy+migrate"]'), inputs.operation) && inputs.deploy_cloud_run == true }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      # Accounts owns two PostgreSQL pools (business + admin settings) and
      # shares Supabase's session pooler quota with billing-service. Parallel
      # rolling revisions can exceed the shared pool_size before either
      # replacement revision becomes ready.
      max-parallel: 1
      matrix:
        service: ${{ fromJSON(inputs.cloud_run_service != '' && format('["{0}"]', inputs.cloud_run_service) || '["accounts","content-service","billing-service"]') }}
    steps:
      - name: Checkout platform toolkit
        uses: actions/checkout@v7

      - name: Checkout GitOps runtime topology
        uses: actions/checkout@v7
        with:
          repository: ai-workspace-infra/gitops
          # GitOps runtime topology is the environment configuration source of truth;
          # keep it on main while deployable artifacts share tag_ref.
          ref: main
          path: gitops
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            topology/${{ inputs.vault_env_path || 'uat' }}/serverless/runtime-topology.yaml
            services/accounts/${{ inputs.vault_env_path || 'uat' }}/oauth/github.json
            resources/xworktech.com/${{ inputs.vault_env_path || 'uat' }}/gcp/open-platform-${{ inputs.vault_env_path || 'uat' }}.yaml

      - name: Read GitOps GCP target
        id: gitops_gcp
        run: ruby ./.github/scripts/gitops/read_gcp_gitops_target.rb
        env:
          GCP_GITOPS_MANIFEST: ${{ github.workspace }}/gitops/resources/xworktech.com/${{ inputs.vault_env_path || 'uat' }}/gcp/open-platform-${{ inputs.vault_env_path || 'uat' }}.yaml

      # accounts rejects any browser Origin that is not on its CORS allowlist,
      # so the deploy has to pass this environment's console host through.
      - name: Render GitOps runtime topology YAML
        run: ./.github/scripts/gitops/prepare_gitops_routing_config.sh
        env:
          GITOPS_ROUTING_YAML: ${{ github.workspace }}/gitops/topology/${{ inputs.vault_env_path || 'uat' }}/serverless/runtime-topology.yaml
          GITOPS_ROUTING_OUTPUT: ${{ runner.temp }}/edge-routing.json

      - name: Authenticate to Vault with GitHub OIDC
        id: vault
        uses: hashicorp/vault-action@v4
        with:
          url: ${{ vars.VAULT_ADDR || 'https://vault.svc.plus' }}
          method: jwt
          role: github-actions-platform-ops-toolkit-${{ inputs.vault_env_path || 'uat' }}
          jwtGithubAudience: vault
          exportToken: true
          secrets: |
            kv/data/${{ inputs.vault_env_path || 'uat' }}/serverless/gcp GCP_WORKLOAD_IDENTITY_PROVIDER | GCP_WORKLOAD_IDENTITY_PROVIDER ;
            kv/data/${{ inputs.vault_env_path || 'uat' }}/serverless/gcp GCP_SERVICE_ACCOUNT_EMAIL | GCP_SERVICE_ACCOUNT_EMAIL ;
            kv/data/CICD/github-app/daily-snapshot app_private_key | APP_PRIVATE_KEY

      # The legacy service-repository pipelines publish to the retired
      # xworktech/asia-northeast1 registry. Build the same immutable source tag
      # here and push it with the target project's WIF identity, so a new
      # open-platform project is self-contained and does not depend on the old
      # account or registry.
      - name: Create service-source GitHub App token
        id: source_token
        uses: actions/create-github-app-token@v3
        with:
          client-id: Iv23liNwStpQIiXajhpb
          private-key: ${{ steps.vault.outputs.APP_PRIVATE_KEY }}
          owner: ai-workspace-services
          repositories: ${{ matrix.service }}
          permission-contents: read

      - name: Checkout immutable service source
        uses: actions/checkout@v7
        with:
          repository: ai-workspace-services/${{ matrix.service }}
          ref: ${{ inputs.tag_ref }}
          token: ${{ steps.source_token.outputs.token }}
          path: service-source

      - name: Verify Vault GCP target matches GitOps project declaration
        run: ruby ./.github/scripts/gitops/validate_gcp_gitops_contract.rb
        env:
          GCP_GITOPS_MANIFEST: ${{ github.workspace }}/gitops/resources/xworktech.com/${{ inputs.vault_env_path || 'uat' }}/gcp/open-platform-${{ inputs.vault_env_path || 'uat' }}.yaml
          GCP_ENVIRONMENT: ${{ inputs.vault_env_path || 'uat' }}
          GCP_PROJECT_ID: ${{ steps.gitops_gcp.outputs.project_id }}
          GCP_REGION: ${{ steps.gitops_gcp.outputs.region }}

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ steps.vault.outputs.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ steps.vault.outputs.GCP_SERVICE_ACCOUNT_EMAIL }}

      - name: Set up Google Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Verify target Artifact Registry repository
        run: |
          gcloud artifacts repositories describe serverless \
            --location="${{ steps.gitops_gcp.outputs.region }}" \
            --project="${{ steps.gitops_gcp.outputs.project_id }}" \
            --format='value(name)'

      - name: Authenticate Docker to target Artifact Registry
        run: gcloud auth configure-docker "${{ steps.gitops_gcp.outputs.region }}-docker.pkg.dev" --quiet

      # UAT builds the image from the immutable source tag. PROD never does:
      # it copies the digest UAT accepted (next step).
      - name: Build and publish target Cloud Run image
        id: build
        if: ${{ inputs.vault_env_path != 'prod' }}
        uses: docker/build-push-action@v6
        with:
          context: service-source
          file: service-source/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.gitops_gcp.outputs.region }}-docker.pkg.dev/${{ steps.gitops_gcp.outputs.project_id }}/serverless/${{ matrix.service }}:${{ inputs.tag_ref }}

      - name: Promote the UAT-accepted image by digest
        id: promoted
        if: ${{ inputs.vault_env_path == 'prod' }}
        run: ./.github/scripts/serverless/promote_image_by_digest.sh
        env:
          PROMOTION_MANIFEST: ${{ inputs.promotion_manifest }}
          SERVICE: ${{ matrix.service }}
          TARGET_IMAGE: ${{ steps.gitops_gcp.outputs.region }}-docker.pkg.dev/${{ steps.gitops_gcp.outputs.project_id }}/serverless/${{ matrix.service }}
          IMAGE_TAG: ${{ inputs.tag_ref }}

      - name: Wait for service image in Artifact Registry
        run: ./.github/scripts/serverless/wait_for_artifact_image.sh
        env:
          GCP_PROJECT_ID: ${{ steps.gitops_gcp.outputs.project_id }}
          GCP_ARTIFACT_REGISTRY_REGION: ${{ steps.gitops_gcp.outputs.region }}
          CLOUD_RUN_SERVICE: ${{ matrix.service }}
          IMAGE_TAG: ${{ inputs.tag_ref }}

      # accounts is the only service that sends mail today. Its Cloud Run
      # revision reads SMTP credentials as secretKeyRef, so Secret Manager has
      # to carry what Vault holds before the new revision starts.
      - name: Sync SMTP credentials from Vault to Secret Manager
        if: ${{ matrix.service == 'accounts' }}
        run: ./.github/scripts/serverless/sync_smtp_secrets.sh
        env:
          VAULT_ADDR: ${{ vars.VAULT_ADDR || 'https://vault.svc.plus' }}
          VAULT_ENV_PATH: ${{ inputs.vault_env_path || 'uat' }}
          GCP_PROJECT_ID: ${{ steps.gitops_gcp.outputs.project_id }}

      - name: Deploy Cloud Run service
        run: ./.github/scripts/platform-ops/deploy/uat_orchestrator_runner.sh
        env:
          VAULT_ADDR: ${{ vars.VAULT_ADDR || 'https://vault.svc.plus' }}
          VAULT_ENV_PATH: ${{ inputs.vault_env_path || 'uat' }}
          DEPLOY_ENV: ${{ inputs.vault_env_path || 'uat' }}
          GCP_PROJECT_ID: ${{ steps.gitops_gcp.outputs.project_id }}
          GCP_REGION: ${{ steps.gitops_gcp.outputs.region }}
          GCP_ARTIFACT_REGISTRY_REGION: ${{ steps.gitops_gcp.outputs.region }}
          IMAGE_TAG: ${{ inputs.tag_ref }}
          DEPLOY_CLOUDFLARE: 'false'
          DEPLOY_CLOUD_RUN: 'true'
          VERIFY_SUPABASE: 'false'
          CLOUD_RUN_SERVICE: ${{ matrix.service }}
          CLOUDFLARE_BOUNDARY_CONFIG: ${{ runner.temp }}/edge-routing.json
          GITOPS_OAUTH_GITHUB_CONFIG: ${{ github.workspace }}/gitops/services/accounts/${{ inputs.vault_env_path || 'uat' }}/oauth/github.json

      # A tag is not evidence: the serving revision must run the digest UAT
      # built, or in PROD the digest UAT accepted.
      - name: Verify the serving revision runs the expected digest
        run: ./.github/scripts/serverless/verify_cloud_run_image_digest.sh
        env:
          GCP_PROJECT_ID: ${{ steps.gitops_gcp.outputs.project_id }}
          GCP_REGION: ${{ steps.gitops_gcp.outputs.region }}
          CLOUD_RUN_SERVICE_NAME: ${{ inputs.vault_env_path || 'uat' }}-${{ matrix.service }}
          IMAGE: ${{ steps.gitops_gcp.outputs.region }}-docker.pkg.dev/${{ steps.gitops_gcp.outputs.project_id }}/serverless/${{ matrix.service }}
          EXPECTED_DIGEST: ${{ inputs.vault_env_path == 'prod' && steps.promoted.outputs.digest || steps.build.outputs.digest }}

      - name: Record the UAT image digest
        if: ${{ inputs.vault_env_path != 'prod' }}
        run: ./.github/scripts/serverless/record_image_digest.sh
        env:
          SERVICE: ${{ matrix.service }}
          IMAGE: ${{ steps.gitops_gcp.outputs.region }}-docker.pkg.dev/${{ steps.gitops_gcp.outputs.project_id }}/serverless/${{ matrix.service }}
          IMAGE_TAG: ${{ inputs.tag_ref }}
          IMAGE_DIGEST: ${{ steps.build.outputs.digest }}
          SOURCE_DIR: service-source
          OUTPUT_DIR: ${{ runner.temp }}/image-manifest

      - name: Upload the UAT image digest record
        if: ${{ inputs.vault_env_path != 'prod' }}
        uses: actions/upload-artifact@v7
        with:
          name: serverless-image-${{ matrix.service }}
          path: ${{ runner.temp }}/image-manifest/${{ matrix.service }}.json
          if-no-files-found: error

  # The UAT artifact manifest: the exact images this run built and verified,
  # which is all a PROD promotion may deploy.
  artifact_manifest:
    name: Artifacts / UAT image manifest
    needs: [cloud_run]
    if: ${{ always() && needs.cloud_run.result == 'success' && inputs.vault_env_path != 'prod' && inputs.cloud_run_service == '' }}
    runs-on: ubuntu-latest
    steps:
      - name: Download the per-service digest records
        uses: actions/download-artifact@v8
        with:
          pattern: serverless-image-*
          merge-multiple: true
          path: ${{ runner.temp }}/image-manifest

      - name: Assemble the UAT artifact manifest
        env:
          SNAPSHOT_TAG: ${{ inputs.tag_ref }}
          RECORD_DIR: ${{ runner.temp }}/image-manifest
          OUTPUT: ${{ runner.temp }}/serverless-artifact-manifest.json
        run: |
          set -euo pipefail
          jq -s --arg tag "${SNAPSHOT_TAG}" \
            '{schema: 1, environment: "uat", snapshot_tag: $tag, images: (sort_by(.service))}' \
            "${RECORD_DIR}"/*.json > "${OUTPUT}"
          jq -e '[.images[].service] | sort == ["accounts", "billing-service", "content-service"]' "${OUTPUT}" >/dev/null || {
            echo "::error::The UAT artifact manifest must cover accounts, billing-service and content-service." >&2
            exit 1
          }
          jq . "${OUTPUT}"

      - name: Upload the UAT artifact manifest
        uses: actions/upload-artifact@v7
        with:
          name: serverless-artifact-manifest
          path: ${{ runner.temp }}/serverless-artifact-manifest.json
          if-no-files-found: error

  backend_gate:
    name: Gate / backend rollout
    # `gcloud run deploy` only exits 0 once the revision is serving, so the
    # matrix result already carries backend readiness. What was missing is that
    # nothing consumed it: the Cloudflare jobs depended on preflight alone, so a
    # failed backend still shipped a frontend pointing at it, and `fail-fast:
    # false` could leave one service on the new tag while another stayed on the
    # previous one. This gate turns both into an explicit stop before any
    # frontend job runs.
    needs: [preflight, cloud_run]
    if: >-
      ${{ always() && needs.preflight.result == 'success' &&
      needs.cloud_run.result != 'cancelled' &&
      contains(fromJSON('["deploy","upgrade","deploy+migrate"]'), inputs.operation) &&
      inputs.deploy_cloud_run == true }}
    runs-on: ubuntu-latest
    steps:
      - name: Require a complete Cloud Run rollout
        env:
          CLOUD_RUN_RESULT: ${{ needs.cloud_run.result }}
        run: |
          if [[ "${CLOUD_RUN_RESULT}" != "success" ]]; then
            echo "::error::Cloud Run rollout is '${CLOUD_RUN_RESULT}'; refusing to publish a frontend against a partial or failed backend."
            echo "A partial rollout leaves some services on the new tag and others on the previous one, a state nothing downstream describes." >&2
            exit 1
          fi
          echo "Cloud Run rollout complete; frontend deployment may proceed."

  cloudflare_ssr:
    name: Cloudflare / SSR / ${{ matrix.boundary }}
    needs: [preflight, backend_gate]
    if: >-
      ${{ always() && needs.preflight.result == 'success' &&
      contains(fromJSON('["deploy","upgrade","deploy+migrate"]'), inputs.operation) &&
      inputs.deploy_cloudflare == true &&
      (needs.backend_gate.result == 'success' || needs.backend_gate.result == 'skipped') }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        boundary:
          - public
          - content
          - auth
          - console
          - workspace
    steps:
      - name: Checkout platform toolkit
        uses: actions/checkout@v7

      - name: Checkout GitOps runtime topology
        uses: actions/checkout@v7
        with:
          repository: ai-workspace-infra/gitops
          # GitOps runtime topology is the environment configuration source of truth;
          # keep it on main while deployable artifacts share tag_ref.
          ref: main
          path: gitops
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            topology/${{ inputs.vault_env_path || 'uat' }}/serverless/runtime-topology.yaml

      - name: Render GitOps runtime topology YAML
        run: ./.github/scripts/gitops/prepare_gitops_routing_config.sh
        env:
          GITOPS_ROUTING_YAML: ${{ github.workspace }}/gitops/topology/${{ inputs.vault_env_path || 'uat' }}/serverless/runtime-topology.yaml
          GITOPS_ROUTING_OUTPUT: ${{ runner.temp }}/edge-routing.json

      - name: Validate Cloudflare boundary contract
        run: python3 scripts/serverless_uat/validate_cloudflare_boundaries.py
        env:
          CLOUDFLARE_BOUNDARY_CONFIG: ${{ runner.temp }}/edge-routing.json
          REQUIRED_RUNTIME_MODE: serverless

      - name: Checkout portal source
        uses: actions/checkout@v7
        with:
          repository: ai-workspace-services/portal
          ref: ${{ inputs.tag_ref || 'main' }}
          path: portal

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Authenticate to Vault with GitHub OIDC
        id: vault
        uses: hashicorp/vault-action@v4
        with:
          url: ${{ vars.VAULT_ADDR || 'https://vault.svc.plus' }}
          method: jwt
          role: github-actions-platform-ops-toolkit-${{ inputs.vault_env_path || 'uat' }}
          jwtGithubAudience: vault
          exportToken: true
          secrets: |
            kv/data/${{ inputs.vault_env_path || 'uat' }}/serverless/cloudflare CLOUDFLARE_ACCOUNT_ID | CLOUDFLARE_ACCOUNT_ID ;
            kv/data/${{ inputs.vault_env_path || 'uat' }}/serverless/cloudflare CLOUDFLARE_API_TOKEN | CLOUDFLARE_API_TOKEN ;
            kv/data/WEB_SAAS INTERNAL_SERVICE_TOKEN | INTERNAL_SERVICE_TOKEN

      - name: Deploy SSR Worker boundary
        run: ./.github/scripts/serverless/run_cloudflare_target.sh
        env:
          CLOUDFLARE_TARGET: ssr
          PORTAL_SSR_BOUNDARY: ${{ matrix.boundary }}
          CLOUDFLARE_ENV: ${{ inputs.vault_env_path || 'uat' }}
          CLOUDFLARE_BOUNDARY_CONFIG: ${{ runner.temp }}/edge-routing.json
          PORTAL_DIR: ${{ github.workspace }}/portal
          EDGE_ASSETS_OUT: ${{ runner.temp }}/edge-assets
          CLOUDFLARE_ACCOUNT_ID: ${{ steps.vault.outputs.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ steps.vault.outputs.CLOUDFLARE_API_TOKEN }}

      # The boundary serves its HTML, but with a static CDN declared the client
      # chunks are fetched from <static_cdn_url>/_edge/<boundary>; hand them to
      # the static-pages job so one Pages deployment carries every boundary.
      - name: Upload boundary edge assets
        uses: actions/upload-artifact@v7
        with:
          name: edge-assets-${{ matrix.boundary }}
          path: ${{ runner.temp }}/edge-assets
          retention-days: 1
          if-no-files-found: error

  frontend_router:
    name: Cloudflare / frontend-router
    needs: [preflight, backend_gate]
    if: >-
      ${{ always() && needs.preflight.result == 'success' &&
      contains(fromJSON('["deploy","upgrade","deploy+migrate"]'), inputs.operation) &&
      inputs.deploy_cloudflare == true &&
      (needs.backend_gate.result == 'success' || needs.backend_gate.result == 'skipped') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout platform toolkit
        uses: actions/checkout@v7

      - name: Checkout GitOps runtime topology
        uses: actions/checkout@v7
        with:
          repository: ai-workspace-infra/gitops
          ref: main
          path: gitops
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            topology/${{ inputs.vault_env_path || 'uat' }}/serverless/runtime-topology.yaml

      - name: Render GitOps runtime topology YAML
        run: ./.github/scripts/gitops/prepare_gitops_routing_config.sh
        env:
          GITOPS_ROUTING_YAML: ${{ github.workspace }}/gitops/topology/${{ inputs.vault_env_path || 'uat' }}/serverless/runtime-topology.yaml
          GITOPS_ROUTING_OUTPUT: ${{ runner.temp }}/edge-routing.json

      - name: Validate Cloudflare boundary contract
        run: python3 scripts/serverless_uat/validate_cloudflare_boundaries.py
        env:
          CLOUDFLARE_BOUNDARY_CONFIG: ${{ runner.temp }}/edge-routing.json
          REQUIRED_RUNTIME_MODE: serverless

      - name: Checkout frontend-router deployment tooling at the release tag
        uses: actions/checkout@v7
        with:
          repository: ai-workspace-services/frontend-router
          ref: ${{ inputs.tag_ref || 'main' }}
          path: frontend-router

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Authenticate to Vault with GitHub OIDC
        id: vault
        uses: hashicorp/vault-action@v4
        with:
          url: ${{ vars.VAULT_ADDR || 'https://vault.svc.plus' }}
          method: jwt
          role: github-actions-platform-ops-toolkit-${{ inputs.vault_env_path || 'uat' }}
          jwtGithubAudience: vault
          exportToken: true
          secrets: |
            kv/data/${{ inputs.vault_env_path || 'uat' }}/serverless/cloudflare CLOUDFLARE_ACCOUNT_ID | CLOUDFLARE_ACCOUNT_ID ;
            kv/data/${{ inputs.vault_env_path || 'uat' }}/serverless/cloudflare CLOUDFLARE_API_TOKEN | CLOUDFLARE_API_TOKEN ;

      - name: Deploy Frontend Router Worker
        run: ./.github/scripts/serverless/run_cloudflare_target.sh
        env:
          CLOUDFLARE_TARGET: frontend-router
          CLOUDFLARE_BOUNDARY_CONFIG: ${{ runner.temp }}/edge-routing.json
          FRONTEND_ROUTER_DIR: ${{ github.workspace }}/frontend-router
          FRONTEND_ROUTER_RELEASE_TAG: ${{ inputs.tag_ref }}
          GH_TOKEN: ${{ github.token }}
          CLOUDFLARE_ACCOUNT_ID: ${{ steps.vault.outputs.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ steps.vault.outputs.CLOUDFLARE_API_TOKEN }}

  edge_gateway:
    name: Cloudflare / ${{ matrix.display_name }}
    needs: [preflight, backend_gate]
    if: >-
      ${{ always() && needs.preflight.result == 'success' &&
      contains(fromJSON('["deploy","upgrade","deploy+migrate"]'), inputs.operation) &&
      inputs.deploy_cloudflare == true &&
      (needs.backend_gate.result == 'success' || needs.backend_gate.result == 'skipped') }}
    runs-on: ubuntu-latest
    # hybrid-orchestrator writes these same three Worker names on the same
    # routes, differing only in the vars it sets, so the two orchestrators must
    # never write the same boundary concurrently. The group is per boundary: a
    # group shared by all three matrix legs would make GitHub cancel the queued
    # legs instead of serialising them.
    concurrency:
      group: edge-gateway-${{ inputs.vault_env_path || 'uat' }}-${{ matrix.boundary }}
      cancel-in-progress: false
    strategy:
      fail-fast: false
      matrix:
        include:
          - boundary: auth
            display_name: Edge Gateway Auth
          - boundary: admin
            display_name: Edge Gateway Admin
          - boundary: core
            display_name: Edge Gateway Router Core
    steps:
      - name: Checkout platform toolkit
        uses: actions/checkout@v7

      - name: Checkout GitOps runtime topology
        uses: actions/checkout@v7
        with:
          repository: ai-workspace-infra/gitops
          # GitOps runtime topology is the environment configuration source of truth;
          # keep it on main while deployable artifacts share tag_ref.
          ref: main
          path: gitops
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            topology/${{ inputs.vault_env_path || 'uat' }}/serverless/runtime-topology.yaml

      - name: Render GitOps runtime topology YAML
        run: ./.github/scripts/gitops/prepare_gitops_routing_config.sh
        env:
          GITOPS_ROUTING_YAML: ${{ github.workspace }}/gitops/topology/${{ inputs.vault_env_path || 'uat' }}/serverless/runtime-topology.yaml
          GITOPS_ROUTING_OUTPUT: ${{ runner.temp }}/edge-routing.json

      - name: Validate Cloudflare boundary contract
        run: python3 scripts/serverless_uat/validate_cloudflare_boundaries.py
        env:
          CLOUDFLARE_BOUNDARY_CONFIG: ${{ runner.temp }}/edge-routing.json
          REQUIRED_RUNTIME_MODE: serverless

      - name: Checkout edge-gateway source
        uses: actions/checkout@v7
        with:
          repository: ai-workspace-services/edge-gateway
          ref: main
          path: edge-gateway

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Authenticate to Vault with GitHub OIDC
        id: vault
        uses: hashicorp/vault-action@v4
        with:
          url: ${{ vars.VAULT_ADDR || 'https://vault.svc.plus' }}
          method: jwt
          role: github-actions-platform-ops-toolkit-${{ inputs.vault_env_path || 'uat' }}
          jwtGithubAudience: vault
          exportToken: true
          secrets: |
            kv/data/${{ inputs.vault_env_path || 'uat' }}/serverless/cloudflare CLOUDFLARE_ACCOUNT_ID | CLOUDFLARE_ACCOUNT_ID ;
            kv/data/${{ inputs.vault_env_path || 'uat' }}/serverless/cloudflare CLOUDFLARE_API_TOKEN | CLOUDFLARE_API_TOKEN ;
            kv/data/WEB_SAAS INTERNAL_SERVICE_TOKEN | INTERNAL_SERVICE_TOKEN

      - name: Deploy edge-gateway Worker boundary
        run: ./.github/scripts/serverless/run_cloudflare_target.sh
        env:
          CLOUDFLARE_TARGET: edge-gateway
          EDGE_GATEWAY_BOUNDARY: ${{ matrix.boundary }}
          CLOUDFLARE_ENV: ${{ inputs.vault_env_path || 'uat' }}
          CLOUDFLARE_BOUNDARY_CONFIG: ${{ runner.temp }}/edge-routing.json
          WORKER_DIR: ${{ github.workspace }}/edge-gateway
          CLOUDFLARE_ACCOUNT_ID: ${{ steps.vault.outputs.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ steps.vault.outputs.CLOUDFLARE_API_TOKEN }}
          INTERNAL_SERVICE_TOKEN: ${{ steps.vault.outputs.INTERNAL_SERVICE_TOKEN }}

  static_pages:
    name: Cloudflare / static-pages
    # The Pages deployment carries the client chunks of every SSR boundary
    # (assetPrefix points at static_cdn_url), so it can only be published once
    # the boundaries have been built and their assets uploaded.
    needs: [preflight, cloudflare_ssr]
    if: >-
      ${{ always() && needs.preflight.result == 'success' &&
      contains(fromJSON('["deploy","upgrade","deploy+migrate"]'), inputs.operation) &&
      inputs.deploy_cloudflare == true &&
      needs.cloudflare_ssr.result == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout platform toolkit
        uses: actions/checkout@v7

      - name: Checkout GitOps runtime topology
        uses: actions/checkout@v7
        with:
          repository: ai-workspace-infra/gitops
          # GitOps runtime topology is the environment configuration source of truth;
          # keep it on main while deployable artifacts share tag_ref.
          ref: main
          path: gitops
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            topology/${{ inputs.vault_env_path || 'uat' }}/serverless/runtime-topology.yaml

      - name: Render GitOps runtime topology YAML
        run: ./.github/scripts/gitops/prepare_gitops_routing_config.sh
        env:
          GITOPS_ROUTING_YAML: ${{ github.workspace }}/gitops/topology/${{ inputs.vault_env_path || 'uat' }}/serverless/runtime-topology.yaml
          GITOPS_ROUTING_OUTPUT: ${{ runner.temp }}/edge-routing.json

      - name: Validate Cloudflare boundary contract
        run: python3 scripts/serverless_uat/validate_cloudflare_boundaries.py
        env:
          CLOUDFLARE_BOUNDARY_CONFIG: ${{ runner.temp }}/edge-routing.json
          REQUIRED_RUNTIME_MODE: serverless

      - name: Checkout portal source
        uses: actions/checkout@v7
        with:
          repository: ai-workspace-services/portal
          ref: ${{ inputs.tag_ref || 'main' }}
          path: portal

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Authenticate to Vault with GitHub OIDC
        id: vault
        uses: hashicorp/vault-action@v4
        with:
          url: ${{ vars.VAULT_ADDR || 'https://vault.svc.plus' }}
          method: jwt
          role: github-actions-platform-ops-toolkit-${{ inputs.vault_env_path || 'uat' }}
          jwtGithubAudience: vault
          exportToken: true
          secrets: |
            kv/data/${{ inputs.vault_env_path || 'uat' }}/serverless/cloudflare CLOUDFLARE_ACCOUNT_ID | CLOUDFLARE_ACCOUNT_ID ;
            kv/data/${{ inputs.vault_env_path || 'uat' }}/serverless/cloudflare CLOUDFLARE_API_TOKEN | CLOUDFLARE_API_TOKEN

      - name: Download boundary edge assets
        uses: actions/download-artifact@v8
        with:
          pattern: edge-assets-*
          merge-multiple: true
          path: ${{ runner.temp }}/edge-assets

      - name: Deploy Cloudflare Pages static assets
        run: ./.github/scripts/serverless/run_cloudflare_target.sh
        env:
          CLOUDFLARE_TARGET: static-pages
          EDGE_ASSETS_DIR: ${{ runner.temp }}/edge-assets
          CLOUDFLARE_ENV: ${{ inputs.vault_env_path || 'uat' }}
          PAGES_BRANCH: ${{ inputs.vault_env_path || 'uat' }}
          CLOUDFLARE_BOUNDARY_CONFIG: ${{ runner.temp }}/edge-routing.json
          PORTAL_DIR: ${{ github.workspace }}/portal
          CLOUDFLARE_ACCOUNT_ID: ${{ steps.vault.outputs.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ steps.vault.outputs.CLOUDFLARE_API_TOKEN }}
          INTERNAL_SERVICE_TOKEN: ${{ steps.vault.outputs.INTERNAL_SERVICE_TOKEN }}

  serverless_domains:
    name: Cloudflare / custom domains and public CORS chain
    needs: [preflight, supabase, uat_accounts_baseline, uat_accounts_schema_migration, cloud_run, cloudflare_ssr, frontend_router, edge_gateway, static_pages]
    if: >-
      ${{ always() && needs.preflight.result == 'success' &&
      contains(fromJSON('["deploy","upgrade","deploy+migrate"]'), inputs.operation) &&
      inputs.deploy_cloudflare == true &&
      (needs.supabase.result == 'success' || needs.supabase.result == 'failure' || needs.supabase.result == 'skipped') &&
      (!inputs.adopt_accounts_baseline || needs.uat_accounts_baseline.result == 'success') &&
      (!inputs.apply_accounts_schema_migration || needs.uat_accounts_schema_migration.result == 'success') &&
      (needs.cloud_run.result == 'success' || needs.cloud_run.result == 'skipped') &&
      (needs.cloudflare_ssr.result == 'success' || needs.cloudflare_ssr.result == 'skipped') &&
      (needs.frontend_router.result == 'success' || needs.frontend_router.result == 'skipped') &&
      (needs.edge_gateway.result == 'success' || needs.edge_gateway.result == 'skipped') &&
      (needs.static_pages.result == 'success' || needs.static_pages.result == 'skipped') }}
    concurrency:
      group: public-dns-${{ inputs.vault_env_path || 'uat' }}
      cancel-in-progress: false
    runs-on: ubuntu-latest
    steps:
      - name: Checkout platform toolkit
        uses: actions/checkout@v7

      - name: Checkout GitOps serverless runtime topology
        uses: actions/checkout@v7
        with:
          repository: ai-workspace-infra/gitops
          # The GitOps runtime topology is the source of truth for the public
          # console/accounts hosts and the Pages/Worker boundary names.
          ref: main
          path: gitops
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            topology/${{ inputs.vault_env_path || 'uat' }}/serverless/runtime-topology.yaml

      - name: Render GitOps runtime topology YAML
        run: ./.github/scripts/gitops/prepare_gitops_routing_config.sh
        env:
          GITOPS_ROUTING_YAML: ${{ github.workspace }}/gitops/topology/${{ inputs.vault_env_path || 'uat' }}/serverless/runtime-topology.yaml
          GITOPS_ROUTING_OUTPUT: ${{ runner.temp }}/edge-routing.json

      - name: Authenticate to Vault with GitHub OIDC
        id: vault
        uses: hashicorp/vault-action@v4
        with:
          url: ${{ vars.VAULT_ADDR || 'https://vault.svc.plus' }}
          method: jwt
          role: github-actions-platform-ops-toolkit-${{ inputs.vault_env_path || 'uat' }}
          jwtGithubAudience: vault
          exportToken: true
          secrets: |
            kv/data/${{ inputs.vault_env_path || 'uat' }}/serverless/cloudflare CLOUDFLARE_ACCOUNT_ID | CLOUDFLARE_ACCOUNT_ID ;
            kv/data/${{ inputs.vault_env_path || 'uat' }}/serverless/cloudflare CLOUDFLARE_API_TOKEN | CLOUDFLARE_API_TOKEN

      - name: Reconcile Worker custom domains and routes
        run: ./scripts/serverless_uat/reconcile_cloudflare_domains.sh
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ steps.vault.outputs.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ steps.vault.outputs.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_BOUNDARY_CONFIG: ${{ runner.temp }}/edge-routing.json
          SERVERLESS_DNS_MODE: ${{ inputs.dns_mode || 'none' }}

      - name: Verify public Console to Accounts CORS chain
        run: ./scripts/serverless_uat/verify_serverless_public_chain.sh
        env:
          CLOUDFLARE_BOUNDARY_CONFIG: ${{ runner.temp }}/edge-routing.json
          SERVERLESS_DNS_MODE: ${{ inputs.dns_mode || 'none' }}

      - name: Verify Frontend Router boundary assets
        run: ./.github/scripts/serverless/verify_frontend_boundary_assets.sh
        env:
          CLOUDFLARE_BOUNDARY_CONFIG: ${{ runner.temp }}/edge-routing.json

      # Post-deploy checklist: the brand website must stay reviewable by
      # Google / Apple / Android company and app-store reviewers (pages served
      # in place on the brand domain, legal name, company-domain email, no
      # legacy branding). Spec: store-and-startup-homepage-spec skill.
      - name: Verify brand website review readiness
        run: ./scripts/serverless_uat/verify_brand_site_review_readiness.sh
        env:
          CLOUDFLARE_BOUNDARY_CONFIG: ${{ runner.temp }}/edge-routing.json

  trigger_data_migration:
    name: Data Migration / Supabase
    needs: [preflight, supabase, uat_accounts_baseline, uat_accounts_schema_migration, cloud_run, cloudflare_ssr, frontend_router, edge_gateway, static_pages, serverless_domains]
    if: >-
      ${{ always() && !cancelled() &&
      needs.preflight.result == 'success' &&
      contains(fromJSON('["migrate","deploy+migrate"]'), inputs.operation) &&
      (!inputs.adopt_accounts_baseline || needs.uat_accounts_baseline.result == 'success') &&
      (!inputs.apply_accounts_schema_migration || needs.uat_accounts_schema_migration.result == 'success') &&
      (needs.supabase.result == 'success' || needs.supabase.result == 'skipped') &&
      (needs.cloud_run.result == 'success' || needs.cloud_run.result == 'skipped') &&
      (needs.cloudflare_ssr.result == 'success' || needs.cloudflare_ssr.result == 'skipped') &&
      (needs.frontend_router.result == 'success' || needs.frontend_router.result == 'skipped') &&
      (needs.edge_gateway.result == 'success' || needs.edge_gateway.result == 'skipped') &&
      (needs.static_pages.result == 'success' || needs.static_pages.result == 'skipped') &&
      (needs.serverless_domains.result == 'success' || needs.serverless_domains.result == 'skipped') }}
    uses: ./.github/workflows/data-migration.yaml
    with:
      vault_env_path: ${{ inputs.vault_env_path || 'uat' }}
      runner_type: ${{ inputs.runner_type || 'ubuntu-latest' }}
      toolkit_ref: ${{ github.sha }}
      infra_ref: main
      toolkit_action: migrate
      migration_scope: accounts
      accounts_dry_run: false
      accounts_ref: ${{ inputs.tag_ref || 'main' }}
      accounts_source_backend: ${{ inputs.accounts_source_backend || 'supabase' }}
      accounts_target_backend: supabase
      accounts_migration_mode: metadata_and_data
      supabase_metadata_dry_run: false
      supabase_source_tunnel_host: ${{ inputs.supabase_source_tunnel_host }}
      # Automatic UAT deploy+migrate runs must not fall back to the reusable
      # workflow's safety default (reject) when the input is omitted.
      supabase_target_existing_strategy: ${{ inputs.supabase_target_existing_strategy || 'accounts_merge' }}
      supabase_target_confirm_replace: ${{ inputs.supabase_target_confirm_replace || false }}

  stripe_catalog:
    name: Stripe / Catalog Bootstrap
    # Stripe catalog synchronization is a post-deploy reconciliation task.
    # An Accounts administrator may require interactive MFA, which cannot be
    # completed by a GitHub runner. Do not roll back or mark the core PROD
    # deployment failed for that condition; retain the job log for the
    # follow-up run with a non-interactive service credential.
    continue-on-error: true
    needs: [preflight, supabase, uat_accounts_baseline, uat_accounts_schema_migration, cloud_run, serverless_domains]
    if: >-
      ${{ always() && !cancelled() &&
      needs.preflight.result == 'success' &&
      contains(fromJSON('["deploy","upgrade","deploy+migrate"]'), inputs.operation) &&
      (!inputs.adopt_accounts_baseline || needs.uat_accounts_baseline.result == 'success') &&
      (!inputs.apply_accounts_schema_migration || needs.uat_accounts_schema_migration.result == 'success') &&
      inputs.deploy_cloud_run == true &&
      inputs.skip_stripe_catalog != true &&
      inputs.deploy_cloudflare == true &&
      (needs.supabase.result == 'success' || needs.supabase.result == 'skipped') &&
      (needs.cloud_run.result == 'success' || needs.cloud_run.result == 'skipped') &&
      needs.serverless_domains.result == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout platform toolkit
        uses: actions/checkout@v7

      - name: Checkout Accounts catalog source
        uses: actions/checkout@v7
        with:
          repository: ai-workspace-services/accounts
          ref: ${{ inputs.tag_ref || 'main' }}
          path: accounts
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            scripts/seed-billing-plans.sql
            scripts/stripe-catalog.yaml
            scripts/stripe-sync-catalog.sh

      - name: Checkout GitOps runtime topology
        uses: actions/checkout@v7
        with:
          repository: ai-workspace-infra/gitops
          ref: main
          path: gitops
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            topology/${{ inputs.vault_env_path || 'uat' }}/serverless/runtime-topology.yaml

      - name: Resolve Accounts catalog endpoint
        run: |
          ./.github/scripts/gitops/prepare_gitops_routing_config.sh
          accounts_host="$(jq -er '.spec.serverless.accounts_host' "${RUNNER_TEMP}/edge-routing.json")"
          accounts_run_url="$(jq -er '.spec.serverless.cloud_run.accounts' "${RUNNER_TEMP}/edge-routing.json")"
          domain_base="${accounts_host#*.}"
          [[ "${domain_base}" != "${accounts_host}" ]] || {
            echo "invalid Accounts host in GitOps topology: ${accounts_host}" >&2
            exit 1
          }
          [[ "${accounts_run_url}" =~ ^https://[^/]+\.run\.app$ ]] || {
            echo "invalid Accounts Cloud Run URL in GitOps topology: ${accounts_run_url}" >&2
            exit 1
          }
          # The public Accounts hostname is protected by Cloudflare. Catalog
          # bootstrap runs on a GitHub-hosted runner, so use the GitOps-owned
          # Cloud Run origin for its authenticated API calls and retain the
          # public domain only for domain-derived catalog metadata.
          echo "ACCOUNTS_BASE_URL=${accounts_run_url}" >> "${GITHUB_ENV}"
          echo "DOMAIN_BASE=${domain_base}" >> "${GITHUB_ENV}"
        env:
          GITOPS_ROUTING_YAML: ${{ github.workspace }}/gitops/topology/${{ inputs.vault_env_path || 'uat' }}/serverless/runtime-topology.yaml
          GITOPS_ROUTING_OUTPUT: ${{ runner.temp }}/edge-routing.json

      - name: Install catalog bootstrap dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes postgresql-client
          python3 -m pip install --user pyyaml

      - name: Install Vault CLI
        run: ./.github/scripts/serverless/install_vault_cli.sh

      - name: Authenticate to Vault with GitHub OIDC
        uses: hashicorp/vault-action@v4
        with:
          url: ${{ vars.VAULT_ADDR || 'https://vault.svc.plus' }}
          method: jwt
          role: github-actions-platform-ops-toolkit-${{ inputs.vault_env_path || 'uat' }}
          jwtGithubAudience: vault
          exportToken: true

      - name: Bootstrap Stripe billing catalog
        run: ./scripts/serverless_uat/bootstrap_stripe_catalog.sh
        env:
          VAULT_ADDR: ${{ vars.VAULT_ADDR || 'https://vault.svc.plus' }}
          VAULT_ENV_PATH: ${{ inputs.vault_env_path || 'uat' }}
          ACCOUNTS_DIR: ${{ github.workspace }}/accounts

  destroy:
    name: Destroy / Cloud Run ephemeral compute
    needs: preflight
    if: ${{ always() && needs.preflight.result == 'success' && inputs.operation == 'destroy' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout platform toolkit
        uses: actions/checkout@v7

      - name: Checkout GitOps GCP project declaration
        uses: actions/checkout@v7
        with:
          repository: ai-workspace-infra/gitops
          ref: main
          path: gitops
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            resources/xworktech.com/${{ inputs.vault_env_path || 'uat' }}/gcp/open-platform-${{ inputs.vault_env_path || 'uat' }}.yaml

      - name: Read GitOps GCP target
        id: gitops_gcp
        run: ruby ./.github/scripts/gitops/read_gcp_gitops_target.rb
        env:
          GCP_GITOPS_MANIFEST: ${{ github.workspace }}/gitops/resources/xworktech.com/${{ inputs.vault_env_path || 'uat' }}/gcp/open-platform-${{ inputs.vault_env_path || 'uat' }}.yaml

      - name: Load GCP deployment identity from Vault
        id: vault
        uses: hashicorp/vault-action@v4
        with:
          url: ${{ vars.VAULT_ADDR || 'https://vault.svc.plus' }}
          method: jwt
          role: github-actions-platform-ops-toolkit-${{ inputs.vault_env_path || 'uat' }}
          jwtGithubAudience: vault
          exportToken: true
          secrets: |
            kv/data/${{ inputs.vault_env_path || 'uat' }}/serverless/gcp GCP_WORKLOAD_IDENTITY_PROVIDER | GCP_WORKLOAD_IDENTITY_PROVIDER ;
            kv/data/${{ inputs.vault_env_path || 'uat' }}/serverless/gcp GCP_SERVICE_ACCOUNT_EMAIL | GCP_SERVICE_ACCOUNT_EMAIL

      - name: Verify Vault GCP target matches GitOps project declaration
        run: ruby ./.github/scripts/gitops/validate_gcp_gitops_contract.rb
        env:
          GCP_GITOPS_MANIFEST: ${{ github.workspace }}/gitops/resources/xworktech.com/${{ inputs.vault_env_path || 'uat' }}/gcp/open-platform-${{ inputs.vault_env_path || 'uat' }}.yaml
          GCP_ENVIRONMENT: ${{ inputs.vault_env_path || 'uat' }}
          GCP_PROJECT_ID: ${{ steps.gitops_gcp.outputs.project_id }}
          GCP_REGION: ${{ steps.gitops_gcp.outputs.region }}

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ steps.vault.outputs.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ steps.vault.outputs.GCP_SERVICE_ACCOUNT_EMAIL }}

      - name: Set up Google Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Destroy serverless ephemeral compute
        run: ./scripts/serverless_uat/destroy_ephemeral_compute.sh
        env:
          DEPLOY_ENV: ${{ inputs.vault_env_path || 'uat' }}
          GCP_PROJECT_ID: ${{ steps.gitops_gcp.outputs.project_id }}
          GCP_REGION: ${{ steps.gitops_gcp.outputs.region }}

  verify:
    name: Verify / Summary
    needs: [preflight, supabase, uat_accounts_baseline, uat_accounts_schema_migration, cloud_run, cloudflare_ssr, frontend_router, edge_gateway, static_pages, serverless_domains, trigger_data_migration, stripe_catalog]
    if: >-
      ${{ always() && needs.preflight.result == 'success' &&
      contains(fromJSON('["deploy","upgrade","deploy+migrate"]'), inputs.operation) &&
      needs.supabase.result != 'cancelled' &&
      (!inputs.adopt_accounts_baseline || needs.uat_accounts_baseline.result == 'success') &&
      (!inputs.apply_accounts_schema_migration || needs.uat_accounts_schema_migration.result == 'success') &&
      needs.cloud_run.result != 'cancelled' &&
      needs.cloudflare_ssr.result != 'cancelled' &&
      needs.frontend_router.result != 'cancelled' &&
      needs.edge_gateway.result != 'cancelled' &&
      needs.static_pages.result != 'cancelled' &&
      needs.serverless_domains.result != 'cancelled' &&
      (needs.stripe_catalog.result == 'success' || needs.stripe_catalog.result == 'skipped') &&
      (needs.trigger_data_migration.result == 'success' || needs.trigger_data_migration.result == 'skipped') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout platform toolkit
        uses: actions/checkout@v7

      - name: Authenticate to Vault with GitHub OIDC
        uses: hashicorp/vault-action@v4
        with:
          url: ${{ vars.VAULT_ADDR || 'https://vault.svc.plus' }}
          method: jwt
          role: github-actions-platform-ops-toolkit-${{ inputs.vault_env_path || 'uat' }}
          jwtGithubAudience: vault
          exportToken: true

      - name: Verify Supabase and publish summary
        run: ./.github/scripts/serverless/verify_summary.sh
        env:
          VAULT_ADDR: ${{ vars.VAULT_ADDR || 'https://vault.svc.plus' }}
          VAULT_ENV_PATH: ${{ inputs.vault_env_path || 'uat' }}
          CLOUDFLARE_RESULT: ${{ needs.cloudflare_ssr.result }}
          FRONTEND_ROUTER_RESULT: ${{ needs.frontend_router.result }}
          EDGE_GATEWAY_RESULT: ${{ needs.edge_gateway.result }}
          STATIC_PAGES_RESULT: ${{ needs.static_pages.result }}
          SERVERLESS_DOMAINS_RESULT: ${{ needs.serverless_domains.result }}
          CLOUD_RUN_RESULT: ${{ needs.cloud_run.result }}
          SUPABASE_RESULT: ${{ needs.supabase.result }}

  console_release_metadata:
    name: Record release identity for Operations Console
    needs: [preflight, supabase, uat_accounts_schema_migration, cloud_run, cloudflare_ssr, frontend_router, edge_gateway, static_pages, serverless_domains, verify]
    # Observe every terminal outcome; this job uploads metadata only.
    if: >-
      ${{ always() && needs.preflight.result != '' && needs.cloud_run.result != '' &&
      needs.cloudflare_ssr.result != '' && needs.frontend_router.result != '' &&
      needs.edge_gateway.result != '' && needs.static_pages.result != '' &&
      needs.serverless_domains.result != '' && needs.verify.result != '' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Write allowlisted release metadata
        env:
          RELEASE_ENV: ${{ inputs.vault_env_path || 'uat' }}
          RELEASE_TAG: ${{ inputs.tag_ref }}
          RELEASE_OPERATION: ${{ inputs.operation }}
          RELEASE_TARGET: ${{ inputs.target_domains || 'all' }}
          RELEASE_LANES: ${{ toJSON(needs) }}
        run: |
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          lanes = json.loads(os.environ['RELEASE_LANES'])
          payload = {'environment': os.environ['RELEASE_ENV'], 'tag': os.environ['RELEASE_TAG'],
                     'operation': os.environ['RELEASE_OPERATION'], 'target': os.environ['RELEASE_TARGET'],
                     'lanes': {key: {'result': value['result']} for key, value in lanes.items()}}
          Path('release-metadata.json').write_text(json.dumps(payload))
          PY
      - uses: actions/upload-artifact@v7
        with:
          name: console-release-metadata
          path: release-metadata.json
