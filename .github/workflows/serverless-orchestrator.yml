name: Serverless Orchestrator

permissions:
  id-token: write
  contents: read

on:
  workflow_dispatch:
    inputs:
      initialize_supabase:
        description: 'Initialize the Supabase Accounts schema before selected deployments'
        required: false
        default: false
        type: boolean
      vault_env_path:
        description: 'Target environment'
        required: false
        default: 'uat'
        type: choice
        options:
          - dev
          - sit
          - uat
          - prod
      tag_ref:
        description: 'Unified immutable tag for Cloud Run images, portal, and edge-gateway (for example daily-build-2026.08.17-r1)'
        required: true
        type: string
      deploy_cloudflare:
        description: 'Deploy Cloudflare SSR Workers, edge gateway, and Pages static assets'
        required: false
        default: true
        type: boolean
      deploy_cloud_run:
        description: 'Deploy backend services to GCP Cloud Run'
        required: false
        default: true
        type: boolean
      verify_supabase:
        description: 'Validate the selected Supabase connection contract from Vault'
        required: false
        default: true
        type: boolean

jobs:
  supabase:
    name: Supabase / xworktech
    if: ${{ inputs.initialize_supabase == true || inputs.verify_supabase == true }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout platform toolkit
        uses: actions/checkout@v7

      - name: Checkout Accounts schema
        if: ${{ inputs.initialize_supabase == true }}
        uses: actions/checkout@v7
        with:
          repository: ai-workspace-services/accounts
          ref: main
          path: accounts
          sparse-checkout: |
            sql/schema.sql

      - name: Install Vault CLI
        run: ./.github/scripts/serverless/install_vault_cli.sh

      - name: Authenticate to Vault with GitHub OIDC
        uses: hashicorp/vault-action@v4
        with:
          url: ${{ vars.VAULT_ADDR || 'https://vault.svc.plus' }}
          method: jwt
          role: github-actions-platform-ops-toolkit-${{ inputs.vault_env_path || 'uat' }}
          jwtGithubAudience: vault
          exportToken: true

      - name: Run Supabase task
        run: ./.github/scripts/serverless/run_supabase_task.sh
        env:
          VAULT_ADDR: ${{ vars.VAULT_ADDR || 'https://vault.svc.plus' }}
          VAULT_ENV_PATH: ${{ inputs.vault_env_path || 'uat' }}
          INITIALIZE_SUPABASE: ${{ inputs.initialize_supabase }}
          VERIFY_SUPABASE: ${{ inputs.verify_supabase }}
          ACCOUNT_SCHEMA_FILE: ${{ github.workspace }}/accounts/sql/schema.sql

  cloud_run:
    name: Cloud Run / ${{ matrix.service }}
    needs: supabase
    if: ${{ always() && inputs.deploy_cloud_run == true && (needs.supabase.result == 'success' || needs.supabase.result == 'skipped') }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service:
          - accounts
          - content-service
          - billing-service
    steps:
      - name: Checkout platform toolkit
        uses: actions/checkout@v7

      - name: Authenticate to Vault with GitHub OIDC
        id: vault
        uses: hashicorp/vault-action@v4
        with:
          url: ${{ vars.VAULT_ADDR || 'https://vault.svc.plus' }}
          method: jwt
          role: github-actions-platform-ops-toolkit-${{ inputs.vault_env_path || 'uat' }}
          jwtGithubAudience: vault
          exportToken: true
          secrets: |
            kv/data/${{ inputs.vault_env_path || 'uat' }}/serverless/gcp GCP_WORKLOAD_IDENTITY_PROVIDER | GCP_WORKLOAD_IDENTITY_PROVIDER ;
            kv/data/${{ inputs.vault_env_path || 'uat' }}/serverless/gcp GCP_SERVICE_ACCOUNT_EMAIL | GCP_SERVICE_ACCOUNT_EMAIL

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ steps.vault.outputs.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ steps.vault.outputs.GCP_SERVICE_ACCOUNT_EMAIL }}

      - name: Set up Google Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Deploy Cloud Run service
        run: ./.github/scripts/platform-ops/deploy/uat_orchestrator_runner.sh
        env:
          VAULT_ADDR: ${{ vars.VAULT_ADDR || 'https://vault.svc.plus' }}
          VAULT_ENV_PATH: ${{ inputs.vault_env_path || 'uat' }}
          DEPLOY_ENV: ${{ inputs.vault_env_path || 'uat' }}
          IMAGE_TAG: ${{ inputs.tag_ref }}
          DEPLOY_CLOUDFLARE: 'false'
          DEPLOY_CLOUD_RUN: 'true'
          VERIFY_SUPABASE: 'false'
          CLOUD_RUN_SERVICE: ${{ matrix.service }}

  cloudflare_ssr:
    name: Cloudflare / SSR / ${{ matrix.boundary }}
    needs: cloud_run
    if: ${{ always() && inputs.deploy_cloudflare == true && (needs.cloud_run.result == 'success' || needs.cloud_run.result == 'skipped') }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        boundary:
          - public
          - content
          - auth
          - console
          - workspace
    steps:
      - name: Checkout platform toolkit
        uses: actions/checkout@v7

      - name: Checkout GitOps routing config
        uses: actions/checkout@v7
        with:
          repository: ai-workspace-infra/gitops
          # GitOps routing is the environment configuration source of truth;
          # keep it on main while deployable artifacts share tag_ref.
          ref: main
          path: gitops
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            resources/svc.plus/${{ inputs.vault_env_path || 'uat' }}/serverless/edge-routing.yaml

      - name: Render GitOps routing YAML
        run: ./.github/scripts/serverless/prepare_gitops_routing_config.sh
        env:
          GITOPS_ROUTING_YAML: ${{ github.workspace }}/gitops/resources/svc.plus/${{ inputs.vault_env_path || 'uat' }}/serverless/edge-routing.yaml
          GITOPS_ROUTING_OUTPUT: ${{ runner.temp }}/edge-routing.json

      - name: Validate Cloudflare boundary contract
        run: python3 scripts/serverless_uat/validate_cloudflare_boundaries.py
        env:
          CLOUDFLARE_BOUNDARY_CONFIG: ${{ runner.temp }}/edge-routing.json
          REQUIRED_RUNTIME_MODE: serverless

      - name: Checkout portal source
        uses: actions/checkout@v7
        with:
          repository: ai-workspace-services/portal
          ref: ${{ inputs.tag_ref }}
          path: portal

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Authenticate to Vault with GitHub OIDC
        id: vault
        uses: hashicorp/vault-action@v4
        with:
          url: ${{ vars.VAULT_ADDR || 'https://vault.svc.plus' }}
          method: jwt
          role: github-actions-platform-ops-toolkit-${{ inputs.vault_env_path || 'uat' }}
          jwtGithubAudience: vault
          exportToken: true
          secrets: |
            kv/data/${{ inputs.vault_env_path || 'uat' }}/serverless/cloudflare CLOUDFLARE_ACCOUNT_ID | CLOUDFLARE_ACCOUNT_ID ;
            kv/data/${{ inputs.vault_env_path || 'uat' }}/serverless/cloudflare CLOUDFLARE_API_TOKEN | CLOUDFLARE_API_TOKEN

      - name: Deploy SSR Worker boundary
        run: ./.github/scripts/serverless/run_cloudflare_target.sh
        env:
          CLOUDFLARE_TARGET: ssr
          PORTAL_SSR_BOUNDARY: ${{ matrix.boundary }}
          CLOUDFLARE_ENV: ${{ inputs.vault_env_path || 'uat' }}
          CLOUDFLARE_BOUNDARY_CONFIG: ${{ runner.temp }}/edge-routing.json
          PORTAL_DIR: ${{ github.workspace }}/portal

  edge_gateway:
    name: Cloudflare / edge-gateway / ${{ matrix.boundary }}
    needs: cloudflare_ssr
    if: ${{ always() && inputs.deploy_cloudflare == true && needs.cloudflare_ssr.result == 'success' }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        boundary:
          - auth
          - admin
          - core
    steps:
      - name: Checkout platform toolkit
        uses: actions/checkout@v7

      - name: Checkout GitOps routing config
        uses: actions/checkout@v7
        with:
          repository: ai-workspace-infra/gitops
          # GitOps routing is the environment configuration source of truth;
          # keep it on main while deployable artifacts share tag_ref.
          ref: main
          path: gitops
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            resources/svc.plus/${{ inputs.vault_env_path || 'uat' }}/serverless/edge-routing.yaml

      - name: Render GitOps routing YAML
        run: ./.github/scripts/serverless/prepare_gitops_routing_config.sh
        env:
          GITOPS_ROUTING_YAML: ${{ github.workspace }}/gitops/resources/svc.plus/${{ inputs.vault_env_path || 'uat' }}/serverless/edge-routing.yaml
          GITOPS_ROUTING_OUTPUT: ${{ runner.temp }}/edge-routing.json

      - name: Checkout edge-gateway source
        uses: actions/checkout@v7
        with:
          repository: ai-workspace-services/edge-gateway
          ref: ${{ inputs.tag_ref }}
          path: edge-gateway

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Authenticate to Vault with GitHub OIDC
        uses: hashicorp/vault-action@v4
        with:
          url: ${{ vars.VAULT_ADDR || 'https://vault.svc.plus' }}
          method: jwt
          role: github-actions-platform-ops-toolkit-${{ inputs.vault_env_path || 'uat' }}
          jwtGithubAudience: vault
          exportToken: true
          secrets: |
            kv/data/${{ inputs.vault_env_path || 'uat' }}/serverless/cloudflare CLOUDFLARE_ACCOUNT_ID | CLOUDFLARE_ACCOUNT_ID ;
            kv/data/${{ inputs.vault_env_path || 'uat' }}/serverless/cloudflare CLOUDFLARE_API_TOKEN | CLOUDFLARE_API_TOKEN

      - name: Deploy edge-gateway Worker boundary
        run: ./.github/scripts/serverless/run_cloudflare_target.sh
        env:
          CLOUDFLARE_TARGET: edge-gateway
          EDGE_GATEWAY_BOUNDARY: ${{ matrix.boundary }}
          CLOUDFLARE_ENV: ${{ inputs.vault_env_path || 'uat' }}
          CLOUDFLARE_BOUNDARY_CONFIG: ${{ runner.temp }}/edge-routing.json
          WORKER_DIR: ${{ github.workspace }}/edge-gateway

  static_pages:
    name: Cloudflare / static-pages
    needs: edge_gateway
    if: ${{ always() && inputs.deploy_cloudflare == true && needs.edge_gateway.result == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout platform toolkit
        uses: actions/checkout@v7

      - name: Checkout GitOps routing config
        uses: actions/checkout@v7
        with:
          repository: ai-workspace-infra/gitops
          # GitOps routing is the environment configuration source of truth;
          # keep it on main while deployable artifacts share tag_ref.
          ref: main
          path: gitops
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            resources/svc.plus/${{ inputs.vault_env_path || 'uat' }}/serverless/edge-routing.yaml

      - name: Render GitOps routing YAML
        run: ./.github/scripts/serverless/prepare_gitops_routing_config.sh
        env:
          GITOPS_ROUTING_YAML: ${{ github.workspace }}/gitops/resources/svc.plus/${{ inputs.vault_env_path || 'uat' }}/serverless/edge-routing.yaml
          GITOPS_ROUTING_OUTPUT: ${{ runner.temp }}/edge-routing.json

      - name: Validate Cloudflare boundary contract
        run: python3 scripts/serverless_uat/validate_cloudflare_boundaries.py
        env:
          CLOUDFLARE_BOUNDARY_CONFIG: ${{ runner.temp }}/edge-routing.json
          REQUIRED_RUNTIME_MODE: serverless

      - name: Checkout portal source
        uses: actions/checkout@v7
        with:
          repository: ai-workspace-services/portal
          ref: ${{ inputs.tag_ref }}
          path: portal

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Authenticate to Vault with GitHub OIDC
        uses: hashicorp/vault-action@v4
        with:
          url: ${{ vars.VAULT_ADDR || 'https://vault.svc.plus' }}
          method: jwt
          role: github-actions-platform-ops-toolkit-${{ inputs.vault_env_path || 'uat' }}
          jwtGithubAudience: vault
          exportToken: true
          secrets: |
            kv/data/${{ inputs.vault_env_path || 'uat' }}/serverless/cloudflare CLOUDFLARE_ACCOUNT_ID | CLOUDFLARE_ACCOUNT_ID ;
            kv/data/${{ inputs.vault_env_path || 'uat' }}/serverless/cloudflare CLOUDFLARE_API_TOKEN | CLOUDFLARE_API_TOKEN

      - name: Deploy Cloudflare Pages static assets
        run: ./.github/scripts/serverless/run_cloudflare_target.sh
        env:
          CLOUDFLARE_TARGET: static-pages
          CLOUDFLARE_ENV: ${{ inputs.vault_env_path || 'uat' }}
          PAGES_BRANCH: ${{ inputs.vault_env_path || 'uat' }}
          CLOUDFLARE_BOUNDARY_CONFIG: ${{ runner.temp }}/edge-routing.json
          PORTAL_DIR: ${{ github.workspace }}/portal

  verify:
    name: Verify / Summary
    needs: [supabase, cloud_run, cloudflare_ssr, edge_gateway, static_pages]
    if: ${{ always() && inputs.verify_supabase == true && needs.supabase.result != 'cancelled' && needs.cloud_run.result != 'cancelled' && needs.cloudflare_ssr.result != 'cancelled' && needs.edge_gateway.result != 'cancelled' && needs.static_pages.result != 'cancelled' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout platform toolkit
        uses: actions/checkout@v7

      - name: Authenticate to Vault with GitHub OIDC
        uses: hashicorp/vault-action@v4
        with:
          url: ${{ vars.VAULT_ADDR || 'https://vault.svc.plus' }}
          method: jwt
          role: github-actions-platform-ops-toolkit-${{ inputs.vault_env_path || 'uat' }}
          jwtGithubAudience: vault
          exportToken: true

      - name: Verify Supabase and publish summary
        run: ./.github/scripts/serverless/verify_summary.sh
        env:
          VAULT_ADDR: ${{ vars.VAULT_ADDR || 'https://vault.svc.plus' }}
          VAULT_ENV_PATH: ${{ inputs.vault_env_path || 'uat' }}
          CLOUDFLARE_RESULT: ${{ needs.cloudflare_ssr.result }}
          EDGE_GATEWAY_RESULT: ${{ needs.edge_gateway.result }}
          STATIC_PAGES_RESULT: ${{ needs.static_pages.result }}
          CLOUD_RUN_RESULT: ${{ needs.cloud_run.result }}
          SUPABASE_RESULT: ${{ needs.supabase.result }}
