name: Serverless Orchestrator

permissions:
  id-token: write
  contents: read

on:
  workflow_dispatch:
    inputs:
      initialize_supabase:
        description: 'Initialize the Supabase Accounts schema before selected deployments'
        required: true
        default: false
        type: boolean
      vault_env_path:
        description: 'Target environment'
        required: true
        default: 'uat'
        type: choice
        options:
          - dev
          - sit
          - uat
          - prod
      image_tag:
        description: 'Image tag to deploy to Cloud Run'
        required: false
        default: 'latest'
      deploy_cloudflare:
        description: 'Deploy Cloudflare Pages and the portal OpenNext Worker'
        required: true
        default: true
        type: boolean
      deploy_cloud_run:
        description: 'Deploy selected backend services to GCP Cloud Run'
        required: true
        default: true
        type: boolean
      verify_supabase:
        description: 'Validate the selected Supabase connection contract from Vault'
        required: true
        default: true
        type: boolean
      portal_repository:
        description: 'Portal repository to check out for frontend deployment'
        required: true
        default: 'ai-workspace-services/portal'
        type: string
      portal_ref:
        description: 'Portal source ref: immutable release tag, commit SHA, or branch (for example daily-build-2026.08.16-r1)'
        required: true
        default: 'main'
        type: string
jobs:
  deploy_serverless:
    name: Deploy and verify selected Serverless components
    needs: initialize_supabase
    # Explicit Supabase initialization is an init-only operation. Keep the
    # normal deployment path available when the input is false or omitted.
    if: ${{ always() && inputs.initialize_supabase != true && (needs.initialize_supabase.result == 'success' || needs.initialize_supabase.result == 'skipped') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Checkout portal source
        if: ${{ inputs.deploy_cloudflare == true }}
        uses: actions/checkout@v7
        with:
          repository: ${{ inputs.portal_repository }}
          ref: ${{ inputs.portal_ref }}
          path: portal

      - name: Authenticate to Vault with GitHub OIDC
        id: vault
        uses: hashicorp/vault-action@v4
        with:
          url: ${{ vars.VAULT_ADDR || 'https://vault.svc.plus' }}
          method: jwt
          role: github-actions-platform-ops-toolkit-${{ inputs.vault_env_path || 'uat' }}
          jwtGithubAudience: vault
          exportToken: true
          secrets: |
            kv/data/${{ inputs.vault_env_path || 'uat' }}/serverless/gcp GCP_WORKLOAD_IDENTITY_PROVIDER | GCP_WORKLOAD_IDENTITY_PROVIDER ;
            kv/data/${{ inputs.vault_env_path || 'uat' }}/serverless/gcp GCP_SERVICE_ACCOUNT_EMAIL | GCP_SERVICE_ACCOUNT_EMAIL

      - name: Authenticate to Google Cloud
        if: ${{ inputs.deploy_cloud_run == true }}
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ steps.vault.outputs.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ steps.vault.outputs.GCP_SERVICE_ACCOUNT_EMAIL }}

      - name: Set up Google Cloud SDK
        if: ${{ inputs.deploy_cloud_run == true }}
        uses: google-github-actions/setup-gcloud@v2

      - name: Run Serverless Orchestrator
        run: ./.github/scripts/platform-ops/deploy/uat_orchestrator_runner.sh
        env:
          VAULT_ADDR: ${{ vars.VAULT_ADDR || 'https://vault.svc.plus' }}
          VAULT_ENV_PATH: ${{ inputs.vault_env_path || 'uat' }}
          DEPLOY_ENV: ${{ inputs.vault_env_path || 'uat' }}
          IMAGE_TAG: ${{ github.event.inputs.image_tag || 'latest' }}
          DEPLOY_CLOUDFLARE: ${{ inputs.deploy_cloudflare || true }}
          DEPLOY_CLOUD_RUN: ${{ inputs.deploy_cloud_run || true }}
          VERIFY_SUPABASE: ${{ inputs.verify_supabase || true }}
          PORTAL_DIR: ${{ github.workspace }}/portal
          PORTAL_REF: ${{ inputs.portal_ref || 'main' }}
          CLOUDFLARE_ENV: ${{ inputs.vault_env_path || 'uat' }}
          PAGES_BRANCH: ${{ inputs.vault_env_path || 'uat' }}

  initialize_supabase:
    name: Initialize Supabase Accounts schema
    if: ${{ inputs.initialize_supabase == true }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout platform toolkit
        uses: actions/checkout@v7

      - name: Checkout Accounts schema
        uses: actions/checkout@v7
        with:
          repository: ai-workspace-services/accounts
          ref: main
          path: accounts
          sparse-checkout: |
            sql/schema.sql

      - name: Install Vault CLI
        run: |
          set -euo pipefail
          VAULT_VERSION=1.21.3
          wget -qO vault.zip "https://releases.hashicorp.com/vault/${VAULT_VERSION}/vault_${VAULT_VERSION}_linux_amd64.zip"
          unzip -o vault.zip
          sudo mv vault /usr/local/bin/vault
          rm -f vault.zip
          vault version

      - name: Authenticate to Vault with GitHub OIDC
        id: vault
        uses: hashicorp/vault-action@v4
        with:
          url: ${{ vars.VAULT_ADDR || 'https://vault.svc.plus' }}
          method: jwt
          role: github-actions-platform-ops-toolkit-${{ inputs.vault_env_path || 'uat' }}
          jwtGithubAudience: vault
          exportToken: true

      - name: Initialize Supabase Accounts database
        env:
          VAULT_ADDR: ${{ vars.VAULT_ADDR || 'https://vault.svc.plus' }}
          VAULT_ENV_PATH: ${{ inputs.vault_env_path || 'uat' }}
        run: |
          set -euo pipefail
          bash scripts/serverless_uat/init_supabase_account_db.sh \
            --env "${VAULT_ENV_PATH}" \
            --schema-file "${GITHUB_WORKSPACE}/accounts/sql/schema.sql" \
            --write-account-password
