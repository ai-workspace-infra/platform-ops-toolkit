name: Serverless Orchestrator

permissions:
  id-token: write
  contents: read

on:
  workflow_dispatch:
    inputs:
      initialize_supabase:
        description: 'Initialize Supabase Accounts schema only'
        required: true
        default: false
        type: boolean
      vault_env_path:
        description: 'Vault environment path (dev, uat, prod)'
        required: true
        default: 'uat'
        type: choice
        options:
          - dev
          - uat
          - prod
      image_tag:
        description: 'Image tag to deploy to Cloud Run'
        required: false
        default: 'latest'
      deploy_portal_frontend:
        description: 'Build and deploy portal static Pages and OpenNext Worker targets'
        required: true
        default: false
        type: boolean
      frontend_only:
        description: 'Only validate the portal Cloudflare frontend; skip Cloud Run, gateway, and Supabase steps'
        required: true
        default: false
        type: boolean
      portal_repository:
        description: 'Portal repository to check out for frontend deployment'
        required: true
        default: 'ai-workspace-services/portal'
        type: string
      portal_ref:
        description: 'Portal branch, tag, or commit SHA to deploy'
        required: true
        default: 'main'
        type: string
  schedule:
    # 每个工作日 09:00 (UTC 01:00) 自动拉起临时 Serverless 计算环境
    - cron: '0 1 * * 1-5'

jobs:
  deploy_uat:
    name: Provision Serverless Stack
    if: ${{ inputs.initialize_supabase != true }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Checkout portal source
        if: ${{ inputs.deploy_portal_frontend == true }}
        uses: actions/checkout@v7
        with:
          repository: ${{ inputs.portal_repository }}
          ref: ${{ inputs.portal_ref }}
          path: portal

      - name: Authenticate to Vault with GitHub OIDC
        id: vault
        uses: hashicorp/vault-action@v4
        with:
          url: ${{ vars.VAULT_ADDR || 'https://vault.svc.plus' }}
          method: jwt
          role: github-actions-platform-ops-toolkit-${{ inputs.vault_env_path || 'uat' }}
          jwtGithubAudience: vault
          exportToken: true

      - name: Run UAT Orchestrator Script
        run: ./.github/scripts/platform-ops/deploy/uat_orchestrator_runner.sh
        env:
          VAULT_ADDR: ${{ vars.VAULT_ADDR || 'https://vault.svc.plus' }}
          VAULT_ENV_PATH: ${{ inputs.vault_env_path || 'uat' }}
          DEPLOY_ENV: ${{ inputs.vault_env_path || 'uat' }}
          IMAGE_TAG: ${{ github.event.inputs.image_tag || 'latest' }}
          DEPLOY_PORTAL_FRONTEND: ${{ inputs.deploy_portal_frontend || false }}
          FRONTEND_ONLY: ${{ inputs.frontend_only || false }}
          PORTAL_DIR: ${{ github.workspace }}/portal
          PORTAL_REF: ${{ inputs.portal_ref || 'main' }}
          CLOUDFLARE_ENV: uat

  initialize_supabase:
    name: Initialize Supabase Accounts schema
    if: ${{ inputs.initialize_supabase == true }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout platform toolkit
        uses: actions/checkout@v7

      - name: Checkout Accounts schema
        uses: actions/checkout@v7
        with:
          repository: ai-workspace-services/accounts
          ref: main
          path: accounts
          sparse-checkout: |
            sql/schema.sql

      - name: Install Vault CLI
        run: |
          set -euo pipefail
          VAULT_VERSION=1.21.3
          wget -qO vault.zip "https://releases.hashicorp.com/vault/${VAULT_VERSION}/vault_${VAULT_VERSION}_linux_amd64.zip"
          unzip -o vault.zip
          sudo mv vault /usr/local/bin/vault
          rm -f vault.zip
          vault version

      - name: Authenticate to Vault with GitHub OIDC
        id: vault
        uses: hashicorp/vault-action@v4
        with:
          url: ${{ vars.VAULT_ADDR || 'https://vault.svc.plus' }}
          method: jwt
          role: github-actions-platform-ops-toolkit-${{ inputs.vault_env_path || 'uat' }}
          jwtGithubAudience: vault
          exportToken: true

      - name: Initialize Supabase Accounts database
        env:
          VAULT_ADDR: ${{ vars.VAULT_ADDR || 'https://vault.svc.plus' }}
          VAULT_ENV_PATH: ${{ inputs.vault_env_path || 'uat' }}
        run: |
          set -euo pipefail
          bash scripts/serverless_uat/init_supabase_account_db.sh \
            --env "${VAULT_ENV_PATH}" \
            --schema-file "${GITHUB_WORKSPACE}/accounts/sql/schema.sql" \
            --write-account-password
