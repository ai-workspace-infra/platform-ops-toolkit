name: UCloud UHost Terraform IaC

on:
  workflow_dispatch:
    inputs:
      deploy_action:
        type: choice
        required: true
        default: plan
        options: [plan, apply, destroy]
      vault_env_path:
        type: choice
        required: true
        default: uat
        options: [sit, uat, prod]
      project:
        type: string
        required: true
        default: svc.plus
      account:
        type: string
        required: true
      workspace:
        type: string
        required: true
        default: platform
      resource_manifest:
        description: GitOps path under resources/<project>/<env>/ucloud/.
        type: string
        required: false
        default: ''
      gitops_repo_name:
        type: string
        required: false
        default: ai-workspace-infra/gitops
      gitops_repo_ref:
        type: string
        required: false
        default: main
      iac_ref:
        type: string
        required: false
        default: main
  workflow_call:
    inputs:
      deploy_action:
        type: string
        required: false
        default: plan
      vault_env_path:
        type: string
        required: true
      project:
        type: string
        required: true
      account:
        type: string
        required: true
      workspace:
        type: string
        required: true
      resource_manifest:
        type: string
        required: false
        default: ''
      gitops_repo_name:
        type: string
        required: false
        default: ai-workspace-infra/gitops
      gitops_repo_ref:
        type: string
        required: false
        default: main
      iac_ref:
        type: string
        required: false
        default: main

permissions:
  contents: read
  id-token: write

concurrency:
  group: ucloud-${{ inputs.vault_env_path }}-${{ inputs.project }}-${{ inputs.account }}-${{ inputs.workspace }}
  cancel-in-progress: false

jobs:
  terraform:
    runs-on: ubuntu-latest
    environment:
      name: ${{ inputs.vault_env_path }}
    env:
      DEPLOY_ACTION: ${{ inputs.deploy_action || 'plan' }}
      DEPLOY_ENV: ${{ inputs.vault_env_path }}
      PROJECT: ${{ inputs.project }}
      ACCOUNT: ${{ inputs.account }}
      WORKSPACE: ${{ inputs.workspace }}
      GITOPS_REPO: ${{ inputs.gitops_repo_name }}
      GITOPS_REF: ${{ inputs.gitops_repo_ref }}
      IAC_REF: ${{ inputs.iac_ref }}
      MANIFEST_INPUT: ${{ inputs.resource_manifest }}
      TF_ROOT: ${{ github.workspace }}/iac_modules/terraform-hcl-standard/ucloud/envs/${{ inputs.vault_env_path }}/${{ inputs.workspace }}
    steps:
      - uses: actions/checkout@v4

      - name: Checkout IaC modules
        uses: actions/checkout@v4
        with:
          repository: ai-workspace-infra/iac_modules
          ref: ${{ env.IAC_REF }}
          path: iac_modules

      - name: Checkout GitOps declarations
        uses: actions/checkout@v4
        with:
          repository: ${{ env.GITOPS_REPO }}
          ref: ${{ env.GITOPS_REF }}
          path: gitops

      - name: Resolve canonical state contract
        id: contract
        run: |
          python3 scripts/iac/resolve_iac_contract.py \
            --environment "${DEPLOY_ENV}" --project "${PROJECT}" \
            --provider ucloud --account "${ACCOUNT}" --workspace "${WORKSPACE}" \
            --github-output

      - name: Validate UCloud account and workspace
        run: |
          set -euo pipefail
          [[ "${ACCOUNT}" =~ ^[A-Za-z0-9][A-Za-z0-9._-]*$ ]] || { echo 'account must be path-safe' >&2; exit 1; }
          case "${ACCOUNT}" in primary|default|main) echo 'account must be a concrete UCloud project ID' >&2; exit 1;; esac
          [[ "${WORKSPACE}" =~ ^[A-Za-z0-9][A-Za-z0-9._-]*$ ]] || { echo 'workspace must be path-safe' >&2; exit 1; }

      - name: Load UCloud and state credentials from Vault
        id: vault
        uses: hashicorp/vault-action@v4
        with:
          url: https://vault.svc.plus
          method: jwt
          role: github-actions-platform-ops-toolkit-${{ inputs.vault_env_path }}
          jwtGithubAudience: vault
          exportToken: false
          secrets: |
            kv/data/CICD/${{ inputs.vault_env_path }}/ucloud/${{ inputs.account }} UCLOUD_PUBLIC_KEY | UCLOUD_PUBLIC_KEY ;
            kv/data/CICD/${{ inputs.vault_env_path }}/ucloud/${{ inputs.account }} UCLOUD_PRIVATE_KEY | UCLOUD_PRIVATE_KEY ;
            kv/data/CICD/${{ inputs.vault_env_path }}/ucloud/${{ inputs.account }} UCLOUD_PROJECT_ID | UCLOUD_PROJECT_ID ;
            kv/data/CICD/${{ inputs.vault_env_path }}/ucloud/${{ inputs.account }} UCLOUD_REGION | UCLOUD_REGION ;
            kv/data/CICD/${{ inputs.vault_env_path }}/ucloud/${{ inputs.account }} UCLOUD_SECURITY_GROUP_ID | UCLOUD_SECURITY_GROUP_ID ;
            kv/data/CICD/${{ inputs.vault_env_path }}/ucloud/${{ inputs.account }} UCLOUD_KEY_PAIR_ID | UCLOUD_KEY_PAIR_ID ;
            kv/data/CICD/${{ inputs.vault_env_path }}/iac_state TF_STATE_ENDPOINT | TF_STATE_ENDPOINT ;
            kv/data/CICD/${{ inputs.vault_env_path }}/iac_state TF_STATE_BUCKET | TF_STATE_BUCKET ;
            kv/data/CICD/${{ inputs.vault_env_path }}/iac_state TF_STATE_ACCESS_KEY | TF_STATE_ACCESS_KEY ;
            kv/data/CICD/${{ inputs.vault_env_path }}/iac_state TF_STATE_SECRET_KEY | TF_STATE_SECRET_KEY ;
            kv/data/CICD/${{ inputs.vault_env_path }}/iac_state TF_STATE_REGION | TF_STATE_REGION

      - name: Validate UCloud credential binding
        env:
          UCLOUD_PUBLIC_KEY: ${{ steps.vault.outputs.UCLOUD_PUBLIC_KEY }}
          UCLOUD_PRIVATE_KEY: ${{ steps.vault.outputs.UCLOUD_PRIVATE_KEY }}
          UCLOUD_PROJECT_ID: ${{ steps.vault.outputs.UCLOUD_PROJECT_ID }}
          UCLOUD_SECURITY_GROUP_ID: ${{ steps.vault.outputs.UCLOUD_SECURITY_GROUP_ID }}
          UCLOUD_KEY_PAIR_ID: ${{ steps.vault.outputs.UCLOUD_KEY_PAIR_ID }}
        run: |
          set -euo pipefail
          [[ -n "${UCLOUD_PUBLIC_KEY}" && -n "${UCLOUD_PRIVATE_KEY}" ]] || { echo 'UCloud API credentials are empty' >&2; exit 1; }
          [[ "${UCLOUD_PROJECT_ID}" == "${ACCOUNT}" ]] || { echo 'Vault UCloud project ID does not match account path' >&2; exit 1; }
          [[ -n "${UCLOUD_SECURITY_GROUP_ID}" && -n "${UCLOUD_KEY_PAIR_ID}" ]] || { echo 'UCloud bootstrap Job outputs are missing from Vault' >&2; exit 1; }

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.10.5

      - name: Resolve GitOps UHost declaration
        id: manifest
        run: |
          set -euo pipefail
          manifest="${MANIFEST_INPUT:-resources/${PROJECT}/${DEPLOY_ENV}/ucloud/${WORKSPACE}.yaml}"
          [[ "${manifest}" != /* && "${manifest}" != *..* ]] || { echo 'invalid resource manifest path' >&2; exit 1; }
          [[ "${manifest}" == resources/*/${DEPLOY_ENV}/ucloud/*.yaml ]] || { echo 'manifest must be under resources/<project>/<env>/ucloud/' >&2; exit 1; }
          test -f "gitops/${manifest}"
          echo "path=${manifest}" >> "${GITHUB_OUTPUT}"

      - name: Render UCloud Terraform root
        run: |
          python3 iac_modules/terraform-hcl-standard/ucloud/scripts/generate.py render \
            --resources "gitops/${{ steps.manifest.outputs.path }}" --workdir "${TF_ROOT}"
          terraform fmt -recursive "${TF_ROOT}"

      - name: Configure S3-compatible state backend
        env:
          TF_STATE_ENDPOINT: ${{ steps.vault.outputs.TF_STATE_ENDPOINT }}
          TF_STATE_BUCKET: ${{ steps.vault.outputs.TF_STATE_BUCKET }}
          TF_STATE_ACCESS_KEY: ${{ steps.vault.outputs.TF_STATE_ACCESS_KEY }}
          TF_STATE_SECRET_KEY: ${{ steps.vault.outputs.TF_STATE_SECRET_KEY }}
          TF_STATE_REGION: ${{ steps.vault.outputs.TF_STATE_REGION }}
          TF_STATE_KEY: ${{ steps.contract.outputs.state_key }}
        run: |
          set -euo pipefail
          umask 077
          backend="${RUNNER_TEMP}/ucloud-backend.hcl"
          printf '%s\n' \
            "bucket = \"${TF_STATE_BUCKET}\"" \
            "key = \"${TF_STATE_KEY}\"" \
            "region = \"${TF_STATE_REGION}\"" \
            "access_key = \"${TF_STATE_ACCESS_KEY}\"" \
            "secret_key = \"${TF_STATE_SECRET_KEY}\"" \
            "endpoint = \"${TF_STATE_ENDPOINT}\"" \
            'skip_credentials_validation = true' \
            'skip_region_validation = true' \
            'skip_requesting_account_id = true' \
            'skip_metadata_api_check = true' \
            'use_path_style = true' \
            'use_lockfile = true' > "${backend}"
          terraform -chdir="${TF_ROOT}" init -input=false -reconfigure -backend-config="${backend}"

      - name: Terraform validate and plan
        env:
          TF_VAR_ucloud_public_key: ${{ steps.vault.outputs.UCLOUD_PUBLIC_KEY }}
          TF_VAR_ucloud_private_key: ${{ steps.vault.outputs.UCLOUD_PRIVATE_KEY }}
          TF_VAR_ucloud_project_id: ${{ steps.vault.outputs.UCLOUD_PROJECT_ID }}
          TF_VAR_ucloud_region: ${{ steps.vault.outputs.UCLOUD_REGION }}
          TF_VAR_ucloud_bootstrap_security_group_id: ${{ steps.vault.outputs.UCLOUD_SECURITY_GROUP_ID }}
          TF_VAR_ucloud_bootstrap_key_pair_id: ${{ steps.vault.outputs.UCLOUD_KEY_PAIR_ID }}
        run: |
          set -euo pipefail
          terraform -chdir="${TF_ROOT}" validate -no-color
          if [[ "${DEPLOY_ACTION}" != destroy ]]; then terraform -chdir="${TF_ROOT}" plan -input=false -no-color; fi

      - name: Terraform apply or destroy
        if: ${{ inputs.deploy_action == 'apply' || inputs.deploy_action == 'destroy' }}
        env:
          TF_VAR_ucloud_public_key: ${{ steps.vault.outputs.UCLOUD_PUBLIC_KEY }}
          TF_VAR_ucloud_private_key: ${{ steps.vault.outputs.UCLOUD_PRIVATE_KEY }}
          TF_VAR_ucloud_project_id: ${{ steps.vault.outputs.UCLOUD_PROJECT_ID }}
          TF_VAR_ucloud_region: ${{ steps.vault.outputs.UCLOUD_REGION }}
          TF_VAR_ucloud_bootstrap_security_group_id: ${{ steps.vault.outputs.UCLOUD_SECURITY_GROUP_ID }}
          TF_VAR_ucloud_bootstrap_key_pair_id: ${{ steps.vault.outputs.UCLOUD_KEY_PAIR_ID }}
        run: terraform -chdir="${TF_ROOT}" "${DEPLOY_ACTION}" -input=false -auto-approve

      - name: Produce UCloud inventory after apply
        if: ${{ inputs.deploy_action == 'apply' }}
        run: |
          python3 iac_modules/terraform-hcl-standard/ucloud/scripts/generate.py inventory \
            --resources "gitops/${{ steps.manifest.outputs.path }}" --workdir "${TF_ROOT}"

      - name: Write UCloud inventory and run record
        if: ${{ inputs.deploy_action == 'apply' }}
        env:
          AWS_ACCESS_KEY_ID: ${{ steps.vault.outputs.TF_STATE_ACCESS_KEY }}
          AWS_SECRET_ACCESS_KEY: ${{ steps.vault.outputs.TF_STATE_SECRET_KEY }}
          AWS_DEFAULT_REGION: ${{ steps.vault.outputs.TF_STATE_REGION }}
          TF_STATE_ENDPOINT: ${{ steps.vault.outputs.TF_STATE_ENDPOINT }}
          TF_STATE_BUCKET: ${{ steps.vault.outputs.TF_STATE_BUCKET }}
          INVENTORY_KEY: ${{ steps.contract.outputs.inventory_key }}
          RUN_KEY: ${{ steps.contract.outputs.run_key }}
        run: |
          set -euo pipefail
          jq -n \
            --arg provider "ucloud" --arg env "${DEPLOY_ENV}" \
            --arg project "${PROJECT}" --arg account "${ACCOUNT}" \
            --arg workspace "${WORKSPACE}" --arg action "${DEPLOY_ACTION}" \
            '{provider:$provider,environment:$env,project:$project,account:$account,workspace:$workspace,action:$action}' \
            > "${RUNNER_TEMP}/ucloud-run.json"
          aws --endpoint-url "${TF_STATE_ENDPOINT}" s3api put-object \
            --bucket "${TF_STATE_BUCKET}" --key "${INVENTORY_KEY}" \
            --body "${TF_ROOT}/cmdb.json" >/dev/null
          aws --endpoint-url "${TF_STATE_ENDPOINT}" s3api put-object \
            --bucket "${TF_STATE_BUCKET}" --key "${RUN_KEY}" \
            --body "${RUNNER_TEMP}/ucloud-run.json" >/dev/null
