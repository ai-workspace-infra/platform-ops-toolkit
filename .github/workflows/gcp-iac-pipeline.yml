name: Compatibility / gcp-iac-pipeline
'on':
  workflow_dispatch:
    inputs:
      deploy_action:
        description: Terraform action for the GCP platform stack.
        type: choice
        required: true
        default: plan
        options:
          - plan
          - apply
          - destroy
      vault_env_path:
        description: Target GCP environment.
        type: choice
        required: true
        default: uat
        options:
          - uat
          - prod
          - shared
      github_environment:
        description: GitHub Environment used for approval and OIDC JWT claims (defaults to vault_env_path; shared uses prod).
        type: string
        required: false
        default: ''
      gcp_account_id:
        description: Readable GCP account identifier used in Vault runtime role/path.
        type: string
        required: false
        default: ''
      gitops_repo_name:
        description: GitOps repository (URL or owner/repo).
        type: string
        required: false
        default: ''
      gitops_repo_ref:
        description: GitOps repository branch, tag, or commit.
        type: string
        required: false
        default: ''
      iac_ref:
        description: Owner code/module revision
        type: string
        required: false
        default: ''
      gcp_resource_manifest:
        description: Optional manifest path inside GitOps; environment is validated against vault_env_path.
        type: string
        required: false
        default: ''
      state_migration_source_key:
        description: Optional existing S3-compatible Terraform state key to migrate into the manifest-derived key before apply.
        type: string
        required: false
        default: ''
      adopt_existing_platform_resources:
        description: Import already-existing GCP network/platform objects into the target state before apply. Use only for an audited recovery.
        type: string
        required: false
        default: 'false'
      target_manifest:
        description: Reviewed IaCPipelineTargets path; missing/ambiguous legacy identity fails closed
        type: string
        required: false
        default: ''
      gitops_ref:
        description: Fixed declaration revision or explicitly selected ref
        type: string
        required: false
        default: ''
  workflow_call:
    inputs:
      deploy_action:
        type: string
        required: false
        default: plan
      vault_env_path:
        type: string
        required: true
      github_environment:
        type: string
        required: false
        default: ''
      gcp_account_id:
        type: string
        required: false
        default: ''
      gitops_repo_name:
        type: string
        required: false
        default: ''
      gitops_repo_ref:
        type: string
        required: false
        default: ''
      iac_ref:
        description: Owner code/module revision
        type: string
        required: false
        default: ''
      gcp_resource_manifest:
        type: string
        required: false
        default: ''
      state_migration_source_key:
        type: string
        required: false
        default: ''
      adopt_existing_platform_resources:
        type: string
        required: false
        default: 'false'
      target_manifest:
        description: Reviewed IaCPipelineTargets path; missing/ambiguous legacy identity fails closed
        type: string
        required: false
        default: ''
      gitops_ref:
        description: Fixed declaration revision or explicitly selected ref
        type: string
        required: false
        default: ''
permissions:
  contents: read
  id-token: write
  actions: read
jobs:
  resolve:
    runs-on: ubuntu-latest
    outputs:
      target_manifest: ${{ steps.normalize.outputs.target_manifest }}
      selectors: ${{ steps.normalize.outputs.selectors }}
      action: ${{ steps.normalize.outputs.action }}
      environment: ${{ steps.normalize.outputs.environment }}
      gitops_sha: ${{ steps.normalize.outputs.gitops_sha }}
      iac_sha: ${{ steps.normalize.outputs.iac_sha }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: ai-workspace-infra/iac_modules
          ref: ${{ inputs.iac_ref || 'be8456282f7495e098170e0894e742605a94dae6' }}
          path: iac_modules
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: ai-workspace-infra/gitops
          ref: ${{ inputs.gitops_ref || inputs.gitops_repo_ref || '4e052f34675a218df0179677088266c6e7f57f6c' }}
          path: gitops
          persist-credentials: false
      - id: normalize
        uses: ./iac_modules/.github/actions/iac-legacy-inputs
        with:
          inputs-json: ${{ toJSON(inputs) }}
          stage: resources
          provider: gcp-cloud
          iac-root: ${{ github.workspace }}/iac_modules
          gitops-root: ${{ github.workspace }}/gitops
  pipeline:
    needs: resolve
    if: ${{ !cancelled() && needs.resolve.result == 'success' }}
    uses: ./.github/workflows/iac-self-check-matrix.yml
    with:
      action: ${{ needs.resolve.outputs.action }}
      environment: ${{ needs.resolve.outputs.environment }}
      target_manifest: ${{ needs.resolve.outputs.target_manifest }}
      gitops_ref: ${{ needs.resolve.outputs.gitops_sha }}
      iac_ref: ${{ needs.resolve.outputs.iac_sha }}
      stage_scope: resources
      bootstrap_mode: verify
      selectors: ${{ needs.resolve.outputs.selectors }}
      correlation_id: ${{ github.run_id }}:${{ github.run_attempt }}:compat
    secrets: inherit
