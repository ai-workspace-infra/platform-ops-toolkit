name: Configure Email DNS

# Reconciles the transactional-email DNS of every zone declared in GitOps:
# Google Workspace MX, the merged apex SPF, DKIM selectors and DMARC.
#
# It lives here rather than in ai-workspace-infra/playbooks because this is the
# orchestration repository - playbooks holds the Ansible content, and every
# other pipeline that runs it is driven from here.
#
# The Cloudflare token comes from `kv/data/<env>/serverless/cloudflare`, the
# same entry the serverless orchestrator reads. It is deliberately not copied
# into a mail-specific path: one credential in two places is two rotation
# points, and the second one is the one nobody remembers.
#
# Dispatch is restricted to release tags by the Vault role's `ref` bound claim,
# not by this file. The role's workflow allowlist lives in
# scripts/create_vault_service_repo_roles.sh and ends in @* - pinning a tag
# there breaks this workflow on the next release, at the Vault step, where
# nothing points back at the tag as the cause.

on:
  workflow_dispatch:
    inputs:
      vault_env_path:
        description: Target environment
        required: true
        default: prod
        type: choice
        options: [prod]

permissions:
  contents: read
  id-token: write

jobs:
  reconcile:
    name: Reconcile ${{ matrix.zone }}
    runs-on: ubuntu-latest
    environment: prod
    strategy:
      # Serial, and one zone's failure must not abandon the other half-applied:
      # both policies edit the same Cloudflare account, and the apex SPF of each
      # zone is rewritten in place rather than diffed.
      max-parallel: 1
      fail-fast: false
      matrix:
        zone: [xworktech.com, svc.plus]
    steps:
      - name: Checkout platform toolkit
        uses: actions/checkout@v7

      - name: Checkout playbooks
        uses: actions/checkout@v7
        with:
          repository: ai-workspace-infra/playbooks
          ref: main
          path: playbooks

      - name: Checkout GitOps declarations
        uses: actions/checkout@v7
        with:
          # The declared state is the source of truth for this run; keep it on
          # main even when the toolkit is dispatched from a tag.
          repository: ai-workspace-infra/gitops
          ref: main
          path: gitops

      - name: Load provider credentials from Vault
        id: vault
        uses: hashicorp/vault-action@v4
        with:
          url: ${{ vars.VAULT_ADDR || 'https://vault.svc.plus' }}
          method: jwt
          role: github-actions-platform-ops-toolkit-${{ inputs.vault_env_path }}
          jwtGithubAudience: vault
          secrets: |
            kv/data/${{ inputs.vault_env_path }}/serverless/cloudflare CLOUDFLARE_API_TOKEN | CLOUDFLARE_DNS_API_TOKEN

      - name: Install Ansible
        run: ./.github/scripts/serverless/install_email_dns_deps.sh

      - name: Reconcile DNS
        env:
          EMAIL_DNS_APPLY: "true"
          CLOUDFLARE_DNS_API_TOKEN: ${{ steps.vault.outputs.CLOUDFLARE_DNS_API_TOKEN }}
          EMAIL_DNS_CONFIG_PATH: ${{ github.workspace }}/gitops/resources/${{ matrix.zone }}/${{ inputs.vault_env_path }}/cloudflare/email-dns.yaml
        run: >-
          ansible-playbook -i localhost, -c local
          playbooks/configure_email_dns.yml
