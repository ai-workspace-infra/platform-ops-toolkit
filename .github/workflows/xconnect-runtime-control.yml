name: XConnect UAT Runtime Control

on:
  workflow_dispatch:
    inputs:
      operation:
        description: UAT host/service operation owned by Playbooks
        type: choice
        options: [gateway_verify, one_verify, xhttp_verify]
        required: true
        default: gateway_verify
      target_host:
        description: Exact UAT host address from the approved CMDB artifact
        type: string
        required: true
      target_user:
        description: SSH user from the approved UAT CMDB artifact
        type: string
        required: true
        default: root
      state_dir:
        description: Existing runtime state directory on the selected host
        type: string
        required: true
      xhttp_role:
        description: Runtime role for xhttp_verify; ignored by status-only operations
        type: choice
        options: [gateway, one]
        default: gateway
      xhttp_config_path:
        description: Exact remote Gateway config path or One state directory for xhttp_verify
        type: string
        required: false
        default: ''
      xhttp_remote_address:
        description: Exact One remote address for xhttp_verify; ignored for Gateway
        type: string
        required: false
        default: ''
      xhttp_server_name:
        description: Exact TLS server name for xhttp_verify
        type: string
        required: false
        default: ''
      xhttp_path:
        description: Exact XHTTP path for xhttp_verify
        type: string
        required: false
        default: ''
      xhttp_mode:
        description: Exact XHTTP mode for xhttp_verify
        type: choice
        options: [auto, packet-up, stream-up]
        default: auto
      xhttp_host:
        description: Exact XHTTP Host for xhttp_verify
        type: string
        required: false
        default: ''

permissions:
  contents: read
  id-token: write

concurrency:
  group: xconnect-uat-runtime-${{ inputs.target_host }}
  cancel-in-progress: false

env:
  PLAYBOOKS_OWNER_SHA: 9d585e147348800b1603c4f7b0d8a6bcf0546007

jobs:
  validate:
    name: Validate UAT runtime caller
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Validate immutable owner ref and exact runtime inputs
        env:
          TARGET_HOST: ${{ inputs.target_host }}
          TARGET_USER: ${{ inputs.target_user }}
          STATE_DIR: ${{ inputs.state_dir }}
          OPERATION: ${{ inputs.operation }}
          XHTTP_CONFIG_PATH: ${{ inputs.xhttp_config_path }}
        run: |
          set -euo pipefail
          [[ "$PLAYBOOKS_OWNER_SHA" =~ ^[0-9a-f]{40}$ ]] || { echo 'owner pin must be a full immutable SHA' >&2; exit 1; }
          [[ "$TARGET_HOST" =~ ^[A-Za-z0-9][A-Za-z0-9._:-]{0,127}$ ]] || { echo 'target_host has an unsafe shape' >&2; exit 1; }
          [[ "$TARGET_HOST" != localhost && "$TARGET_HOST" != 127.0.0.1 && "$TARGET_HOST" != ::1 && "$TARGET_HOST" != *..* ]] || { echo 'loopback or ambiguous target is forbidden' >&2; exit 1; }
          [[ "$TARGET_USER" =~ ^[a-z_][a-z0-9_-]{0,31}$ ]] || { echo 'target_user has an unsafe shape' >&2; exit 1; }
          [[ "$STATE_DIR" =~ ^/[A-Za-z0-9][A-Za-z0-9_./-]*$ && "$STATE_DIR" != *..* ]] || { echo 'state_dir has an unsafe shape' >&2; exit 1; }
          if [[ "$OPERATION" == xhttp_verify ]]; then
            [[ "$XHTTP_CONFIG_PATH" =~ ^/[A-Za-z0-9][A-Za-z0-9_./-]*$ && "$XHTTP_CONFIG_PATH" != *..* ]] || {
              echo 'xhttp_config_path is required for xhttp_verify' >&2; exit 1;
            }
          fi
          grep -Fq 'ai-workspace-infra/playbooks/.github/actions/xconnect-lab-runtime@9d585e147348800b1603c4f7b0d8a6bcf0546007' .github/workflows/xconnect-runtime-control.yml

  runtime:
    name: Execute UAT runtime verification
    needs: validate
    runs-on: ubuntu-24.04
    environment: uat
    timeout-minutes: 20
    env:
      TARGET_HOST: ${{ inputs.target_host }}
      TARGET_USER: ${{ inputs.target_user }}
      STATE_DIR: ${{ inputs.state_dir }}
      VAULT_ADDR: https://vault.svc.plus
      VAULT_ROLE: github-actions-platform-ops-toolkit-uat-xconnect-cloud-lab
      ANSIBLE_HOST_KEY_CHECKING: 'True'
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - id: ssh
        name: Read temporary UAT SSH identity and reviewed host keys from Vault
        uses: hashicorp/vault-action@v4
        with:
          url: ${{ env.VAULT_ADDR }}
          role: ${{ env.VAULT_ROLE }}
          method: jwt
          jwtGithubAudience: vault
          secrets: |
            kv/data/CICD/uat SSH_PRIVATE_DEPLOY_KEY_B64 | SSH_PRIVATE_DEPLOY_KEY_B64 ;
            kv/data/CICD/uat SSH_KNOWN_HOSTS_B64 | SSH_KNOWN_HOSTS_B64 ;
      - name: Install runner-private owner inputs
        env:
          DEPLOY_KEY_B64: ${{ steps.ssh.outputs.SSH_PRIVATE_DEPLOY_KEY_B64 }}
          KNOWN_HOSTS_B64: ${{ steps.ssh.outputs.SSH_KNOWN_HOSTS_B64 }}
          OPERATION: ${{ inputs.operation }}
          XHTTP_ROLE: ${{ inputs.xhttp_role }}
          XHTTP_CONFIG_PATH: ${{ inputs.xhttp_config_path }}
          XHTTP_REMOTE_ADDRESS: ${{ inputs.xhttp_remote_address }}
          XHTTP_SERVER_NAME: ${{ inputs.xhttp_server_name }}
          XHTTP_PATH: ${{ inputs.xhttp_path }}
          XHTTP_MODE: ${{ inputs.xhttp_mode }}
          XHTTP_HOST: ${{ inputs.xhttp_host }}
        run: |
          set -euo pipefail
          install -d -m 700 "$RUNNER_TEMP/xconnect-runtime"
          printf '%s' "$DEPLOY_KEY_B64" | base64 --decode > "$RUNNER_TEMP/xconnect-runtime/id_deploy"
          printf '%s' "$KNOWN_HOSTS_B64" | base64 --decode > "$RUNNER_TEMP/xconnect-runtime/known_hosts"
          test -s "$RUNNER_TEMP/xconnect-runtime/id_deploy"
          test -s "$RUNNER_TEMP/xconnect-runtime/known_hosts"
          chmod 600 "$RUNNER_TEMP/xconnect-runtime/id_deploy" "$RUNNER_TEMP/xconnect-runtime/known_hosts"
          if [[ "$OPERATION" == xhttp_verify ]]; then
            jq -cn \
              --arg role "$XHTTP_ROLE" --arg config "$XHTTP_CONFIG_PATH" \
              --arg remote "$XHTTP_REMOTE_ADDRESS" --arg server "$XHTTP_SERVER_NAME" \
              --arg path "$XHTTP_PATH" --arg mode "$XHTTP_MODE" --arg host "$XHTTP_HOST" \
              '{xconnect_lab_runtime_xhttp_role:$role,
                xconnect_lab_runtime_xhttp_config_path:$config,
                xconnect_lab_runtime_xhttp_remote_address:$remote,
                xconnect_lab_runtime_xhttp_server_name:$server,
                xconnect_lab_runtime_xhttp_path:$path,
                xconnect_lab_runtime_xhttp_mode:$mode,
                xconnect_lab_runtime_xhttp_host:$host}' \
              > "$RUNNER_TEMP/xconnect-runtime/variables.json"
          else
            jq -cn --arg operation "$OPERATION" --arg state "$STATE_DIR" \
              '{xconnect_gateway_state_dir:(if $operation == "gateway_verify" then $state else "/var/lib/xconnect-gateway/uat" end),
                xconnect_one_state_dir:(if $operation == "one_verify" then $state else "/var/lib/xconnect-one/uat" end)}' \
              > "$RUNNER_TEMP/xconnect-runtime/variables.json"
          fi
          chmod 600 "$RUNNER_TEMP/xconnect-runtime/variables.json"
      - name: Invoke Playbooks host/service owner
        uses: ai-workspace-infra/playbooks/.github/actions/xconnect-lab-runtime@9d585e147348800b1603c4f7b0d8a6bcf0546007
        with:
          owner-sha: 9d585e147348800b1603c4f7b0d8a6bcf0546007
          operation: ${{ inputs.operation }}
          target: ${{ inputs.target_host }}
          ssh-user: ${{ inputs.target_user }}
          private-key-file: ${{ runner.temp }}/xconnect-runtime/id_deploy
          known-hosts-file: ${{ runner.temp }}/xconnect-runtime/known_hosts
          variables-file: ${{ runner.temp }}/xconnect-runtime/variables.json
          receipt-file: ${{ runner.temp }}/xconnect-runtime/receipt.json
      - name: Upload sanitized same-run owner receipt
        uses: actions/upload-artifact@v4
        with:
          name: xconnect-runtime-owner-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/xconnect-runtime/receipt.json
          if-no-files-found: error
          retention-days: 7
      - name: Remove runner-private owner inputs
        if: ${{ always() }}
        run: rm -rf "$RUNNER_TEMP/xconnect-runtime"
