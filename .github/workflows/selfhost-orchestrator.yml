name: Selfhost Orchestrator

# =============================================================================
# IaC 环境交付与应用部署流水线 (Environment Provisioning & Deployment)
# 1. 动态 Provision (基于 Terraform 创建新环境 platform-ops-toolkit)
# 2. 部署基础服务与业务服务 (Bootstrap Node 与全域业务服务部署)
# 3. 可选 DNS 流量接管与发布 (Cloudflare DNS Cutover)
# =============================================================================

on:
  # Branches select a delivery profile. pull_request and branch/tag pushes
  # always run the provision stage, but only workflow_dispatch can request an
  # actual apply/deploy run.
  pull_request:
    types: [opened, synchronize, reopened]
    paths-ignore:
      - '.github/workflows/deploy-action-runner-iac.yaml'
  push:
    branches:
    - main
    - 'release/**'
    tags:
    - 'v*'
    paths-ignore:
      - '.github/workflows/deploy-action-runner-iac.yaml'
  workflow_dispatch:
    inputs:
      runner_type:
        description: "选择 Runner 环境 (ubuntu-latest 或 self-hosted)"
        required: true
        default: "ubuntu-latest"
        type: choice
        options:
        - ubuntu-latest
        - self-hosted
      deploy_tag:
        description: "应用部署的不可变镜像版本（例如 daily-build-2026.07.30-r1）。operation=deploy 或 deploy+migrate 时必填；基础设施、迁移操作可留空。"
        required: false
        type: string
      source_ref:
        description: "基础设施、Playbooks、GitOps、Toolkit 与 Console 共用的 Git Ref；留空使用各仓库默认（main，Console 回退 deploy_tag）"
        required: false
        default: ""
        type: string
      offline_mode:
        description: "on-host 离线包模式: off=在线拉最新(默认); auto=离线加速; force=强制离线"
        required: false
        default: "off"
        type: choice
        options: ["off", "auto", "force"]
      source_host:
        description: "源环境 IP 或域名 (用于导出数据)"
        required: true
        default: "install.svc.plus"
        type: string
      source_domain_base:
        description: "源环境域名后缀 (例如 svc.plus)"
        required: true
        default: "svc.plus"
        type: string
      target_domain_base:
        description: "新环境域名后缀 (用于参数化替换，如 onwalk.net)"
        required: true
        default: "onwalk.net"
        type: string
      observability_endpoint:
        description: "监控数据上报网关 (默认 https://observability.svc.plus)，支持覆盖"
        required: false
        default: "https://observability.svc.plus"
        type: string
      xray_exporter_image:
        description: "可选 Xray Exporter 覆盖，格式 owner/repository@tag；留空使用环境默认"
        required: false
        default: ""
        type: string
      operation:
        description: "执行范围：plan 仅校验；infra 仅基础设施；deploy 部署应用；deploy+init 显式 UAT 空库初始化并部署；native-standby 仅准备 PROD PostgreSQL、保持应用停止；native-init-plan/native-init 按受控合同策略执行原生空库预演/初始化；native-billing-plan/native-billing 执行 Billing 原生增量预演/升级；native-business-plan/copy/compare 执行全业务预演/复制/比对；native-core-users 显式复制；native-core-users-compare 只读比对数量/email/密码 hash/Proxy UUID；native-availability 检查容器/HTTPS/API/DB 可用性，均不授权切库；migrate 仅迁移；deploy+migrate 部署并迁移；destroy 销毁。GitOps 仅声明拓扑与能力。"
        required: true
        default: "plan"
        type: choice
        options: [plan, infra, deploy, deploy+init, native-standby, native-init-plan, native-init, native-billing-plan, native-billing, native-business-plan, native-business-copy, native-business-compare, native-core-users, native-core-users-compare, native-availability, migrate, deploy+migrate, destroy]
      target_domains:
        description: "选择要执行的业务域 (Business Domain)"
        required: true
        default: "web-saas"
        type: choice
        options:
        - all
        - ai-workspace
        - web-saas
        - open-platform
        - infra-platform
        - agent-proxy
        - agent-proxy-jp
        - agent-proxy-us
        - agent-proxy-sg
        - web-saas + agent-proxy
      open_platform_service:
        description: "open-platform 独立服务单元；all=Vault+IAM+Observability，单项可独立重跑"
        required: true
        default: "all"
        type: choice
        options: [all, vault, iam, observability]
      cloud_provider:
        description: "云服务商（按 UAT Hybrid/GitOps provider registry 选择；不要用单一 provider 覆盖 target_domains=all；ULightHost existing 由 external adapter 处理）"
        required: true
        default: "gcp-cloud"
        type: choice
        options:
        - aws-cloud
        - gcp-cloud
        - azure-cloud
        - vultr-vps
        - akamai-cloud
        - ucloud
      cloud_account:
        description: "所选云厂商的具体账户名/ID；留空时使用环境 profile 的账户"
        required: false
        default: ""
        type: string
      akamai_account:
        description: "Akamai Cloud concrete account name/ID used by the state key; blank uses cloud_account or the environment profile"
        required: false
        default: ""
        type: string
      include_external_agent_proxy:
        description: "是否部署 GitOps 声明的 Ulighthost existing Agent Proxy 节点"
        required: false
        default: true
        type: boolean
      instance_plan:
        description: "选择默认业务规格（UAT Hybrid 的 provider、创建或复用方式及规格以 GitOps namespace 声明为准）"
        required: true
        default: "2C4G"
        type: choice
        options:
        - 4C8G
        - 2C4G
        - 2C8G
        - 2C2G
        - 1C2G
      agent_proxy_plan:
        description: "Agent Proxy 运行时规格（UAT/PROD 默认 1C2G；不默认创建 AWS Spot）"
        required: true
        default: "1C2G"
        type: choice
        options:
        - 1C1G
        - 1C2G
        - 2C1G
        - 2C2G
      dns_mode:
        description: "DNS 行为：none 不发布；uat-records 更新 SIT all-in-one 或 UAT 固定记录；prod-cutover 接管生产流量；destroy 操作始终忽略 DNS 输入"
        required: true
        default: "none"
        type: choice
        options: [none, uat-records, prod-cutover]
      vault_env_path:
        description: "Vault 环境路径 (如 sit, uat, prod)，用于动态 secrets 的读写"
        required: true
        default: "uat"
        type: choice
        options:
        - sit
        - uat
        - prod
      skip_stripe_catalog:
        description: "跳过可选 Stripe Catalog 同步，不阻断核心发布"
        required: false
        default: false
        type: boolean
      agent_controller_url:
        description: "Agent Proxy 注册到的 Accounts 控制器 HTTPS 地址；留空使用同一 Selfhost Web SaaS Accounts"
        required: false
        default: ""
        type: string
      vault_addr:
        description: "Vault 服务地址 (可选，覆盖默认的 https://vault.svc.plus)"
        required: false
        type: string
      xconnect_gateway_ref:
        description: "UAT XConnect Gateway DNS/Vault record key; other XConnect settings use the target workflow defaults"
        required: false
        default: "tw-xconnect.svc.plus"
        type: string
      existing_target_host:
        description: "Existing host deployment target. Only ai-workspace UAT accepts this; no Terraform state or destroy is performed."
        required: false
        default: ""
        type: string
      # 注意: 这里曾有一个 vault_token 输入作为 "JWT 异常时的兜底"。已移除。
      # workflow_dispatch 输入不脱敏且长期留在 run metadata 里, 任何有仓库读
      # 权限的人都能看到; 且 method:token 会绕过 role 上全部 bound_claims 绑定,
      # 等于给整套 OIDC 开一个常驻后门。JWT 认证有问题就修 role 绑定, 不要旁路。

permissions:
  contents: read
  actions: write
  id-token: write

concurrency:
  # Aggregate UAT deployment is a parent orchestrator that dispatches child
  # runs of this same workflow. Include target_domains so the parent `all`
  # lock does not block its isolated namespace child lock.
  group: deploy-env-migration-${{ github.event.inputs.vault_env_path || 'uat' }}-${{ github.event.inputs.cloud_provider || 'auto' }}-${{ github.event.inputs.cloud_account || github.event.inputs.akamai_account || 'profile' }}-${{ github.event.inputs.target_domains || 'auto' }}
  cancel-in-progress: false

env:
  VAULT_ADDR: ${{ github.event.inputs.vault_addr || 'https://vault.svc.plus' }}
  # Branches select a complete deployment profile:
  # - pull_request -> sit
  # - main / release/* -> uat, except release/v* -> prod
  # - tags (v*) -> prod
  DEPLOY_ENV: ${{ github.event_name == 'pull_request' && 'sit' || (startsWith(github.ref, 'refs/tags/v') || startsWith(github.ref, 'refs/heads/release/v')) && 'prod' || github.event.inputs.vault_env_path || 'uat' }}
  VAULT_ENV_PATH: ${{ github.event_name == 'pull_request' && 'sit' || (startsWith(github.ref, 'refs/tags/v') || startsWith(github.ref, 'refs/heads/release/v')) && 'prod' || github.event.inputs.vault_env_path || 'uat' }}
  VAULT_ROLE: github-actions-platform-ops-toolkit-${{ github.event_name == 'pull_request' && 'sit' || (startsWith(github.ref, 'refs/tags/v') || startsWith(github.ref, 'refs/heads/release/v')) && 'prod' || github.event.inputs.vault_env_path || 'uat' }}
  # 公共服务 secret: 三个环境共读、只读不可改 (GHCR 镜像拉取凭据等)。
  # 拉的是同一批镜像, 不存在环境维度, 不拆分。
  VAULT_KV: kv/data/CICD
  # 基础凭据: 按环境拆分, 各 role 只读自己那份。
  # VULTR_API_KEY / TF_STATE_* / SSH_PRIVATE_DEPLOY_KEY_B64 授予的是"控制基础
  # 设施"和"登录主机"的能力, 是提权的实际载体, 必须隔离 —— sit 失陷不应拿到
  # prod 的云账号与主机私钥。
  VAULT_KV_BASE: kv/data/CICD/${{ github.event_name == 'pull_request' && 'sit' || (startsWith(github.ref, 'refs/tags/v') || startsWith(github.ref, 'refs/heads/release/v')) && 'prod' || github.event.inputs.vault_env_path || 'uat' }}
  VAULT_KV_IAC_STATE: kv/data/CICD/${{ github.event_name == 'pull_request' && 'sit' || (startsWith(github.ref, 'refs/tags/v') || startsWith(github.ref, 'refs/heads/release/v')) && 'prod' || github.event.inputs.vault_env_path || 'uat' }}/iac_state
  VAULT_KV_OPENCLAW: kv/data/openclaw
  VAULT_KV_WEB_SAAS: kv/data/WEB_SAAS
  # 计费域密钥按环境隔离, 与 databases / agent-proxy 同形。此前是共享的
  # kv/data/billing-service, 靠 SANDBOX_/PROD_ 键前缀区分两套密钥 —— 但
  # KV v2 的读权限是整份 secret 粒度, 那样 uat 角色必然连 PROD_STRIPE_SECRET_KEY
  # 一起读到, 而那把密钥能对真实客户扣款退款。拆开之后, 既有的
  # kv/data/<env>/* 规则天然完成隔离, 不需要任何额外 policy。
  VAULT_KV_BILLING: kv/data/${{ github.event_name == 'pull_request' && 'sit' || (startsWith(github.ref, 'refs/tags/v') || startsWith(github.ref, 'refs/heads/release/v')) && 'prod' || github.event.inputs.vault_env_path || 'uat' }}/billing-service
  VAULT_KV_DATABASES: kv/data/${{ github.event_name == 'pull_request' && 'sit' || (startsWith(github.ref, 'refs/tags/v') || startsWith(github.ref, 'refs/heads/release/v')) && 'prod' || github.event.inputs.vault_env_path || 'uat' }}/databases
  VAULT_KV_AGENT_PROXY: kv/data/${{ github.event_name == 'pull_request' && 'sit' || (startsWith(github.ref, 'refs/tags/v') || startsWith(github.ref, 'refs/heads/release/v')) && 'prod' || github.event.inputs.vault_env_path || 'uat' }}/agent-proxy
  PLAYBOOKS_DIR: infra/playbooks
  AKAMAI_ACCOUNT: ${{ github.event.inputs.akamai_account || 'manbuzhe2026' }}

jobs:
  # GitHub Actions renders jobs as a dependency graph.  Keep every job and
  # dependency intact, but use four stable visual stages in job names so the
  # matrix fan-out remains readable: Prepare, Bootstrap, Workloads, Gate.
  native_prod_standby:
    name: "[1] PROD | native database standby only"
    if: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.operation == 'native-standby' }}
    runs-on: ubuntu-latest
    environment: prod
    steps:
      - name: Checkout immutable control source
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
      - name: Checkout fixed IaC GCP authentication owner
        uses: actions/checkout@v7
        with:
          repository: ai-workspace-infra/iac_modules
          ref: 8373e926a6f7ba37a59a7b7ee864c7e87b102f58
          path: iac_modules
          persist-credentials: false
          sparse-checkout: .github/actions/auth-gcp-cloud
      - name: Verify approved resource run and original CMDB artifact
        id: native_control
        env:
          GH_TOKEN: ${{ github.token }}
        uses: ./.github/actions/prod-selfhost-control
        with:
          mode: standby
          contract: .github/config/prod-native-standby.yaml
          destination: ${{ runner.temp }}/native-resource-cmdb
      - name: Checkout fixed GitOps declaration
        uses: actions/checkout@v7
        with:
          repository: ai-workspace-infra/gitops
          ref: ${{ steps.native_control.outputs.gitops_commit }}
          path: native-gitops
          persist-credentials: false
      - name: Configure exact PROD GitHub OIDC deploy identity
        uses: ./.github/actions/configure-gcp-oidc
        with:
          environment: prod
          account_id: xworktech
          load_state_contract: 'false'
          vault_addr: https://vault.svc.plus
      - name: Configure cloud access runtime
        uses: google-github-actions/setup-gcloud@v2
      - name: Read only target PostgreSQL and registry runtime secrets
        id: native_vault
        uses: hashicorp/vault-action@v4
        with:
          url: https://vault.svc.plus
          method: jwt
          role: github-actions-platform-ops-toolkit-prod
          jwtGithubAudience: vault
          exportToken: false
          secrets: |
            kv/data/prod/databases postgres_root_password | NATIVE_POSTGRES_PASSWORD ;
            kv/data/CICD GHCR_USERNAME | NATIVE_GHCR_USERNAME ;
            kv/data/CICD GHCR_TOKEN | NATIVE_GHCR_TOKEN
      - name: Open same-run cloud access through fixed IaC owner
        id: native_access
        uses: ai-workspace-infra/iac_modules/.github/actions/prod-selfhost-access@254dd6321449ab12b862220c8876b482d7032fcd
        with:
          phase: open
          cmdb_file: ${{ runner.temp }}/native-resource-cmdb/cmdb.json
          cmdb_sha256: ${{ steps.native_control.outputs.cmdb_sha256 }}
          access_dir: ${{ runner.temp }}/prod-native-access-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Deploy only PostgreSQL standby through fixed Playbooks owner
        uses: ai-workspace-infra/playbooks/.github/actions/prod-native-standby@c6a4cb6c54c7e6dd2d63c43767f44a228385312a
        with:
          cmdb_dir: ${{ runner.temp }}/native-resource-cmdb
          cmdb_sha256: ${{ steps.native_control.outputs.cmdb_sha256 }}
          gitops_checkout: ${{ github.workspace }}/native-gitops
          gitops_commit: ${{ steps.native_control.outputs.gitops_commit }}
          access_file: ${{ steps.native_access.outputs.access_file }}
          postgres_password: ${{ steps.native_vault.outputs.NATIVE_POSTGRES_PASSWORD }}
          ghcr_username: ${{ steps.native_vault.outputs.NATIVE_GHCR_USERNAME }}
          ghcr_token: ${{ steps.native_vault.outputs.NATIVE_GHCR_TOKEN }}
      - name: Revoke cloud access even if standby deployment failed
        if: ${{ always() && steps.native_access.outcome != '' && steps.native_access.outcome != 'skipped' }}
        uses: ai-workspace-infra/iac_modules/.github/actions/prod-selfhost-access@254dd6321449ab12b862220c8876b482d7032fcd
        with:
          phase: close
          cmdb_file: ${{ runner.temp }}/native-resource-cmdb/cmdb.json
          cmdb_sha256: ${{ steps.native_control.outputs.cmdb_sha256 }}
          access_dir: ${{ runner.temp }}/prod-native-access-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Retain original authoritative CMDB for the next controlled stage
        uses: actions/upload-artifact@v4
        with:
          name: platform-ops-toolkit-cmdb
          path: ${{ runner.temp }}/native-resource-cmdb
          if-no-files-found: error
      - name: Publish sanitized standby evidence only after successful cleanup
        uses: actions/upload-artifact@v4
        with:
          name: prod-native-standby-receipt
          path: ${{ runner.temp }}/prod-native-standby-receipt.json
          if-no-files-found: error
      - name: State the completed boundary
        run: |
          echo '## PROD PostgreSQL standby' >> "$GITHUB_STEP_SUMMARY"
          echo 'PostgreSQL and independent storage verified; application/CD writers remain paused. Schema initialization, full business copy, equality and main database cutover are pending.' >> "$GITHUB_STEP_SUMMARY"

  prod_availability:
    name: "[3] PROD | containers + HTTPS + API + DB availability"
    needs: [provision, deploy_web_saas]
    if: ${{ !cancelled() && github.event_name == 'workflow_dispatch' && (github.event.inputs.operation == 'native-availability' || (needs.provision.outputs.deployment_env == 'prod' && needs.provision.outputs.target_domains == 'web-saas' && needs.deploy_web_saas.result == 'success')) }}
    runs-on: ubuntu-latest
    environment: prod
    steps:
      - name: Checkout immutable control source
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
      - name: Checkout fixed IaC GCP authentication owner
        uses: actions/checkout@v7
        with:
          repository: ai-workspace-infra/iac_modules
          ref: 8373e926a6f7ba37a59a7b7ee864c7e87b102f58
          path: iac_modules
          persist-credentials: false
          sparse-checkout: .github/actions/auth-gcp-cloud
      - name: Verify approved resource run and original CMDB artifact
        id: native_control
        env:
          GH_TOKEN: ${{ github.token }}
        uses: ./.github/actions/prod-selfhost-control
        with:
          mode: availability
          contract: .github/config/prod-native-standby.yaml
          destination: ${{ runner.temp }}/native-resource-cmdb
      - name: Checkout fixed GitOps declaration
        uses: actions/checkout@v7
        with:
          repository: ai-workspace-infra/gitops
          ref: ${{ steps.native_control.outputs.gitops_commit }}
          path: native-gitops
          persist-credentials: false
      - name: Configure exact PROD GitHub OIDC deploy identity
        uses: ./.github/actions/configure-gcp-oidc
        with:
          environment: prod
          account_id: xworktech
          load_state_contract: 'false'
          vault_addr: https://vault.svc.plus
      - name: Configure cloud access runtime
        uses: google-github-actions/setup-gcloud@v2
      - name: Open same-run cloud access through fixed IaC owner
        id: native_access
        uses: ai-workspace-infra/iac_modules/.github/actions/prod-selfhost-access@254dd6321449ab12b862220c8876b482d7032fcd
        with:
          phase: open
          cmdb_file: ${{ runner.temp }}/native-resource-cmdb/cmdb.json
          cmdb_sha256: ${{ steps.native_control.outputs.cmdb_sha256 }}
          access_dir: ${{ runner.temp }}/prod-native-access-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Observe Doco-CD, containers, HTTPS, API and DB without service changes
        uses: ai-workspace-infra/playbooks/.github/actions/prod-availability@934e1e1f729d8d5ecf1adcbae05a02c6b1ff7939
        with:
          cmdb_dir: ${{ runner.temp }}/native-resource-cmdb
          cmdb_sha256: ${{ steps.native_control.outputs.cmdb_sha256 }}
          gitops_checkout: ${{ github.workspace }}/native-gitops
          gitops_commit: ${{ steps.native_control.outputs.gitops_commit }}
          access_file: ${{ steps.native_access.outputs.access_file }}
      - name: Revoke cloud access even if availability failed
        if: ${{ always() && steps.native_access.outcome != '' && steps.native_access.outcome != 'skipped' }}
        uses: ai-workspace-infra/iac_modules/.github/actions/prod-selfhost-access@254dd6321449ab12b862220c8876b482d7032fcd
        with:
          phase: close
          cmdb_file: ${{ runner.temp }}/native-resource-cmdb/cmdb.json
          cmdb_sha256: ${{ steps.native_control.outputs.cmdb_sha256 }}
          access_dir: ${{ runner.temp }}/prod-native-access-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Publish sanitized availability evidence only after successful cleanup
        uses: actions/upload-artifact@v4
        with:
          name: prod-availability-receipt
          path: ${{ runner.temp }}/prod-availability-receipt.json
          if-no-files-found: error

  native_prod_init:
    name: "[2] PROD | native empty schema only"
    if: ${{ github.event_name == 'workflow_dispatch' && (github.event.inputs.operation == 'native-init-plan' || github.event.inputs.operation == 'native-init') }}
    runs-on: ubuntu-latest
    environment: prod
    steps:
      - name: Checkout immutable control source
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
      - name: Checkout fixed IaC GCP authentication owner
        uses: actions/checkout@v7
        with:
          repository: ai-workspace-infra/iac_modules
          ref: 8373e926a6f7ba37a59a7b7ee864c7e87b102f58
          path: iac_modules
          persist-credentials: false
          sparse-checkout: .github/actions/auth-gcp-cloud
      - name: Verify configured PROD data review policy and exact successful standby/resource evidence
        id: native_init_control
        env:
          GH_TOKEN: ${{ github.token }}
        uses: ./.github/actions/prod-selfhost-control
        with:
          mode: initialization
          contract: .github/config/prod-native-init.yaml
          destination: ${{ runner.temp }}/native-resource-cmdb
      - name: Checkout fixed GitOps declaration
        uses: actions/checkout@v7
        with:
          repository: ai-workspace-infra/gitops
          ref: ${{ steps.native_init_control.outputs.gitops_commit }}
          path: native-gitops
          persist-credentials: false
      - name: Configure exact PROD GitHub OIDC deploy identity
        uses: ./.github/actions/configure-gcp-oidc
        with:
          environment: prod
          account_id: xworktech
          load_state_contract: 'false'
          vault_addr: https://vault.svc.plus
      - name: Configure cloud access runtime
        uses: google-github-actions/setup-gcloud@v2
      - name: Read only target PostgreSQL and registry runtime secrets
        id: native_vault
        uses: hashicorp/vault-action@v4
        with:
          url: https://vault.svc.plus
          method: jwt
          role: github-actions-platform-ops-toolkit-prod
          jwtGithubAudience: vault
          exportToken: false
          exportEnv: false
          secrets: |
            kv/data/prod/databases postgres_root_password | NATIVE_POSTGRES_PASSWORD ;
            kv/data/CICD GHCR_USERNAME | NATIVE_GHCR_USERNAME ;
            kv/data/CICD GHCR_TOKEN | NATIVE_GHCR_TOKEN
