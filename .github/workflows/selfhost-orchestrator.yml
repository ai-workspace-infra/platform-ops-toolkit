      terraform_project: ${{ steps.route.outputs.terraform_project }}
    steps:
    - name: Checkout repository
      uses: actions/checkout@v7
      with:
        ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.event.inputs.source_ref || 'main' }}
    - name: Route ref to an explicit profile
      id: route
      # env block inherited from job level — no repetition needed here
      run: |-
        ${{ github.workspace }}/.github/scripts/platform-ops/provision/platform-ops_provision_route-ref-to-an-explicit-profile.sh

    - name: Checkout GitOps selfhost routing declaration
      if: steps.route.outputs.run_infrastructure == 'true' || steps.route.outputs.run_application_deploy == 'true' || steps.route.outputs.toolkit_action == 'migrate'
      uses: actions/checkout@v7
      with:
        repository: ai-workspace-infra/gitops
        ref: ${{ steps.route.outputs.gitops_ref }}
        path: gitops
    - name: Set up YAML reader for the existing-host owner
      if: steps.route.outputs.reuse_existing_host == 'true' && steps.route.outputs.run_application_deploy == 'true'
      uses: ./.github/actions/setup-yq

    - name: Render existing AI Workspace CMDB through IaC
      if: steps.route.outputs.reuse_existing_host == 'true' && steps.route.outputs.run_application_deploy == 'true'
      uses: ai-workspace-infra/iac_modules/.github/actions/platform-resource-operations@bd098cba5acde525f2f1c4d3bc3a7bd6338c9077
      with:
        operation: existing-host
        environment: ${{ steps.route.outputs.deployment_env }}
        declaration: ${{ github.workspace }}/gitops/topology/${{ steps.route.outputs.deployment_env }}/selfhost/ai-workspace-existing.yaml
      env:
        EXISTING_TARGET_HOST: ${{ steps.route.outputs.existing_target_host }}
        EXISTING_TARGET_USER: ${{ steps.route.outputs.existing_target_user }}
        OUTPUT_DIR: ${{ runner.temp }}/existing-ai-workspace-cmdb

    - name: Resolve Agent Proxy machine service origins from GitOps
      id: agent_proxy_origins
      if: ${{ steps.route.outputs.run_application_deploy == 'true' && steps.route.outputs.terraform_action != 'destroy' && contains(fromJSON('["all","agent-proxy","agent-proxy-jp","agent-proxy-us","agent-proxy-sg","web-saas
        + agent-proxy"]'), steps.route.outputs.target_domains) }}
      run: ${{ github.workspace }}/.github/scripts/platform-ops/provision/platform-ops_provision_resolve-agent-proxy-service-origins.sh
      env:
        AGENT_CONTROLLER_URL: ${{ steps.route.outputs.agent_controller_url }}
        BILLING_SERVICE_BASE_URL: ${{ steps.route.outputs.billing_service_base_url }}
        DEPLOYMENT_ENV: ${{ steps.route.outputs.deployment_env }}
        GITOPS_SERVERLESS_ROUTING_YAML: ${{ github.workspace }}/gitops/topology/${{ steps.route.outputs.deployment_env }}/serverless/runtime-topology.yaml
    - name: Render GitOps selfhost routing declaration
      if: ${{ (steps.route.outputs.run_infrastructure == 'true' || steps.route.outputs.toolkit_action == 'migrate') && steps.route.outputs.terraform_action != 'destroy'
        && contains(fromJSON('["all","web-saas","web-saas + agent-proxy"]'), steps.route.outputs.target_domains) }}
      run: ${{ github.workspace }}/.github/scripts/gitops/prepare_gitops_routing_config.sh
      env:
        GITOPS_ROUTING_YAML: ${{ github.workspace }}/gitops/topology/${{ steps.route.outputs.deployment_env }}/selfhost/runtime-topology.yaml
        GITOPS_ROUTING_OUTPUT: ${{ runner.temp }}/selfhost-edge-routing.json
    - name: Validate GitOps selfhost routing contract
      if: ${{ (steps.route.outputs.run_infrastructure == 'true' || steps.route.outputs.toolkit_action == 'migrate') && steps.route.outputs.terraform_action != 'destroy'
        && contains(fromJSON('["all","web-saas","web-saas + agent-proxy"]'), steps.route.outputs.target_domains) }}
      run: python3 ${{ github.workspace }}/.github/scripts/gitops/validate_selfhost_contract.py
      env:
        GITOPS_ROUTING_CONFIG: ${{ runner.temp }}/selfhost-edge-routing.json
        EXPECTED_ENV: ${{ steps.route.outputs.deployment_env }}
        EXPECTED_TARGET_DOMAIN_BASE: ${{ steps.route.outputs.target_domain_base }}
    - name: Resolve Accounts migration target from GitOps
      id: resolve_migration_target
      if: ${{ (steps.route.outputs.run_infrastructure == 'true' || steps.route.outputs.toolkit_action == 'migrate') && steps.route.outputs.terraform_action != 'destroy'
        && contains(fromJSON('["all","web-saas","web-saas + agent-proxy"]'), steps.route.outputs.target_domains) }}
      run: ${{ github.workspace }}/.github/scripts/gitops/resolve_gitops_migration_target.sh
      env:
        GITOPS_ROUTING_CONFIG: ${{ runner.temp }}/selfhost-edge-routing.json
        MIGRATION_SERVICE: console
    - if: github.event_name == 'workflow_dispatch' && steps.route.outputs.run_infrastructure == 'true' && steps.route.outputs.reuse_existing_host != 'true'
      uses: actions/checkout@v4
      with:
        repository: ai-workspace-infra/iac_modules
        ref: be8456282f7495e098170e0894e742605a94dae6
        path: iac_modules
        persist-credentials: false
    - id: iac_target
      if: github.event_name == 'workflow_dispatch' && steps.route.outputs.run_infrastructure == 'true' && steps.route.outputs.reuse_existing_host != 'true'
      uses: ./iac_modules/.github/actions/iac-caller-targets
      with:
        iac-root: ${{ github.workspace }}/iac_modules
        gitops-root: ${{ github.workspace }}/gitops
        target-manifest: ${{ '' }}
        caller: selfhost
        topology-path: ''
        state-key: ${{ steps.route.outputs.state_key }}
        selectors: ${{ format('{{"environment":"{0}","project":"{1}","provider":"{2}","account":"{3}","workspace":"{4}"}}', steps.route.outputs.deployment_env, steps.route.outputs.terraform_project,
          steps.route.outputs.cloud_provider, steps.route.outputs.account, steps.route.outputs.terraform_namespace) }}
    - if: steps.route.outputs.reuse_existing_host == 'true' && steps.route.outputs.run_application_deploy == 'true'
      uses: actions/upload-artifact@v4
      with:
        name: iac-existing-host-${{ github.run_id }}-${{ github.run_attempt }}
        path: ${{ runner.temp }}/existing-ai-workspace-cmdb
        if-no-files-found: error
  iac:
    name: '[0A] IaC | unified resources pipeline'
    needs: resolve-targets
    if: needs.resolve-targets.result == 'success' && needs.resolve-targets.outputs.run_infrastructure == 'true' && needs.resolve-targets.outputs.reuse_existing_host
      != 'true'
    uses: ./.github/workflows/iac-pipeline-multi-cloud-master.yaml
    with:
      action: ${{ needs.resolve-targets.outputs.terraform_action }}
      environment: ${{ needs.resolve-targets.outputs.deployment_env }}
      target_manifest: ${{ needs.resolve-targets.outputs.target_manifest }}
      gitops_ref: ${{ needs.resolve-targets.outputs.gitops_sha }}
      iac_ref: ${{ needs.resolve-targets.outputs.iac_sha }}
      stage_scope: resources
      bootstrap_mode: verify
      correlation_id: ${{ github.run_id }}:${{ github.run_attempt }}:selfhost
      selectors: ${{ needs.resolve-targets.outputs.selectors }}
    secrets: inherit
  provision:
    if: ${{ !cancelled() && needs.resolve-targets.result == 'success' && (needs.iac.result == 'success' || (needs.iac.result == 'skipped' && (needs.resolve-targets.outputs.run_infrastructure
      != 'true' || needs.resolve-targets.outputs.reuse_existing_host == 'true'))) }}
    name: '[0B] Verify | receipt + deployment inventory'
    environment: ${{ (github.event_name == 'workflow_dispatch' && github.event.inputs.vault_env_path == 'prod') && 'prod' || (github.event_name == 'workflow_dispatch'
      && github.event.inputs.vault_env_path == 'uat' && 'uat' || (github.event_name == 'push' && github.ref == 'refs/heads/main' && 'uat' || ((startsWith(github.ref,
      'refs/tags/v') || startsWith(github.ref, 'refs/heads/release/v')) && 'prod' || ''))) }}
    runs-on: ${{ github.event.inputs.runner_type || 'ubuntu-latest' }}
    outputs:
      deployment_env: ${{ needs.resolve-targets.outputs.deployment_env }}
      resource_file: ${{ needs.resolve-targets.outputs.resource_file }}
      terraform_workspace: ${{ needs.resolve-targets.outputs.terraform_workspace }}
      state_key: ${{ needs.resolve-targets.outputs.state_key }}
      terraform_namespace: ${{ needs.resolve-targets.outputs.terraform_namespace }}
      terraform_workdir: ${{ needs.resolve-targets.outputs.terraform_workdir }}
      run_infrastructure: ${{ needs.resolve-targets.outputs.run_infrastructure }}
      run_application_deploy: ${{ needs.resolve-targets.outputs.run_application_deploy }}
      target_domains: ${{ needs.resolve-targets.outputs.target_domains }}
      deploy_tag: ${{ needs.resolve-targets.outputs.deploy_tag }}
      terraform_action: ${{ needs.resolve-targets.outputs.terraform_action }}
      toolkit_action: ${{ needs.resolve-targets.outputs.toolkit_action }}
      toolkit_ref: ${{ needs.resolve-targets.outputs.toolkit_ref }}
      infra_ref: ${{ needs.resolve-targets.outputs.infra_ref }}
      playbooks_ref: ${{ needs.resolve-targets.outputs.playbooks_ref }}
      gitops_ref: ${{ needs.resolve-targets.outputs.gitops_ref }}
      console_ref: ${{ needs.resolve-targets.outputs.console_ref }}
      offline_mode: ${{ needs.resolve-targets.outputs.offline_mode }}
      source_host: ${{ needs.resolve-targets.outputs.source_host }}
      source_domain_base: ${{ needs.resolve-targets.outputs.source_domain_base }}
      target_domain_base: ${{ needs.resolve-targets.outputs.target_domain_base }}
      env_suffix: ${{ needs.resolve-targets.outputs.env_suffix }}
      dns_mode: ${{ needs.resolve-targets.outputs.dns_mode }}
      vault_env_path: ${{ needs.resolve-targets.outputs.vault_env_path }}
      agent_controller_url: ${{ needs.resolve-targets.outputs.agent_controller_url }}
      agent_accounts_base_url: ${{ needs.resolve-targets.outputs.agent_accounts_base_url || needs.resolve-targets.outputs.agent_controller_url }}
      billing_service_base_url: ${{ needs.resolve-targets.outputs.billing_service_base_url }}
      cloud_provider: ${{ needs.resolve-targets.outputs.cloud_provider }}
      provider_gitops_dir: ${{ needs.resolve-targets.outputs.provider_gitops_dir }}
      account: ${{ needs.resolve-targets.outputs.account }}
      migration_target_host: ${{ needs.resolve-targets.outputs.migration_target_host }}
      hosts_infra_platform: ${{ steps.matrix.outputs.hosts_infra_platform || '[]' }}
      hosts_agent_proxy: ${{ steps.matrix.outputs.hosts_agent_proxy  || '[]' }}
      hosts_agent_proxy_iac: ${{ steps.agent_proxy_matrix.outputs.hosts_agent_proxy_iac || steps.matrix.outputs.hosts_agent_proxy || '[]' }}
      hosts_agent_proxy_non_iac: ${{ steps.agent_proxy_matrix.outputs.hosts_agent_proxy_non_iac || '[]' }}
      agent_proxy_region_count: ${{ steps.agent_proxy_matrix.outputs.agent_proxy_region_count || '0' }}
      include_external_agent_proxy: ${{ needs.resolve-targets.outputs.include_external_agent_proxy || 'true' }}
      reuse_existing_host: ${{ needs.resolve-targets.outputs.reuse_existing_host || 'false' }}
      existing_target_host: ${{ needs.resolve-targets.outputs.existing_target_host || '' }}
      existing_target_user: ${{ needs.resolve-targets.outputs.existing_target_user || '' }}
      hosts: ${{ steps.matrix.outputs.hosts || needs.resolve-targets.outputs.hosts || '[]' }}
      hosts_web_saas: ${{ steps.matrix.outputs.hosts_web_saas || needs.resolve-targets.outputs.hosts_web_saas || '[]' }}
      hosts_ai_workspace: ${{ steps.matrix.outputs.hosts_ai_workspace || needs.resolve-targets.outputs.hosts_ai_workspace || '[]' }}
      count: ${{ steps.matrix.outputs.count || needs.resolve-targets.outputs.count || '0' }}
    steps:
    - uses: actions/checkout@v4
      with:
        persist-credentials: false
    - if: needs.iac.result == 'success'
      uses: actions/checkout@v4
      with:
        repository: ai-workspace-infra/iac_modules
        ref: ${{ needs.iac.outputs.iac_sha }}
        path: iac_modules
        persist-credentials: false
    - if: needs.iac.result == 'success'
      uses: actions/download-artifact@v4
      with:
        artifact-ids: ${{ needs.iac.outputs.receipt_artifact_id }}
        merge-multiple: true
        path: ${{ runner.temp }}/iac-summary
    - id: verified_iac
      if: needs.iac.result == 'success'
      uses: ./iac_modules/.github/actions/iac-receipt-verify
      with:
        summary-file: ${{ runner.temp }}/iac-summary/summary.json
        receipt-sha256: ${{ needs.iac.outputs.receipt_sha256 }}
        run-id: ${{ github.run_id }}
        run-attempt: ${{ github.run_attempt }}
        gitops-sha: ${{ needs.resolve-targets.outputs.gitops_sha }}
        iac-sha: ${{ needs.resolve-targets.outputs.iac_sha }}
        target-manifest: ${{ needs.resolve-targets.outputs.target_manifest }}
        action: ${{ needs.resolve-targets.outputs.terraform_action }}
        correlation-id: ${{ github.run_id }}:${{ github.run_attempt }}:selfhost
    - if: needs.iac.result == 'success' && needs.resolve-targets.outputs.terraform_action == 'apply'
      uses: ./iac_modules/.github/actions/iac-caller-inventory
      with:
        summary-file: ${{ runner.temp }}/iac-summary/summary.json
        output-dir: ${{ runner.temp }}/cmdb-artifact
    - if: needs.resolve-targets.outputs.reuse_existing_host == 'true' && needs.resolve-targets.outputs.run_application_deploy == 'true'
      uses: actions/download-artifact@v4
      with:
        name: iac-existing-host-${{ github.run_id }}-${{ github.run_attempt }}
        path: ${{ runner.temp }}/cmdb-artifact
    - if: needs.resolve-targets.outputs.run_application_deploy == 'true'
      uses: actions/checkout@v4
      with:
        repository: ai-workspace-infra/gitops
        ref: ${{ needs.resolve-targets.outputs.gitops_sha || needs.resolve-targets.outputs.gitops_ref }}
        path: gitops
        persist-credentials: false
    - name: Build deploy matrix
      id: matrix
      if: needs.resolve-targets.outputs.run_infrastructure == 'true' && needs.resolve-targets.outputs.terraform_action == 'apply'
      working-directory: ${{ runner.temp }}/cmdb-artifact
      run: ${{ github.workspace }}/.github/scripts/platform-ops/provision/platform-ops_provision_build-deploy-matrix.sh
    - name: Build Agent Proxy IaC and non-IaC matrices
      id: agent_proxy_matrix
      if: ${{ needs.resolve-targets.outputs.run_infrastructure == 'true' && needs.resolve-targets.outputs.terraform_action == 'apply' && needs.resolve-targets.outputs.cloud_provider
        == 'akamai-cloud' && contains(fromJSON('["all","agent-proxy","web-saas + agent-proxy"]'), needs.resolve-targets.outputs.target_domains) }}
      env:
        CMDB_FILE: ${{ runner.temp }}/cmdb-artifact/cmdb.json
        HOSTS_MANIFEST_FILE: ${{ runner.temp }}/cmdb-artifact/hosts_manifest.json
        DEPLOYMENT_ENV: ${{ needs.resolve-targets.outputs.deployment_env }}
        GITOPS_XCONNECT_CONFIG: ${{ github.workspace }}/gitops/topology/${{ needs.resolve-targets.outputs.deployment_env }}/selfhost/${{ needs.resolve-targets.outputs.deployment_env
          == 'uat' && 'xconnect-regional-pool.yaml' || 'xconnect-regional-pools.yaml' }}
        AGENT_PROXY_NAMESPACE: ${{ needs.resolve-targets.outputs.terraform_namespace }}
      run: python3 ${{ github.workspace }}/.github/scripts/platform-ops/provision/platform-ops_provision_build-agent-proxy-matrices.py
    - name: Authenticate Vault for the existing application credential preparation
      if: needs.resolve-targets.outputs.run_application_deploy == 'true' && needs.resolve-targets.outputs.terraform_action == 'apply'
      uses: hashicorp/vault-action@v4
      with:
        url: ${{ env.VAULT_ADDR }}
        method: jwt
        role: ${{ env.VAULT_ROLE }}
        jwtGithubAudience: vault
        exportToken: true
        outputToken: true
    - name: Initialize Databases Credentials
      if: ${{ needs.resolve-targets.outputs.run_application_deploy == 'true' && needs.resolve-targets.outputs.terraform_action == 'apply' }}
      env:
        VAULT_ENV_PATH: ${{ needs.resolve-targets.outputs.vault_env_path }}
      run: ${{ github.workspace }}/.github/scripts/platform-ops/provision/platform-ops_provision_initialize-databases-credentials.sh
    - name: Initialize Agent Proxy Credentials
      if: ${{ needs.resolve-targets.outputs.run_application_deploy == 'true' && needs.resolve-targets.outputs.terraform_action == 'apply' && contains(fromJSON('["all","agent-proxy","agent-proxy-jp","agent-proxy-us","agent-proxy-sg","web-saas
        + agent-proxy"]'), needs.resolve-targets.outputs.target_domains) }}
      env:
        VAULT_ENV_PATH: ${{ needs.resolve-targets.outputs.vault_env_path }}
      run: ${{ github.workspace }}/.github/scripts/platform-ops/provision/platform-ops_provision_initialize-agent-proxy-credentials.sh
    - name: Remove application preparation token from later step environments
      if: always()
      shell: bash
      run: printf 'VAULT_TOKEN=\n' >> "$GITHUB_ENV"
    - name: Upload CMDB artifact
      if: ${{ (needs.resolve-targets.outputs.run_infrastructure == 'true' && needs.resolve-targets.outputs.terraform_action == 'apply') || (needs.resolve-targets.outputs.reuse_existing_host
        == 'true' && needs.resolve-targets.outputs.run_application_deploy == 'true') }}
      uses: actions/upload-artifact@v7
      with:
        name: platform-ops-toolkit-cmdb
        path: ${{ runner.temp }}/cmdb-artifact
        if-no-files-found: error
    needs:
    - resolve-targets
    - iac

  # target_domains=all is not complete until the UAT XConnect Zero control/data
  # plane is reconciled. Keep this as a separate workflow so its existing-One
  # state and Vault role remain independent from provider-specific resources.
  # The external Gateway and One records are configurable inputs; the defaults
  # are the current UAT topology, not provider-specific logic.
  deploy_xconnect_zero_uat:
    name: "[0B] XConnect Zero UAT / existing One"
    needs: [provision]
    if: >-
      ${{ !cancelled() &&
      needs.provision.result == 'success' &&
      needs.provision.outputs.deployment_env == 'uat' &&
      needs.provision.outputs.target_domains == 'all' &&
      needs.provision.outputs.run_application_deploy == 'true' &&
      needs.provision.outputs.terraform_action == 'apply' }}
    runs-on: ${{ github.event.inputs.runner_type || 'ubuntu-latest' }}
    steps:
    - name: Checkout toolkit
      uses: actions/checkout@v7
      with:
        ref: main
        persist-credentials: false

    - name: Dispatch and wait for XConnect Zero UAT
      env:
        GH_TOKEN: ${{ github.token }}
        GH_REPO: ai-workspace-infra/platform-ops-toolkit
        XCONNECT_WORKFLOW: xconnect-zero-cloud.yaml
        XCONNECT_REF: main
        XCONNECT_GATEWAY_REF: ${{ github.event.inputs.xconnect_gateway_ref || 'tw-xconnect.svc.plus' }}
      run: .github/scripts/platform-ops/provision/platform-ops_provision_dispatch-xconnect-uat.sh



  # ---------------------------------------------------------------------------
  # 步骤 2: 基础环境安装 (Bootstrap Deploy)
  # ---------------------------------------------------------------------------
  deploy_base:
    name: "[1] Bootstrap | ${{ matrix.host }}"
    # 只初始化节点；服务安装由后续 deploy_* jobs 负责。
    needs: provision
    if: >-
      ${{ !cancelled() &&
      needs.provision.result == 'success' &&
      needs.provision.outputs.run_application_deploy == 'true' &&
      (needs.provision.outputs.terraform_action == 'apply' ||
      needs.provision.outputs.reuse_existing_host == 'true') &&
      needs.provision.outputs.count != '0' &&
      needs.provision.outputs.hosts != '[]' &&
      needs.provision.outputs.hosts != '' }}
    runs-on: ${{ github.event.inputs.runner_type || 'ubuntu-latest' }}
    strategy:
      fail-fast: false
      matrix:
        host: ${{ fromJSON(needs.provision.outputs.hosts) }}
    env:
      MATRIX_HOST:              ${{ matrix.host }}
      ANSIBLE_HOST_KEY_CHECKING: "False"
      ANSIBLE_PIPELINING:       "True"
      ANSIBLE_SSH_ARGS:         "-o ControlMaster=auto -o ControlPersist=60s -o IdentityFile=~/.ssh/id_deploy -o StrictHostKeyChecking=no"
      TARGET_DOMAIN_BASE:       ${{ needs.provision.outputs.target_domain_base }}
      TARGET_DOMAINS:            ${{ needs.provision.outputs.target_domains }}
    steps:
    - name: Checkout repository
      uses: actions/checkout@v7
      with:
        ref: ${{ needs.provision.outputs.toolkit_ref }}

    - name: Checkout playbooks
      uses: actions/checkout@v7
      with:
        repository: ai-workspace-infra/playbooks
        ref: ${{ needs.provision.outputs.playbooks_ref }}
        path: playbooks

    - name: Checkout GitOps Agent Proxy resources
      if: >-
        ${{ contains(fromJSON('["all","web-saas","open-platform","ai-workspace","agent-proxy-jp","agent-proxy-us","agent-proxy-sg","agent-proxy","web-saas + agent-proxy"]'),
        needs.provision.outputs.target_domains) }}
      uses: actions/checkout@v7
      with:
        repository: ai-workspace-infra/gitops
        ref: ${{ needs.provision.outputs.gitops_ref }}
        path: gitops
        sparse-checkout-cone-mode: false
        sparse-checkout: |
          resources/svc.plus/${{ needs.provision.outputs.deployment_env }}/${{ needs.provision.outputs.provider_gitops_dir }}/agent-proxy*.yaml

    # The AI Workspace playbook builds the Hermes ACP adapter from the
    # sibling xworkmate-bridge checkout when the prebuilt bridge override is
    # not enabled. Keep this source checkout scoped to AI Workspace runs so
    # other domains do not gain an unnecessary cross-repository dependency.
    - name: Load GitHub App private key for AI Workspace source
      if: ${{ contains(fromJSON('["all","ai-workspace"]'), needs.provision.outputs.target_domains) }}
      id: xworkmate-vault
      uses: hashicorp/vault-action@v4
      with:
        url: ${{ env.VAULT_ADDR }}
        method: jwt
        role: ${{ env.VAULT_ROLE }}
        jwtGithubAudience: vault
        secrets: |
          kv/data/CICD/github-app/daily-snapshot app_private_key | APP_PRIVATE_KEY

    - name: Create GitHub App installation token for AI Workspace source
      if: ${{ contains(fromJSON('["all","ai-workspace"]'), needs.provision.outputs.target_domains) }}
      id: xworkmate-app-token
      uses: actions/create-github-app-token@v3
      with:
        client-id: Iv23liNwStpQIiXajhpb
        private-key: ${{ steps.xworkmate-vault.outputs.APP_PRIVATE_KEY }}
        owner: ai-workspace-lab
        repositories: xworkmate-bridge
        permission-contents: read

    - name: Checkout AI Workspace bridge source
      if: ${{ contains(fromJSON('["all","ai-workspace"]'), needs.provision.outputs.target_domains) }}
      uses: actions/checkout@v7
      with:
        repository: ai-workspace-lab/xworkmate-bridge
        ref: ${{ github.event.inputs.source_ref || 'main' }}
        token: ${{ steps.xworkmate-app-token.outputs.token }}
        path: xworkmate-bridge

    - name: Download CMDB
      uses: actions/download-artifact@v8
      with:
        name: platform-ops-toolkit-cmdb
        path: cmdb

    - name: Resolve agent-proxy source CIDRs for Billing Caddy
      env:
        CMDB_FILE: cmdb/cmdb.json
        DEPLOY_ENV: ${{ needs.provision.outputs.deployment_env }}
        # Public, non-secret UAT state only. Production keeps the empty
        # default and therefore cannot consume this split-state escape hatch.
        BILLING_AGENT_PROXY_CIDRS_OVERRIDE: ${{ vars.UAT_BILLING_AGENT_PROXY_CIDRS || '' }}
        GITOPS_AGENT_PROXY_RESOURCE_DIR: ${{ github.workspace }}/gitops/resources/svc.plus/${{ needs.provision.outputs.deployment_env }}/${{ needs.provision.outputs.provider_gitops_dir }}
      run: ${{ github.workspace }}/.github/scripts/platform-ops/deploy/platform-ops_deploy_base_resolve-billing-agent-cidrs.sh

    - name: Load Vault secrets
      id: vault
      uses: hashicorp/vault-action@v4
      with:
        url: ${{ env.VAULT_ADDR }}
        method: jwt
        role: ${{ env.VAULT_ROLE }}
        jwtGithubAudience: vault
        exportToken: true
        ignoreNotFound: true
        secrets: |
          ${{ env.VAULT_KV_BASE }} SSH_PRIVATE_DEPLOY_KEY_B64 | ANSIBLE_SSH_KEY_B64 ;
          ${{ env.VAULT_KV }} ROOT_BOOTSTRAP_PASSWORD | ROOT_BOOTSTRAP_PASSWORD ;
          ${{ env.VAULT_KV_DATABASES }} account_pg_password | ACCOUNT_PG_PASSWORD ;
          ${{ env.VAULT_KV }} AI_WORKSPACE_AUTH_TOKEN | AI_WORKSPACE_AUTH_TOKEN ;
          ${{ env.VAULT_KV }} GHCR_USERNAME | GHCR_USERNAME ;
          ${{ env.VAULT_KV }} GHCR_TOKEN | GHCR_PASSWORD ;
          ${{ env.VAULT_KV_DATABASES }} postgres_root_password | WEB_SAAS_POSTGRES_PASSWORD ;
          ${{ env.VAULT_KV_DATABASES }} account_pg_password | WEB_SAAS_ACCOUNT_PG_PASSWORD ;
          ${{ env.VAULT_KV_WEB_SAAS }} AUTH_TOKEN_PUBLIC_TOKEN | WEB_SAAS_AUTH_TOKEN_PUBLIC_TOKEN ;
          ${{ env.VAULT_KV_WEB_SAAS }} AUTH_TOKEN_REFRESH_SECRET | WEB_SAAS_AUTH_TOKEN_REFRESH_SECRET ;
          ${{ env.VAULT_KV_WEB_SAAS }} AUTH_TOKEN_ACCESS_SECRET | WEB_SAAS_AUTH_TOKEN_ACCESS_SECRET ;
          ${{ env.VAULT_KV_WEB_SAAS }} STUNNEL_CA_CERT_B64 | WEB_SAAS_STUNNEL_CA_CERT_B64 ;
          ${{ env.VAULT_KV_WEB_SAAS }} STUNNEL_SERVER_CERT_B64 | WEB_SAAS_STUNNEL_SERVER_CERT_B64 ;
          ${{ env.VAULT_KV_WEB_SAAS }} STUNNEL_SERVER_KEY_B64 | WEB_SAAS_STUNNEL_SERVER_KEY_B64 ;
          ${{ env.VAULT_KV }} CLOUDFLARE_DNS_API_TOKEN | CLOUDFLARE_DNS_API_TOKEN

    # OAUTH_* / INTERNAL_SERVICE_TOKEN 是真正可选的(不影响是否能起服务),
    # 但 vault-action 的 ignoreNotFound 只在整个 KV 路径 404 时生效 —— 路径
    # 存在而某个键缺失照样硬失败。放到独立脚本里自己读、缺则空。
    # 脚本自己走 GitHub OIDC -> Vault JWT role 认证(与 vault-action 内部
    # 做的事一样), 不依赖上一步导出的静态 token —— 那只是别处场景下的可选
    # fallback, 不该在这里造出一条"依赖前一步是否恰好导出了 token"的隐式
    # 耦合。ACTIONS_ID_TOKEN_REQUEST_URL/TOKEN 由 id-token: write 权限
    # (workflow 顶层已声明)自动注入, 无需在此显式传递。
    - name: Load optional web-saas secrets
      run: ${{ github.workspace }}/.github/scripts/platform-ops/deploy/platform-ops_deploy_base_load-optional-web-saas.sh

    # SSH 可达不等于机器可用。新 VPS 此时通常还在跑 cloud-init 与
    # unattended-upgrades, 它们持有 dpkg 前端锁 —— 后续任何 apt 任务撞上
    # 就会中止整个部署(r8 即因此在 vector 安装处断掉, 结果 agent-proxy 上
    # xray / exporter / vector 一个都没装上)。
    #
    # 在 bootstrap 阶段等一次, 就是 deploy_base "把基础条件准备就绪" 的含义:
    # 后面每个 job 面对的都是首次启动已收敛的机器, 而不是靠每个 apt 任务
    # 各自挂一个长超时去兜底。
    - name: Cache pip packages
      uses: actions/cache@v6
      with:
        path: ~/.cache/pip
        key: ${{ runner.os }}-pip-ansible-v1
        restore-keys: |
          ${{ runner.os }}-pip-

    - name: Setup deployment runner
      uses: ai-workspace-infra/playbooks/.github/actions/setup-deployment-runner@2d326409ccfbd5f6e862c3dc08660e0ae12fb51d
      with:
        ssh_key_b64: ${{ steps.vault.outputs.ANSIBLE_SSH_KEY_B64 }}
        matrix_host: ${{ matrix.host }}
        wait_for_ssh: 'true'
        wait_for_package_init: 'true'
        install_ansible: 'true'

    # 证书持久化。主机重建会把 caddy_data 卷一起丢掉, 于是每次重建都重新签发,
    # 撞上 Let's Encrypt "同一组域名 5 次/周" 的限流 —— 2026-07-28 console-uat
    # 就是这么挂的(HTTP 429, retry after 20:38 UTC), 而且没有任何代码能修, 只能等。
    #
    # 顺序: 先恢复(bootstrap 之后、Doco-CD 把 caddy 拉起来之前), 让 caddy 一起来
    # 就发现证书已在, 根本不调 ACME; 部署末尾再备份, 把这一轮可能新签的证书存回去。
    - name: Restore domain TLS state from Vault before Caddy can issue
      id: tls_restore
      # Agent Proxy owns a public Caddy vhost too.  The combined UAT path
      # deploys it after serverless web-saas, so restore the shared wildcard
      # certificate for agent-proxy-only runs as well; otherwise the playbook
      # correctly refuses to fall back to ACME on a fresh node.
      if: ${{ contains(needs.provision.outputs.target_domains, 'web-saas') || contains(needs.provision.outputs.target_domains, 'agent-proxy') || needs.provision.outputs.target_domains == 'all' }}
      env:
        VAULT_ROLE: ${{ env.VAULT_ROLE }}
        VAULT_CADDY_PATH: kv/data/CICD/domains/${{ needs.provision.outputs.target_domain_base }}
        # Public wildcard PEM is separate from web-saas/certs/, which belongs
        # to stunnel's internal CA. Non-Caddy consumers use current/{fullchain,
        # cert,key,ca}.pem below; `current` flips atomically after validation.
        DOMAIN_TLS_DIR: /etc/xcontrol/tls/${{ needs.provision.outputs.target_domain_base }}
      run: python3 ${{ github.workspace }}/.github/scripts/platform-ops/deploy/prepare-domain-tls-restore.py

    - name: Checkout reviewed Caddy PEM restore owner
      if: ${{ steps.tls_restore.outputs.restore_required == 'true' }}
      uses: actions/checkout@v7
      with:
        repository: ai-workspace-infra/playbooks
        ref: 14f6196bbf69b78d07f1adb9fb8c97bc816a485b
        path: caddy-restore-playbooks

    - name: Restore PEM with pinned Playbooks Role
      if: ${{ steps.tls_restore.outputs.restore_required == 'true' }}
      env:
        TLS_RESTORE_VARS_FILE: ${{ steps.tls_restore.outputs.vars_file }}
      run: >-
        ansible-playbook -i cmdb/inventory.ini
        caddy-restore-playbooks/caddy_certificate_restore.yml
        -e "@${TLS_RESTORE_VARS_FILE}"

    - name: Remove runtime PEM variables
      if: ${{ always() && steps.tls_restore.outputs.vars_file != '' }}
      env:
        TLS_RESTORE_VARS_FILE: ${{ steps.tls_restore.outputs.vars_file }}
      run: rm -f -- "${TLS_RESTORE_VARS_FILE}"

    - name: Bootstrap node according to CMDB role
      working-directory: playbooks
      env:
        # The new UAT open-platform VPS is bootstrapped before DNS cutover.
        # Keep VAULT_ADDR public here so create_databases_and_users can read
        # kv/data/uat/databases, while the bootstrap helper passes the Vault
        # service health/CLI address as an Ansible extra var locally.
        OPEN_PLATFORM_LOCAL_VAULT_ADDR: >-
          ${{ needs.provision.outputs.target_domains == 'open-platform' &&
          needs.provision.outputs.deployment_env == 'uat' &&
          needs.provision.outputs.cloud_provider == 'akamai-cloud' &&
          'http://127.0.0.1:8200' || '' }}
        OPEN_PLATFORM_SERVICE: ${{ github.event.inputs.open_platform_service || 'all' }}
        OPEN_PLATFORM_MCP_SERVICES: ${{ 'none' }}
        # The explicit deployment-only mode permits a fresh IAM unit to start
        # before environment-scoped business secrets are migrated. Normal
        # service deployments keep strict Vault secret validation.
        OPEN_PLATFORM_DEPLOY_ONLY: >-
          ${{ needs.provision.outputs.target_domains == 'open-platform' &&
          needs.provision.outputs.deployment_env == 'uat' &&
          needs.provision.outputs.cloud_provider == 'akamai-cloud' &&
          'true' || 'false' }}
        # The inherited VAULT_TOKEN authenticates to the external CI/CD Vault
        # for KV reads. A fresh local Vault must generate and persist its own
        # root token instead of treating that external token as local admin.
        VAULT_BOOTSTRAP_GENERATE_ROOT_TOKEN: >-
          ${{ needs.provision.outputs.target_domains == 'open-platform' &&
          needs.provision.outputs.deployment_env == 'uat' &&
          needs.provision.outputs.cloud_provider == 'akamai-cloud' &&
          'true' || 'false' }}
        # vault-action exportToken: true writes VAULT_TOKEN to GITHUB_ENV.
        # Do not overwrite it with the non-existent vault_token output.
        # MATRIX_HOST / ANSIBLE_HOST_KEY_CHECKING / ANSIBLE_SSH_ARGS / TARGET_DOMAIN_BASE from job env
        #
        # web_saas_host_config 角色读这些环境变量渲染主机侧配置(见
        # playbooks roles/vhosts/web_saas_host_config/defaults/main.yml)。
        # 只在 web_saas 组的主机上才会用到 —— 其他域的 bootstrap 脚本
        # 会忽略它们。空值时角色自己的断言会给出指名道姓的错误, 而不是
        # 静默渲染出一个能起来但连不上的服务。
        WEB_SAAS_POSTGRES_PASSWORD:        ${{ steps.vault.outputs.WEB_SAAS_POSTGRES_PASSWORD }}
        ACCOUNT_PG_PASSWORD:               ${{ steps.vault.outputs.WEB_SAAS_ACCOUNT_PG_PASSWORD }}
        # Billing and Accounts share account/account_user. Keep the compose
        # compatibility variable, but source it from the canonical account
        # credential rather than a separate billing secret.
        BILLING_DB_PASSWORD:               ${{ steps.vault.outputs.WEB_SAAS_ACCOUNT_PG_PASSWORD }}
        # The canonical root email is not a secret and older Vault mounts do
        # not contain ROOT_BOOTSTRAP_EMAIL. Use a Vault value when present,
        # otherwise keep fresh UAT bootstrap compatible with the accounts
        # service's documented admin identity.
        ROOT_BOOTSTRAP_EMAIL:              ${{ steps.vault.outputs.ROOT_BOOTSTRAP_EMAIL || 'admin@svc.plus' }}
        ROOT_BOOTSTRAP_PASSWORD:           ${{ steps.vault.outputs.ROOT_BOOTSTRAP_PASSWORD }}
        AUTH_TOKEN_PUBLIC_TOKEN:           ${{ steps.vault.outputs.WEB_SAAS_AUTH_TOKEN_PUBLIC_TOKEN }}
        AUTH_TOKEN_REFRESH_SECRET:         ${{ steps.vault.outputs.WEB_SAAS_AUTH_TOKEN_REFRESH_SECRET }}
        AUTH_TOKEN_ACCESS_SECRET:          ${{ steps.vault.outputs.WEB_SAAS_AUTH_TOKEN_ACCESS_SECRET }}
        # Billing consumes the explicit multi-source exporter contract from
        # Vault. It must be reachable from web-saas; never use a loopback URL
        # for an exporter running on agent-proxy.
        # The optional-web-saas loader exports EXPORTER_SOURCES_JSON through
        # GITHUB_ENV. It uses Vault when present and a UAT-only default when
        # the non-secret source routing key has not been initialized yet.
        # OAUTH_GITHUB_CLIENT_ID / OAUTH_GITHUB_CLIENT_SECRET / OAUTH_GOOGLE_CLIENT_ID /
        # OAUTH_GOOGLE_CLIENT_SECRET / INTERNAL_SERVICE_TOKEN 由上面 "Load optional
        # web-saas secrets" 写进 GITHUB_ENV, 此处不再重复声明 —— 它们已经是这个
        # step 的环境变量, 重复写只会用同名 env 覆盖同名 env, 没有意义。
        WEB_SAAS_STUNNEL_CA_CERT_B64:      ${{ steps.vault.outputs.WEB_SAAS_STUNNEL_CA_CERT_B64 }}
        WEB_SAAS_STUNNEL_SERVER_CERT_B64:  ${{ steps.vault.outputs.WEB_SAAS_STUNNEL_SERVER_CERT_B64 }}
        WEB_SAAS_STUNNEL_SERVER_KEY_B64:   ${{ steps.vault.outputs.WEB_SAAS_STUNNEL_SERVER_KEY_B64 }}
        # Doco-CD 角色用这两个做 docker login, 生成 /root/.docker/config.json ——
        # compose 把那个文件挂进容器好拉私有镜像。不传的话 Docker 会用一个
        # 自动创建的空目录顶上, Doco-CD 照样 healthy, 但每次轮询都以
        # "failed to pull images: unauthorized" 结束, 从容器状态上看不出来。
        GHCR_USERNAME:                     ${{ steps.vault.outputs.GHCR_USERNAME }}
        GHCR_PASSWORD:                     ${{ steps.vault.outputs.GHCR_PASSWORD }}
        # 计费域密钥由上面的 optional-web-saas loader 写入 GITHUB_ENV。
        # loader 将 SANDBOX_/PROD_ 前缀映射为这些运行时变量；缺失时
        # accounts 的 Stripe 客户端保持 disabled，不阻塞其余服务启动。
        # Deploy and migration share one base-domain contract. The playbooks
        # derive Accounts' tenant host from TARGET_DOMAIN_BASE; no separate
        # source/forwarded-host input is accepted.
        TARGET_DOMAIN_BASE:                ${{ needs.provision.outputs.target_domain_base }}
        DEPLOY_ENV:                        ${{ needs.provision.outputs.deployment_env }}
        # Public Bridge ingress belongs to the deployment domain.  Vault may
        # override it for a separately hosted Bridge, but it never falls back
        # to a source-zone URL.
        XWORKMATE_BRIDGE_SERVER_URL:       ${{ env.XWORKMATE_BRIDGE_SERVER_URL || format('https://bridge-{0}.{1}', needs.provision.outputs.deployment_env, needs.provision.outputs.target_domain_base) }}
        # The VPS Caddy vhosts use the mode-qualified selfhost names. DNS keeps
        # the public environment aliases separate and points them at these
        # selfhost targets.
        WEB_SAAS_CONSOLE_DOMAIN:           ${{ format('console-selfhost-{0}.{1}', needs.provision.outputs.deployment_env, needs.provision.outputs.target_domain_base) }}
        WEB_SAAS_ACCOUNTS_DOMAIN:          ${{ format('accounts-selfhost-{0}.{1}', needs.provision.outputs.deployment_env, needs.provision.outputs.target_domain_base) }}
        WEB_SAAS_BILLING_DOMAIN:           ${{ format('billing-selfhost-{0}.{1}', needs.provision.outputs.deployment_env, needs.provision.outputs.target_domain_base) }}
        AGENT_CONTROLLER_URL:              ${{ needs.provision.outputs.agent_accounts_base_url }}
        # Agent Proxy follows the same immutable deploy tag as the rest of the
        # environment. The repository was migrated to xconnect-edge-agent;
        # do not silently deploy the legacy x-evor repository or main.
        AGENT_REPO_URL:                    https://github.com/ai-workspace-xstream/xconnect-edge-agent.git
        AGENT_REPO_VERSION:                ${{ needs.provision.outputs.deploy_tag }}
        AGENT_PROXY_VERSION:               ${{ needs.provision.outputs.deploy_tag }}
        AGENT_SVC_PLUS_MANAGE_SOURCE_CHECKOUT: "true"
        AGENT_SVC_PLUS_BUILD_ON_TARGET:    "true"
        # 给了它 web_saas_host_config 就渲染 DNS-01 + *.<base> 泛域名 Caddyfile,
        # 没给就退回逐域名 HTTP-01。HTTP-01 要求 A 记录已经指向本机, 而交付顺序
        # 是"先部署新主机、最后才切 DNS" —— 切换之前签不出证书。
        CLOUDFLARE_DNS_API_TOKEN:          ${{ steps.vault.outputs.CLOUDFLARE_DNS_API_TOKEN }}
      run: ${{ github.workspace }}/playbooks/scripts/pipeline/bootstrap-node.sh

  # ---------------------------------------------------------------------------
  # Pre-upgrade data fingerprint for accept_web_saas_upgrade.
  #
  # It must run before update_gitops_tags: the tag commit is what makes Doco-CD
  # roll the new images, and a fingerprint taken after that would compare the
  # upgrade with itself. Read-only on the database; the fingerprint stays on the
  # host. A fresh host simply records that no account database existed yet.
  # PROD is excluded until promotion of this gate to PROD is decided explicitly.
  # ---------------------------------------------------------------------------
  capture_web_saas_baseline:
    name: "[1] Web SaaS baseline | ${{ matrix.host }}"
    outputs:
      baseline_data_run_id: ${{ steps.dispatch.outputs.data_run_id }}
      baseline_state: ${{ steps.receipt.outputs.captured_state }}
      acceptance_mode: ${{ steps.receipt.outputs.acceptance_mode }}
    needs: [provision]
    if: >-
      ${{ !cancelled() &&
      needs.provision.result == 'success' &&
      needs.provision.outputs.run_application_deploy == 'true' &&
      needs.provision.outputs.terraform_action == 'apply' &&
      needs.provision.outputs.deployment_env != 'prod' &&
      needs.provision.outputs.count != '0' &&
      contains(fromJSON('["all","web-saas","web-saas + agent-proxy"]'), needs.provision.outputs.target_domains) &&
      needs.provision.outputs.hosts_web_saas != '[]' &&
      needs.provision.outputs.hosts_web_saas != '' }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        host: ${{ fromJSON(needs.provision.outputs.hosts_web_saas) }}
    steps:
    - name: Check out the toolkit dispatcher
      uses: actions/checkout@v7
      with:
        ref: ${{ github.sha }}

    - name: Dispatch owned read-only baseline and wait for its receipt
      id: dispatch
      env:
        GH_TOKEN: ${{ github.token }}
        DATA_OPERATION: selfhost_probe
        DATA_ENVIRONMENT: ${{ needs.provision.outputs.deployment_env }}
        DATA_CONFIG_JSON: '{"action":"baseline","target_host":"${{ matrix.host }}","acceptance_run_id":"${{ github.run_id }}","caller_run_id":"${{ github.run_id }}"}'
        RELEASE_TAG: ${{ needs.provision.outputs.deploy_tag }}
        ACCOUNTS_REF: ${{ needs.provision.outputs.deploy_tag || 'main' }}
        DATA_WORKFLOW_REF: main
        WEB_SAAS_HOSTS_JSON: ${{ needs.provision.outputs.hosts_web_saas }}
      run: |
        python3 - <<'PY'
        import json, os
        expected = ['web-saas-' + os.environ['DATA_ENVIRONMENT']]
        if json.loads(os.environ['WEB_SAAS_HOSTS_JSON']) != expected:
            raise SystemExit('baseline dispatch requires one canonical environment host; multi-host receipts need a separate reviewed mapping')
        PY
        python3 .github/scripts/environment-upgrade/dispatch.py

    - name: Download baseline receipt from the correlated child run
      uses: actions/download-artifact@v8
      with:
        name: selfhost-baseline-${{ matrix.host }}
        repository: ai-workspace-infra/platform-ops-toolkit
        run-id: ${{ steps.dispatch.outputs.data_run_id }}
        github-token: ${{ github.token }}
        path: ${{ runner.temp }}/selfhost-baseline

    - name: Verify receipt is real and bound to this parent, child, and host
      id: receipt
      env:
        RECEIPT_PATH: ${{ runner.temp }}/selfhost-baseline/baseline.json
        EXPECTED_PARENT_RUN_ID: ${{ github.run_id }}
        EXPECTED_BASELINE_RUN_ID: ${{ steps.dispatch.outputs.data_run_id }}
        EXPECTED_HOST: ${{ matrix.host }}
        EXPECTED_ACCEPTANCE_RUN_ID: ${{ github.run_id }}
      run: python3 .github/scripts/environment-upgrade/read-selfhost-baseline-state.py

  # ---------------------------------------------------------------------------
  # 步骤 2.5: 自动推进 GitOps 版本
  # 如果用户在触发流程时显式指定了 deploy_tag，我们将替用户自动把新的 tag 写入
  # ai-workspace-infra/gitops 并提交，以打通 CI 到 Pull-Only CD 的闭环。
  # ---------------------------------------------------------------------------
  update_gitops_tags:
    name: "[1] GitOps | deploy tags"
    needs: [provision, capture_web_saas_baseline]
    if: >-
      ${{ !cancelled() &&
      needs.provision.result == 'success' &&
      (needs.capture_web_saas_baseline.result == 'success' || needs.capture_web_saas_baseline.result == 'skipped') &&
      needs.provision.outputs.run_application_deploy == 'true' &&
      needs.provision.outputs.terraform_action == 'apply' &&
      needs.provision.outputs.deploy_tag != '' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout playbook scripts
        uses: actions/checkout@v7
        with:
          repository: ai-workspace-infra/playbooks
          ref: main

      - name: Load GitHub App private key from Vault
        id: vault
        uses: hashicorp/vault-action@v4
        with:
          url: https://vault.svc.plus
          method: jwt
          role: ${{ env.VAULT_ROLE }}
          jwtGithubAudience: vault
          secrets: |
            kv/data/CICD/github-app/daily-snapshot app_private_key | APP_PRIVATE_KEY

      - name: Create GitHub App installation token
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: Iv23liNwStpQIiXajhpb
          private-key: ${{ steps.vault.outputs.APP_PRIVATE_KEY }}
          owner: ai-workspace-infra

      - name: Checkout GitOps repository
        uses: actions/checkout@v7
        with:
          repository: ai-workspace-infra/gitops
          ref: ${{ needs.provision.outputs.gitops_ref }}
          token: ${{ steps.app-token.outputs.token }}
          path: gitops

      # web-saas 域更新
      - name: Update web-saas tags
        if: ${{ contains(needs.provision.outputs.target_domains, 'web-saas') || needs.provision.outputs.target_domains == 'all' }}
        env:
          DOMAIN: web-saas
          DEPLOY_ENV: ${{ needs.provision.outputs.deployment_env }}
          DEPLOY_TAG: ${{ needs.provision.outputs.deploy_tag }}
          # XWORKMATE_BRIDGE_IMAGE 暂时移出托管列表: ai-workspace-lab/xworkmate-bridge
          # 的 Pipeline 只把镜像推成 commit SHA tag, 不产出 uat-daily-build-* tag
          # (见 run 31769621656: tags: ...xworkmate-bridge:050977839b46...)。留在
          # 列表里会把 .env.uat 改写成 GHCR 里不存在的 tag, compose 整体 pull 失败,
          # 于是整个 web-saas stack 都起不来 —— 2026-08-14 就是这样把 UAT 打挂的
          # (run 31773108095: DB Init 等 postgres 超时, accounts 迁移 exit 125)。
          # bridge 流水线补上 daily-build tag 之后再加回来。
          MANAGED_IMAGES: ACCOUNTS_IMAGE BILLING_IMAGE CONSOLE_IMAGE
        run: bash .github/scripts/gitops-update-tags.sh

      # open-platform 域更新 (根据需要可以补充 MANAGED_IMAGES)
      - name: Update open-platform tags
        if: ${{ contains(needs.provision.outputs.target_domains, 'open-platform') || needs.provision.outputs.target_domains == 'all' }}
        env:
          DOMAIN: open-platform
          DEPLOY_ENV: ${{ needs.provision.outputs.deployment_env }}
          DEPLOY_TAG: ${{ needs.provision.outputs.deploy_tag }}
          # 假设 open-platform 也有管理的镜像，暂时放空或根据实际情况填写
          MANAGED_IMAGES: ''
        run: |
          if [ -n "${MANAGED_IMAGES}" ]; then
            bash .github/scripts/gitops-update-tags.sh
          fi

      - name: Commit and push changes
        working-directory: gitops
        run: |
          if ! git diff --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git commit -am "chore(cd): auto-update tags to ${{ needs.provision.outputs.deploy_tag }} for ${{ needs.provision.outputs.deployment_env }}"
            git push
            echo "GitOps repository updated successfully."
          else
            echo "No changes to GitOps configuration."
          fi

  # ---------------------------------------------------------------------------
  # 步骤 2b: Web SaaS 域服务部署 (postgresql / stunnel / accounts / billing / console)
  # 单机部署: 所有 web-saas 服务都跑在同一台 provision 出来的主机上, 所以需要先
  # 补上生产环境里各服务各自假设"已经存在"的共享前置条件:
  #   - cn-toolkit-shared Docker 网络 (没有任何 playbook 会创建它, 全靠约定已存在)
  #   - stunnel 自签证书 (postgresql_service 角色如果证书缺失会直接 fail)
  #   - account 库 / account_user 账号 (全新 Postgres 实例, 需要先建库建用户)
  # web-saas 业务密钥集中放在 kv/data/WEB_SAAS (人工维护, 不再自动生成/
  # 写回): POSTGRES_ROOT_PASSWORD, ACCOUNT_DB_PASSWORD, BILLING_DATABASE_URL,
  # INTERNAL_SERVICE_TOKEN。accounts 的系统 admin 引导密码是跨部署链路的
  # CI/CD 凭据：密码固定放在 kv/data/CICD；ROOT_BOOTSTRAP_EMAIL 可选，缺失时
  # 使用 accounts 服务约定的 admin@svc.plus。
  # GHCR 私有镜像凭据不在 WEB_SAAS, 而是跟其它 CI 通用凭据一起放在
  # kv/data/CICD: GHCR_USERNAME 直接同名取, 密码键名是 GHCR_TOKEN, 映射为
  # 各脚本统一消费的 GHCR_PASSWORD。
  # ---------------------------------------------------------------------------
  # 2026-07-28: 这个 job 原来排在 deploy_web_saas 之后, deploy_web_saas 原来
  # 只做 validate/confirm-pull-only, 从不真正检查容器是否起来, 所以顺序反了
  # 也从来没人发现。playbooks#200 给 deploy_web_saas 加了 observe_urls 健康
  # 检查后, 这个反序在任何一台*新*主机上都会死锁: accounts 容器要连
  # account 库才能起, 库要这个 job 来建, 而这个 job 又要等 deploy_web_saas
  # 先成功 —— deploy_web_saas 永远等不到健康的 accounts, 于是永远失败,
  # 这个 job 也永远不会跑。#164 和 #200 各自都对, 合在一起才第一次暴露
  # 这个耦合(见 run 30358343199, Bootstrap 成功但 Deploy Web SaaS Services
  # 报 "no HTTP response" / "HTTP 502" 全部 fail)。
  # 把建库挪到 observe 检查之前修复, 不是撤销任何一个 fix。
  # Application deployment remains independent of explicit schema initialization.
  # A schema init is routed through the unified data control plane only when
  # specifically requested there; ordinary deploys never create schema.
  initialize_empty_web_saas:
    name: "[2] Explicit empty UAT database initialization"
    needs: [provision, deploy_base, capture_web_saas_baseline, update_gitops_tags]
    if: >-
      ${{ !cancelled() && github.event.inputs.operation == 'deploy+init' &&
      needs.provision.result == 'success' && needs.deploy_base.result == 'success' &&
      needs.capture_web_saas_baseline.result == 'success' &&
      (needs.update_gitops_tags.result == 'success' || needs.update_gitops_tags.result == 'skipped') }}
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
      with:
        ref: ${{ github.sha }}
    - name: Dispatch explicit empty-host initialization and wait
      env:
        GH_TOKEN: ${{ github.token }}
        DATA_OPERATION: selfhost_init
        DATA_ENVIRONMENT: ${{ needs.provision.outputs.deployment_env }}
        DATA_CONFIG_JSON: '{"target_host":"web-saas-uat","caller_run_id":"${{ github.run_id }}"}'
        RELEASE_TAG: ${{ needs.provision.outputs.deploy_tag }}
        ACCOUNTS_REF: ${{ needs.provision.outputs.deploy_tag }}
        DATA_WORKFLOW_REF: main
        BASELINE_STATE: ${{ needs.capture_web_saas_baseline.outputs.baseline_state }}
      run: |
        test "$BASELINE_STATE" = absent || { echo "::error::Explicit initialization requires an absent pre-deploy database; use ordinary deploy for existing data."; exit 1; }
        python3 .github/scripts/environment-upgrade/dispatch.py

  deploy_web_saas:
    name: "[2] Web SaaS | ${{ matrix.host }}"
    needs: [provision, deploy_base, update_gitops_tags, initialize_empty_web_saas]
    if: >-
      ${{ !cancelled() &&
      needs.provision.result == 'success' &&
      needs.deploy_base.result == 'success' &&
      (needs.initialize_empty_web_saas.result == 'success' || needs.initialize_empty_web_saas.result == 'skipped') &&
      (needs.update_gitops_tags.result == 'success' || needs.update_gitops_tags.result == 'skipped') &&
      needs.provision.outputs.run_application_deploy == 'true' &&
      needs.provision.outputs.terraform_action == 'apply' &&
      needs.provision.outputs.count != '0' &&
      contains(fromJSON('["all","web-saas","web-saas + agent-proxy"]'), needs.provision.outputs.target_domains) &&
      needs.provision.outputs.hosts_web_saas != '[]' &&
      needs.provision.outputs.hosts_web_saas != '' }}
    strategy:
      fail-fast: false
      matrix:
        host: ${{ fromJSON(needs.provision.outputs.hosts_web_saas) }}
    uses: ai-workspace-infra/playbooks/.github/workflows/web-saas-domain-cd.yaml@ed7397b9b61b244b36000acebd50519a2649f310
    with:
      target_host: ${{ matrix.host }}
      deploy_env: ${{ needs.provision.outputs.deployment_env }}
      deploy_tag: ${{ needs.provision.outputs.deploy_tag }}
      # Deployment only. The final DNS stage performs public endpoint checks
      # after reconciliation/cutover.
      observe_urls: ''

  # ---------------------------------------------------------------------------
  # DNS-independent Web SaaS acceptance.
  #
  # observe_web_saas_after_dns only runs after switch_dns, so a dns_mode=none
  # upgrade can otherwise finish without proof that the new Accounts/Console
  # served or that existing users and subscriptions survived. Existing-database
  # baselines use data-preservation verification; a first deploy whose bound
  # baseline is absent uses the read-only service probe instead. Neither path
  # initializes schema or mutates data. This job runs after deploy and reaches
  # services through the exact CMDB host; a failure fails the run and summary.
  # ---------------------------------------------------------------------------
  accept_web_saas_upgrade:
    name: "[3] Web SaaS acceptance | ${{ matrix.host }}"
    needs: [provision, capture_web_saas_baseline, deploy_web_saas]
    if: >-
      ${{ always() && !cancelled() &&
      needs.provision.result == 'success' &&
      needs.capture_web_saas_baseline.result == 'success' &&
      needs.deploy_web_saas.result == 'success' &&
      needs.provision.outputs.hosts_web_saas != '[]' &&
      needs.provision.outputs.hosts_web_saas != '' }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        host: ${{ fromJSON(needs.provision.outputs.hosts_web_saas) }}
    steps:
    - name: Check out the toolkit dispatcher
      uses: actions/checkout@v7
      with:
        ref: ${{ github.sha }}

    - name: Dispatch read-only selfhost verification or first-deploy probe
      env:
        GH_TOKEN: ${{ github.token }}
        DATA_OPERATION: ${{ needs.capture_web_saas_baseline.outputs.acceptance_mode == 'probe' && 'selfhost_probe' || 'selfhost_verify' }}
        DATA_ENVIRONMENT: ${{ needs.provision.outputs.deployment_env }}
        DATA_CONFIG_JSON: >-
          {"action":"${{ needs.capture_web_saas_baseline.outputs.acceptance_mode == 'probe' && 'probe' || 'verify' }}","target_host":"${{ matrix.host }}","acceptance_run_id":"${{ github.run_id }}","caller_run_id":"${{ github.run_id }}","baseline_data_run_id":"${{ needs.capture_web_saas_baseline.outputs.baseline_data_run_id }}"}
        RELEASE_TAG: ${{ needs.provision.outputs.deploy_tag }}
        ACCOUNTS_REF: ${{ needs.provision.outputs.deploy_tag || 'main' }}
        DATA_WORKFLOW_REF: main
      run: python3 .github/scripts/environment-upgrade/dispatch.py

  switch_dns:
    name: "[3] DNS Update"
    # This stage only reconciles DNS. Service validation runs in the two
    # parallel matrix jobs after this job succeeds.
    needs: [
      provision,
      deploy_web_saas,
      accept_web_saas_upgrade,
      prod_availability,
      deploy_infra_platform,
      deploy_agent_proxy,
      deploy_agent_proxy_non_iac,
      deploy_ai_workspace
    ]
    if: >-
      ${{ always() && !cancelled() &&
      needs.provision.result == 'success' &&
      (needs.deploy_web_saas.result == 'success' || !contains(fromJSON('["all","web-saas","web-saas + agent-proxy"]'), needs.provision.outputs.target_domains)) &&
      (needs.provision.outputs.deployment_env != 'uat' ||
      !contains(fromJSON('["all","web-saas","web-saas + agent-proxy"]'), needs.provision.outputs.target_domains) ||
      needs.accept_web_saas_upgrade.result == 'success') &&
      (needs.provision.outputs.deployment_env != 'prod' || needs.provision.outputs.target_domains != 'web-saas' || needs.prod_availability.result == 'success') &&
      (needs.deploy_infra_platform.result == 'success' ||
      needs.deploy_infra_platform.result == 'skipped' ||
      !contains(fromJSON('["all","infra-platform","open-platform"]'), needs.provision.outputs.target_domains)) &&
      (needs.deploy_agent_proxy.result == 'success' || !contains(fromJSON('["all","agent-proxy","agent-proxy-jp","agent-proxy-us","agent-proxy-sg","web-saas + agent-proxy"]'), needs.provision.outputs.target_domains)) &&
      (needs.deploy_agent_proxy_non_iac.result == 'success' || needs.provision.outputs.hosts_agent_proxy_non_iac == '[]' || !contains(fromJSON('["all","agent-proxy","web-saas + agent-proxy"]'), needs.provision.outputs.target_domains)) &&
      (needs.deploy_ai_workspace.result == 'success' || !contains(fromJSON('["all","ai-workspace"]'), needs.provision.outputs.target_domains)) &&
      needs.provision.outputs.terraform_action == 'apply' &&
      contains(fromJSON('["prod-cutover","uat-records"]'), needs.provision.outputs.dns_mode) }}
    runs-on: ${{ github.event.inputs.runner_type || 'ubuntu-latest' }}
    concurrency:
      group: public-dns-${{ needs.provision.outputs.deployment_env }}
      cancel-in-progress: false
    env:
      PROVISION_TARGET_DOMAIN_BASE:  ${{ needs.provision.outputs.target_domain_base }}
      PROVISION_SOURCE_DOMAIN_BASE:  ${{ needs.provision.outputs.source_domain_base }}
      INPUT_RUN_INFRASTRUCTURE:      ${{ needs.provision.outputs.run_infrastructure }}
      DEPLOY_ENV:                    ${{ needs.provision.outputs.deployment_env }}
      TARGET_DOMAINS:                ${{ needs.provision.outputs.target_domains }}
      AGENT_CONTROLLER_URL:          ${{ needs.provision.outputs.agent_controller_url }}
      DNS_SERVICE_NAMES:             console accounts billing
      VAULT_ADDR:                    https://vault.svc.plus
      VAULT_ROLE:                    github-actions-platform-ops-toolkit-${{ needs.provision.outputs.vault_env_path }}
      VAULT_KV:                      kv/data/CICD
      CMDB_FILE:                     cmdb/cmdb.json
    steps:
    - name: Checkout repository
      uses: actions/checkout@v7
      with:
        ref: ${{ needs.provision.outputs.toolkit_ref }}

    - name: Checkout GitOps selfhost routing declaration
      if: ${{ needs.provision.outputs.deployment_env == 'uat' && needs.provision.outputs.dns_mode == 'uat-records' }}
      uses: actions/checkout@v7
      with:
        repository: ai-workspace-infra/gitops
        ref: ${{ needs.provision.outputs.gitops_ref }}
        path: gitops
        sparse-checkout-cone-mode: false
        sparse-checkout: |
          topology/uat/selfhost/runtime-topology.yaml

    - name: Checkout GitOps XConnect topology
      if: >-
        ${{ needs.provision.outputs.deployment_env == 'prod' &&
        needs.provision.outputs.dns_mode == 'prod-cutover' &&
        contains(fromJSON('["all","agent-proxy","web-saas + agent-proxy"]'),
        needs.provision.outputs.target_domains) }}
      uses: actions/checkout@v7
      with:
        repository: ai-workspace-infra/gitops
        ref: ${{ needs.provision.outputs.gitops_ref }}
        path: gitops-xconnect
        sparse-checkout-cone-mode: false
        sparse-checkout: topology/prod/selfhost/xconnect-regional-pools.yaml

    - name: Render GitOps selfhost routing declaration
      if: ${{ needs.provision.outputs.deployment_env == 'uat' && needs.provision.outputs.dns_mode == 'uat-records' }}
      run: ${{ github.workspace }}/.github/scripts/gitops/prepare_gitops_routing_config.sh
      env:
        GITOPS_ROUTING_YAML: ${{ github.workspace }}/gitops/topology/uat/selfhost/runtime-topology.yaml
        GITOPS_ROUTING_OUTPUT: ${{ runner.temp }}/selfhost-edge-routing.json

    - name: Download CMDB
      # 与上传条件保持一致: artifact 只在基础设施阶段 apply 时产生。
      if: >-
        ${{ needs.provision.outputs.run_infrastructure == 'true' &&
        needs.provision.outputs.terraform_action == 'apply' }}
      uses: actions/download-artifact@v8
      with:
        name: platform-ops-toolkit-cmdb
        path: cmdb

    - name: Checkout playbooks
      uses: actions/checkout@v7
      with:
        repository: ai-workspace-infra/playbooks
        ref: ${{ needs.provision.outputs.playbooks_ref }}
        path: playbooks

    - name: Load Vault secrets for DNS
      id: vault
      uses: hashicorp/vault-action@v4
      with:
        url: ${{ env.VAULT_ADDR }}
        method: jwt
        role: ${{ env.VAULT_ROLE }}
        jwtGithubAudience: vault
        exportToken: true
        ignoreNotFound: true
        secrets: |
          ${{ env.VAULT_KV_BASE }} SSH_PRIVATE_DEPLOY_KEY_B64 | ANSIBLE_SSH_KEY_B64 ;
          ${{ env.VAULT_KV }} CLOUDFLARE_DNS_API_TOKEN | CLOUDFLARE_DNS_API_TOKEN

    - name: Setup DNS deployment runner
      uses: ai-workspace-infra/playbooks/.github/actions/setup-deployment-runner@2d326409ccfbd5f6e862c3dc08660e0ae12fb51d
      with:
        ssh_key_b64: ${{ steps.vault.outputs.ANSIBLE_SSH_KEY_B64 }}
        install_ansible: 'true'

    - name: Switch production Cloudflare DNS records
      if: ${{ needs.provision.outputs.dns_mode == 'prod-cutover' }}
      env:
        CLOUDFLARE_DNS_API_TOKEN: ${{ steps.vault.outputs.CLOUDFLARE_DNS_API_TOKEN }}
      run: |-
        ${{ github.workspace }}/playbooks/scripts/pipeline/switch-cloudflare-dns-records.sh

    - name: Reconcile production XConnect regional entrypoints
      if: >-
        ${{ needs.provision.outputs.deployment_env == 'prod' &&
        needs.provision.outputs.dns_mode == 'prod-cutover' &&
        contains(fromJSON('["all","agent-proxy","web-saas + agent-proxy"]'),
        needs.provision.outputs.target_domains) }}
      working-directory: playbooks
      env:
        CLOUDFLARE_DNS_API_TOKEN: ${{ steps.vault.outputs.CLOUDFLARE_DNS_API_TOKEN }}
        XCONNECT_GITOPS_CONFIG: ${{ github.workspace }}/gitops-xconnect/topology/prod/selfhost/xconnect-regional-pools.yaml
        XCONNECT_CMDB_FILE: ${{ github.workspace }}/cmdb/cmdb.json
      run: |-
        for pool in jp us sg ph; do
          XCONNECT_POOL="${pool}" ansible-playbook reconcile_xconnect_entrypoint.yml
        done

    - name: Check out reviewed UAT DNS provider owner
      if: ${{ needs.provision.outputs.deployment_env == 'uat' && needs.provision.outputs.dns_mode == 'uat-records' }}
      uses: actions/checkout@v7
      with:
        repository: ai-workspace-infra/iac_modules
        ref: ed299ac0cbf0d7f3c355b36f2ecbed794ceebd7f
        path: iac-dns-owner
        persist-credentials: false

    - name: Reconcile UAT DNS records
      if: ${{ needs.provision.outputs.deployment_env == 'uat' && needs.provision.outputs.dns_mode == 'uat-records' }}
      env:
        CLOUDFLARE_DNS_API_TOKEN: ${{ steps.vault.outputs.CLOUDFLARE_DNS_API_TOKEN }}
        SOURCE_DOMAIN_BASE: ${{ needs.provision.outputs.source_domain_base }}
        TARGET_DOMAIN_BASE: ${{ needs.provision.outputs.target_domain_base }}
        DEPLOY_ENV: ${{ needs.provision.outputs.deployment_env }}
        CMDB_FILE: ${{ runner.temp }}/uat-dns-cmdb.json
        GITOPS_ROUTING_CONFIG: ${{ runner.temp }}/selfhost-edge-routing.json
      run: |
        jq -e 'with_entries(select((.value | type) == "object") | select((.value.groups | type) == "array"))' \
          cmdb/cmdb.json > "$CMDB_FILE"
        bash ${{ github.workspace }}/iac-dns-owner/scripts/pipeline/cloudflare-uat-dns-reconcile.sh

    - name: Reconcile SIT all-in-one DNS records
      if: ${{ needs.provision.outputs.deployment_env == 'sit' && needs.provision.outputs.dns_mode == 'uat-records' }}
      env:
        CLOUDFLARE_DNS_API_TOKEN: ${{ steps.vault.outputs.CLOUDFLARE_DNS_API_TOKEN }}
        SOURCE_DOMAIN_BASE: ${{ needs.provision.outputs.source_domain_base }}
        TARGET_DOMAIN_BASE: ${{ needs.provision.outputs.target_domain_base }}
        DEPLOY_ENV: ${{ needs.provision.outputs.deployment_env }}
        CMDB_FILE: cmdb/cmdb.json
      uses: ai-workspace-infra/iac_modules/.github/actions/platform-resource-operations@bd098cba5acde525f2f1c4d3bc3a7bd6338c9077
      with:
        operation: sit-dns
        environment: sit

    - name: Remove temporary agent controller host pin
      if: >-
        ${{ contains(fromJSON('["all","agent-proxy","web-saas + agent-proxy"]'),
        needs.provision.outputs.target_domains) }}
      run: ${{ github.workspace }}/playbooks/scripts/pipeline/remove-temporary-agent-controller-host.sh

  bootstrap_stripe_catalog:
    name: "[4] Stripe catalog"
    needs: [provision, switch_dns]
    if: >-
      ${{ always() && !cancelled() &&
      needs.provision.result == 'success' &&
      needs.switch_dns.result == 'success' &&
      inputs.skip_stripe_catalog != true &&
      contains(fromJSON('["all","web-saas","web-saas + agent-proxy"]'), needs.provision.outputs.target_domains) }}
    runs-on: ${{ github.event.inputs.runner_type || 'ubuntu-latest' }}
    steps:
    - name: Checkout platform toolkit
      uses: actions/checkout@v7
      with:
        ref: ${{ needs.provision.outputs.toolkit_ref || github.sha }}

    - name: Checkout Accounts catalog source
      uses: actions/checkout@v7
      with:
        repository: ai-workspace-services/accounts
        ref: ${{ needs.provision.outputs.deploy_tag || 'main' }}
        path: accounts
        sparse-checkout-cone-mode: false
        sparse-checkout: |
          scripts/stripe-catalog.yaml
          scripts/stripe-sync-catalog.sh

    - name: Install catalog bootstrap dependencies
      run: python3 -m pip install --user pyyaml

    - name: Install Vault CLI
      run: ./.github/scripts/serverless/install_vault_cli.sh

    - name: Authenticate to Vault with GitHub OIDC
      uses: hashicorp/vault-action@v4
      with:
        url: ${{ env.VAULT_ADDR }}
        method: jwt
        role: github-actions-platform-ops-toolkit-${{ needs.provision.outputs.vault_env_path }}
        jwtGithubAudience: vault
        exportToken: true

    - name: Synchronize Stripe catalog to Accounts
      run: ./scripts/serverless_uat/bootstrap_stripe_catalog.sh
      env:
        VAULT_ADDR: ${{ env.VAULT_ADDR }}
        VAULT_ENV_PATH: ${{ needs.provision.outputs.vault_env_path }}
        ACCOUNTS_DIR: ${{ github.workspace }}/accounts
        ACCOUNTS_BASE_URL: >-
          https://accounts-${{ needs.provision.outputs.deployment_env }}.${{ needs.provision.outputs.target_domain_base }}
        DOMAIN_BASE: ${{ needs.provision.outputs.target_domain_base }}
        SKIP_DATABASE_SEED: 'true'

  observe_web_saas_after_dns:
    name: "[4] Web SaaS status | ${{ matrix.host }}"
    needs: [provision, switch_dns]
    if: >-
      ${{ always() && !cancelled() &&
      needs.provision.result == 'success' &&
      needs.switch_dns.result == 'success' &&
      contains(fromJSON('["all","web-saas","web-saas + agent-proxy"]'), needs.provision.outputs.target_domains) &&
      needs.provision.outputs.hosts_web_saas != '[]' &&
      needs.provision.outputs.hosts_web_saas != '' }}
    runs-on: ${{ github.event.inputs.runner_type || 'ubuntu-latest' }}
    strategy:
      fail-fast: false
      matrix:
        host: ${{ fromJSON(needs.provision.outputs.hosts_web_saas) }}
    env:
      MATRIX_HOST: ${{ matrix.host }}
      ANSIBLE_HOST_KEY_CHECKING: "False"
      ANSIBLE_SSH_ARGS: "-o ControlMaster=auto -o ControlPersist=60s -o IdentityFile=~/.ssh/id_deploy -o StrictHostKeyChecking=no"
      VAULT_ENV_PATH: ${{ needs.provision.outputs.vault_env_path }}
    steps:
    - name: Checkout repository
      uses: actions/checkout@v7
      with:
        ref: ${{ needs.provision.outputs.toolkit_ref }}

    - name: Checkout playbooks
      uses: actions/checkout@v7
      with:
        repository: ai-workspace-infra/playbooks
        ref: ${{ needs.provision.outputs.playbooks_ref }}
        path: playbooks

    - name: Download CMDB
      uses: actions/download-artifact@v8
      with:
        name: platform-ops-toolkit-cmdb
        path: cmdb

    - name: Load deployment SSH key from Vault
      id: vault
      uses: hashicorp/vault-action@v4
      with:
        url: ${{ env.VAULT_ADDR }}
        method: jwt
        role: ${{ env.VAULT_ROLE }}
        jwtGithubAudience: vault
        secrets: |
          ${{ env.VAULT_KV_BASE }} SSH_PRIVATE_DEPLOY_KEY_B64 | ANSIBLE_SSH_KEY_B64

    - name: Setup deployment runner
      uses: ai-workspace-infra/playbooks/.github/actions/setup-deployment-runner@2d326409ccfbd5f6e862c3dc08660e0ae12fb51d
      with:
        ssh_key_b64: ${{ steps.vault.outputs.ANSIBLE_SSH_KEY_B64 }}
        matrix_host: ${{ matrix.host }}
        wait_for_ssh: 'true'
        install_ansible: 'true'
        assert_ansible_target: 'true'
        ansible_inventory: cmdb/inventory.ini

    - name: Verify Web SaaS host with Playbooks role
      working-directory: playbooks
      env:
        WEB_SAAS_CANONICAL_PROBE_HOST: ${{ format('console-{0}.{1}', needs.provision.outputs.deployment_env, needs.provision.outputs.target_domain_base) }}
      run: >-
        ansible-playbook verify_web_saas_post_deploy.yml
        --inventory ../cmdb/inventory.ini
        --limit "${MATRIX_HOST}"
        --extra-vars "readiness_target_host=${MATRIX_HOST} web_saas_canonical_probe_host=${WEB_SAAS_CANONICAL_PROBE_HOST}"

    - name: Verify Web SaaS public endpoints after DNS
      env:
        DOMAIN: web-saas
        DEPLOY_ENV: ${{ needs.provision.outputs.deployment_env }}
        OBSERVE_URLS: >-
          https://console-${{ needs.provision.outputs.deployment_env }}.${{ needs.provision.outputs.target_domain_base }}/
          https://console-selfhost-${{ needs.provision.outputs.deployment_env }}.${{ needs.provision.outputs.target_domain_base }}/
          https://accounts-${{ needs.provision.outputs.deployment_env }}.${{ needs.provision.outputs.target_domain_base }}/
          https://bridge-${{ needs.provision.outputs.deployment_env }}.${{ needs.provision.outputs.target_domain_base }}/api/ping
        # Both the canonical Hybrid console route and its mode-qualified
        # selfhost origin must serve. Accounts and Bridge intentionally require
        # authentication; their 404/401 responses prove those services are
        # routed and alive. The observer rejects every other code.
        # OBSERVE_URLS order: canonical console, selfhost console, accounts, bridge.
        OBSERVE_EXPECTED_CODES: "200,200,404,401"
      run: bash playbooks/.github/scripts/domain-cd-observe-endpoints.sh

  observe_agent_proxy_after_dns:
    name: "[4] Agent Proxy status | ${{ matrix.host }}"
    needs: [provision, switch_dns]
    if: >-
      ${{ always() && !cancelled() &&
      needs.provision.result == 'success' &&
      needs.switch_dns.result == 'success' &&
      contains(fromJSON('["all","agent-proxy","agent-proxy-jp","agent-proxy-us","agent-proxy-sg","web-saas + agent-proxy"]'), needs.provision.outputs.target_domains) &&
      needs.provision.outputs.hosts_agent_proxy_iac != '[]' &&
      needs.provision.outputs.hosts_agent_proxy_iac != '' }}
    runs-on: ${{ github.event.inputs.runner_type || 'ubuntu-latest' }}
    strategy:
      fail-fast: false
      matrix:
        host: ${{ fromJSON(needs.provision.outputs.hosts_agent_proxy_iac) }}
    env:
      MATRIX_HOST: ${{ matrix.host }}
      ANSIBLE_HOST_KEY_CHECKING: "False"
      ANSIBLE_PIPELINING: "True"
      ANSIBLE_SSH_ARGS: "-o ControlMaster=auto -o ControlPersist=60s -o IdentityFile=~/.ssh/id_deploy -o StrictHostKeyChecking=no"
      VAULT_ENV_PATH: ${{ needs.provision.outputs.vault_env_path }}
    steps:
    - name: Checkout repository
      uses: actions/checkout@v7
      with:
        ref: ${{ needs.provision.outputs.toolkit_ref }}

    - name: Checkout playbooks
      uses: actions/checkout@v7
      with:
        repository: ai-workspace-infra/playbooks
        ref: ${{ needs.provision.outputs.playbooks_ref }}
        path: playbooks

    - name: Download CMDB
      uses: actions/download-artifact@v8
      with:
        name: platform-ops-toolkit-cmdb
        path: cmdb

    - name: Load deployment SSH key from Vault
      id: vault
      uses: hashicorp/vault-action@v4
      with:
        url: ${{ env.VAULT_ADDR }}
        method: jwt
        role: ${{ env.VAULT_ROLE }}
        jwtGithubAudience: vault
        secrets: |
          ${{ env.VAULT_KV_BASE }} SSH_PRIVATE_DEPLOY_KEY_B64 | ANSIBLE_SSH_KEY_B64

    - name: Setup deployment runner
      uses: ai-workspace-infra/playbooks/.github/actions/setup-deployment-runner@2d326409ccfbd5f6e862c3dc08660e0ae12fb51d
      with:
        ssh_key_b64: ${{ steps.vault.outputs.ANSIBLE_SSH_KEY_B64 }}
        matrix_host: ${{ matrix.host }}
        wait_for_ssh: 'true'
        install_ansible: 'true'
        assert_ansible_target: 'true'
        ansible_inventory: cmdb/inventory.ini

    - name: Verify Agent Proxy host with Playbooks role
      working-directory: playbooks
      run: >-
        ansible-playbook verify_agent_proxy_post_dns.yml
        --inventory ../cmdb/inventory.ini
        --limit "${MATRIX_HOST}"
        --extra-vars "readiness_target_host=${MATRIX_HOST}"

  deployment_summary:
    name: "[5] Deployment summary"
    needs: [
      provision,
      deploy_web_saas,
      capture_web_saas_baseline,
      initialize_empty_web_saas,
      accept_web_saas_upgrade,
      prod_availability,
      deploy_agent_proxy,
      deploy_agent_proxy_non_iac,
      switch_dns,
      observe_web_saas_after_dns,
      observe_agent_proxy_after_dns,
      deploy_infra_platform,
      bootstrap_stripe_catalog,
      trigger_data_migration,
      deploy_xconnect_zero_uat,
      deploy_ai_workspace,
      deploy_monitor_agent
    ]
    # Keep the summary alive after failed upstream jobs, but explicitly assert
    # that every declared need has produced a result. This satisfies the
    # workflow gating contract without turning a failure into a skipped summary.
    if: >-
      ${{ always() && !cancelled() && github.event.inputs.operation != 'native-standby' && github.event.inputs.operation != 'native-init-plan' && github.event.inputs.operation != 'native-init' && github.event.inputs.operation != 'native-billing-plan' && github.event.inputs.operation != 'native-billing' && github.event.inputs.operation != 'native-business-plan' && github.event.inputs.operation != 'native-business-copy' && github.event.inputs.operation != 'native-business-compare' && github.event.inputs.operation != 'native-core-users' && github.event.inputs.operation != 'native-core-users-compare' && github.event.inputs.operation != 'native-availability' &&
      needs.provision.result != '' &&
      needs.deploy_web_saas.result != '' &&
      needs.capture_web_saas_baseline.result != '' &&
      needs.initialize_empty_web_saas.result != '' &&
      needs.accept_web_saas_upgrade.result != '' &&
      needs.prod_availability.result != '' &&
      needs.deploy_agent_proxy.result != '' &&
      needs.deploy_agent_proxy_non_iac.result != '' &&
      needs.switch_dns.result != '' &&
      needs.observe_web_saas_after_dns.result != '' &&
      needs.observe_agent_proxy_after_dns.result != '' &&
      needs.deploy_infra_platform.result != '' &&
      needs.bootstrap_stripe_catalog.result != '' &&
      needs.trigger_data_migration.result != '' &&
      needs.deploy_xconnect_zero_uat.result != '' &&
      needs.deploy_ai_workspace.result != '' &&
      needs.deploy_monitor_agent.result != '' }}
    runs-on: ${{ github.event.inputs.runner_type || 'ubuntu-latest' }}
    steps:
    - name: Checkout repository
      uses: actions/checkout@v7
      with:
        ref: ${{ github.sha }}

    - name: Write deployment summary
      env:
        PROVISION_RESULT: ${{ needs.provision.result }}
        WEB_SAAS_DEPLOY_RESULT: ${{ needs.deploy_web_saas.result }}
        DB_INIT_RESULT: ${{ needs.initialize_empty_web_saas.result }}
        WEB_SAAS_BASELINE_RESULT: ${{ needs.capture_web_saas_baseline.result }}
        WEB_SAAS_ACCEPTANCE_RESULT: ${{ needs.provision.outputs.deployment_env == 'prod' && needs.prod_availability.result || needs.accept_web_saas_upgrade.result }}
        RUN_APPLICATION_DEPLOY: ${{ needs.provision.outputs.run_application_deploy }}
        AGENT_PROXY_DEPLOY_RESULT: ${{ needs.deploy_agent_proxy.result }}
        AGENT_PROXY_NON_IAC_DEPLOY_RESULT: ${{ needs.deploy_agent_proxy_non_iac.result }}
        DNS_UPDATE_RESULT: ${{ needs.switch_dns.result }}
        WEB_SAAS_STATUS_RESULT: ${{ needs.observe_web_saas_after_dns.result }}
        AGENT_PROXY_STATUS_RESULT: ${{ needs.observe_agent_proxy_after_dns.result }}
        INFRA_PLATFORM_DEPLOY_RESULT: ${{ needs.deploy_infra_platform.result }}
        STRIPE_CATALOG_RESULT: ${{ needs.bootstrap_stripe_catalog.result }}
        DATA_MIGRATION_RESULT: ${{ needs.trigger_data_migration.result }}
        XCONNECT_ZERO_UAT_RESULT: ${{ needs.deploy_xconnect_zero_uat.result }}
        AI_WORKSPACE_RESULT: ${{ needs.deploy_ai_workspace.result }}
        MONITOR_AGENT_RESULT: ${{ needs.deploy_monitor_agent.result }}
        DEPLOYMENT_ENV: ${{ needs.provision.outputs.deployment_env }}
        TARGET_DOMAINS: ${{ needs.provision.outputs.target_domains }}
        TERRAFORM_NAMESPACE: ${{ needs.provision.outputs.terraform_namespace }}
        TERRAFORM_STATE_KEY: ${{ needs.provision.outputs.state_key }}
        DEPLOY_TAG: ${{ needs.provision.outputs.deploy_tag }}
        AGENT_CONTROLLER_URL: ${{ needs.provision.outputs.agent_accounts_base_url }}
      run: ${{ github.workspace }}/.github/scripts/platform-ops/observe/platform-ops_deployment-summary.sh

  deploy_infra_platform:
    name: "[2] Infra | ${{ matrix.host }}"
    # UAT Akamai open-platform is installed by deploy_base via
    # setup-open-platform-domain.yml. The generic pull-only CD workflow has no
    # managed image contract for this domain and would only perform a
    # duplicate validation/observation pass. Keep the service deployment and
    # migration boundary in bootstrap, but skip that generic verification for
    # the open-platform leg (including the open-platform leg of target=all).
    needs: [provision, deploy_base]
    if: >-
      ${{ !cancelled() &&
      needs.provision.result == 'success' &&
      needs.deploy_base.result == 'success' &&
      needs.provision.outputs.run_application_deploy == 'true' &&
      needs.provision.outputs.terraform_action == 'apply' &&
      needs.provision.outputs.count != '0' &&
      contains(fromJSON('["all","infra-platform","open-platform"]'), needs.provision.outputs.target_domains) &&
      !(needs.provision.outputs.deployment_env == 'uat' &&
      needs.provision.outputs.cloud_provider == 'akamai-cloud' &&
      contains(fromJSON('["all","open-platform"]'), needs.provision.outputs.target_domains)) &&
      needs.provision.outputs.hosts_infra_platform != '[]' &&
      needs.provision.outputs.hosts_infra_platform != '' }}
    strategy:
      fail-fast: false
      matrix:
        host: ${{ fromJSON(needs.provision.outputs.hosts_infra_platform) }}
    uses: ai-workspace-infra/playbooks/.github/workflows/open-platform-domain-cd.yaml@main
    with:
      target_host: ${{ matrix.host }}
      deploy_env: ${{ needs.provision.outputs.deployment_env }}
      deploy_tag: ${{ needs.provision.outputs.deploy_tag }}

  deploy_agent_proxy:
    name: "[3] Agent Proxy IaC | ${{ matrix.host }}"
    # UAT selfhost Agent Proxy registration targets the Web SaaS Accounts
    # service. Wait for the Web SaaS deployment before registering agents;
    # otherwise a fresh all-domain run races the controller and fails with a
    # registration timeout. Standalone agent-proxy runs still proceed without
    # this dependency because deploy_web_saas is skipped for those targets.
    needs: [provision, deploy_base, deploy_web_saas]
    if: >-
      ${{ always() && !cancelled() &&
      needs.provision.result == 'success' &&
      needs.deploy_base.result == 'success' &&
      (needs.deploy_web_saas.result == 'success' ||
      !contains(fromJSON('["all","web-saas","web-saas + agent-proxy"]'), needs.provision.outputs.target_domains)) &&
      needs.provision.outputs.run_application_deploy == 'true' &&
      needs.provision.outputs.terraform_action == 'apply' &&
      needs.provision.outputs.count != '0' &&
      contains(fromJSON('["all","agent-proxy","agent-proxy-jp","agent-proxy-us","agent-proxy-sg","web-saas + agent-proxy"]'), needs.provision.outputs.target_domains) &&
      needs.provision.outputs.hosts_agent_proxy_iac != '[]' &&
      needs.provision.outputs.hosts_agent_proxy_iac != '' }}
    strategy:
      fail-fast: false
      matrix:
        host: ${{ fromJSON(needs.provision.outputs.hosts_agent_proxy_iac) }}
    runs-on: ${{ github.event.inputs.runner_type || 'ubuntu-latest' }}
    env:
      MATRIX_HOST: ${{ matrix.host }}
      ANSIBLE_HOST_KEY_CHECKING: "False"
      ANSIBLE_PIPELINING: "True"
      ANSIBLE_SSH_ARGS: "-o ControlMaster=auto -o ControlPersist=60s -o IdentityFile=~/.ssh/id_deploy -o StrictHostKeyChecking=no"
      VAULT_ENV_PATH: ${{ needs.provision.outputs.vault_env_path }}
    steps:
    - name: Checkout repository
      uses: actions/checkout@v7
      with:
        ref: ${{ github.sha }}

    - name: Checkout playbooks
      uses: actions/checkout@v7
      with:
        repository: ai-workspace-infra/playbooks
        ref: ${{ needs.provision.outputs.playbooks_ref }}
        path: playbooks

    - name: Download CMDB
      uses: actions/download-artifact@v8
      with:
        name: platform-ops-toolkit-cmdb
        path: cmdb

    - name: Resolve Agent Proxy controller IP
      id: controller
      env:
        CMDB_FILE: cmdb/cmdb.json
        AGENT_CONTROLLER_URL: ${{ needs.provision.outputs.agent_accounts_base_url }}
      run: ${{ github.workspace }}/.github/scripts/platform-ops/deploy/platform-ops_deploy_agent_proxy_resolve-controller-ip.sh

    - name: Load agent-proxy secrets
      id: vault
      uses: hashicorp/vault-action@v4
      with:
        url: ${{ env.VAULT_ADDR }}
        method: jwt
        role: ${{ env.VAULT_ROLE }}
        jwtGithubAudience: vault
        exportToken: true
        secrets: |
          ${{ env.VAULT_KV_BASE }} SSH_PRIVATE_DEPLOY_KEY_B64 | ANSIBLE_SSH_KEY_B64 ;
          ${{ env.VAULT_KV_WEB_SAAS }} INTERNAL_SERVICE_TOKEN | INTERNAL_SERVICE_TOKEN

    - name: Cache pip packages
      uses: actions/cache@v6
      with:
        path: ~/.cache/pip
        key: ${{ runner.os }}-pip-ansible-v1
        restore-keys: |
          ${{ runner.os }}-pip-

    - name: Setup deployment runner
      uses: ai-workspace-infra/playbooks/.github/actions/setup-deployment-runner@2d326409ccfbd5f6e862c3dc08660e0ae12fb51d
      with:
        ssh_key_b64: ${{ steps.vault.outputs.ANSIBLE_SSH_KEY_B64 }}
        matrix_host: ${{ matrix.host }}
        wait_for_ssh: 'true'
        install_ansible: 'true'
        assert_ansible_target: 'true'
        ansible_inventory: cmdb/inventory.ini

    - name: Resolve Xray Exporter image
      id: xray_exporter
      env:
        INPUT_XRAY_EXPORTER_IMAGE: ${{ github.event.inputs.xray_exporter_image }}
        DEPLOYMENT_ENV: ${{ needs.provision.outputs.deployment_env }}
        DEPLOY_TAG: ${{ needs.provision.outputs.deploy_tag }}
        GH_TOKEN: ${{ github.token }}
      run: |-
        ${{ github.workspace }}/.github/scripts/platform-ops/deploy/platform-ops_deploy_resolve-xray-exporter-image.sh

    - name: Deploy native agent-proxy services
      working-directory: playbooks
      env:
        INTERNAL_SERVICE_TOKEN: ${{ steps.vault.outputs.INTERNAL_SERVICE_TOKEN }}
        AGENT_REPO_URL: https://github.com/ai-workspace-xstream/xconnect-edge-agent.git
        # AGENT_PROXY_VERSION takes precedence over the legacy daily-build
        # fallback in the playbook and preserves the unified immutable tag.
        AGENT_PROXY_VERSION: ${{ needs.provision.outputs.deploy_tag }}
        AGENT_CONTROLLER_URL: ${{ needs.provision.outputs.agent_accounts_base_url }}
        AGENT_CONTROLLER_IP: ${{ steps.controller.outputs.ip }}
        AGENT_REPO_VERSION: ${{ needs.provision.outputs.deploy_tag }}
        AGENT_ID: ${{ matrix.host }}
        # The CMDB key is the first service domain declared for this host.
        # Use it per matrix entry so a regional pool does not render the same
        # Caddy/Xray hostname on every node.
        AGENT_PROXY_DOMAIN: ${{ matrix.host }}
        # Keep the legacy PROD hostname usable when it is a CNAME to the new
        # node. UAT receives no production alias.
        AGENT_PROXY_LEGACY_DOMAIN: ${{ needs.provision.outputs.deployment_env == 'prod' && (matrix.host == format('agent-proxy-selfhost-{0}-jp.{1}', needs.provision.outputs.deployment_env, needs.provision.outputs.target_domain_base) || matrix.host == format('agent-proxy-selfhost-{0}.{1}', needs.provision.outputs.deployment_env, needs.provision.outputs.target_domain_base)) && 'tky-proxy.svc.plus' || '' }}
        AGENT_DOMAIN_TLS_DIR: /etc/xcontrol/tls/${{ needs.provision.outputs.target_domain_base }}
        BILLING_SERVICE_BASE_URL: ${{ needs.provision.outputs.billing_service_base_url }}
        AGENT_XRAY_ENABLED: "true"
        # Usage is always exported through the local Vector hand-off. The
        # route step derives BILLING_SERVICE_BASE_URL from deployment_env, so
        # a production node can only publish to its production Billing origin
        # and a UAT node can only publish to its UAT Billing origin.
        # Keep the legacy direct-pull collector disabled in every environment.
        AGENT_BILLING_ENABLED: "false"
        EXPORTER_ENV: ${{ needs.provision.outputs.deployment_env }}
        # Browser-facing and Agent registration traffic keeps the public
        # controller URL. Exporter identity sync is a token-protected machine
        # API, so serverless deployments use the direct Cloud Run origin from
        # GitOps and cannot be blocked by an interactive Cloudflare challenge.
        ACCOUNTS_BASE_URL: ${{ needs.provision.outputs.agent_accounts_base_url }}
        XRAY_EXPORTER_RELEASE_REPOSITORY: ${{ steps.xray_exporter.outputs.repository }}
        XRAY_EXPORTER_VERSION: ${{ steps.xray_exporter.outputs.version }}
        XRAY_EXPORTER_SNAPSHOT_FEATURES_ENABLED: "true"
        XRAY_EXPORTER_LISTEN_ADDR: ${{ needs.provision.outputs.deployment_env == 'uat' && '0.0.0.0:8080' || '127.0.0.1:8080' }}
        XRAY_EXPORTER_TCP_LISTEN_ADDR: ${{ needs.provision.outputs.deployment_env == 'uat' && '0.0.0.0:8081' || '127.0.0.1:8081' }}
        VECTOR_SNAPSHOT_URL: http://127.0.0.1:8686
      run: >-
        ansible-playbook -i ../cmdb/inventory.ini setup-agent-proxy-domain.yml
        --limit "${MATRIX_HOST}"
        -e agent_service_hosts=agent_proxy
        -e xray_exporter_hosts=agent_proxy
        -e agent_proxy_manage_source_checkout=true
        -e agent_proxy_build_on_target=true
        -e agent_proxy_wait_for_runtime_config=false
        -e agent_billing_enabled="${AGENT_BILLING_ENABLED}"

  deploy_agent_proxy_non_iac:
    name: "[3] Agent Proxy non-IaC | ${{ matrix.host }}"
    # TW and PH are deliberately outside Terraform state. Their public
    # addresses and credentials come from the GitOps declaration plus Vault,
    # while JP/US/SG continue through the CMDB Agent Proxy matrix above.
    needs: [provision]
    if: >-
      ${{ always() && !cancelled() &&
      needs.provision.result == 'success' &&
      contains(fromJSON('["uat","prod"]'), needs.provision.outputs.deployment_env) &&
      needs.provision.outputs.run_application_deploy == 'true' &&
      needs.provision.outputs.terraform_action == 'apply' &&
      needs.provision.outputs.include_external_agent_proxy == 'true' &&
      contains(fromJSON('["all","agent-proxy","web-saas + agent-proxy"]'),
      needs.provision.outputs.target_domains) &&
      needs.provision.outputs.hosts_agent_proxy_non_iac != '[]' &&
      needs.provision.outputs.hosts_agent_proxy_non_iac != '' }}
    strategy:
      fail-fast: false
      matrix:
        host: ${{ fromJSON(needs.provision.outputs.hosts_agent_proxy_non_iac) }}
    runs-on: ${{ github.event.inputs.runner_type || 'ubuntu-latest' }}
    env:
      MATRIX_HOST: ${{ matrix.host }}
      ANSIBLE_HOST_KEY_CHECKING: "False"
      ANSIBLE_PIPELINING: "True"
      ANSIBLE_SSH_ARGS: "-o ControlMaster=auto -o ControlPersist=60s -o StrictHostKeyChecking=no"
      VAULT_ENV_PATH: ${{ needs.provision.outputs.vault_env_path }}
      # The observability agent step below renders Vector's remote-write and
      # log sinks from this value. An undefined variable expands to an empty
      # string and silently ships the node's metrics nowhere, so keep the
      # same default the IaC monitor job uses.
      OBSERVABILITY_ENDPOINT: ${{ github.event.inputs.observability_endpoint || 'https://observability.svc.plus' }}
    steps:
    - name: Checkout repository
      uses: actions/checkout@v7
      with:
        ref: ${{ needs.provision.outputs.toolkit_ref }}

    - name: Checkout playbooks
      uses: actions/checkout@v7
      with:
        repository: ai-workspace-infra/playbooks
        ref: ${{ needs.provision.outputs.playbooks_ref }}
        path: playbooks

    - name: Checkout GitOps XConnect topology
      uses: actions/checkout@v7
      with:
        repository: ai-workspace-infra/gitops
        ref: ${{ needs.provision.outputs.gitops_ref }}
        path: gitops
        sparse-checkout-cone-mode: false
        sparse-checkout: |
          topology/uat/selfhost/xconnect-regional-pool.yaml
          topology/prod/selfhost/xconnect-regional-pools.yaml

    - name: Download CMDB
      uses: actions/download-artifact@v8
      with:
        name: platform-ops-toolkit-cmdb
        path: cmdb

    - name: Resolve Agent Proxy controller IP
      id: controller
      env:
        CMDB_FILE: cmdb/cmdb.json
        AGENT_CONTROLLER_URL: ${{ needs.provision.outputs.agent_accounts_base_url }}
      run: ${{ github.workspace }}/.github/scripts/platform-ops/deploy/platform-ops_deploy_agent_proxy_resolve-controller-ip.sh

    - name: Load non-IaC Agent Proxy secrets
      id: vault
      uses: hashicorp/vault-action@v4
      with:
        url: ${{ env.VAULT_ADDR }}
        method: jwt
        role: ${{ env.VAULT_ROLE }}
        jwtGithubAudience: vault
        exportToken: true
        secrets: |
          ${{ env.VAULT_KV_BASE }} SSH_PRIVATE_DEPLOY_KEY_B64 | ANSIBLE_SSH_KEY_B64 ;
          ${{ env.VAULT_KV_WEB_SAAS }} INTERNAL_SERVICE_TOKEN | INTERNAL_SERVICE_TOKEN ;
          kv/data/CICD/observability user | VECTOR_AUTH_USER ;
          kv/data/CICD/observability password | VECTOR_AUTH_PASSWORD

    - name: Install Ansible and password transport
      run: |
        if ! command -v sshpass >/dev/null 2>&1; then
          sudo apt-get update -qq
          sudo apt-get install -y -qq sshpass
        fi

    - name: Setup deployment runner
      id: runner
      uses: ai-workspace-infra/playbooks/.github/actions/setup-deployment-runner@2d326409ccfbd5f6e862c3dc08660e0ae12fb51d
      with:
        matrix_host: ${{ matrix.host }}
        ssh_key_b64: ${{ steps.vault.outputs.ANSIBLE_SSH_KEY_B64 }}
        install_ansible: 'true'

    - name: Materialize non-IaC deploy key at runner temp
      id: deploy_key
      env:
        DEPLOY_KEY_B64: ${{ steps.vault.outputs.ANSIBLE_SSH_KEY_B64 }}
        DEPLOY_KEY_FILE: ${{ runner.temp }}/xconnect-non-iac-deploy-key
      run: |-
        set -euo pipefail
        test -n "${DEPLOY_KEY_B64}" || {
          echo "::error::Vault did not provide the non-IaC deployment key." >&2
          exit 1
        }
        umask 077
        printf '%s' "${DEPLOY_KEY_B64}" | base64 --decode >"${DEPLOY_KEY_FILE}"
        ssh-keygen -y -f "${DEPLOY_KEY_FILE}" >/dev/null
        printf 'path=%s\n' "${DEPLOY_KEY_FILE}" >>"${GITHUB_OUTPUT}"

    - name: Resolve non-IaC node Vault path
      id: vault_path
      env:
        XCONNECT_GITOPS_CONFIG: ${{ github.workspace }}/gitops/topology/${{ needs.provision.outputs.deployment_env }}/selfhost/${{ needs.provision.outputs.deployment_env == 'uat' && 'xconnect-regional-pool.yaml' || 'xconnect-regional-pools.yaml' }}
        XCONNECT_NODE_ID: ${{ matrix.host }}
      run: >-
        python3
        ${{ github.workspace }}/.github/scripts/platform-ops/deploy/platform-ops_deploy_resolve-non-iac-agent-proxy-vault-path.py

    - name: Read external Agent Proxy node record from Vault
      env:
        XCONNECT_VAULT_API_PATH: ${{ steps.vault_path.outputs.vault_api_path }}
        XCONNECT_VAULT_RESPONSE_FILE: ${{ runner.temp }}/xconnect-vault.json
      run: |
        set -euo pipefail
        umask 077
        test -n "${VAULT_TOKEN:-}" || {
          echo "::error::Vault token was not exported for the non-IaC XConnect deployment." >&2
          exit 1
        }
        curl --fail --silent --show-error \
          -H "X-Vault-Token: ${VAULT_TOKEN}" \
          "${VAULT_ADDR}/v1/${XCONNECT_VAULT_API_PATH}" \
          > "${XCONNECT_VAULT_RESPONSE_FILE}"

    - name: Render non-IaC Agent Proxy inventory
      id: bootstrap_inventory
      env:
        DEPLOYMENT_ENV: ${{ needs.provision.outputs.deployment_env }}
        XCONNECT_GITOPS_CONFIG: ${{ github.workspace }}/gitops/topology/${{ needs.provision.outputs.deployment_env }}/selfhost/${{ needs.provision.outputs.deployment_env == 'uat' && 'xconnect-regional-pool.yaml' || 'xconnect-regional-pools.yaml' }}
        XCONNECT_VAULT_RESPONSE_FILE: ${{ runner.temp }}/xconnect-vault.json
        XCONNECT_INVENTORY_FILE: ${{ runner.temp }}/external-agent-proxy-bootstrap-inventory.yml
        XCONNECT_NODE_ID: ${{ matrix.host }}
        # The renderer replaces this fallback with a node-scoped Vault key
        # when ssh_private_key_b64 is present in the node record.
        XCONNECT_DEPLOY_KEY_FILE: ${{ steps.deploy_key.outputs.path }}
      run: >-
        python3
        ${{ github.workspace }}/.github/scripts/platform-ops/deploy/platform-ops_deploy_render-non-iac-agent-proxy-inventory.py

    - name: Preserve deploy-key access on non-IaC node
      working-directory: playbooks
      env:
        # The PH host is manually provisioned and may not carry the release key
        # yet, so the rendered inventory still supplies the Vault password. That
        # password must not be the *only* permitted method: this step installs
        # the deploy key, and later steps in this same job harden sshd with
        # `PasswordAuthentication no`. Pinning the connection to password-only
        # therefore worked exactly once — on every later run the node offers
        # publickey alone and refuses with "Permission denied (publickey)",
        # which is how a re-run of this job failed after its first success.
        # Offer the deploy key first and let ssh fall back to the password for a
        # genuine first contact. That makes the step idempotent and matches the
        # transport every other Ansible step in this workflow uses.
        ANSIBLE_SSH_ARGS: "-o ControlMaster=auto -o ControlPersist=60s -o IdentityFile=${{ runner.temp }}/xconnect-non-iac-deploy-key -o PreferredAuthentications=publickey,password -o StrictHostKeyChecking=no"
      run: |-
        SSH_PUBLIC_DEPLOY_KEY="$(ssh-keygen -y -f "${{ steps.deploy_key.outputs.path }}")"
        export SSH_PUBLIC_DEPLOY_KEY
        ansible-playbook \
          -i "${{ runner.temp }}/external-agent-proxy-bootstrap-inventory.yml" \
          prepare_non_iac_ssh_access.yml \
          --limit "${MATRIX_HOST}"

    - name: Render deploy-key inventory for non-IaC node
      id: inventory
      env:
        DEPLOYMENT_ENV: ${{ needs.provision.outputs.deployment_env }}
        XCONNECT_GITOPS_CONFIG: ${{ github.workspace }}/gitops/topology/${{ needs.provision.outputs.deployment_env }}/selfhost/${{ needs.provision.outputs.deployment_env == 'uat' && 'xconnect-regional-pool.yaml' || 'xconnect-regional-pools.yaml' }}
        XCONNECT_VAULT_RESPONSE_FILE: ${{ runner.temp }}/xconnect-vault.json
        XCONNECT_INVENTORY_FILE: ${{ runner.temp }}/external-agent-proxy-inventory.yml
        XCONNECT_NODE_ID: ${{ matrix.host }}
        XCONNECT_DEPLOY_KEY_FILE: ${{ steps.deploy_key.outputs.path }}
      run: >-
        python3
        ${{ github.workspace }}/.github/scripts/platform-ops/deploy/platform-ops_deploy_render-non-iac-agent-proxy-inventory.py

    - name: Restore domain TLS state to non-IaC node
      id: tls_restore
      env:
        VAULT_ROLE: ${{ env.VAULT_ROLE }}
        VAULT_CADDY_PATH: kv/data/CICD/domains/${{ needs.provision.outputs.target_domain_base }}
        DOMAIN_TLS_DIR: /etc/xcontrol/tls/${{ needs.provision.outputs.target_domain_base }}
      run: python3 ${{ github.workspace }}/.github/scripts/platform-ops/deploy/prepare-domain-tls-restore.py

    - name: Checkout reviewed Caddy PEM restore owner for non-IaC node
      if: ${{ steps.tls_restore.outputs.restore_required == 'true' }}
      uses: actions/checkout@v7
      with:
        repository: ai-workspace-infra/playbooks
        ref: 14f6196bbf69b78d07f1adb9fb8c97bc816a485b
        path: caddy-restore-playbooks

    - name: Restore PEM with pinned Playbooks Role on non-IaC node
      if: ${{ steps.tls_restore.outputs.restore_required == 'true' }}
      env:
        TLS_RESTORE_VARS_FILE: ${{ steps.tls_restore.outputs.vars_file }}
        ANSIBLE_SSH_ARGS: "-o ControlMaster=auto -o ControlPersist=60s -o IdentityFile=${{ runner.temp }}/xconnect-non-iac-deploy-key -o PreferredAuthentications=publickey,password -o StrictHostKeyChecking=no"
      run: >-
        ansible-playbook -i "${{ runner.temp }}/external-agent-proxy-inventory.yml"
        caddy-restore-playbooks/caddy_certificate_restore.yml
        -e "@${TLS_RESTORE_VARS_FILE}"

    - name: Remove non-IaC runtime PEM variables
      if: ${{ always() && steps.tls_restore.outputs.vars_file != '' }}
      env:
        TLS_RESTORE_VARS_FILE: ${{ steps.tls_restore.outputs.vars_file }}
      run: rm -f -- "${TLS_RESTORE_VARS_FILE}"

    - name: Resolve Xray Exporter image
      id: xray_exporter
      env:
        INPUT_XRAY_EXPORTER_IMAGE: ${{ github.event.inputs.xray_exporter_image }}
        DEPLOYMENT_ENV: ${{ needs.provision.outputs.deployment_env }}
        DEPLOY_TAG: ${{ needs.provision.outputs.deploy_tag }}
        GH_TOKEN: ${{ github.token }}
      run: >-
        ${{ github.workspace }}/.github/scripts/platform-ops/deploy/platform-ops_deploy_resolve-xray-exporter-image.sh

    - name: Deploy non-IaC Agent Proxy services
      working-directory: playbooks
      env:
        INTERNAL_SERVICE_TOKEN: ${{ steps.vault.outputs.INTERNAL_SERVICE_TOKEN }}
        AGENT_REPO_URL: https://github.com/ai-workspace-xstream/xconnect-edge-agent.git
        AGENT_PROXY_VERSION: ${{ needs.provision.outputs.deploy_tag }}
        # Use the resolved Cloud Run origin for serverless Accounts.  The
        # vanity controller hostname can be protected by a certificate for a
        # different hostname, which prevents the node from registering.
        AGENT_CONTROLLER_URL: ${{ needs.provision.outputs.agent_accounts_base_url }}
        AGENT_CONTROLLER_IP: ${{ steps.controller.outputs.ip }}
        AGENT_REPO_VERSION: ${{ needs.provision.outputs.deploy_tag }}
        AGENT_ID: ${{ matrix.host }}
        AGENT_PROXY_DOMAIN: ${{ steps.inventory.outputs.domain }}
        AGENT_DOMAIN_TLS_DIR: /etc/xcontrol/tls/${{ needs.provision.outputs.target_domain_base }}
        BILLING_SERVICE_BASE_URL: ${{ needs.provision.outputs.billing_service_base_url }}
        AGENT_XRAY_ENABLED: "true"
        AGENT_BILLING_ENABLED: "true"
        EXPORTER_ENV: prod
        ACCOUNTS_BASE_URL: ${{ needs.provision.outputs.agent_accounts_base_url }}
        XRAY_EXPORTER_RELEASE_REPOSITORY: ${{ steps.xray_exporter.outputs.repository }}
        XRAY_EXPORTER_VERSION: ${{ steps.xray_exporter.outputs.version }}
        XRAY_EXPORTER_LISTEN_ADDR: 127.0.0.1:8080
        XRAY_EXPORTER_TCP_LISTEN_ADDR: 127.0.0.1:8081
        VECTOR_SNAPSHOT_URL: ""
      run: >-
        ansible-playbook -i "${{ runner.temp }}/external-agent-proxy-inventory.yml"
        setup-agent-proxy-domain.yml
        --limit "${MATRIX_HOST}"
        -e agent_service_hosts=agent_proxy
        -e xray_exporter_hosts=agent_proxy
        -e agent_proxy_manage_source_checkout=true
        -e agent_proxy_build_on_target=true
        -e agent_proxy_wait_for_runtime_config=false
        -e agent_billing_enabled=true

    - name: Verify non-IaC Agent Proxy services
      working-directory: playbooks
      run: >-
        ansible
        -i "${{ runner.temp }}/external-agent-proxy-inventory.yml"
        "${MATRIX_HOST}"
        -m shell
        -a 'systemctl is-active --quiet caddy && systemctl is-active --quiet xray'

    - name: Validate central observability endpoint for non-IaC node
      env:
        OBSERVABILITY_ENDPOINT: ${{ github.event.inputs.observability_endpoint || 'https://observability.svc.plus' }}
      run: |
        set -euo pipefail
        case "${OBSERVABILITY_ENDPOINT}" in
          http://*|https://*) ;;
          *) echo "::error::OBSERVABILITY_ENDPOINT must be an HTTP(S) URL." >&2; exit 1 ;;
        esac

    - name: Deploy Observability Agent for non-IaC Agent Proxy
      working-directory: playbooks
      env:
        VECTOR_AUTH_USER: ${{ steps.vault.outputs.VECTOR_AUTH_USER || 'observability' }}
        VECTOR_AUTH_PASSWORD: ${{ steps.vault.outputs.VECTOR_AUTH_PASSWORD || 'vector-auth-default-token' }}
        INTERNAL_SERVICE_TOKEN: ${{ steps.vault.outputs.INTERNAL_SERVICE_TOKEN }}
        VECTOR_BILLING_INGEST_ENABLED: 'true'
        VECTOR_BILLING_INGEST_ADDRESS: 127.0.0.1:8686
        VECTOR_BILLING_INGEST_URL: ${{ format('{0}/v1/ingest/snapshots', needs.provision.outputs.billing_service_base_url) }}
        VECTOR_SNAPSHOT_URL: http://127.0.0.1:8686
        OBSERVABILITY_ENDPOINT: ${{ github.event.inputs.observability_endpoint || 'https://observability.svc.plus' }}
      run: >-
        ansible-playbook
        -i "${{ runner.temp }}/external-agent-proxy-inventory.yml"
        deploy_observability_agent.yml
        --limit "${MATRIX_HOST}"
        -e observability_agent_hosts=agent_proxy
        -e xray_exporter_hosts=agent_proxy
        -e vector_observability_endpoint="${OBSERVABILITY_ENDPOINT}"

  deploy_ai_workspace:
    name: "[2] AI Workspace | ${{ matrix.host }}"
    needs: [provision, deploy_base]
    if: >-
      ${{ !cancelled() &&
      needs.provision.result == 'success' &&
      needs.deploy_base.result == 'success' &&
      needs.provision.outputs.run_application_deploy == 'true' &&
      (needs.provision.outputs.terraform_action == 'apply' ||
      needs.provision.outputs.reuse_existing_host == 'true') &&
      needs.provision.outputs.count != '0' &&
      contains(fromJSON('["all","ai-workspace"]'), needs.provision.outputs.target_domains) &&
      needs.provision.outputs.hosts_ai_workspace != '[]' &&
      needs.provision.outputs.hosts_ai_workspace != '' }}
    strategy:
      fail-fast: false
      matrix:
        host: ${{ fromJSON(needs.provision.outputs.hosts_ai_workspace) }}
    uses: ai-workspace-infra/playbooks/.github/workflows/ai-workspace-domain-cd.yaml@main
    with:
      target_host: ${{ matrix.host }}
      deploy_env: ${{ needs.provision.outputs.deployment_env }}
      deploy_tag: ${{ needs.provision.outputs.deploy_tag }}

  deploy_monitor_agent:
    name: "[2] Monitor Agent"
    # Agent Proxy owns the native Xray and xray-exporter services. Vector's
    # billing input and exporter scrape sources must be rendered after that
    # deployment has completed; otherwise a parallel monitor job can render a
    # config without the Xray data-plane inputs and leave Billing at zero.
    needs: [provision, deploy_base, deploy_agent_proxy, deploy_agent_proxy_non_iac]
    if: >-
      ${{ always() && !cancelled() &&
      needs.provision.result == 'success' &&
      needs.deploy_base.result == 'success' &&
      (needs.deploy_agent_proxy.result == 'success' ||
      !contains(fromJSON('["all","agent-proxy","agent-proxy-jp","agent-proxy-us","agent-proxy-sg","web-saas + agent-proxy"]'), needs.provision.outputs.target_domains)) &&
      (needs.deploy_agent_proxy_non_iac.result == 'success' ||
      needs.provision.outputs.hosts_agent_proxy_non_iac == '[]' ||
      !contains(fromJSON('["all","agent-proxy","agent-proxy-jp","agent-proxy-us","agent-proxy-sg","web-saas + agent-proxy"]'), needs.provision.outputs.target_domains)) &&
      needs.provision.outputs.run_application_deploy == 'true' &&
      (needs.provision.outputs.terraform_action == 'apply' ||
      needs.provision.outputs.reuse_existing_host == 'true') &&
      needs.provision.outputs.count != '0' &&
      needs.provision.outputs.hosts != '[]' &&
      needs.provision.outputs.hosts != '' }}
    runs-on: ${{ github.event.inputs.runner_type || 'ubuntu-latest' }}
    strategy:
      fail-fast: false
      matrix:
        host: ${{ fromJSON(needs.provision.outputs.hosts) }}
    env:
      MATRIX_HOST: ${{ matrix.host }}
      ANSIBLE_HOST_KEY_CHECKING: "False"
      ANSIBLE_PIPELINING: "True"
      ANSIBLE_SSH_ARGS: "-o ControlMaster=auto -o ControlPersist=60s -o IdentityFile=~/.ssh/id_deploy -o StrictHostKeyChecking=no"
      VAULT_ENV_PATH: ${{ needs.provision.outputs.vault_env_path }}
      OBSERVABILITY_ENDPOINT: ${{ github.event.inputs.observability_endpoint || 'https://observability.svc.plus' }}
    steps:
    - name: Checkout repository
      uses: actions/checkout@v7

    - name: Checkout playbooks
      uses: actions/checkout@v7
      with:
        repository: ai-workspace-infra/playbooks
        ref: ${{ needs.provision.outputs.playbooks_ref }}
        path: playbooks

    - name: Download CMDB
      uses: actions/download-artifact@v8
      with:
        name: platform-ops-toolkit-cmdb
        path: cmdb

    - name: Load Vault secrets
      id: vault
      uses: hashicorp/vault-action@v4
      with:
        url: ${{ env.VAULT_ADDR }}
        method: jwt
        role: ${{ env.VAULT_ROLE }}
        jwtGithubAudience: vault
        ignoreNotFound: true
        secrets: |
          ${{ env.VAULT_KV_BASE }} SSH_PRIVATE_DEPLOY_KEY_B64 | ANSIBLE_SSH_KEY_B64 ;
          ${{ env.VAULT_KV_WEB_SAAS }} INTERNAL_SERVICE_TOKEN | INTERNAL_SERVICE_TOKEN ;
          ${{ env.VAULT_KV_DATABASES }} postgres_root_password | POSTGRESQL_ADMIN_PASSWORD ;
          kv/data/CICD/observability user | VECTOR_AUTH_USER ;
          kv/data/CICD/observability password | VECTOR_AUTH_PASSWORD

    - name: Cache pip packages
      uses: actions/cache@v6
      with:
        path: ~/.cache/pip
        key: ${{ runner.os }}-pip-ansible-v1
        restore-keys: |
          ${{ runner.os }}-pip-

    - name: Setup deployment runner
      uses: ai-workspace-infra/playbooks/.github/actions/setup-deployment-runner@2d326409ccfbd5f6e862c3dc08660e0ae12fb51d
      with:
        ssh_key_b64: ${{ steps.vault.outputs.ANSIBLE_SSH_KEY_B64 }}
        matrix_host: ${{ matrix.host }}
        wait_for_ssh: 'true'
        install_ansible: 'true'

    - name: Validate central observability endpoint
      env:
        OBSERVABILITY_ENDPOINT: ${{ github.event.inputs.observability_endpoint || 'https://observability.svc.plus' }}
      run: |
        set -euo pipefail
        case "${OBSERVABILITY_ENDPOINT}" in
          http://*|https://*) ;;
          *) echo "::error::OBSERVABILITY_ENDPOINT must be an HTTP(S) URL." >&2; exit 1 ;;
        esac

    - name: Deploy Observability Agent
      working-directory: playbooks
      env:
        VECTOR_AUTH_USER: ${{ steps.vault.outputs.VECTOR_AUTH_USER || 'observability' }}
        VECTOR_AUTH_PASSWORD: ${{ steps.vault.outputs.VECTOR_AUTH_PASSWORD || 'vector-auth-default-token' }}
        # Used only when a PostgreSQL listener is detected without a local
        # postgres process/container. The value comes from Vault via OIDC and
        # is consumed by Ansible's environment lookup; it is never committed
        # or passed as a command-line argument.
        POSTGRESQL_ADMIN_PASSWORD: ${{ steps.vault.outputs.POSTGRESQL_ADMIN_PASSWORD }}
        INTERNAL_SERVICE_TOKEN: ${{ steps.vault.outputs.INTERNAL_SERVICE_TOKEN }}
        # The billing fan-out uses the same contract in every environment.
        # billing_service_base_url is derived from deployment_env, preserving
        # strict production/UAT endpoint and data-plane separation.
        VECTOR_BILLING_INGEST_ENABLED: ${{ contains(fromJSON('["all","agent-proxy","agent-proxy-jp","agent-proxy-us","agent-proxy-sg","web-saas + agent-proxy"]'), needs.provision.outputs.target_domains) && 'true' || 'false' }}
        VECTOR_BILLING_INGEST_ADDRESS: 127.0.0.1:8686
        VECTOR_BILLING_INGEST_URL: ${{ format('{0}/v1/ingest/snapshots', needs.provision.outputs.billing_service_base_url) }}
        VECTOR_SNAPSHOT_URL: ${{ contains(fromJSON('["all","agent-proxy","agent-proxy-jp","agent-proxy-us","agent-proxy-sg","web-saas + agent-proxy"]'), needs.provision.outputs.target_domains) && 'http://127.0.0.1:8686' || '' }}
        OBSERVABILITY_ENDPOINT: ${{ github.event.inputs.observability_endpoint || 'https://observability.svc.plus' }}
      run: ${{ github.workspace }}/playbooks/scripts/pipeline/deploy-monitor-agent.sh

    - name: Verify Xray to Billing ingest chain
      if: ${{ contains(fromJSON('["all","agent-proxy","agent-proxy-jp","agent-proxy-us","agent-proxy-sg","web-saas + agent-proxy"]'), needs.provision.outputs.target_domains) }}
      working-directory: playbooks
      env:
        MATRIX_HOST: ${{ matrix.host }}
        ANSIBLE_INVENTORY: ../cmdb/inventory.ini
        VECTOR_BILLING_INGEST_URL: ${{ format('{0}/v1/ingest/snapshots', needs.provision.outputs.billing_service_base_url) }}
      run: ${{ github.workspace }}/playbooks/scripts/pipeline/verify-xray-billing-chain.sh

  trigger_data_migration:
    name: "[3] Data Migration"
    # The toolkit operation selects whether this execution includes migration.
    # GitOps supplies the declarative runtime topology only; its migration
    # capability flag is not a control-plane authorization for this run.
    # Import is explicit and gated by confirm_legacy_import in the unified
    # control plane. Older migrate/deploy+migrate callers fail closed.
    needs: [provision]
    if: >-
      ${{ always() && !cancelled() &&
      needs.provision.result == 'success' &&
      (needs.provision.outputs.toolkit_action == 'migrate' ||
      needs.provision.outputs.toolkit_action == 'deploy+migrate') }}
    runs-on: ubuntu-latest
    steps:
    - name: Check out the toolkit dispatcher
      uses: actions/checkout@v7
      with:
        ref: ${{ github.sha }}

    - name: Dispatch explicitly gated legacy import and wait for its verdict
      env:
        GH_TOKEN: ${{ github.token }}
        DATA_OPERATION: legacy_import
        DATA_ENVIRONMENT: ${{ needs.provision.outputs.deployment_env }}
        DATA_CONFIG_JSON: '{"confirm_legacy_import":false,"caller_run_id":"${{ github.run_id }}","accounts_source_host":"${{ needs.provision.outputs.source_host }}","accounts_target_host":"${{ needs.provision.outputs.migration_target_host }}","accounts_transport":"ssh","accounts_source_backend":"vps","accounts_target_backend":"vps","accounts_migration_mode":"data","accounts_dry_run":false}'
        RELEASE_TAG: ${{ needs.provision.outputs.deploy_tag }}
        ACCOUNTS_REF: ${{ needs.provision.outputs.deploy_tag || 'main' }}
        DATA_WORKFLOW_REF: main
      run: python3 .github/scripts/environment-upgrade/dispatch.py
