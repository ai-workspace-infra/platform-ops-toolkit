name: XConnect One Existing UAT

on:
  workflow_dispatch:
    inputs:
      mode:
        description: Validate only or enroll the fixed UAT One
        type: choice
        options: [dry-run, apply]
        default: dry-run
      gitops_ref:
        description: Reviewed GitOps commit SHA
        type: string
        required: false
        default: 'b7cc399f64d56f1b236b76f4fb2bbb37a8797d43'
      playbooks_ref:
        description: Reviewed Playbooks commit SHA
        type: string
        required: false
        default: 'dfa5f4c397d79d40681aaa96939003f38b9f2266'
      cli_release_tag:
        description: XConnect-One GitHub Release tag
        type: string
        required: false
        default: 'v0.1.12'
      network_id:
        description: Existing UAT Zero network identity
        type: string
        required: false
        default: 'net_uat'
      one_vault_key:
        description: Existing One Vault record key under prod/ulighthost-xconnect
        type: string
        required: false
        default: 'observability.svc.plus'
      gateway_vault_key:
        description: Stable Gateway Vault record key under prod/ulighthost-xconnect
        type: string
        required: false
        default: 'TW-XConnect.onwalk.net'
      ssh_debug_ingress_cidrs:
        description: Optional operator SSH IPv4 /32 allowlist; not stored in GitOps
        type: string
        required: false
        default: '35.79.83.48/32'

permissions:
  contents: read
  id-token: write

concurrency:
  group: xconnect-one-uat-existing
  cancel-in-progress: false

env:
  XCONNECT_VAULT_ROLE: github-actions-platform-ops-toolkit-uat-xconnect-existing-one

jobs:
  validate:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      MODE: ${{ inputs.mode }}
      GITOPS_REF: ${{ inputs.gitops_ref || 'b7cc399f64d56f1b236b76f4fb2bbb37a8797d43' }}
      PLAYBOOKS_REF: ${{ inputs.playbooks_ref || 'dfa5f4c397d79d40681aaa96939003f38b9f2266' }}
      CLI_RELEASE_TAG: ${{ inputs.cli_release_tag || 'v0.1.12' }}
      ZERO_NETWORK_ID: ${{ inputs.network_id || 'net_uat' }}
      ONE_DEVICE_ID: observability-uat
      ONE_VAULT_KEY: ${{ inputs.one_vault_key || 'observability.svc.plus' }}
      GATEWAY_VAULT_KEY: ${{ inputs.gateway_vault_key || 'TW-XConnect.onwalk.net' }}
      GATEWAY_SERVER_NAME: TW-XConnect.svc.plus
      SSH_DEBUG_INGRESS_CIDRS: ${{ inputs.ssh_debug_ingress_cidrs || '35.79.83.48/32' }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Validate workflow and local contracts
        run: |
          test "${GITOPS_REF}" != "" && test "${PLAYBOOKS_REF}" != ""
          [[ "${GITOPS_REF}" =~ ^[0-9a-f]{40}$ ]]
          [[ "${PLAYBOOKS_REF}" =~ ^[0-9a-f]{40}$ ]]
          [[ "${CLI_RELEASE_TAG}" =~ ^v[0-9A-Za-z._-]+$ ]]
          bash -n .github/scripts/xconnect-existing-one-uat/deploy.sh
          test "${SSH_DEBUG_INGRESS_CIDRS}" != '0.0.0.0/0'

      - name: Authenticate CI to Vault via GitHub JWT
        id: bootstrap
        uses: hashicorp/vault-action@v4
        with:
          url: https://vault.svc.plus
          method: jwt
          role: ${{ env.XCONNECT_VAULT_ROLE }}
          jwtGithubAudience: vault
          exportEnv: false
          secrets: |
            kv/data/CICD/github-app/daily-snapshot app_private_key | APP_PRIVATE_KEY

      - name: Create read-only infrastructure repository token
        id: infra-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: Iv23liNwStpQIiXajhpb
          private-key: ${{ steps.bootstrap.outputs.APP_PRIVATE_KEY }}
          owner: ai-workspace-infra
          repositories: gitops,playbooks

      - name: Create read-only XConnect-One release token
        id: artifact-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: Iv23liNwStpQIiXajhpb
          private-key: ${{ steps.bootstrap.outputs.APP_PRIVATE_KEY }}
          owner: ai-workspace-xstream
          repositories: XConnect-One

      - uses: actions/checkout@v4
        with:
          repository: ai-workspace-infra/gitops
          ref: ${{ env.GITOPS_REF }}
          token: ${{ steps.infra-token.outputs.token }}
          path: gitops
          persist-credentials: false

      - uses: actions/checkout@v4
        with:
          repository: ai-workspace-infra/playbooks
          ref: ${{ env.PLAYBOOKS_REF }}
          token: ${{ steps.infra-token.outputs.token }}
          path: playbooks
          persist-credentials: false

      - name: Verify fixed UAT One declaration
        run: |
          declaration=gitops/vpn-overlay/uat/xconnect-one-nodes.yaml
          grep -Fq 'gateway_ref: TW-XConnect.svc.plus' "$declaration"
          grep -Fq 'fqdn: observability.svc.plus' "$declaration"
          grep -Fq 'lifecycle: persistent' "$declaration"
          grep -Fq 'deployment: enabled' "$declaration"

      - name: Read UAT runtime credentials from dedicated Vault paths
        if: inputs.mode == 'apply'
        id: runtime
        uses: hashicorp/vault-action@v4
        with:
          url: https://vault.svc.plus
          method: jwt
          role: ${{ env.XCONNECT_VAULT_ROLE }}
          jwtGithubAudience: vault
          exportEnv: false
          secrets: |
            kv/data/uat/xconnect-one VLESS_ID | LAB_VLESS_ID ;
            kv/data/uat/xconnect-one ZERO_SERVICE_TOKEN | ZERO_SERVICE_TOKEN ;
            kv/data/uat/xconnect-one ZERO_OWNER_EMAIL | ZERO_OWNER_EMAIL ;
            kv/data/prod/ulighthost-xconnect/${{ env.ONE_VAULT_KEY }} host | ONE_HOST ;
            kv/data/prod/ulighthost-xconnect/${{ env.ONE_VAULT_KEY }} user | ONE_USER ;
            kv/data/prod/ulighthost-xconnect/${{ env.ONE_VAULT_KEY }} ssh_private_key_b64 | ONE_SSH_PRIVATE_KEY_B64 ;
            kv/data/prod/ulighthost-xconnect/${{ env.GATEWAY_VAULT_KEY }} host | GATEWAY_HOST ;
            kv/data/prod/ulighthost-xconnect/${{ env.GATEWAY_VAULT_KEY }} user | GATEWAY_USER ;
            kv/data/prod/ulighthost-xconnect/${{ env.GATEWAY_VAULT_KEY }} ssh_private_key_b64 | GATEWAY_SSH_PRIVATE_KEY_B64 ;
            kv/data/CICD/observability user | OBSERVABILITY_USER ;
            kv/data/CICD/observability password | OBSERVABILITY_PASSWORD

      - name: Install Ansible controller
        if: inputs.mode == 'apply'
        run: |
          python3 -m pip install --user 'ansible-core==2.17.7'
          echo "$(python3 -m site --user-base)/bin" >> "$GITHUB_PATH"

      - name: Enroll existing Linux One and verify UAT data plane
        if: inputs.mode == 'apply'
        env:
          LAB_DIR: ${{ runner.temp }}/xconnect-existing-one
          GITHUB_WORKSPACE: ${{ github.workspace }}
          CLI_RELEASE_TOKEN: ${{ steps.artifact-token.outputs.token }}
          ZERO_ACCOUNTS_API_URL: https://accounts-uat.onwalk.net
          LAB_VLESS_ID: ${{ steps.runtime.outputs.LAB_VLESS_ID }}
          ZERO_SERVICE_TOKEN: ${{ steps.runtime.outputs.ZERO_SERVICE_TOKEN }}
          ZERO_OWNER_EMAIL: ${{ steps.runtime.outputs.ZERO_OWNER_EMAIL }}
          ONE_DEVICE_ID: observability-uat
          ONE_HOST: ${{ steps.runtime.outputs.ONE_HOST }}
          ONE_USER: ${{ steps.runtime.outputs.ONE_USER }}
          ONE_SSH_PRIVATE_KEY_B64: ${{ steps.runtime.outputs.ONE_SSH_PRIVATE_KEY_B64 }}
          GATEWAY_HOST: ${{ steps.runtime.outputs.GATEWAY_HOST }}
          GATEWAY_USER: ${{ steps.runtime.outputs.GATEWAY_USER }}
          GATEWAY_SSH_PRIVATE_KEY_B64: ${{ steps.runtime.outputs.GATEWAY_SSH_PRIVATE_KEY_B64 }}
          GATEWAY_SERVER_NAME: TW-XConnect.svc.plus
          OBSERVABILITY_USER: ${{ steps.runtime.outputs.OBSERVABILITY_USER }}
          OBSERVABILITY_PASSWORD: ${{ steps.runtime.outputs.OBSERVABILITY_PASSWORD }}
        run: bash .github/scripts/xconnect-existing-one-uat/deploy.sh
