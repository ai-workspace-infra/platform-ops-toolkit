name: Observability server

on:
  workflow_dispatch:
    inputs:
      deploy_env:
        description: "Environment contract: UAT or PROD. Select target_platform for the concrete UAT runtime."
        type: choice
        required: true
        default: uat
        options: [uat, prod]
      target_platform:
        description: "UAT runtime target. shared-gcp resolves the target solely from the reviewed shared GitOps declaration."
        type: choice
        required: true
        default: legacy-akamai
        options: [legacy-akamai, shared-gcp]
      gcp_account_id:
        description: "Concrete shared GCP account/project identity; used only when target_platform=shared-gcp."
        type: string
        required: false
        default: open-platform-shared
      gcp_resource_manifest:
        description: "Reviewed GitOps GCPWorkloadNamespace path for the shared Observability VM."
        type: string
        required: false
        default: resources/svc.plus/shared/gcp/open-platform-shared-observability.yaml
      deployment_action:
        description: "UAT target action; PROD only accepts plan or skip for declaration audit"
        type: choice
        required: true
        default: plan
        options: [plan, infra, deploy, skip]
      instance_plan:
        description: "Akamai plan for the open-platform target"
        type: choice
        required: true
        default: 2C4G
        options: [2C4G, 4C8G]
      deploy_tag:
        description: "Immutable UAT daily-build tag; required for UAT deploy"
        type: string
        required: false
        default: ""
      source_ref:
        description: "Reviewed toolkit/playbooks/GitOps source ref"
        type: string
        required: true
        default: main
      mcp_services:
        description: "Optional MCP adapters: none, all, or comma-separated grafana,victoriametrics,victorialogs,victoriatraces"
        type: string
        required: true
        default: none
      source_ip:
        description: "Optional retired migration-source IPv4; required only for an explicit migration or rollback"
        type: string
        required: false
        default: ""
      target_ip_override:
        description: "Existing target IPv4, required when deployment_action=skip and migration/cutover/verification is selected"
        type: string
        required: false
        default: ""
      verify_existing_target:
        description: "Read-only verification of an existing target and the current source node; requires deployment_action=skip and target_ip_override"
        type: boolean
        required: true
        default: false
      migration_mode:
        description: "none leaves stores untouched; baseline copies live snapshots; final performs the last sync"
        type: choice
        required: true
        default: none
        options: [none, baseline, final]
      data_components:
        description: "Historical store set to copy; DNS cutover requires all three"
        type: choice
        required: true
        default: all
        options: [all, metrics, logs, traces]
      confirm_source_writers_paused:
        description: "Confirm all external writers to the source have been paused before final sync"
        type: boolean
        required: true
        default: false
      confirm_target_historical_queries:
        description: "Confirm representative historical metrics, logs, and traces queries matched the source after baseline restore"
        type: boolean
        required: true
        default: false
      confirm_history_omission:
        description: "Explicitly accept that historical metrics, logs, and traces will not be copied to the new target"
        type: boolean
        required: true
        default: false
      dns_action:
        description: "Only the observability.svc.plus A record is changed"
        type: choice
        required: true
        default: none
        options: [none, cutover, rollback]
      confirm_dns_change:
        description: "Acknowledge that this run changes the public observability.svc.plus DNS record"
        type: boolean
        required: true
        default: false
      dns_confirmation:
        description: "Type SWITCH-OBSERVABILITY-DNS or ROLLBACK-OBSERVABILITY-DNS to confirm the selected DNS action"
        type: string
        required: false
        default: ""

permissions:
  actions: write
  contents: read
  id-token: write

concurrency:
  group: observability-server-${{ inputs.deploy_env }}
  cancel-in-progress: false

jobs:
  validate:
    name: Validate parameters and build store matrix
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    outputs:
      environment_matrix: ${{ steps.environment.outputs.matrix }}
      runtime_model: ${{ steps.environment.outputs.runtime_model }}
      cloud_provider: ${{ steps.environment.outputs.cloud_provider }}
      vault_env_path: ${{ steps.environment.outputs.vault_env_path }}
      cloud_account: ${{ steps.environment.outputs.cloud_account }}
      target_domain_base: ${{ steps.environment.outputs.target_domain_base }}
      source_domain_base: ${{ steps.environment.outputs.source_domain_base }}
      source_host: ${{ steps.environment.outputs.source_host }}
      target_platform: ${{ steps.environment.outputs.target_platform }}
      gcp_account_id: ${{ steps.environment.outputs.gcp_account_id }}
      gcp_resource_manifest: ${{ steps.environment.outputs.gcp_resource_manifest }}
      matrix: ${{ steps.plan.outputs.matrix }}
      mcp_matrix: ${{ steps.plan.outputs.mcp_matrix }}
      mcp_enabled: ${{ steps.plan.outputs.mcp_enabled }}
      mcp_services: ${{ steps.plan.outputs.mcp_services }}
    steps:
      - name: Build selected environment contract
        id: environment
        env:
          DEPLOY_ENV: ${{ inputs.deploy_env }}
          TARGET_PLATFORM: ${{ inputs.target_platform }}
          GCP_ACCOUNT_ID: ${{ inputs.gcp_account_id }}
          GCP_RESOURCE_MANIFEST: ${{ inputs.gcp_resource_manifest }}
        run: |
          set -euo pipefail
          [[ "${TARGET_PLATFORM}" == legacy-akamai || "${TARGET_PLATFORM}" == shared-gcp ]] || {
            echo "Unsupported target_platform: ${TARGET_PLATFORM}" >&2; exit 1;
          }
          if [[ "${TARGET_PLATFORM}" == shared-gcp ]]; then
            [[ "${DEPLOY_ENV}" == uat ]] || { echo 'shared-gcp is currently an UAT service runtime' >&2; exit 1; }
            [[ "${GCP_ACCOUNT_ID}" == open-platform-shared ]] || { echo 'shared Observability must use the reviewed open-platform-shared account' >&2; exit 1; }
            [[ "${GCP_RESOURCE_MANIFEST}" == resources/svc.plus/shared/gcp/open-platform-shared-observability.yaml ]] || {
              echo 'shared Observability manifest must be the reviewed open-platform shared declaration' >&2; exit 1;
            }
            matrix='{"include":[{"name":"shared-gcp","runtime_model":"gcp-oslogin-compose","cloud_provider":"gcp-cloud","evidence":"gitops-declaration"}]}'
            runtime_model='gcp-oslogin-compose'
            cloud_provider='gcp-cloud'
            cloud_account="${GCP_ACCOUNT_ID}"
            target_domain_base='svc.plus'
            source_domain_base='svc.plus'
            source_host=''
          fi
          case "${DEPLOY_ENV}" in
            uat)
              if [[ "${TARGET_PLATFORM}" == legacy-akamai ]]; then
                matrix='{"include":[{"name":"uat","runtime_model":"akamai-compose","cloud_provider":"akamai-cloud","evidence":"observed-runtime"}]}'
                runtime_model='akamai-compose'
                cloud_provider='akamai-cloud'
                cloud_account='manbuzhe2026'
                target_domain_base='onwalk.net'
                source_domain_base='svc.plus'
                source_host='observability.svc.plus'
              fi
              ;;
            prod)
              matrix='{"include":[{"name":"prod","runtime_model":"flux-kubernetes","cloud_provider":"kubernetes","evidence":"gitops-declaration"}]}'
              runtime_model='flux-kubernetes'
              cloud_provider='kubernetes'
              cloud_account=''
              target_domain_base='svc.plus'
              source_domain_base='svc.plus'
              source_host=''
              ;;
            *) echo "Unsupported deploy_env: ${DEPLOY_ENV}" >&2; exit 1 ;;
          esac
          echo "matrix=${matrix}" >> "${GITHUB_OUTPUT}"
          echo "runtime_model=${runtime_model}" >> "${GITHUB_OUTPUT}"
          echo "cloud_provider=${cloud_provider}" >> "${GITHUB_OUTPUT}"
          echo "vault_env_path=${DEPLOY_ENV}" >> "${GITHUB_OUTPUT}"
          echo "cloud_account=${cloud_account}" >> "${GITHUB_OUTPUT}"
          echo "target_domain_base=${target_domain_base}" >> "${GITHUB_OUTPUT}"
          echo "source_domain_base=${source_domain_base}" >> "${GITHUB_OUTPUT}"
          echo "source_host=${source_host}" >> "${GITHUB_OUTPUT}"
          echo "target_platform=${TARGET_PLATFORM}" >> "${GITHUB_OUTPUT}"
          echo "gcp_account_id=${GCP_ACCOUNT_ID}" >> "${GITHUB_OUTPUT}"
          echo "gcp_resource_manifest=${GCP_RESOURCE_MANIFEST}" >> "${GITHUB_OUTPUT}"

      - name: Validate run controls
        env:
          DEPLOY_ENV: ${{ inputs.deploy_env }}
          TARGET_PLATFORM: ${{ inputs.target_platform }}
          DEPLOYMENT_ACTION: ${{ inputs.deployment_action }}
          DEPLOY_TAG: ${{ inputs.deploy_tag }}
          SOURCE_REF: ${{ inputs.source_ref }}
          SOURCE_IP: ${{ inputs.source_ip }}
          TARGET_IP: ${{ inputs.target_ip_override }}
          VERIFY_EXISTING_TARGET: ${{ inputs.verify_existing_target }}
          MIGRATION_MODE: ${{ inputs.migration_mode }}
          DATA_COMPONENTS: ${{ inputs.data_components }}
          MCP_SERVICES: ${{ inputs.mcp_services }}
          SOURCE_WRITERS_PAUSED: ${{ inputs.confirm_source_writers_paused }}
          TARGET_HISTORY_VERIFIED: ${{ inputs.confirm_target_historical_queries }}
          HISTORY_OMITTED: ${{ inputs.confirm_history_omission }}
          DNS_ACTION: ${{ inputs.dns_action }}
          DNS_CONFIRMED: ${{ inputs.confirm_dns_change }}
          DNS_CONFIRMATION: ${{ inputs.dns_confirmation }}
        run: |
          set -euo pipefail
          if [[ "${DEPLOY_ENV}" == prod ]]; then
            [[ "${DEPLOYMENT_ACTION}" == plan || "${DEPLOYMENT_ACTION}" == skip ]] || {
              echo 'PROD is Flux/Kubernetes managed; this workflow only audits its declaration with deployment_action=plan or skip' >&2; exit 1;
            }
            [[ "${MIGRATION_MODE}" == none && "${DNS_ACTION}" == none && "${VERIFY_EXISTING_TARGET}" == false ]] || {
              echo 'PROD declaration audit cannot run UAT Compose migration, DNS, or SSH verification controls' >&2; exit 1;
            }
            [[ -z "${DEPLOY_TAG}" && -z "${SOURCE_IP}" && -z "${TARGET_IP}" ]] || {
              echo 'PROD declaration audit does not accept UAT deploy tags or host IPs' >&2; exit 1;
            }
          fi
          if [[ "${TARGET_PLATFORM}" == shared-gcp ]]; then
            [[ -z "${TARGET_IP}" && "${VERIFY_EXISTING_TARGET}" == false ]] || {
              echo 'shared-gcp resolves its target from GitOps; do not pass target_ip_override or verify_existing_target' >&2; exit 1;
            }
            [[ "${MIGRATION_MODE}" == none && "${DNS_ACTION}" == none ]] || {
              echo 'shared-gcp deployment does not migrate history or change DNS; use a dedicated reviewed migration/cutover workflow' >&2; exit 1;
            }
          fi
          [[ "${SOURCE_REF}" =~ ^[A-Za-z0-9._/-]+$ && "${SOURCE_REF}" != *..* ]] || {
            echo 'source_ref must be a simple reviewed Git ref' >&2; exit 1;
          }
          if [[ "${MCP_SERVICES}" != none ]]; then
            [[ "${DEPLOYMENT_ACTION}" != plan && "${DEPLOYMENT_ACTION}" != infra ]] || { echo 'MCP verification requires deployment_action=deploy or skip' >&2; exit 1; }
            [[ "${DEPLOYMENT_ACTION}" != skip || -n "${TARGET_IP}" ]] || { echo 'target_ip_override is required to verify MCP on an existing target' >&2; exit 1; }
          fi
          if [[ "${VERIFY_EXISTING_TARGET}" == true ]]; then
            [[ "${DEPLOYMENT_ACTION}" == skip && -n "${TARGET_IP}" ]] || {
              echo 'verify_existing_target=true requires deployment_action=skip and target_ip_override' >&2; exit 1;
            }
            [[ "${MIGRATION_MODE}" == none && "${DNS_ACTION}" == none ]] || {
              echo 'Read-only verification cannot be combined with migration or DNS changes' >&2; exit 1;
            }
          fi
          python3 - "${SOURCE_IP}" "${TARGET_IP}" <<'PY'
          import ipaddress, sys
          for value in sys.argv[1:]:
              if value:
                  ipaddress.IPv4Address(value)
          PY
          if [[ "${DEPLOYMENT_ACTION}" == deploy ]]; then
            [[ "${DEPLOY_TAG}" =~ ^(uat-)?daily-build-[0-9]{4}\.[0-9]{2}\.[0-9]{2}(-r[1-9][0-9]*)?$ ]] || {
              echo 'deployment_action=deploy requires an immutable UAT daily-build tag' >&2; exit 1;
            }
            [[ -z "${TARGET_IP}" ]] || { echo 'Do not set target_ip_override when deploying a target.' >&2; exit 1; }
          elif [[ -n "${DEPLOY_TAG}" ]]; then
            echo 'deploy_tag is only accepted for deployment_action=deploy' >&2; exit 1
          fi
          if [[ "${DEPLOYMENT_ACTION}" == plan || "${DEPLOYMENT_ACTION}" == infra ]]; then
            [[ "${MIGRATION_MODE}" == none && "${DNS_ACTION}" == none ]] || {
              echo 'plan/infra cannot be combined with data migration or DNS changes' >&2; exit 1;
            }
          fi
          if [[ "${DEPLOYMENT_ACTION}" == skip && ( "${MIGRATION_MODE}" != none || "${DNS_ACTION}" == cutover ) && -z "${TARGET_IP}" ]]; then
            echo 'target_ip_override is required when skipping deployment for migration/cutover' >&2; exit 1
          fi
          if [[ "${MIGRATION_MODE}" == final && "${SOURCE_WRITERS_PAUSED}" != true ]]; then
            echo 'final sync requires confirm_source_writers_paused=true' >&2; exit 1
          fi
          if [[ "${MIGRATION_MODE}" != none && -z "${SOURCE_IP}" ]]; then
            echo 'Historical migration requires an explicit source_ip because the retired node has no default' >&2; exit 1
          fi
          if [[ "${DNS_ACTION}" == cutover ]]; then
            [[ "${DEPLOYMENT_ACTION}" == skip && "${DNS_CONFIRMED}" == true && "${DNS_CONFIRMATION}" == SWITCH-OBSERVABILITY-DNS ]] || {
              echo 'DNS cutover requires a deployed/existing target, confirm_dns_change=true, and dns_confirmation=SWITCH-OBSERVABILITY-DNS' >&2; exit 1;
            }
            if [[ "${MIGRATION_MODE}" == none ]]; then
              [[ "${HISTORY_OMITTED}" == true ]] || {
                echo 'DNS cutover without history migration requires confirm_history_omission=true' >&2; exit 1;
              }
            else
              [[ "${MIGRATION_MODE}" == final && "${DATA_COMPONENTS}" == all && "${SOURCE_WRITERS_PAUSED}" == true && "${TARGET_HISTORY_VERIFIED}" == true ]] || {
                echo 'DNS cutover with history migration requires final sync of all stores, paused source writers, and verified historical queries' >&2; exit 1;
              }
            fi
          elif [[ "${DNS_ACTION}" == rollback ]]; then
            [[ -n "${SOURCE_IP}" && "${DEPLOYMENT_ACTION}" == skip && "${DNS_CONFIRMED}" == true && "${DNS_CONFIRMATION}" == ROLLBACK-OBSERVABILITY-DNS ]] || {
              echo 'DNS rollback requires deployment_action=skip, confirm_dns_change=true, and dns_confirmation=ROLLBACK-OBSERVABILITY-DNS' >&2; exit 1;
            }
          elif [[ "${DNS_CONFIRMED}" == true || -n "${DNS_CONFIRMATION}" ]]; then
            echo 'DNS confirmations are only valid when dns_action=cutover or rollback' >&2; exit 1
          fi
          if [[ "${MIGRATION_MODE}" != none && "${DEPLOYMENT_ACTION}" == plan ]]; then
            echo 'Historical migration requires deployment_action=deploy or skip' >&2; exit 1
          fi

      - name: Plan selected store matrix
        id: plan
        env:
          DATA_COMPONENTS: ${{ inputs.data_components }}
          MCP_SERVICES: ${{ inputs.mcp_services }}
        run: |
          set -euo pipefail
          case "${DATA_COMPONENTS}" in
            all) matrix='{"include":[{"component":"victoriametrics","key":"metrics"},{"component":"victorialogs","key":"logs"},{"component":"victoriatraces","key":"traces"}]}' ;;
            metrics) matrix='{"include":[{"component":"victoriametrics","key":"metrics"}]}' ;;
            logs) matrix='{"include":[{"component":"victorialogs","key":"logs"}]}' ;;
            traces) matrix='{"include":[{"component":"victoriatraces","key":"traces"}]}' ;;
            *) echo "Unsupported data_components: ${DATA_COMPONENTS}" >&2; exit 1 ;;
          esac
          echo "matrix=${matrix}" >> "${GITHUB_OUTPUT}"
          python3 - <<'PY'
          import json, os
          all_services = [
              ("grafana", "xstream_mcp_grafana", 8000),
              ("victoriametrics", "xstream_mcp_victoriametrics", 8088),
              ("victorialogs", "xstream_mcp_victorialogs", 8083),
              ("victoriatraces", "xstream_mcp_victoriatraces", 8082),
          ]
          raw = os.environ["MCP_SERVICES"]
          allowed = {name for name, _, _ in all_services}
          if raw == "all":
              selected = allowed
          elif raw == "none":
              selected = set()
          else:
              items = raw.split(",")
              if any(not item or item.strip() != item or item not in allowed for item in items):
                  raise SystemExit("mcp_services must be none, all, or a comma-separated list of supported service names")
              if len(set(items)) != len(items):
                  raise SystemExit("mcp_services cannot contain duplicate service names")
              selected = set(items)
          include = [
              {"component": name, "container": container, "port": str(port), "enabled": name in selected}
              for name, container, port in all_services
          ]
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write("mcp_matrix=" + json.dumps({"include": include}, separators=(",", ":")) + "\n")
              output.write("mcp_enabled=" + str(bool(selected)).lower() + "\n")
              output.write("mcp_services=" + ("all" if selected == allowed else ",".join(name for name, _, _ in all_services if name in selected) or "none") + "\n")
          PY

  audit_environment:
    name: "Audit ${{ matrix.name }} ${{ matrix.runtime_model }} resources"
    needs: validate
    runs-on: ubuntu-latest
    strategy:
      matrix: ${{ fromJSON(needs.validate.outputs.environment_matrix) }}
    steps:
      - name: Checkout Playbooks
        uses: actions/checkout@v4
        with:
          repository: ai-workspace-infra/playbooks
          ref: ${{ inputs.source_ref }}
          path: playbooks

      - name: Checkout GitOps
        uses: actions/checkout@v4
        with:
          repository: ai-workspace-infra/gitops
          ref: main
          path: gitops

      - name: Check UAT Akamai Compose source and live core
        if: matrix.name == 'uat' && needs.validate.outputs.target_platform == 'legacy-akamai'
        run: |
          set -euo pipefail
          grep -Eq '^observability\.svc\.plus[[:space:]]+ansible_host=45\.79\.175\.119([[:space:]]|$)' playbooks/inventory.ini
          compose=playbooks/roles/docker/observability-server/templates/docker-compose.yml.j2
          for service in grafana victoria-metrics victoria-logs victoria-traces; do
            grep -Eq "^[[:space:]]{2}${service}:" "${compose}" || {
              echo "Missing UAT Compose service: ${service}" >&2; exit 1;
            }
          done
          curl --fail --silent --show-error --retry 4 --retry-all-errors --retry-delay 2 \
            --connect-timeout 5 --max-time 20 https://observability.svc.plus/grafana/api/health \
            | jq -e '.database == "ok"' >/dev/null
          for path in victoriametrics victorialogs victoriatraces; do
            curl --fail --silent --show-error --retry 4 --retry-all-errors --retry-delay 2 \
              --connect-timeout 5 --max-time 20 "https://observability.svc.plus/${path}/metrics" >/dev/null
          done
          printf '### UAT Observability resource evidence\n\n- Runtime: Akamai Compose\n- Inventory target: 45.79.175.119\n- Evidence: live HTTP health and Playbooks source\n' >> "${GITHUB_STEP_SUMMARY}"

      - name: Check shared GCP Observability declaration
        if: matrix.name == 'shared-gcp'
        env:
          MANIFEST: ${{ needs.validate.outputs.gcp_resource_manifest }}
          ACCOUNT: ${{ needs.validate.outputs.gcp_account_id }}
        run: |
          set -euo pipefail
          MANIFEST="${MANIFEST}" ACCOUNT="${ACCOUNT}" ruby <<'RUBY'
          require "yaml"
          manifest = ENV.fetch("MANIFEST")
          abort "unsafe GitOps manifest path" unless manifest.match?(%r{\Aresources/svc\.plus/shared/gcp/[a-z0-9-]+\.yaml\z})
          doc = YAML.load_file(File.join("gitops", manifest))
          metadata, spec = doc.fetch("metadata"), doc.fetch("spec")
          abort "wrong resource kind" unless doc.fetch("kind") == "GCPWorkloadNamespace"
          abort "shared GCP declaration required" unless metadata.fetch("environment") == "shared" && metadata.fetch("provider") == "gcp"
          abort "unexpected GCP account" unless spec.fetch("gcp_account_id") == ENV.fetch("ACCOUNT")
          nodes = spec.fetch("resources").fetch("vault_nodes")
          abort "exactly one Observability node is required" unless nodes.length == 1
          node = nodes.fetch(0)
          abort "shared Observability node name mismatch" unless node.fetch("name") == "observability-shared-0"
          abort "shared Observability requires a public IP" unless node.fetch("public_ip") == true
          abort "observability service domain missing" unless Array(node.fetch("service_domains")).include?("observability.svc.plus")
          RUBY
          printf '### Shared GCP Observability resource evidence\n\n- Runtime: GCP VM with OS Login\n- Target: GitOps `open-platform-shared-observability` declaration\n- DNS: unchanged by this service deployment\n' >> "${GITHUB_STEP_SUMMARY}"

      - name: Check PROD Flux and Kubernetes declaration
        if: matrix.name == 'prod'
        run: |
          set -euo pipefail
          ruby -e '
            require "yaml"
            flux = YAML.safe_load(File.read("gitops/environments/clusters/prod/observability-kustomization.yaml"))
            abort "wrong Flux path" unless flux.dig("spec", "path") == "./services/observability"
            values = YAML.safe_load(File.read("gitops/services/observability/observability-stack/values.yaml"))
            server = values.fetch("server")
            %w[victoriaMetrics victoriaLogs victoriaTraces].each do |name|
              abort "#{name} is not enabled in PROD declaration" unless server.dig(name, "enabled") == true
            end
            grafana = server.dig("grafana", "enabled")
            File.open(ENV.fetch("GITHUB_STEP_SUMMARY"), "a") do |f|
              f.puts "### PROD Observability resource evidence"
              f.puts
              f.puts "- Runtime: Flux/Kubernetes"
              f.puts "- VictoriaMetrics, VictoriaLogs, VictoriaTraces: enabled in GitOps"
              f.puts "- Grafana enabled in PROD GitOps: #{grafana}"
              f.puts "- Evidence type: desired declaration; no UAT runtime status was reused"
            end
          '

      - name: Verify PROD Console aliases through the same Worker chain
        if: matrix.name == 'prod'
        run: |
          set -euo pipefail
          for host in console.svc.plus console-serverless-prod.svc.plus; do
            headers="${RUNNER_TEMP}/${host}.headers"
            status="$(curl --silent --show-error --output /dev/null --dump-header "${headers}" \
              --write-out '%{http_code}' --retry 4 --retry-all-errors --retry-delay 2 \
              --connect-timeout 5 --max-time 20 "https://${host}/")"
            [[ "${status}" == 200 ]] || { echo "${host} returned HTTP ${status}" >&2; exit 1; }
            route="$(awk 'BEGIN { IGNORECASE=1 } /^x-frontend-route:/ {gsub("\\r", "", $2); print $2}' "${headers}" | tail -1)"
            [[ "${route}" == ssr-public ]] || { echo "${host} reached unexpected route: ${route:-missing}" >&2; exit 1; }
            echo "- ${host}: HTTP 200 via ${route}" >> "${GITHUB_STEP_SUMMARY}"
          done

  deploy_target:
    name: Deploy only the Observability service
    needs: [validate, audit_environment]
    if: inputs.deploy_env == 'uat' && inputs.target_platform == 'legacy-akamai' && inputs.deployment_action != 'skip'
    runs-on: ubuntu-latest
    outputs:
      child_run_id: ${{ steps.dispatch.outputs.child_run_id }}
    steps:
      - name: Checkout toolkit
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Dispatch isolated open-platform Observability target
        id: dispatch
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          DEPLOYMENT_ACTION: ${{ inputs.deployment_action }}
          INSTANCE_PLAN: ${{ inputs.instance_plan }}
          DEPLOY_TAG: ${{ inputs.deploy_tag }}
          SOURCE_REF: ${{ inputs.source_ref }}
          OPEN_PLATFORM_MCP_SERVICES: ${{ needs.validate.outputs.mcp_services }}
          CLOUD_PROVIDER: ${{ needs.validate.outputs.cloud_provider }}
          VAULT_ENV_PATH: ${{ needs.validate.outputs.vault_env_path }}
          CLOUD_ACCOUNT: ${{ needs.validate.outputs.cloud_account }}
          TARGET_DOMAIN_BASE: ${{ needs.validate.outputs.target_domain_base }}
          SOURCE_DOMAIN_BASE: ${{ needs.validate.outputs.source_domain_base }}
          SOURCE_HOST: ${{ needs.validate.outputs.source_host }}
        run: |
          set -euo pipefail
          dispatch_started="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          payload="$(jq -n \
            --arg operation "${DEPLOYMENT_ACTION}" \
            --arg deploy_tag "${DEPLOY_TAG}" \
            --arg source_ref "${SOURCE_REF}" \
            --arg open_platform_mcp_services "${OPEN_PLATFORM_MCP_SERVICES}" \
            --arg instance_plan "${INSTANCE_PLAN}" \
            --arg cloud_provider "${CLOUD_PROVIDER}" \
            --arg vault_env_path "${VAULT_ENV_PATH}" \
            --arg cloud_account "${CLOUD_ACCOUNT}" \
            --arg target_domain_base "${TARGET_DOMAIN_BASE}" \
            --arg source_domain_base "${SOURCE_DOMAIN_BASE}" \
            --arg source_host "${SOURCE_HOST}" \
            '{ref:"main",inputs:{
              runner_type:"ubuntu-latest",
              operation:$operation,
              target_domains:"open-platform",
              open_platform_service:"observability",
              cloud_provider:$cloud_provider,
              vault_env_path:$vault_env_path,
              cloud_account:$cloud_account,
              akamai_account:$cloud_account,
              target_domain_base:$target_domain_base,
              source_domain_base:$source_domain_base,
              source_host:$source_host,
              instance_plan:$instance_plan,
              dns_mode:"none",
              deploy_tag:$deploy_tag,
              source_ref:$source_ref,
              open_platform_mcp_services:$open_platform_mcp_services
            }}')"
          gh api --method POST "repos/${GH_REPO}/actions/workflows/selfhost-orchestrator.yml/dispatches" --input - <<<"${payload}" >/dev/null
          run_id=""
          for _ in $(seq 1 45); do
            run_id="$(gh run list --repo "${GH_REPO}" --workflow selfhost-orchestrator.yml --event workflow_dispatch --limit 50 \
              --json databaseId,createdAt,headBranch \
              --jq "[.[] | select(.headBranch == \"main\" and .createdAt >= \"${dispatch_started}\")] | sort_by(.createdAt) | last | .databaseId // empty")"
            [[ -n "${run_id}" ]] && break
            sleep 2
          done
          [[ -n "${run_id}" ]] || { echo 'Could not locate the child deployment run' >&2; exit 1; }
          echo "Watching Selfhost Orchestrator run ${run_id} (open-platform / observability, ${INSTANCE_PLAN})"
          gh run watch "${run_id}" --repo "${GH_REPO}" --interval 15 --exit-status --compact
          echo "child_run_id=${run_id}" >> "${GITHUB_OUTPUT}"

  deploy_shared_target:
    name: Deploy shared GCP Observability service
    needs: [validate, audit_environment]
    if: inputs.deploy_env == 'uat' && inputs.target_platform == 'shared-gcp' && inputs.deployment_action == 'deploy'
    runs-on: ubuntu-latest
    environment: prod
    permissions:
      contents: read
      id-token: write
    outputs:
      target_ip: ${{ steps.target.outputs.ip }}
    steps:
      - name: Checkout Toolkit actions
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Checkout GitOps declaration
        uses: actions/checkout@v4
        with:
          repository: ai-workspace-infra/gitops
          ref: ${{ inputs.source_ref }}
          path: gitops

      - name: Checkout reviewed Playbooks
        uses: actions/checkout@v4
        with:
          repository: ai-workspace-infra/playbooks
          ref: ${{ inputs.source_ref }}
          path: playbooks

      - name: Authenticate to shared GCP with the service-only Vault role
        id: gcp_auth
        uses: ./.github/actions/configure-gcp-oidc
        with:
          environment: shared
          credential_environment: shared
          account_id: ${{ needs.validate.outputs.gcp_account_id }}
          vault_role: github-actions-platform-ops-toolkit-shared-gcp-service-open-platform-shared
          load_state_contract: 'false'

      - name: Install Google Cloud CLI
        uses: google-github-actions/setup-gcloud@v2

      - name: Resolve declared shared GCP node and public address
        id: target
        env:
          MANIFEST: ${{ needs.validate.outputs.gcp_resource_manifest }}
          EXPECTED_PROJECT: ${{ steps.gcp_auth.outputs.project_id }}
        run: |
          set -euo pipefail
          MANIFEST="${MANIFEST}" EXPECTED_PROJECT="${EXPECTED_PROJECT}" ruby <<'RUBY' >> "${GITHUB_OUTPUT}"
          require "yaml"
          manifest = ENV.fetch("MANIFEST")
          abort "unsafe GitOps manifest path" unless manifest.match?(%r{\Aresources/svc\.plus/shared/gcp/[a-z0-9-]+\.yaml\z})
          doc = YAML.load_file(File.join("gitops", manifest))
          metadata, spec = doc.fetch("metadata"), doc.fetch("spec")
          abort "shared GCP declaration required" unless metadata.fetch("environment") == "shared" && metadata.fetch("provider") == "gcp"
          abort "Vault identity project does not match GitOps" unless spec.fetch("project_id") == ENV.fetch("EXPECTED_PROJECT")
          nodes = spec.fetch("resources").fetch("vault_nodes")
          abort "exactly one Observability node is required" unless nodes.length == 1
          node = nodes.fetch(0)
          abort "unexpected shared Observability node" unless node.fetch("name") == "observability-shared-0" && node.fetch("public_ip") == true
          abort "observability.svc.plus is required" unless Array(node.fetch("service_domains")).include?("observability.svc.plus")
          puts "project_id=#{spec.fetch("project_id")}"
          puts "network_name=#{spec.fetch("network_name")}"
          puts "node_name=#{node.fetch("name")}"
          puts "node_zone=#{node.fetch("zone")}"
          RUBY
          instance="$(gcloud compute instances describe "${{ steps.target.outputs.node_name }}" \
            --project="${{ steps.target.outputs.project_id }}" --zone="${{ steps.target.outputs.node_zone }}" --format=json)"
          test "$(jq -r '.status // empty' <<<"${instance}")" = RUNNING || { echo '::error::Shared Observability VM is not RUNNING' >&2; exit 1; }
          ip="$(jq -r '[.networkInterfaces[]?.accessConfigs[]?.natIP // empty] | first // empty' <<<"${instance}")"
          python3 - "${ip}" <<'PY'
          import ipaddress, sys
          ipaddress.IPv4Address(sys.argv[1])
          PY
          echo "ip=${ip}" >> "${GITHUB_OUTPUT}"

      - name: Create time-limited OS Login access and deployment inventory
        id: access
        env:
          PROJECT_ID: ${{ steps.target.outputs.project_id }}
          NETWORK_NAME: ${{ steps.target.outputs.network_name }}
          NODE_NAME: ${{ steps.target.outputs.node_name }}
          TARGET_IP: ${{ steps.target.outputs.ip }}
        run: |
          set -euo pipefail
          access_dir="${RUNNER_TEMP}/observability-shared-access"
          install -d -m 700 "${access_dir}"
          key_path="${access_dir}/id_ed25519"
          ssh-keygen -q -t ed25519 -N '' -f "${key_path}"
          gcloud compute os-login ssh-keys add --project="${PROJECT_ID}" --key-file="${key_path}.pub" --ttl=35m >/dev/null
          profile="$(gcloud compute os-login describe-profile --project="${PROJECT_ID}" --format=json)"
          ssh_user="$(jq -er '[.posixAccounts[]? | select(.operatingSystemType == "LINUX") | .username] | first' <<<"${profile}")"
          [[ "${ssh_user}" =~ ^[a-z_][a-z0-9_-]{0,31}\$?$ ]] || { echo '::error::GCP OS Login returned an invalid Linux user' >&2; exit 1; }
          runner_ip="$(curl --fail --silent --show-error --retry 3 --connect-timeout 5 https://api.ipify.org)"
          python3 - "${runner_ip}" "${TARGET_IP}" <<'PY'
          import ipaddress, sys
          for value in sys.argv[1:]: ipaddress.IPv4Address(value)
          PY
          rule="obs-shared-ssh-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          gcloud compute firewall-rules create "${rule}" \
            --project="${PROJECT_ID}" --network="${NETWORK_NAME}" \
            --direction=INGRESS --priority=1000 --action=ALLOW --rules=tcp:22 \
            --source-ranges="${runner_ip}/32" --target-tags=vault \
            --description="Ephemeral Observability deployment access; run ${GITHUB_RUN_ID}/${GITHUB_RUN_ATTEMPT}" --quiet
          jq -n --arg host "${NODE_NAME}" --arg ip "${TARGET_IP}" --arg user "${ssh_user}" \
            '{($host): {ip:$ip, ansible_user:$user, ansible_port:22, groups:["observability_hosts"]}}' > "${access_dir}/cmdb.json"
          cat > "${access_dir}/inventory.ini" <<EOF
          [observability_hosts]
          ${NODE_NAME} ansible_host=${TARGET_IP} ansible_user=${ssh_user} ansible_port=22 ansible_ssh_private_key_file=${key_path}
          EOF
          echo "access_dir=${access_dir}" >> "${GITHUB_OUTPUT}"
          echo "key_path=${key_path}" >> "${GITHUB_OUTPUT}"
          echo "rule=${rule}" >> "${GITHUB_OUTPUT}"

      - name: Wait for OS Login SSH and install Ansible controller dependencies
        env:
          ACCESS_DIR: ${{ steps.access.outputs.access_dir }}
          NODE_NAME: ${{ steps.target.outputs.node_name }}
        run: |
          set -euo pipefail
          python3 -m pip install --disable-pip-version-check --quiet ansible hvac
          for _ in $(seq 1 60); do
            if ansible -i "${ACCESS_DIR}/inventory.ini" "${NODE_NAME}" -m ping >/dev/null 2>&1; then exit 0; fi
            sleep 3
          done
          echo '::error::Timed out waiting for GCP OS Login SSH access' >&2
          exit 1

      - name: Deploy Observability stack without DNS cutover
        working-directory: playbooks
        env:
          ACCESS_DIR: ${{ steps.access.outputs.access_dir }}
        run: |
          set -euo pipefail
          ansible-playbook -i "${ACCESS_DIR}/inventory.ini" deploy_observability_server.yml \
            --limit observability_hosts \
            -e observability_server_hosts=observability_hosts \
            -e observability_mcp_enabled=false

      - name: Verify local Observability service health
        env:
          ACCESS_DIR: ${{ steps.access.outputs.access_dir }}
          NODE_NAME: ${{ steps.target.outputs.node_name }}
        run: |
          set -euo pipefail
          ansible -i "${ACCESS_DIR}/inventory.ini" "${NODE_NAME}" -b -m uri \
            -a 'url=http://127.0.0.1:3030/api/health return_content=true status_code=200' | grep -F '"database": "ok"'
          printf '### Shared GCP Observability deployment\n\n- Node: `%s`\n- Public DNS: unchanged\n- SSH: temporary OS Login key and /32 firewall rule revoked after this job\n' "${NODE_NAME}" >> "${GITHUB_STEP_SUMMARY}"

      - name: Revoke temporary OS Login access and SSH firewall rule
        if: ${{ always() && steps.access.outputs.access_dir != '' }}
        env:
          ACCESS_DIR: ${{ steps.access.outputs.access_dir }}
          RULE: ${{ steps.access.outputs.rule }}
          PROJECT_ID: ${{ steps.target.outputs.project_id }}
        run: |
          set -euo pipefail
          if [[ -n "${RULE}" ]] && gcloud compute firewall-rules describe "${RULE}" --project="${PROJECT_ID}" >/dev/null 2>&1; then
            gcloud compute firewall-rules delete "${RULE}" --project="${PROJECT_ID}" --quiet
          fi
          if [[ -s "${ACCESS_DIR}/id_ed25519.pub" ]]; then
            gcloud compute os-login ssh-keys remove --project="${PROJECT_ID}" --key-file="${ACCESS_DIR}/id_ed25519.pub" || true
          fi
          rm -rf -- "${ACCESS_DIR}"

  resolve_target:
    name: Resolve the single Observability target IP
    needs: [validate, deploy_target, deploy_shared_target]
    if: >-
      ${{ always() && !cancelled() &&
      inputs.deploy_env == 'uat' &&
      needs.validate.result == 'success' &&
      (inputs.deployment_action == 'deploy' || inputs.migration_mode != 'none' || inputs.dns_action == 'cutover' || inputs.verify_existing_target || needs.validate.outputs.mcp_enabled == 'true') &&
      (needs.deploy_target.result == 'success' || needs.deploy_shared_target.result == 'success' || inputs.deployment_action == 'skip') }}
    runs-on: ubuntu-latest
    outputs:
      target_ip: ${{ steps.deployed_target.outputs.ip || steps.shared_target.outputs.ip || steps.target.outputs.ip }}
    steps:
      - name: Download target CMDB from the deployment run
        id: deployed_target
        if: inputs.deployment_action == 'deploy'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          CHILD_RUN_ID: ${{ needs.deploy_target.outputs.child_run_id }}
        run: |
          set -euo pipefail
          [[ "${CHILD_RUN_ID}" =~ ^[0-9]+$ ]] || { echo 'Missing successful deployment run ID' >&2; exit 1; }
          gh run download "${CHILD_RUN_ID}" --repo "${GH_REPO}" --name platform-ops-toolkit-cmdb --dir "${RUNNER_TEMP}/cmdb"
          ip="$(jq -er '[to_entries[] | select((.value.groups // []) | index("open_platform")) | .value.ip] | if length == 1 then .[0] else error("expected one open_platform host") end' "${RUNNER_TEMP}/cmdb/cmdb.json")"
          python3 - "${ip}" <<'PY'
          import ipaddress, sys
          ipaddress.IPv4Address(sys.argv[1])
          PY
          echo "ip=${ip}" >> "${GITHUB_OUTPUT}"

      - name: Use GitOps-resolved shared GCP target IP
        id: shared_target
        if: inputs.target_platform == 'shared-gcp' && inputs.deployment_action == 'deploy'
        env:
          TARGET_IP: ${{ needs.deploy_shared_target.outputs.target_ip }}
        run: |
          set -euo pipefail
          python3 - "${TARGET_IP}" <<'PY'
          import ipaddress, sys
          ipaddress.IPv4Address(sys.argv[1])
          PY
          echo "ip=${TARGET_IP}" >> "${GITHUB_OUTPUT}"

      - name: Use explicitly supplied existing target IP
        id: target
        if: inputs.deployment_action == 'skip'
        env:
          TARGET_IP: ${{ inputs.target_ip_override }}
        run: |
          set -euo pipefail
          python3 - "${TARGET_IP}" <<'PY'
          import ipaddress, sys
          ipaddress.IPv4Address(sys.argv[1])
          PY
          echo "ip=${TARGET_IP}" >> "${GITHUB_OUTPUT}"

  historical_data:
    name: "Snapshot and restore ${{ matrix.component }}"
    needs: [validate, resolve_target]
    if: >-
      ${{ always() && !cancelled() && inputs.deploy_env == 'uat' && needs.validate.result == 'success' &&
      needs.resolve_target.result == 'success' && inputs.migration_mode != 'none' }}
    runs-on: ubuntu-latest
    environment: ${{ inputs.deploy_env }}
    permissions:
      contents: read
      id-token: write
    timeout-minutes: 120
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix: ${{ fromJSON(needs.validate.outputs.matrix) }}
    env:
      VAULT_ADDR: https://vault.svc.plus
      VAULT_ROLE: github-actions-platform-ops-toolkit-uat-observability
      SOURCE_IP: ${{ inputs.source_ip }}
      TARGET_IP: ${{ needs.resolve_target.outputs.target_ip }}
      COMPONENT: ${{ matrix.component }}
      MIGRATION_MODE: ${{ inputs.migration_mode }}
      RUN_KEY: ${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - name: Checkout toolkit
        uses: actions/checkout@v4

      - name: Load SSH deployment key from Vault
        id: vault
        uses: hashicorp/vault-action@v4
        with:
          url: ${{ env.VAULT_ADDR }}
          method: jwt
          role: ${{ env.VAULT_ROLE }}
          jwtGithubAudience: vault
          secrets: |
            kv/data/CICD SSH_PRIVATE_DEPLOY_KEY_B64 | SSH_PRIVATE_DEPLOY_KEY_B64

      - name: Configure SSH key
        env:
          SSH_PRIVATE_DEPLOY_KEY_B64: ${{ steps.vault.outputs.SSH_PRIVATE_DEPLOY_KEY_B64 }}
        run: |
          set -euo pipefail
          install -d -m 700 "${RUNNER_TEMP}/observability-ssh"
          printf '%s' "${SSH_PRIVATE_DEPLOY_KEY_B64}" | base64 --decode > "${RUNNER_TEMP}/observability-ssh/id_deploy"
          chmod 600 "${RUNNER_TEMP}/observability-ssh/id_deploy"

      - name: Snapshot, transfer, restore, and verify one store
        env:
          SSH_PRIVATE_KEY_PATH: ${{ runner.temp }}/observability-ssh/id_deploy
        run: .github/scripts/observability/observability_data_migrate.sh

  verify_stores:
    name: "Verify restored ${{ matrix.component }} history"
    needs: [validate, resolve_target, historical_data]
    if: >-
      ${{ always() && !cancelled() && inputs.deploy_env == 'uat' && inputs.migration_mode != 'none' &&
      needs.validate.result == 'success' && needs.resolve_target.result == 'success' &&
      needs.historical_data.result == 'success' }}
    runs-on: ubuntu-latest
    environment: ${{ inputs.deploy_env }}
    permissions:
      contents: read
      id-token: write
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix: ${{ fromJSON(needs.validate.outputs.matrix) }}
    env:
      TARGET_IP: ${{ needs.resolve_target.outputs.target_ip }}
      COMPONENT: ${{ matrix.component }}
      RUN_KEY: ${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - name: Checkout toolkit
        uses: actions/checkout@v4
      - name: Load SSH deployment key from Vault
        id: vault
        uses: hashicorp/vault-action@v4
        with:
          url: https://vault.svc.plus
          method: jwt
          role: github-actions-platform-ops-toolkit-uat-observability
          jwtGithubAudience: vault
          secrets: |
            kv/data/CICD SSH_PRIVATE_DEPLOY_KEY_B64 | SSH_PRIVATE_DEPLOY_KEY_B64
      - name: Configure SSH key
        env:
          SSH_PRIVATE_DEPLOY_KEY_B64: ${{ steps.vault.outputs.SSH_PRIVATE_DEPLOY_KEY_B64 }}
        run: |
          set -euo pipefail
          install -d -m 700 "${RUNNER_TEMP}/observability-ssh"
          printf '%s' "${SSH_PRIVATE_DEPLOY_KEY_B64}" | base64 --decode > "${RUNNER_TEMP}/observability-ssh/id_deploy"
          chmod 600 "${RUNNER_TEMP}/observability-ssh/id_deploy"
      - name: Check component health, restored byte counts, and partition set
        env:
          SSH_PRIVATE_KEY_PATH: ${{ runner.temp }}/observability-ssh/id_deploy
        run: .github/scripts/observability/observability_verify_store.sh

  verify_target:
    name: Verify target service and Git-managed dashboards
    needs: [validate, deploy_target, deploy_shared_target, resolve_target, historical_data, verify_stores]
    if: >-
      ${{ always() && !cancelled() &&
      inputs.deploy_env == 'uat' && inputs.target_platform == 'legacy-akamai' &&
      needs.validate.result == 'success' &&
      (inputs.deployment_action == 'deploy' || inputs.migration_mode != 'none' || inputs.dns_action == 'cutover' || inputs.verify_existing_target || needs.validate.outputs.mcp_enabled == 'true') &&
      (needs.deploy_target.result == 'success' || needs.deploy_shared_target.result == 'success' || inputs.deployment_action == 'skip') &&
      needs.resolve_target.result == 'success' &&
      (needs.historical_data.result == 'success' || needs.historical_data.result == 'skipped') &&
      (needs.verify_stores.result == 'success' || needs.verify_stores.result == 'skipped') }}
    runs-on: ubuntu-latest
    environment: ${{ inputs.deploy_env }}
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout toolkit
        uses: actions/checkout@v4
      - name: Checkout Playbooks dashboard source
        uses: actions/checkout@v4
        with:
          repository: ai-workspace-infra/playbooks
          ref: ${{ inputs.source_ref }}
          path: playbooks
      - name: Load SSH deployment key from Vault
        id: vault
        uses: hashicorp/vault-action@v4
        with:
          url: https://vault.svc.plus
          method: jwt
          role: github-actions-platform-ops-toolkit-uat-observability
          jwtGithubAudience: vault
          secrets: |
            kv/data/CICD SSH_PRIVATE_DEPLOY_KEY_B64 | SSH_PRIVATE_DEPLOY_KEY_B64
      - name: Configure SSH key
        env:
          SSH_PRIVATE_DEPLOY_KEY_B64: ${{ steps.vault.outputs.SSH_PRIVATE_DEPLOY_KEY_B64 }}
        run: |
          set -euo pipefail
          install -d -m 700 "${RUNNER_TEMP}/observability-ssh"
          printf '%s' "${SSH_PRIVATE_DEPLOY_KEY_B64}" | base64 --decode > "${RUNNER_TEMP}/observability-ssh/id_deploy"
          chmod 600 "${RUNNER_TEMP}/observability-ssh/id_deploy"
      - name: Verify Grafana health and exact dashboard asset set
        env:
          SSH_PRIVATE_KEY_PATH: ${{ runner.temp }}/observability-ssh/id_deploy
          TARGET_IP: ${{ needs.resolve_target.outputs.target_ip }}
          SOURCE_IP: ${{ inputs.source_ip }}
          VERIFY_SOURCE_NODE: ${{ inputs.verify_existing_target }}
          DASHBOARD_SOURCE: playbooks/roles/docker/observability-server/files
          DNS_ACTION: ${{ inputs.dns_action }}
        run: .github/scripts/observability/observability_verify_target.sh

  verify_mcp_matrix:
    name: "Verify ${{ matrix.component }} MCP protocol and backend auth"
    needs: [validate, deploy_target, deploy_shared_target, resolve_target, historical_data, verify_stores, verify_target]
    if: >-
      ${{ always() && !cancelled() &&
      inputs.deploy_env == 'uat' && inputs.target_platform == 'legacy-akamai' &&
      needs.validate.result == 'success' &&
      (inputs.deployment_action == 'deploy' || inputs.migration_mode != 'none' || inputs.dns_action == 'cutover' || needs.validate.outputs.mcp_enabled == 'true') &&
      (needs.deploy_target.result == 'success' || needs.deploy_shared_target.result == 'success' || inputs.deployment_action == 'skip') &&
      needs.resolve_target.result == 'success' && needs.verify_target.result == 'success' &&
      (needs.validate.outputs.mcp_enabled == 'true') &&
      (needs.historical_data.result == 'success' || needs.historical_data.result == 'skipped') &&
      (needs.verify_stores.result == 'success' || needs.verify_stores.result == 'skipped') }}
    runs-on: ubuntu-latest
    environment: ${{ inputs.deploy_env }}
    permissions:
      contents: read
      id-token: write
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix: ${{ fromJSON(needs.validate.outputs.mcp_matrix) }}
    env:
      TARGET_IP: ${{ needs.resolve_target.outputs.target_ip }}
      COMPONENT: ${{ matrix.component }}
      CONTAINER: ${{ matrix.container }}
      PORT: ${{ matrix.port }}
    steps:
      - name: Checkout toolkit
        if: matrix.enabled
        uses: actions/checkout@v4
      - name: Load SSH deployment key from Vault
        if: matrix.enabled
        id: vault
        uses: hashicorp/vault-action@v4
        with:
          url: https://vault.svc.plus
          method: jwt
          role: github-actions-platform-ops-toolkit-uat-observability
          jwtGithubAudience: vault
          secrets: |
            kv/data/CICD SSH_PRIVATE_DEPLOY_KEY_B64 | SSH_PRIVATE_DEPLOY_KEY_B64
      - name: Configure SSH key
        if: matrix.enabled
        env:
          SSH_PRIVATE_DEPLOY_KEY_B64: ${{ steps.vault.outputs.SSH_PRIVATE_DEPLOY_KEY_B64 }}
        run: |
          set -euo pipefail
          install -d -m 700 "${RUNNER_TEMP}/observability-ssh"
          printf '%s' "${SSH_PRIVATE_DEPLOY_KEY_B64}" | base64 --decode > "${RUNNER_TEMP}/observability-ssh/id_deploy"
          chmod 600 "${RUNNER_TEMP}/observability-ssh/id_deploy"
      - name: Check MCP container, streamable HTTP handshake, tools, and backend credentials
        if: matrix.enabled
        env:
          SSH_PRIVATE_KEY_PATH: ${{ runner.temp }}/observability-ssh/id_deploy
        run: .github/scripts/observability/observability_verify_mcp.sh

  dns_switch:
    name: "${{ inputs.dns_action == 'rollback' && 'Rollback' || 'Cut over' }} observability.svc.plus"
    needs: [validate, resolve_target, historical_data, verify_stores, verify_target, verify_mcp_matrix]
    if: >-
      ${{ always() && !cancelled() && inputs.deploy_env == 'uat' && inputs.dns_action != 'none' &&
      needs.validate.result == 'success' &&
      (needs.resolve_target.result == 'success' || (inputs.dns_action == 'rollback' && needs.resolve_target.result == 'skipped')) &&
      (needs.historical_data.result == 'success' || (inputs.dns_action == 'rollback' && needs.historical_data.result == 'skipped') || (inputs.dns_action == 'cutover' && inputs.migration_mode == 'none' && inputs.confirm_history_omission && needs.historical_data.result == 'skipped')) &&
      (needs.verify_stores.result == 'success' || (inputs.dns_action == 'rollback' && needs.verify_stores.result == 'skipped') || (inputs.dns_action == 'cutover' && inputs.migration_mode == 'none' && inputs.confirm_history_omission && needs.verify_stores.result == 'skipped')) &&
      (needs.verify_target.result == 'success' || (inputs.dns_action == 'rollback' && needs.verify_target.result == 'skipped')) &&
      (needs.verify_mcp_matrix.result == 'success' || ((inputs.dns_action == 'rollback' || (needs.validate.outputs.mcp_enabled != 'true')) && needs.verify_mcp_matrix.result == 'skipped')) &&
      (inputs.dns_action == 'rollback' ||
      (needs.verify_target.result == 'success' &&
      ((needs.validate.outputs.mcp_enabled != 'true') || needs.verify_mcp_matrix.result == 'success') &&
      ((needs.historical_data.result == 'success' && needs.verify_stores.result == 'success') ||
      (inputs.migration_mode == 'none' && inputs.confirm_history_omission && needs.historical_data.result == 'skipped' && needs.verify_stores.result == 'skipped')))) }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: ${{ inputs.deploy_env }}
    permissions:
      contents: read
      id-token: write
    env:
      VAULT_ADDR: https://vault.svc.plus
      VAULT_ROLE: github-actions-platform-ops-toolkit-uat-observability
    steps:
      - name: Checkout toolkit
        uses: actions/checkout@v4
      - name: Load Cloudflare DNS token from Vault
        id: vault
        uses: hashicorp/vault-action@v4
        with:
          url: ${{ env.VAULT_ADDR }}
          method: jwt
          role: ${{ env.VAULT_ROLE }}
          jwtGithubAudience: vault
          secrets: |
            kv/data/CICD CLOUDFLARE_DNS_API_TOKEN | CLOUDFLARE_DNS_API_TOKEN
      - name: Load SSH deployment key from Vault
        id: ssh-vault
        uses: hashicorp/vault-action@v4
        with:
          url: ${{ env.VAULT_ADDR }}
          method: jwt
          role: ${{ env.VAULT_ROLE }}
          jwtGithubAudience: vault
          secrets: |
            kv/data/CICD SSH_PRIVATE_DEPLOY_KEY_B64 | SSH_PRIVATE_DEPLOY_KEY_B64
      - name: Configure SSH key for Caddy certificate refresh
        env:
          SSH_PRIVATE_DEPLOY_KEY_B64: ${{ steps.ssh-vault.outputs.SSH_PRIVATE_DEPLOY_KEY_B64 }}
        run: |
          set -euo pipefail
          install -d -m 700 "${RUNNER_TEMP}/observability-ssh"
          printf '%s' "${SSH_PRIVATE_DEPLOY_KEY_B64}" | base64 --decode > "${RUNNER_TEMP}/observability-ssh/id_deploy"
          chmod 600 "${RUNNER_TEMP}/observability-ssh/id_deploy"
      - name: Change only the observability.svc.plus A record
        env:
          SSH_PRIVATE_KEY_PATH: ${{ runner.temp }}/observability-ssh/id_deploy
          CLOUDFLARE_DNS_API_TOKEN: ${{ steps.vault.outputs.CLOUDFLARE_DNS_API_TOKEN }}
          DNS_ACTION: ${{ inputs.dns_action }}
          SOURCE_IP: ${{ inputs.source_ip }}
          TARGET_IP: ${{ needs.resolve_target.outputs.target_ip || inputs.target_ip_override }}
        run: .github/scripts/observability/observability_dns_switch.sh
