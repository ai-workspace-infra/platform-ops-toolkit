      - if: contains(inputs.dependency_stages, 'account')
        uses: actions/download-artifact@v4
        with:
          pattern: iac-stage-${{ github.run_id }}-${{ github.run_attempt }}-*-account
          path: ${{ runner.temp }}/iac-dependencies/account
          merge-multiple: false
      - if: contains(inputs.dependency_stages, 'resources')
        uses: actions/download-artifact@v4
        with:
          pattern: iac-stage-${{ github.run_id }}-${{ github.run_attempt }}-*-resources
          path: ${{ runner.temp }}/iac-dependencies/resources
