name: Multi Cloud LandingZone Baseline

on:
  push:
    branches:
      - main
      - 'release/**'
    paths:
    - 'terraform-hcl-standard/**'
    - '.github/workflows/iac-pipeline-multi-cloud-landingzone-baseline.yaml'
  pull_request:
    paths:
    - 'terraform-hcl-standard/**'
    - '.github/workflows/iac-pipeline-multi-cloud-landingzone-baseline.yaml'
    branches: [main]
  workflow_dispatch:
    inputs:
      deploy_action:
        description: "Deployment action"
        type: choice
        options: [plan, apply, destroy]
        default: plan
      deploy_dry_run:
        description: "Dry-run mode"
        type: choice
        options: ['true', 'false']
        default: 'true'
      project:
        description: "环境(项目) / Project (Base Domain)"
        type: string
        default: svc.plus
      vault_env_path:
        description: "Vault environment (e.g. sit, uat, prod)"
        type: choice
        options: [sit, uat, prod]
        default: sit
      cloud_provider:
        description: "服务商 / Cloud Provider"
        type: choice
        required: true
        options: [aws-cloud, gcp-cloud, azure-cloud, vultr-vps]
      state_account:
        description: "Canonical state account segment"
        type: string
        required: false
        default: default
      gitops_repo_name:
        description: "GitOps repository (URL or owner/repo)"
        type: string
        default: https://github.com/cloud-neutral-workshop/gitops.git
      gitops_repo_ref:
        description: "GitOps repo ref (branch/tag/sha) to use"
        type: string
        default: main
      gcp_account_id:
        description: "GCP account identifier used for Vault JWT/WIF authentication"
        type: string
        default: xworktech
      gcp_resource_manifest:
        description: "Optional GCP GitOps manifest path"
        type: string
        default: ''
      gcp_iac_ref:
        description: "Pinned iac_modules ref used for GCP"
        type: string
        default: 54e9f7ed2782f1d30befda6a70615168bcc44921
      aws_region:
        description: "AWS region used only when cloud_provider=aws-cloud"
        type: string
        default: ap-northeast-1
      aws_role_arn:
        description: "AWS OIDC role used only when cloud_provider=aws-cloud"
        type: string
        default: ''
  workflow_call:
    inputs:
      deploy_action:
        type: string
        required: false
        default: plan
      deploy_dry_run:
        type: string
        required: false
        default: 'true'
      project:
        type: string
        required: false
        default: svc.plus
      vault_env_path:
        type: string
        required: false
        default: sit
      cloud_provider:
        type: string
        required: true
      state_account:
        type: string
        required: false
        default: default
      gitops_repo_name:
        type: string
        required: false
        default: https://github.com/cloud-neutral-workshop/gitops.git
      gitops_repo_ref:
        type: string
        required: false
        default: main
      gcp_account_id:
        type: string
        required: false
        default: xworktech
      gcp_resource_manifest:
        type: string
        required: false
        default: ''
      gcp_iac_ref:
        type: string
        required: false
        default: 54e9f7ed2782f1d30befda6a70615168bcc44921
      aws_region:
        type: string
        required: false
        default: ap-northeast-1
      aws_role_arn:
        type: string
        required: false
        default: ''
permissions:
  id-token: write
  contents: read

env:
  PROJECT: ${{ inputs.project || github.event.inputs.project || 'svc.plus' }}
  CLOUD_PROVIDER: ${{ inputs.cloud_provider || github.event.inputs.cloud_provider || 'aws-cloud' }}
  DEPLOY_ENV: ${{ github.event_name == 'push' && (github.ref == 'refs/heads/main' && 'uat' || ((startsWith(github.ref, 'refs/heads/release/v') || startsWith(github.ref, 'refs/tags/v')) && 'prod' || 'sit')) || inputs.vault_env_path || github.event.inputs.vault_env_path || 'sit' }}
  DEPLOY_ACTION: ${{ inputs.deploy_action || github.event.inputs.deploy_action || 'plan' }}
  AWS_REGION: ${{ inputs.aws_region || github.event.inputs.aws_region || 'ap-northeast-1' }}
  AWS_ROLE_ARN: ${{ inputs.aws_role_arn || github.event.inputs.aws_role_arn || vars.AWS_IAC_ROLE_ARN }}
  GCP_ACCOUNT_ID: ${{ inputs.gcp_account_id || github.event.inputs.gcp_account_id || 'xworktech' }}
  STATE_ACCOUNT: ${{ inputs.state_account || github.event.inputs.state_account || 'default' }}
  GITOPS_REPO_ROOT: gitops
  TF_WORKDIR: iac_modules/terraform-hcl-standard/${{ inputs.cloud_provider || github.event.inputs.cloud_provider || 'aws-cloud' }}/component/landingzone
  CONFIG_DIR: gitops/${{ inputs.project || github.event.inputs.project || 'svc.plus' }}/${{ github.event_name == 'push' && (github.ref == 'refs/heads/main' && 'uat' || ((startsWith(github.ref, 'refs/heads/release/v') || startsWith(github.ref, 'refs/tags/v')) && 'prod' || 'sit')) || inputs.vault_env_path || github.event.inputs.vault_env_path || 'sit' }}/${{ inputs.cloud_provider || github.event.inputs.cloud_provider || 'aws-cloud' }}

jobs:
  landingzone:
    name: "Deploy LandingZone Baseline"
    if: env.CLOUD_PROVIDER != 'gcp-cloud'
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Toolkit
      uses: actions/checkout@v7

    - name: Checkout iac_modules
      uses: actions/checkout@v7
      with:
        repository: ai-workspace-infra/iac_modules
        path: iac_modules

    - name: Load Vault secrets
      id: vault
      uses: hashicorp/vault-action@v4
      with:
        url: https://vault.svc.plus
        method: jwt
        role: github-actions-platform-ops-toolkit-${{ env.DEPLOY_ENV }}
        jwtGithubAudience: vault
        secrets: |
          kv/data/CICD/${{ env.DEPLOY_ENV }}/iac_state TF_STATE_ENDPOINT | TF_STATE_ENDPOINT ;
          kv/data/CICD/${{ env.DEPLOY_ENV }}/iac_state TF_STATE_BUCKET | TF_STATE_BUCKET ;
          kv/data/CICD/${{ env.DEPLOY_ENV }}/iac_state TF_STATE_ACCESS_KEY | TF_STATE_ACCESS_KEY ;
          kv/data/CICD/${{ env.DEPLOY_ENV }}/iac_state TF_STATE_SECRET_KEY | TF_STATE_SECRET_KEY ;
          kv/data/CICD/${{ env.DEPLOY_ENV }}/iac_state TF_STATE_REGION | TF_STATE_REGION

    - name: Setup IaC Environment
      uses: ./.github/actions/setup-iac-env
      with:
        gitops_repo_name: ${{ inputs.gitops_repo_name || github.event.inputs.gitops_repo_name || 'https://github.com/cloud-neutral-workshop/gitops.git' }}
        gitops_repo_ref: ${{ inputs.gitops_repo_ref || github.event.inputs.gitops_repo_ref || 'main' }}
        gitops_target_path: ${{ env.GITOPS_REPO_ROOT }}
        aws_region: ${{ env.AWS_REGION }}
        aws_role_arn: ${{ env.CLOUD_PROVIDER == 'aws-cloud' && env.AWS_ROLE_ARN || '' }}

    - name: Configure GCP credentials through Vault JWT and Google WIF
      if: env.CLOUD_PROVIDER == 'gcp-cloud'
      uses: ./.github/actions/configure-gcp-oidc
      with:
        environment: ${{ env.DEPLOY_ENV }}
        account_id: ${{ env.GCP_ACCOUNT_ID }}

    - name: Terraform Init (LandingZone)
      env:
        TF_CLI_ARGS_init: >-
          -backend-config="endpoint=${{ steps.vault.outputs.TF_STATE_ENDPOINT }}"
          -backend-config="bucket=${{ steps.vault.outputs.TF_STATE_BUCKET }}"
          -backend-config="key=terraform/${{ env.DEPLOY_ENV }}/${{ env.PROJECT }}/${{ env.CLOUD_PROVIDER }}/${{ env.STATE_ACCOUNT }}/landingzone/terraform.tfstate"
          -backend-config="access_key=${{ steps.vault.outputs.TF_STATE_ACCESS_KEY }}"
          -backend-config="secret_key=${{ steps.vault.outputs.TF_STATE_SECRET_KEY }}"
          -backend-config="region=${{ steps.vault.outputs.TF_STATE_REGION }}"
          -backend-config="skip_credentials_validation=true"
          -backend-config="skip_metadata_api_check=true"
          -backend-config="skip_region_validation=true"
          -backend-config="use_path_style=true"
          -backend-config="use_lockfile=true"
      uses: ./.github/actions/terraform-command
      with:
        command: init
        config_dir: ${{ env.CONFIG_DIR }}
        working_directory: ${{ env.TF_WORKDIR }}

    - name: Terraform Plan (LandingZone)
      id: tfplan
      if: env.DEPLOY_ACTION == 'plan'
      working-directory: ${{ env.TF_WORKDIR }}
      run: .github/scripts/platform-ops/provision/iac-pipeline-multi-cloud-landingzone-baseline_landingzone_terraform-plan-landingzone.sh

    - name: Upload LandingZone Plan Artifact
      uses: actions/upload-artifact@v7
      with:
        name: landingzone-plan
        path: ${{ env.TF_WORKDIR }}/plan_output.txt

    - name: Terraform Apply (LandingZone)
      if: env.DEPLOY_ACTION == 'apply'
      uses: ./.github/actions/terraform-command
      with:
        command: apply
        config_dir: ${{ env.CONFIG_DIR }}
        working_directory: ${{ env.TF_WORKDIR }}

    - name: Run Validation Checks
      if: env.DEPLOY_ACTION == 'apply'
      run: |-
        .github/scripts/platform-ops/provision/iac-pipeline-multi-cloud-landingzone-baseline_landingzone_run-validation-checks.sh

    - name: Load SMTP notification credentials from Vault
      id: smtp
      if: env.DEPLOY_ACTION == 'apply'
      uses: hashicorp/vault-action@v4
      with:
        url: https://vault.svc.plus
        method: jwt
        role: github-actions-platform-ops-toolkit-${{ env.DEPLOY_ENV }}
        jwtGithubAudience: vault
        secrets: |
          kv/data/CICD/${{ env.DEPLOY_ENV }} SMTP_USERNAME | SMTP_USERNAME ;
          kv/data/CICD/${{ env.DEPLOY_ENV }} SMTP_PASSWORD | SMTP_PASSWORD

    - name: Notify
      if: env.DEPLOY_ACTION == 'apply'
      env:
        SMTP_PASSWORD: ${{ steps.smtp.outputs.SMTP_PASSWORD }}
        SMTP_USERNAME: ${{ steps.smtp.outputs.SMTP_USERNAME }}
      run: |-
        .github/scripts/platform-ops/provision/iac-pipeline-multi-cloud-landingzone-baseline_landingzone_notify.sh

  gcp-platform:
    name: "Deploy GCP platform"
    if: ${{ inputs.cloud_provider == 'gcp-cloud' }}
    uses: ./.github/workflows/gcp-iac-pipeline.yml
    with:
      deploy_action: ${{ inputs.deploy_action || github.event.inputs.deploy_action || 'plan' }}
      vault_env_path: ${{ inputs.vault_env_path || github.event.inputs.vault_env_path || 'uat' }}
      gcp_account_id: ${{ inputs.gcp_account_id || github.event.inputs.gcp_account_id || 'xworktech' }}
      gcp_resource_manifest: ${{ inputs.gcp_resource_manifest || github.event.inputs.gcp_resource_manifest || '' }}
      iac_ref: ${{ inputs.gcp_iac_ref || github.event.inputs.gcp_iac_ref || '54e9f7ed2782f1d30befda6a70615168bcc44921' }}
      gitops_repo_name: ${{ inputs.gitops_repo_name || github.event.inputs.gitops_repo_name || 'https://github.com/ai-workspace-infra/gitops.git' }}
      gitops_repo_ref: ${{ inputs.gitops_repo_ref || github.event.inputs.gitops_repo_ref || 'main' }}
    secrets: inherit
