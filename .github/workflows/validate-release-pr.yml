name: Validate Release PR

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read

jobs:

  sec-qa-gate:
    name: Sec QA Gate (gitleaks)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
    - name: Checkout (full history)
      uses: actions/checkout@v7
      with:
        fetch-depth: 0

    - name: Run release quality checks
      uses: ./.github/actions/release-quality

  workflow-gating:
    name: Workflow Gating Verify
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
    - name: Checkout
      uses: actions/checkout@v7

    - name: Checkout UAT Hybrid GitOps contract
      uses: actions/checkout@v7
      with:
        repository: ai-workspace-infra/gitops
        ref: main
        path: gitops-hybrid-contract
        sparse-checkout-cone-mode: false
        sparse-checkout: |
          topology/uat/hybrid/resource-matrix.json
          resources/onwalk.net/uat/gcp/open-platform.yaml
          resources/onwalk.net/uat/gcp/web-saas.yaml
          resources/svc.plus/uat/gcp/ai-workspace.yaml
          resources/svc.plus/uat/gcp/agent-proxy-us.yaml

    - name: Install PyYAML
      run: pip install --quiet pyyaml

    - name: Verify unified multi-cloud IaC state contract
      run: python3 scripts/tests/test_iac_state_contract.py

    - name: Verify IAC self-check matrix is dry-run only
      run: bash .github/scripts/tests/platform_ops_iac_self_check_contract_test.sh

    # A broken job condition never fails a run -- it shows up as `skipped`,
    # which is indistinguishable from "deliberately not requested". These
    # invariants have to be asserted, because review does not catch them.
    - name: Verify job gating is falsifiable
      run: python3 scripts/ci/workflow_gating_verify.py

    # Terraform-phase steps live in iac_modules/scripts/pipeline and Ansible-phase
    # steps in playbooks/scripts/pipeline. A path that does not exist there only
    # fails in the middle of a provision run, so resolve every call here.
    - name: Checkout iac_modules pipeline scripts
      uses: actions/checkout@v7
      with:
        repository: ai-workspace-infra/iac_modules
        ref: main
        path: pipeline-contract/iac_modules
        sparse-checkout: scripts/pipeline

    - name: Checkout playbooks pipeline scripts
      uses: actions/checkout@v7
      with:
        repository: ai-workspace-infra/playbooks
        ref: main
        path: pipeline-contract/playbooks
        sparse-checkout-cone-mode: false
        sparse-checkout: |
          scripts/pipeline
          .github/scripts
          verify_web_saas_post_deploy.yml
          verify_agent_proxy_post_dns.yml
          roles/vhosts/web_saas_post_deploy_readiness
          roles/vhosts/agent_proxy_post_dns_readiness
          observability_operations.yml
          roles/docker/observability_server_operations
          tests/test_observability_post_dns_cutover.py

    - name: Verify every script a workflow calls exists
      run: >-
        python3 scripts/ci/workflow_script_refs_verify.py
        --iac-root pipeline-contract/iac_modules
        --playbooks-root pipeline-contract/playbooks

    # Registry readiness and digest promotion run from iac_modules; these
    # drills use fake gcloud/gh only and never touch a registry.
    - name: Verify Artifact Registry readiness wiring against the IaC executor
      env:
        IAC_REGISTRY_TEST_ROOT: ${{ github.workspace }}/pipeline-contract/iac_modules
      run: bash .github/scripts/tests/serverless_artifact_image_wait_test.sh

    - name: Verify PROD same-digest promotion without rebuilding
      env:
        IAC_REGISTRY_TEST_ROOT: ${{ github.workspace }}/pipeline-contract/iac_modules
      run: bash .github/scripts/tests/prod_same_digest_promotion_test.sh

    - name: Verify Hybrid UAT child failures cannot report green
      env:
        GITOPS_MATRIX_FILE: ${{ github.workspace }}/gitops-hybrid-contract/topology/uat/hybrid/resource-matrix.json
        GITOPS_OPEN_PLATFORM_FILE: ${{ github.workspace }}/gitops-hybrid-contract/resources/onwalk.net/uat/gcp/open-platform.yaml
        GITOPS_RESOURCE_ROOTS: ${{ github.workspace }}/gitops-hybrid-contract/resources/onwalk.net/uat/gcp:${{ github.workspace }}/gitops-hybrid-contract/resources/svc.plus/uat/gcp
      run: |
        bash .github/scripts/tests/hybrid_uat_matrix_contract_test.sh
        python3 -m unittest discover -s .github/scripts/tests -p selfhost_orchestrator_dispatch_contract_test.py
        python3 .github/scripts/tests/prod_native_standby_control_test.py
        python3 .github/scripts/tests/prod_native_init_control_test.py
        python3 .github/scripts/tests/prod_native_billing_control_test.py
        python3 .github/scripts/tests/prod_full_business_control_test.py
        python3 .github/scripts/tests/prod_managed_runtime_control_test.py

    - name: Verify UAT business evidence is required for PROD promotion
      run: python3 .github/scripts/tests/uat_business_promotion_gate_test.py

    - name: Verify Observability Vault jobs request OIDC tokens
      run: python3 .github/scripts/tests/observability_oidc_permissions_contract_test.py

    - name: Install Ansible for non-mutating DNS ownership rehearsal
      uses: ./.github/actions/setup-deployment-runner
      with:
        install_ansible: 'true'

    - name: Verify DNS provider, host acceptance and recovery owner sequence
      env:
        IAC_DNS_TEST_ROOT: ${{ github.workspace }}/pipeline-contract/iac_modules
        PLAYBOOKS_DNS_TEST_ROOT: ${{ github.workspace }}/pipeline-contract/playbooks
      run: python3 scripts/tests/test_observability_dns_owner_route.py

    - name: Checkout pinned local Grafana health owner for non-mutating rehearsal
      uses: actions/checkout@v7
      with:
        repository: ai-workspace-infra/playbooks
        ref: 49b37d3a7d35610282f5986367c3853158660457
        path: pipeline-contract/local-health-playbooks
        sparse-checkout-cone-mode: false
        sparse-checkout: |
          observability_operations.yml
          roles/docker/observability_server_operations
          tests/test_observability_local_grafana.py

    - name: Verify pinned Grafana owner route and fail-closed caller behavior
      env:
        PLAYBOOKS_LOCAL_HEALTH_TEST_ROOT: ${{ github.workspace }}/pipeline-contract/local-health-playbooks
      run: python3 scripts/tests/test_observability_local_health_owner_route.py

    # Over 25 workflow_dispatch inputs and the file stops being a workflow at
    # all -- callers included. Cheap to assert here, expensive to discover on
    # main.
    - name: Verify workflow_dispatch inputs stay within GitHub's limit
      run: bash .github/scripts/tests/workflow_dispatch_input_limit_test.sh

    - name: Verify UAT snapshot dispatch linkage
      run: bash .github/scripts/tests/daily_snapshot_uat_link_test.sh

    - name: Verify six isolated UAT Akamai namespaces and reject aggregate routing
      run: bash .github/scripts/tests/platform_ops_dispatch_contract_test.sh

    - name: Verify CMDB artifact is flat and required
      run: bash .github/scripts/tests/platform_ops_cmdb_artifact_contract_test.sh

    - name: Verify CMDB matrix ignores platform metadata
      run: bash .github/scripts/tests/platform_ops_build_deploy_matrix_test.sh

    - name: Verify UAT cleanup safety and persistent Open Platform scope
      run: |
        bash .github/scripts/tests/platform_ops_akamai_destroy_scope_contract_test.sh
        bash .github/scripts/tests/platform_ops_agent_proxy_matrix_contract_test.sh
        python3 .github/scripts/tests/platform_ops_akamai_namespace_workdir_contract_test.py

    - name: Verify production snapshot tag auto-revision
      run: bash .github/scripts/tests/daily_snapshot_prod_tag_revision_test.sh

    - name: Verify production Agent Proxy DNS scope
      run: bash .github/scripts/tests/prod_agent_proxy_dns_scope_test.sh

    - name: Verify complete-snapshot combined UAT gate
      run: bash .github/scripts/tests/daily_snapshot_uat_gate_contract_test.sh

    - name: Verify accepted UAT promotion is the only PROD source
      run: bash .github/scripts/tests/prod_accepted_uat_promotion_test.sh

    - name: Verify PROD promotion dispatch and digest manifest contract
      run: bash .github/scripts/tests/daily_snapshot_prod_manifest_test.sh

    - name: Verify immutable snapshot tag routing
      run: bash .github/scripts/tests/snapshot_tag_lookup_test.sh

    - name: Verify independent Shared ZITADEL delivery contract
      run: python3 -m unittest scripts.tests.test_zitadel_server_contract

    # The orchestrator dispatches child workflows by JSON payload; a wrong
    # input or manifest path only fails after the preceding stages already ran.
    - name: Verify Shared platform orchestration and non-destructive upgrade contract
      run: |
        python3 -m unittest scripts.tests.test_open_platform_orchestrator_contract
        python3 -m unittest scripts.tests.test_shared_platform_upgrade_safety_contract

    - name: Verify serverless then Agent Proxy dispatch ordering
      run: bash .github/scripts/tests/daily_snapshot_combined_dispatch_test.sh

    - name: Verify Daily child-run waits and Shared readiness
      run: |
        python3 .github/scripts/tests/hybrid_child_wait_test.py
        bash .github/scripts/tests/daily_snapshot_run_wait_test.sh
        bash .github/scripts/tests/shared_readiness_probe_test.sh

    - name: Verify schema request and unified execution-owner contracts
      run: |
        bash .github/scripts/tests/uat_accounts_schema_migration_contract_test.sh
        python3 .github/scripts/tests/environment_upgrade_test.py
        python3 .github/scripts/tests/environment_data_operations_test.py
        python3 .github/scripts/tests/import_receipt_test.py

    - name: Verify daily snapshot installation preflight
      run: bash .github/scripts/tests/daily_snapshot_installation_access_test.sh

    - name: Verify Daily Snapshot Services repository inventory
      run: bash .github/scripts/tests/daily_snapshot_services_repository_contract_test.sh

    - name: Verify Agent Proxy deployment variable contract
      run: bash .github/scripts/tests/platform_ops_agent_proxy_contract_test.sh

    - name: Verify regional Agent Proxy domain contract
      run: bash .github/scripts/tests/prod_agent_proxy_regional_domain_contract_test.sh

    - name: Verify AWS deploy key derivation contract
      run: bash .github/scripts/tests/aws_deploy_key_derivation_test.sh

    - name: Validate AWS selfhost rootless SSH contract
      run: bash .github/scripts/tests/aws_selfhost_rootless_ssh_test.sh

    - name: Verify pinned PEM restore owner and protected runtime inputs
      run: python3 .github/scripts/tests/caddy_pem_restore_caller_test.py

    - name: Verify post-deploy host operations use Playbooks roles
      run: python3 -m unittest scripts.tests.test_post_deploy_readiness_owner_contract

    - name: Verify Agent Proxy controller registration contract
      run: bash .github/scripts/tests/platform_ops_agent_proxy_controller_contract_test.sh

    # The non-IaC node's observability step interpolates an endpoint that the
    # job has to define. When it was missing the deployment still reported
    # success and the node simply shipped no metrics, so nothing but this
    # assertion catches it.
    - name: Verify monitor agent matrix and non-IaC observability contract
      run: bash .github/scripts/tests/platform_ops_monitor_agent_matrix_contract_test.sh

    - name: Verify AWS OIDC is resolved from GitOps
      run: bash .github/scripts/tests/aws_oidc_gitops_contract_test.sh

    - name: Verify GCP OIDC bootstrap and shared Vault IaC contract
      run: bash .github/scripts/tests/gcp_oidc_bootstrap_contract_test.sh

    - name: Verify GCP Spot VM runtime and OS Login access
      run: |
        bash .github/scripts/tests/platform_ops_gcp_runtime_reconcile_contract_test.sh
        bash .github/scripts/tests/gcp_spot_oslogin_key_test.sh

    - name: Verify Vault node deployment contracts and stage gates
      run: python3 -m unittest discover -s scripts/tests -p 'test_*.py'

    - name: Verify GCP Vault VM runtime verification contract
      run: bash .github/scripts/tests/gcp_vault_node_runtime_contract_test.sh

    - name: Verify shared GCP Vault prerequisite scripts
      run: bash scripts/tests/shared_gcp_vault_prerequisites_contract_test.sh

    - name: Verify Shared ZITADEL Vault bootstrap contract
      run: bash scripts/tests/zitadel_bootstrap_kv_contract_test.sh

    - name: Verify AWS OIDC bootstrap recovery contract
      run: bash .github/scripts/tests/aws_oidc_bootstrap_recovery_contract_test.sh

    - name: Verify canonical cloud bootstrap tree
      run: bash scripts/tests/cloud_bootstrap_layout_contract_test.sh

    - name: Verify Vault manual unseal contract
      run: bash scripts/tests/vault_unseal_local_contract_test.sh

    - name: Verify XConnect cloud-lab Vault role contract
      run: bash .github/scripts/tests/xconnect_cloud_lab_vault_role_contract_test.sh

    - name: Verify XConnect cloud-lab jobs matrix contract
      run: bash .github/scripts/tests/xconnect_cloud_lab_jobs_matrix_contract_test.sh

    - name: XConnect deployed control-plane boundary guard
      run: python3 -m unittest discover -s .github/scripts/xconnect-lab -p 'test_*.py'

    - name: Frontend Router immutable release CD contract
      run: python3 -m unittest discover -s scripts/serverless_uat -p 'test_frontend_router_release.py'

    - name: Verify Web SaaS VPS alias contract
      run: bash .github/scripts/tests/platform_ops_web_saas_public_alias_contract_test.sh

    - name: Verify serverless Cloudflare domain contract
      run: |
        bash .github/scripts/tests/serverless_cloudflare_domains_contract_test.sh
        python3 -m unittest discover -s scripts/serverless_uat -p 'test_console_dns_validation.py'
        python3 -m unittest discover -s .github/scripts/tests -p 'serverless_domain_owner_contract_test.py'

    - name: Verify serverless aliases serve without redirects
      run: bash .github/scripts/tests/serverless_public_chain_challenge_test.sh

    - name: Verify brand website review-readiness post-check contract
      run: bash .github/scripts/tests/serverless_brand_site_review_readiness_test.sh

    - name: Verify serverless Portal Accounts endpoint contract
      run: bash .github/scripts/tests/serverless_portal_accounts_endpoint_contract_test.sh

    - name: Verify serverless canonical DNS ownership guard
      run: bash .github/scripts/tests/serverless_canonical_dns_guard_test.sh

    - name: Verify serverless deployment runs in parallel before readiness
      run: bash .github/scripts/tests/serverless_orchestrator_parallelism_test.sh

    # A Pages deployment that misses the boundary assets still deploys green
    # while every SSR page silently loses its client chunks, so assert the
    # hand-off instead of relying on a smoke test.
    - name: Verify Cloudflare Pages carries the SSR boundary assets
      run: bash .github/scripts/tests/serverless_pages_edge_assets_contract_test.sh

    - name: Verify public DNS and migration concurrency boundaries
      run: bash .github/scripts/tests/public_state_concurrency_contract_test.sh

    - name: Verify serverless operation control-plane boundary
      run: bash .github/scripts/tests/serverless_boundary_migration_operation_test.sh

    # accounts answers an unlisted browser Origin with an empty 403 that reads
    # as an ordinary application error, and Origin-less curl probes stay green,
    # so this wiring has to be asserted rather than smoke-tested.
    - name: Verify Cloud Run accounts CORS origin wiring
      run: bash .github/scripts/tests/cloudrun_accounts_allowed_origins_test.sh

    # Same class of defect: a script committed 100644 dies with exit 126 and a
    # log that contains no searchable error text.
    - name: Verify shell scripts are executable
      run: bash scripts/ci/script_exec_bit_verify.sh
