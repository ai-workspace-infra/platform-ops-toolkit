name: Validate Release PR

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read

jobs:
  sec-qa-gate:
    name: Sec QA Gate (gitleaks)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
    - name: Checkout (full history)
      uses: actions/checkout@v7
      with:
        fetch-depth: 0

    - name: Run release quality checks
      uses: ./.github/actions/release-quality

  workflow-gating:
    name: Workflow Gating Verify
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
    - name: Checkout
      uses: actions/checkout@v7

    - name: Install PyYAML
      run: pip install --quiet pyyaml

    # A broken job condition never fails a run -- it shows up as `skipped`,
    # which is indistinguishable from "deliberately not requested". These
    # invariants have to be asserted, because review does not catch them.
    - name: Verify job gating is falsifiable
      run: python3 scripts/ci/workflow_gating_verify.py

    # Over 25 workflow_dispatch inputs and the file stops being a workflow at
    # all -- callers included. Cheap to assert here, expensive to discover on
    # main.
    - name: Verify workflow_dispatch inputs stay within GitHub's limit
      run: bash .github/scripts/tests/workflow_dispatch_input_limit_test.sh

    - name: Verify UAT Serverless migration source contract
      run: bash .github/scripts/tests/serverless_supabase_source_contract_test.sh

    - name: Verify Supabase migration only uses the managed SSH source path
      run: bash .github/scripts/tests/supabase_migration_ssh_only_contract_test.sh

    - name: Verify Agent Proxy deployment variable contract
      run: bash .github/scripts/tests/platform_ops_agent_proxy_contract_test.sh

    - name: Verify Web SaaS VPS alias contract
      run: bash .github/scripts/tests/platform_ops_web_saas_public_alias_contract_test.sh

    - name: Verify UAT DNS target records
      run: bash .github/scripts/tests/platform_ops_uat_dns_target_records_test.sh

    - name: Verify serverless Cloudflare domain contract
      run: bash .github/scripts/tests/serverless_cloudflare_domains_contract_test.sh

    - name: Verify serverless canonical DNS ownership guard
      run: bash .github/scripts/tests/serverless_canonical_dns_guard_test.sh

    - name: Verify serverless deployment runs in parallel before readiness
      run: bash .github/scripts/tests/serverless_orchestrator_parallelism_test.sh

    # A Pages deployment that misses the boundary assets still deploys green
    # while every SSR page silently loses its client chunks, so assert the
    # hand-off instead of relying on a smoke test.
    - name: Verify Cloudflare Pages carries the SSR boundary assets
      run: bash .github/scripts/tests/serverless_pages_edge_assets_contract_test.sh

    - name: Verify public DNS and migration concurrency boundaries
      run: bash .github/scripts/tests/public_state_concurrency_contract_test.sh

    - name: Verify serverless operation control-plane boundary
      run: bash .github/scripts/tests/serverless_boundary_migration_operation_test.sh

    # accounts answers an unlisted browser Origin with an empty 403 that reads
    # as an ordinary application error, and Origin-less curl probes stay green,
    # so this wiring has to be asserted rather than smoke-tested.
    - name: Verify Cloud Run accounts CORS origin wiring
      run: bash .github/scripts/tests/cloudrun_accounts_allowed_origins_test.sh

    # Same class of defect: a script committed 100644 dies with exit 126 and a
    # log that contains no searchable error text.
    - name: Verify shell scripts are executable
      run: bash scripts/ci/script_exec_bit_verify.sh
