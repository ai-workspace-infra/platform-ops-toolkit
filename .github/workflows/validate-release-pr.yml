name: Validate Release PR

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read

jobs:
  sensitive-information:
    name: Sensitive information check
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout (full history)
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Run release quality checks
        uses: ./.github/actions/release-quality

  tag-rules:
    name: TAG rules
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Validate immutable release tag rules
        run: bash .github/scripts/release/validate-tag-rules.sh
