name: Akamai UAT migration preflight

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: akamai-uat-migration-preflight
  cancel-in-progress: false

jobs:
  inspect:
    name: Read-only UAT state and Linode inventory
    runs-on: ubuntu-latest
    environment:
      name: uat
    env:
      VAULT_ADDR: https://vault.svc.plus
      AKAMAI_ACCOUNT: manbuzhe2026
      TF_IN_AUTOMATION: "1"
      CHECKPOINT_DISABLE: "1"
    steps:
      - name: Checkout platform-ops-toolkit
        uses: actions/checkout@v4

      - name: Checkout latest IaC modules main
        uses: actions/checkout@v4
        with:
          repository: ai-workspace-infra/iac_modules
          ref: main
          path: iac_modules

      - name: Checkout latest GitOps main
        uses: actions/checkout@v4
        with:
          repository: ai-workspace-infra/gitops
          ref: main
          path: gitops

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install manifest parser dependencies
        run: python -m pip install --disable-pip-version-check PyYAML==6.0.2 Jinja2==3.1.6

      - name: Load UAT Akamai and state read credentials from Vault
        id: vault
        uses: hashicorp/vault-action@v4
        with:
          url: https://vault.svc.plus
          method: jwt
          role: github-actions-platform-ops-toolkit-uat-akamai-oidc-bootstrap-manbuzhe2026
          jwtGithubAudience: vault
          exportToken: false
          secrets: |
            kv/data/CICD/uat/akamai-cloud/manbuzhe2026 LINODE_TOKEN | LINODE_TOKEN ;
            kv/data/CICD/uat/iac_state TF_STATE_ENDPOINT | TF_STATE_ENDPOINT ;
            kv/data/CICD/uat/iac_state TF_STATE_BUCKET | TF_STATE_BUCKET ;
            kv/data/CICD/uat/iac_state TF_STATE_ACCESS_KEY | TF_STATE_ACCESS_KEY ;
            kv/data/CICD/uat/iac_state TF_STATE_SECRET_KEY | TF_STATE_SECRET_KEY ;
            kv/data/CICD/uat/iac_state TF_STATE_REGION | TF_STATE_REGION

      - name: Set up Terraform CLI
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.10.5

      - name: Inspect legacy state and Linode resources (read-only)
        env:
          LINODE_TOKEN: ${{ steps.vault.outputs.LINODE_TOKEN }}
          TF_STATE_ENDPOINT: ${{ steps.vault.outputs.TF_STATE_ENDPOINT }}
          TF_STATE_BUCKET: ${{ steps.vault.outputs.TF_STATE_BUCKET }}
          TF_STATE_ACCESS_KEY: ${{ steps.vault.outputs.TF_STATE_ACCESS_KEY }}
          TF_STATE_SECRET_KEY: ${{ steps.vault.outputs.TF_STATE_SECRET_KEY }}
          TF_STATE_REGION: ${{ steps.vault.outputs.TF_STATE_REGION }}
          PREFLIGHT_JSON_PATH: ${{ runner.temp }}/akamai-uat-migration-preflight.json
        run: |
          set -euo pipefail
          python .github/scripts/platform-ops/provision/akamai-uat-migration-preflight.py \
            --gitops-root "$GITHUB_WORKSPACE/gitops" \
            --iac-root "$GITHUB_WORKSPACE/iac_modules" \
            --output "$PREFLIGHT_JSON_PATH"

      - name: Upload sanitized preflight JSON
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: akamai-uat-migration-preflight
          path: ${{ runner.temp }}/akamai-uat-migration-preflight.json
          if-no-files-found: ignore
          retention-days: 7
