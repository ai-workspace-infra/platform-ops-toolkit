name: AI Aggregator v1

on:
  pull_request:
    paths:
      - '.github/workflows/ai-aggregator-v1.yml'
      - 'scripts/ci/validate_ai_aggregator_manifest.py'
  workflow_dispatch:
    inputs:
      operation:
        description: "plan validates only; stage creates non-secret host configuration"
        required: true
        default: plan
        type: choice
        options: [plan, stage]
      gitops_ref:
        description: "Immutable GitOps ref"
        required: true
        default: main
      playbooks_ref:
        description: "Immutable Playbooks ref"
        required: true
        default: main
      target:
        description: "Inventory host to inspect or stage"
        required: true
        default: jp-xhttp-contabo.svc.plus

permissions:
  contents: read
  id-token: write

concurrency:
  group: ai-aggregator-v1-${{ inputs.target || 'validation' }}
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install manifest parser
        run: pip install --quiet pyyaml
      - name: Checkout GitOps declaration
        uses: actions/checkout@v7
        with:
          repository: ai-workspace-infra/gitops
          ref: ${{ inputs.gitops_ref || 'main' }}
          path: gitops
      - name: Validate GitOps declaration
        run: python3 scripts/ci/validate_ai_aggregator_manifest.py gitops/topology/uat/selfhost/ai-aggregator.yaml

  plan:
    needs: validate
    if: ${{ github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/checkout@v7
        with:
          repository: ai-workspace-infra/playbooks
          ref: ${{ inputs.playbooks_ref }}
          path: playbooks
      - uses: actions/checkout@v7
        with:
          repository: ai-workspace-infra/gitops
          ref: ${{ inputs.gitops_ref }}
          path: gitops
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install Ansible
        run: pip install --quiet ansible-core
      - name: Check deployment syntax
        working-directory: playbooks
        run: >-
          ansible-playbook --syntax-check -i inventory.ini deploy-ai-aggregator-v1.yml
          -e ai_aggregator_manifest_file=${{ github.workspace }}/gitops/topology/uat/selfhost/ai-aggregator.yaml
      - name: Require an enabled declaration before remote staging
        if: ${{ inputs.operation == 'stage' }}
        run: >-
          grep -q '^  enabled: true$' gitops/topology/uat/selfhost/ai-aggregator.yaml

