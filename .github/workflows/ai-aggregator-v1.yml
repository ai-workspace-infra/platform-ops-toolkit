name: AI Aggregator v1

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/ai-aggregator-v1.yml'
      - 'scripts/ci/**'
      - 'scripts/verify_ai_aggregator_endpoints.sh'
      - 'docs/plans/**'
  pull_request:
    paths:
      - '.github/workflows/ai-aggregator-v1.yml'
      - 'scripts/ci/validate_ai_aggregator_manifest.py'
  workflow_dispatch:
    inputs:
      operation:
        description: "plan validates only; stage creates non-secret host configuration"
        required: true
        default: plan
        type: choice
        options: [plan, stage, activate]
      environment:
        description: "Target environment (uat: ai.onwalk.net, prod: ai.svc.plus)"
        required: true
        default: uat
        type: choice
        options: [uat, prod]
      gitops_ref:
        description: "Immutable GitOps ref"
        required: true
        default: main
      playbooks_ref:
        description: "Immutable Playbooks ref"
        required: true
        default: main
      target:
        description: "Inventory host to inspect or stage"
        required: true
        default: jp-xhttp-contabo.svc.plus

permissions:
  contents: read
  id-token: write

concurrency:
  group: ai-aggregator-v1-${{ inputs.environment || 'uat' }}-${{ inputs.target || github.head_ref || 'validation' }}
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install manifest parser
        run: pip install --quiet pyyaml
      - name: Checkout GitOps declaration
        uses: actions/checkout@v4
        with:
          repository: x-evor/gitops
          ref: ${{ inputs.gitops_ref || github.head_ref || 'main' }}
          path: gitops
      - name: Validate GitOps declarations (UAT & PROD)
        run: |
          if [ -f gitops/topology/uat/selfhost/ai-aggregator.yaml ]; then
            python3 scripts/ci/validate_ai_aggregator_manifest.py gitops/topology/uat/selfhost/ai-aggregator.yaml
          fi
          if [ -f gitops/topology/prod/selfhost/ai-aggregator.yaml ]; then
            python3 scripts/ci/validate_ai_aggregator_manifest.py gitops/topology/prod/selfhost/ai-aggregator.yaml
      - name: Scan repository and checked-out GitOps declarations for secrets
        uses: gitleaks/gitleaks-action@v2
        with:
          args: detect --source=. --no-banner --redact
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          fi

  plan:
    needs: validate
    if: ${{ github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: ai-workspace-infra/playbooks
          ref: ${{ inputs.playbooks_ref || github.head_ref || 'main' }}
          path: playbooks
      - uses: actions/checkout@v4
        with:
          repository: x-evor/gitops
          ref: ${{ inputs.gitops_ref || github.head_ref || 'main' }}
          path: gitops
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Ansible
        run: pip install --quiet ansible-core
      - name: Check deployment syntax
        working-directory: playbooks
        run: >-
          ansible-playbook --syntax-check -i localhost, deploy-ai-aggregator-v1.yml
          -e ai_aggregator_manifest_file=${{ github.workspace }}/gitops/topology/${{ inputs.environment }}/selfhost/ai-aggregator.yaml
      - name: Require an enabled declaration before remote staging
        if: ${{ inputs.operation == 'stage' || inputs.operation == 'activate' }}
        run: >-
          grep -q '^  enabled: true$' gitops/topology/${{ inputs.environment }}/selfhost/ai-aggregator.yaml

  uat-auto-deploy:
    needs: validate
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.AI_AGGREGATOR_UAT_ENABLED == 'true' }}
    runs-on: ubuntu-latest
    environment: uat
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: x-evor/gitops
          path: gitops
      - uses: actions/checkout@v4
        with:
          repository: ai-workspace-infra/playbooks
          path: playbooks
      - uses: actions/checkout@v4
        with:
          repository: ai-workspace-infra/iac_modules
          path: iac_modules
          sparse-checkout: |
            terraform-hcl-standard
      - name: Set up Terraform and Python
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: '1.9.8'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install render and Ansible dependencies
        run: pip install --quiet pyyaml jinja2 ansible-core
      - name: Resolve the UAT resource contract from GitOps
        id: contract
        env:
          GITOPS_MANIFEST: ${{ github.workspace }}/gitops/topology/uat/selfhost/ai-aggregator.yaml
        run: |
          python3 - <<'PY'
          import os
          from pathlib import Path
          import yaml

          manifest = yaml.safe_load(Path(os.environ['GITOPS_MANIFEST']).read_text())
          contract = manifest['spec']['infrastructure']['resource_contract']
          root = Path(os.environ['GITHUB_WORKSPACE']) / 'iac_modules'
          resources = root / contract['path']
          workdir = root / contract['workdir']
          if not resources.is_file():
              raise SystemExit(f'missing declared resource contract: {resources}')
          print(f'resources={resources}')
          print(f'workdir={workdir}')
          with open(os.environ['GITHUB_OUTPUT'], 'a', encoding='utf-8') as output:
              output.write(f'resources={resources}\nworkdir={workdir}\n')
          PY
      - name: Configure AWS OIDC credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_IAC_ROLE_ARN }}
          aws-region: ap-northeast-1
      - name: Login to Vault with GitHub OIDC
        id: vault_login
        env:
          VAULT_ADDR: https://vault.svc.plus
          VAULT_JWT_ROLE: ${{ vars.VAULT_JWT_ROLE }}
          ACTIONS_ID_TOKEN_REQUEST_TOKEN: ${{ env.ACTIONS_ID_TOKEN_REQUEST_TOKEN }}
          ACTIONS_ID_TOKEN_REQUEST_URL: ${{ env.ACTIONS_ID_TOKEN_REQUEST_URL }}
        run: |
          set -euo pipefail
          test -n "$VAULT_JWT_ROLE"
          oidc_token="$(curl --fail --silent --show-error \
            -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=vault" | jq -r .value)"
          vault_token="$(jq -n --arg role "$VAULT_JWT_ROLE" --arg jwt "$oidc_token" \
            '{role: $role, jwt: $jwt}' | \
            curl --fail --silent --show-error \
              --request POST --data @- "$VAULT_ADDR/v1/auth/jwt/login" | jq -r .auth.client_token)"
          test -n "$vault_token" && test "$vault_token" != "null"
          echo "::add-mask::$vault_token"
          echo "token=$vault_token" >> "$GITHUB_OUTPUT"
      - name: Render AWS UAT resources
        run: |
          python3 iac_modules/terraform-hcl-standard/aws-cloud/scripts/generate.py render \
            --resources "${{ steps.contract.outputs.resources }}" \
            --workdir "${{ steps.contract.outputs.workdir }}"
      - name: Provision AWS UAT Spot resources
        env:
          TARGET_DOMAIN_BASE: onwalk.net
          AI_AGGREGATOR_SSH_CIDR: ${{ vars.AI_AGGREGATOR_SSH_CIDR }}
          AI_AGGREGATOR_SOURCE_CIDR: ${{ vars.AI_AGGREGATOR_SOURCE_CIDR }}
          AI_AGGREGATOR_SSH_PUBLIC_KEY: ${{ vars.AI_AGGREGATOR_SSH_PUBLIC_KEY }}
        run: |
          terraform -chdir="${{ steps.contract.outputs.workdir }}" fmt -recursive
          terraform -chdir="${{ steps.contract.outputs.workdir }}" init -backend=false
          terraform -chdir="${{ steps.contract.outputs.workdir }}" validate
          terraform -chdir="${{ steps.contract.outputs.workdir }}" apply -auto-approve
          python3 iac_modules/terraform-hcl-standard/aws-cloud/scripts/generate.py inventory \
            --resources "${{ steps.contract.outputs.resources }}" \
            --workdir "${{ steps.contract.outputs.workdir }}"
      - name: Deploy non-secret system configuration
        working-directory: playbooks
        env:
          VAULT_ADDR: https://vault.svc.plus
          VAULT_TOKEN: ${{ steps.vault_login.outputs.token }}
        run: |
          ansible-playbook -i ../iac_modules/terraform-hcl-standard/aws-cloud/envs/ai-aggregator-uat/inventory.ini \
            deploy-ai-aggregator-v1.yml \
            -e ai_aggregator_operation=stage \
            -e ai_aggregator_manifest_file=${{ github.workspace }}/gitops/topology/uat/selfhost/ai-aggregator.yaml
      - name: Verify UAT endpoints
        run: ./scripts/verify_ai_aggregator_endpoints.sh
      - name: Destroy UAT Spot resources
        if: ${{ always() && steps.contract.outputs.workdir != '' }}
        run: terraform -chdir="${{ steps.contract.outputs.workdir }}" destroy -auto-approve
