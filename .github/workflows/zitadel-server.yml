name: ZITADEL server

on:
  workflow_dispatch:
    inputs:
      deploy_action:
        description: 'Independent IAM Terraform state action'
        type: choice
        required: true
        default: plan
        options: [none, plan, apply]
      service_stage:
        description: 'deploy bootstraps host prerequisites and Doco-CD GitOps; verify checks OIDC only'
        type: choice
        required: true
        default: none
        options: [none, deploy, verify]
      provider_manifest:
        description: 'Reviewed Shared IAM GitOps resource declaration'
        type: string
        default: resources/svc.plus/shared/gcp/open-platform-shared-iam.yaml
        required: true
      gitops_repo_ref:
        description: 'Reviewed GitOps ref'
        type: string
        default: main
        required: true
      iac_ref:
        description: 'Reviewed IaC ref'
        type: string
        default: main
        required: true
      playbooks_ref:
        description: 'Reviewed Playbooks ref'
        type: string
        default: main
        required: true
      vault_addr:
        description: 'Vault service address'
        type: string
        default: https://vault.svc.plus
        required: true
      dns_action:
        description: 'DNS action: none keeps the current record; update points iam.svc.plus to the declared VM'
        type: choice
        required: true
        default: none
        options: [none, update]
      cloudflare_zone_id:
        description: 'Optional Cloudflare zone ID override; otherwise resolve the active zone from iam.svc.plus'
        type: string
        required: false
        default: ''
      confirm_dns_change:
        description: 'Required acknowledgement for the public iam.svc.plus DNS update'
        type: boolean
        required: true
        default: false
      reset_unbootstrapped_confirmation:
        description: 'One-time recovery only. Type RESET-ZITADEL-DATABASE to back up and rebuild the ZITADEL database when its first-instance bootstrap never wrote the Login client PAT (refused if the PAT exists).'
        type: string
        required: false
        default: ''

permissions:
  contents: read
  id-token: write

concurrency:
  group: zitadel-server-${{ inputs.provider_manifest }}
  cancel-in-progress: false

jobs:
  declaration:
    name: Resolve Shared IAM declaration
    runs-on: ubuntu-latest
    outputs:
      account: ${{ steps.resolve.outputs.account }}
      project: ${{ steps.resolve.outputs.project }}
      node: ${{ steps.resolve.outputs.node }}
      zone: ${{ steps.resolve.outputs.zone }}
      network: ${{ steps.resolve.outputs.network }}
      domain: ${{ steps.resolve.outputs.domain }}
      gitops_sha: ${{ steps.resolve.outputs.gitops_sha }}
      zitadel_image: ${{ steps.resolve.outputs.zitadel_image }}
      zitadel_login_image: ${{ steps.resolve.outputs.zitadel_login_image }}
      doco_cd_image: ${{ steps.resolve.outputs.doco_cd_image }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: ai-workspace-infra/gitops
          ref: ${{ inputs.gitops_repo_ref }}
          path: gitops
          persist-credentials: false
      - run: python3 -m pip install 'pyyaml==6.0.2'
      - name: Resolve node identity and validate operations
        id: resolve
        run: python3 .github/scripts/service-deploy/resolve_zitadel.py
        env:
          MANIFEST: ${{ inputs.provider_manifest }}
          DEPLOY_ACTION: ${{ inputs.deploy_action }}
          SERVICE_STAGE: ${{ inputs.service_stage }}

      - name: Validate one-time recovery request
        env:
          RESET_CONFIRMATION: ${{ inputs.reset_unbootstrapped_confirmation }}
          SERVICE_STAGE: ${{ inputs.service_stage }}
          DEPLOY_ACTION: ${{ inputs.deploy_action }}
          DNS_ACTION: ${{ inputs.dns_action }}
        run: |
          set -euo pipefail
          [[ -z "${RESET_CONFIRMATION}" ]] && exit 0
          [[ "${RESET_CONFIRMATION}" == RESET-ZITADEL-DATABASE ]] || {
            echo 'reset_unbootstrapped_confirmation must be empty or exactly RESET-ZITADEL-DATABASE' >&2
            exit 1
          }
          [[ "${SERVICE_STAGE}" == deploy && "${DEPLOY_ACTION}" == none && "${DNS_ACTION}" == none ]] || {
            echo 'The ZITADEL database recovery runs only with service_stage=deploy, deploy_action=none and dns_action=none' >&2
            exit 1
          }
          echo '::warning::One-time recovery requested: the ZITADEL database is backed up and rebuilt if the Login client PAT is missing.'
      - name: Validate DNS action
        env:
          DNS_ACTION: ${{ inputs.dns_action }}
          CLOUDFLARE_ZONE_ID: ${{ inputs.cloudflare_zone_id }}
          CONFIRM_DNS_CHANGE: ${{ inputs.confirm_dns_change }}
          SERVICE_STAGE: ${{ inputs.service_stage }}
        run: |
          set -euo pipefail
          case "${DNS_ACTION}" in
            none) ;;
            update)
              [[ "${SERVICE_STAGE}" == deploy ]] || {
                echo 'dns_action=update requires service_stage=deploy' >&2
                exit 1
              }
              [[ "${CONFIRM_DNS_CHANGE}" == true ]] || {
                echo 'dns_action=update requires confirm_dns_change=true' >&2
                exit 1
              }
              if [[ -n "${CLOUDFLARE_ZONE_ID}" && ! "${CLOUDFLARE_ZONE_ID}" =~ ^[a-f0-9]{32}$ ]]; then
                echo 'cloudflare_zone_id must be empty or a 32-character hexadecimal zone ID' >&2
                exit 1
              fi
              ;;
            *) echo "unsupported dns_action=${DNS_ACTION}" >&2; exit 1 ;;
          esac

  infrastructure:
    name: Terraform | independent Shared IAM state
    needs: declaration
    if: ${{ inputs.deploy_action != 'none' }}
    uses: ./.github/workflows/gcp-iac-pipeline.yml
    with:
      deploy_action: ${{ inputs.deploy_action }}
      vault_env_path: shared
      github_environment: prod
      gcp_account_id: ${{ needs.declaration.outputs.account }}
      gcp_resource_manifest: ${{ inputs.provider_manifest }}
      gitops_repo_ref: ${{ needs.declaration.outputs.gitops_sha }}
      iac_ref: ${{ inputs.iac_ref }}
    secrets: inherit

  dns:
    name: DNS | ${{ needs.declaration.outputs.domain }}
    needs: [declaration, infrastructure]
    if: ${{ always() && !cancelled() && needs.declaration.result == 'success' && (needs.infrastructure.result == 'success' || (inputs.deploy_action == 'none' && needs.infrastructure.result == 'skipped')) && inputs.dns_action == 'update' }}
    runs-on: ubuntu-latest
    environment: prod
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Checkout reviewed IaC VM runtime executor
        uses: actions/checkout@v4
        with:
          repository: ai-workspace-infra/iac_modules
          ref: f088b7615b6d190e260eab60625ab09b351a4c25
          path: iac_modules
          persist-credentials: false
      - name: Authenticate GCP through GitHub OIDC and Vault
        uses: ./.github/actions/configure-gcp-oidc
        with:
          environment: shared
          credential_environment: shared
          account_id: ${{ needs.declaration.outputs.account }}
          vault_addr: ${{ inputs.vault_addr }}
          vault_role: github-actions-platform-ops-toolkit-shared-zitadel
          load_state_contract: 'false'
      - name: Install Google Cloud CLI
        uses: google-github-actions/setup-gcloud@v2
      - name: Start the declared IAM VM if GCP stopped it
        env:
          PROJECT_ID: ${{ needs.declaration.outputs.project }}
          NODE_NAME: ${{ needs.declaration.outputs.node }}
          NODE_ZONE: ${{ needs.declaration.outputs.zone }}
        run: python3 iac_modules/scripts/pipeline/ensure-gcp-vm-running.py --instance "${NODE_NAME}" --zone "${NODE_ZONE}" --project "${PROJECT_ID}"
      - name: Point IAM DNS to declared VM
        env:
          PROJECT_ID: ${{ needs.declaration.outputs.project }}
          NODE_NAME: ${{ needs.declaration.outputs.node }}
          NODE_ZONE: ${{ needs.declaration.outputs.zone }}
          DOMAIN: ${{ needs.declaration.outputs.domain }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_DNS_API_TOKEN }}
          CLOUDFLARE_ZONE_ID_INPUT: ${{ inputs.cloudflare_zone_id }}
        run: |
          set -euo pipefail
          : "${CLOUDFLARE_API_TOKEN:?CLOUDFLARE_DNS_API_TOKEN must be configured in the prod environment}"
          target_ip="$(gcloud compute instances describe "${NODE_NAME}" \
            --project="${PROJECT_ID}" --zone="${NODE_ZONE}" \
            --format='value(networkInterfaces[0].accessConfigs[0].natIP)')"
          [[ "${target_ip}" =~ ^([0-9]{1,3}\.){3}[0-9]{1,3}$ ]] || {
            echo 'declared IAM VM has no valid public IPv4 address' >&2
            exit 1
          }
          if [[ -n "${CLOUDFLARE_ZONE_ID_INPUT}" ]]; then
            zone_id="${CLOUDFLARE_ZONE_ID_INPUT}"
          else
            zone_name="${DOMAIN#*.}"
            zones="$(curl --fail --silent --show-error --retry 3 \
              -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
              "https://api.cloudflare.com/client/v4/zones?name=${zone_name}&status=active&per_page=20")"
            zone_id="$(jq -er '.result | if length == 1 then .[0].id else error("expected exactly one active Cloudflare zone") end' <<<"${zones}")"
          fi
          response="$(curl --fail --silent --show-error --retry 3 \
            -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
            -H 'Content-Type: application/json' \
            "https://api.cloudflare.com/client/v4/zones/${zone_id}/dns_records?type=A&name=${DOMAIN}&per_page=100" \
            )"
          [[ "$(jq -r '.success' <<<"${response}")" == true ]] || {
            echo 'Cloudflare DNS lookup failed' >&2
            exit 1
          }
          record_count="$(jq -r '.result | length' <<<"${response}")"
          payload="$(jq -n --arg name "${DOMAIN}" --arg ip "${target_ip}" \
            '{type:"A",name:$name,content:$ip,ttl:60,proxied:false}')"
          case "${record_count}" in
            0)
              curl --fail --silent --show-error --retry 3 -X POST \
                -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
                -H 'Content-Type: application/json' -d "${payload}" \
                "https://api.cloudflare.com/client/v4/zones/${zone_id}/dns_records" \
                | jq -e '.success == true' >/dev/null
              ;;
            1)
              record_id="$(jq -r '.result[0].id' <<<"${response}")"
              curl --fail --silent --show-error --retry 3 -X PUT \
                -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
                -H 'Content-Type: application/json' -d "${payload}" \
                "https://api.cloudflare.com/client/v4/zones/${zone_id}/dns_records/${record_id}" \
                | jq -e '.success == true' >/dev/null
              ;;
            *)
              echo "Cloudflare returned ${record_count} A records for ${DOMAIN}; refusing an ambiguous update" >&2
              exit 1
              ;;
          esac
          for attempt in $(seq 1 18); do
            if [[ "$(dig +short "${DOMAIN}" A | tr -d '\r' | grep -Fx "${target_ip}" || true)" == "${target_ip}" ]]; then
              echo "${DOMAIN} resolves to the declared IAM VM"
              exit 0
            fi
            sleep 5
          done
          echo "DNS update accepted but ${DOMAIN} did not resolve to ${target_ip} within 90 seconds" >&2
          exit 1

  service:
    name: ZITADEL | ${{ inputs.service_stage }}
    needs: [declaration, infrastructure, dns]
    if: ${{ always() && !cancelled() && needs.declaration.result == 'success' && (needs.infrastructure.result == 'success' || (inputs.deploy_action == 'none' && needs.infrastructure.result == 'skipped')) && (needs.dns.result == 'success' || (inputs.dns_action == 'none' && needs.dns.result == 'skipped')) && inputs.service_stage != 'none' }}
    runs-on: ubuntu-latest
    environment: prod
    timeout-minutes: 20
    env:
      VAULT_ADDR: ${{ inputs.vault_addr }}
      VAULT_ENV_PATH: shared
      PROJECT_ID: ${{ needs.declaration.outputs.project }}
      NODE_NAME: ${{ needs.declaration.outputs.node }}
      NODE_ZONE: ${{ needs.declaration.outputs.zone }}
      NETWORK_NAME: ${{ needs.declaration.outputs.network }}
      DOMAIN: ${{ needs.declaration.outputs.domain }}
      SERVICE_STAGE: ${{ inputs.service_stage }}
      ZITADEL_GITOPS_URL: https://github.com/ai-workspace-infra/gitops.git
      ZITADEL_GITOPS_SHA: ${{ needs.declaration.outputs.gitops_sha }}
      ZITADEL_IMAGE: ${{ needs.declaration.outputs.zitadel_image }}
      ZITADEL_LOGIN_IMAGE: ${{ needs.declaration.outputs.zitadel_login_image }}
      ZITADEL_DOCO_CD_IMAGE: ${{ needs.declaration.outputs.doco_cd_image }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/checkout@v4
        if: ${{ inputs.service_stage == 'deploy' }}
        with:
          repository: ai-workspace-infra/playbooks
          ref: ${{ inputs.playbooks_ref }}
          path: playbooks
          persist-credentials: false
      # Service health checks for both stages; pinned to the reviewed merge of
      # ai-workspace-infra/playbooks#568, independent of playbooks_ref.
      - name: Checkout reviewed Playbooks ZITADEL operations
        uses: actions/checkout@v4
        with:
          repository: ai-workspace-infra/playbooks
          ref: ada1ce1eea8a5c9b26f9049eafc0f9bdd1ffa685
          path: playbooks-operations
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            zitadel_operations.yml
            roles/docker/zitadel_server_operations
      # VM runtime, the OS Login key and the runner-/32 SSH rule are IaC
      # Modules operations (ai-workspace-infra/iac_modules#390 at its merge commit), pinned here.
      - name: Checkout reviewed IaC temporary SSH access executor
        if: ${{ inputs.service_stage == 'deploy' }}
        uses: actions/checkout@v4
        with:
          repository: ai-workspace-infra/iac_modules
          ref: f088b7615b6d190e260eab60625ab09b351a4c25
          path: iac_modules
          persist-credentials: false
          sparse-checkout: |
            .github/actions/auth-gcp-cloud
            scripts/pipeline
      - name: Authenticate GCP through GitHub OIDC and Vault
        if: ${{ inputs.service_stage == 'deploy' }}
        id: auth
        uses: ./.github/actions/configure-gcp-oidc
        with:
          environment: shared
          credential_environment: shared
          account_id: ${{ needs.declaration.outputs.account }}
          vault_addr: ${{ inputs.vault_addr }}
          vault_role: github-actions-platform-ops-toolkit-shared-zitadel
          load_state_contract: 'false'
      - name: Install Google Cloud CLI
        if: ${{ inputs.service_stage == 'deploy' }}
        uses: google-github-actions/setup-gcloud@v2
      - name: Read IAM and database credentials
        if: ${{ inputs.service_stage == 'deploy' }}
        uses: hashicorp/vault-action@v4
        with:
          url: ${{ inputs.vault_addr }}
          method: jwt
          role: github-actions-platform-ops-toolkit-shared-zitadel
          jwtGithubAudience: vault
          exportToken: true
          secrets: |
            kv/data/shared/iam masterkey | ZITADEL_MASTERKEY ;
            kv/data/shared/iam `zitadel-admin@iam.svc.plus` | ZITADEL_ADMIN_PASSWORD ;
            kv/data/shared/iam login_session_cookie_secret | ZITADEL_LOGIN_SESSION_COOKIE_SECRET ;
            kv/data/shared/databases postgres_root_password | POSTGRESQL_ADMIN_PASSWORD ;
            kv/data/shared/databases zitadel_pg_password | ZITADEL_PG_PASSWORD
      # The verify stage needs no host access: the Playbooks role checks OIDC
      # discovery from the runner, and a failure fails this job.
      - name: Verify ZITADEL public OIDC discovery
        if: ${{ inputs.service_stage == 'verify' }}
        working-directory: playbooks-operations
        run: |
          set -euo pipefail
          python3 -m pip install --disable-pip-version-check --quiet ansible-core
          ansible-playbook -i localhost, -c local zitadel_operations.yml \
            -e zitadel_operation=verify_public -e zitadel_operations_target=localhost \
            -e "zitadel_operations_domain=${DOMAIN}"

      - name: Check the Vault identity and IAM secrets before host access
        if: ${{ inputs.service_stage == 'deploy' }}
        env:
          AUTH_PROJECT_ID: ${{ steps.auth.outputs.project_id }}
        run: |
          set -euo pipefail
          : "${PROJECT_ID:?}" "${AUTH_PROJECT_ID:?}" "${NODE_NAME:?}" "${NODE_ZONE:?}" "${NETWORK_NAME:?}"
          : "${ZITADEL_MASTERKEY:?}" "${ZITADEL_ADMIN_PASSWORD:?}" "${ZITADEL_PG_PASSWORD:?}" "${POSTGRESQL_ADMIN_PASSWORD:?}" "${VAULT_TOKEN:?}"
          : "${ZITADEL_GITOPS_SHA:?}" "${ZITADEL_GITOPS_URL:?}" "${ZITADEL_DOCO_CD_IMAGE:?}"
          : "${ZITADEL_IMAGE:?}" "${ZITADEL_LOGIN_IMAGE:?}" "${ZITADEL_LOGIN_SESSION_COOKIE_SECRET:?}"
          [[ "${AUTH_PROJECT_ID}" == "${PROJECT_ID}" ]] || { echo 'Vault GCP identity does not match GitOps project' >&2; exit 1; }
          [[ "${#ZITADEL_MASTERKEY}" == 32 && "${ZITADEL_MASTERKEY}" != MasterkeyNeedsToHave32Characters ]] || {
            echo 'Vault must contain a non-placeholder 32-character ZITADEL masterkey' >&2; exit 1;
          }
          [[ -f playbooks/deploy_zitadel_docker.yaml ]] || { echo 'Requested ZITADEL playbook is missing' >&2; exit 1; }

      # Starts the VM if GCP stopped it, registers a one-run OS Login key and
      # allows tcp:22 from this runner only. Close below revokes both.
      - name: Open temporary SSH access to the IAM VM
        id: access
        if: ${{ inputs.service_stage == 'deploy' }}
        run: ./iac_modules/scripts/pipeline/gcp-temporary-ssh-access.sh open
        env:
          GCP_PROJECT_ID: ${{ needs.declaration.outputs.project }}
          GCP_ZONE: ${{ needs.declaration.outputs.zone }}
          GCP_INSTANCE: ${{ needs.declaration.outputs.node }}
          GCP_NETWORK: ${{ needs.declaration.outputs.network }}
          ACCESS_RULE_NAME: zitadel-ssh-${{ github.run_id }}-${{ github.run_attempt }}
          ACCESS_DIR: ${{ runner.temp }}/zitadel-access

      # ACME requires the declared public domain to resolve to this exact VM.
      - name: Require IAM DNS to point only at the IAM VM
        if: ${{ inputs.service_stage == 'deploy' }}
        shell: python
        env:
          TARGET_IP: ${{ steps.access.outputs.target_ip }}
        run: |
          import os, socket
          addresses = {item[4][0] for item in socket.getaddrinfo(os.environ["DOMAIN"], 443, socket.AF_INET)}
          if addresses != {os.environ["TARGET_IP"]}:
              raise SystemExit("IAM DNS must point exclusively to the declared VM before deployment")

      - name: Render the IAM inventory and deploy inputs
        if: ${{ inputs.service_stage == 'deploy' }}
        shell: python
        env:
          ACCESS_FILE: ${{ steps.access.outputs.access_file }}
          RESET_UNBOOTSTRAPPED_CONFIRMATION: ${{ inputs.reset_unbootstrapped_confirmation }}
        run: |
          import json, os
          from pathlib import Path
          access = json.loads(Path(os.environ["ACCESS_FILE"]).read_text())
          folder = Path(os.environ["ACCESS_FILE"]).parent
          host = os.environ["NODE_NAME"]
          if access["instance"] != host:
              raise SystemExit("temporary access was opened for another VM")
          inventory = {"all": {"hosts": {host: {
              "ansible_host": access["target_ip"], "ansible_user": access["ssh_user"],
              "ansible_ssh_private_key_file": access["private_key"],
              "ansible_ssh_common_args": f"-o StrictHostKeyChecking=accept-new -o UserKnownHostsFile={access['known_hosts']}"}}}}
          (folder / "inventory.json").write_text(json.dumps(inventory))
          extra = {"domain": os.environ["DOMAIN"], "zitadel_domain": os.environ["DOMAIN"],
                   "zitadel_deployment_mode": "doco-cd",
                   "zitadel_masterkey": os.environ["ZITADEL_MASTERKEY"],
                   "zitadel_admin_password": os.environ["ZITADEL_ADMIN_PASSWORD"],
                   "db_configs_raw": [{"db": "zitadel", "user": "zitadel_user",
                                       "env_var": "ZITADEL_PG_PASSWORD", "vault_key": "zitadel_pg_password"}]}
          # One-time, explicitly confirmed recovery; the playbook re-checks the token and
          # refuses when the Login client PAT exists.
          if os.environ.get("RESET_UNBOOTSTRAPPED_CONFIRMATION", "") == "RESET-ZITADEL-DATABASE":
              extra["zitadel_reset_unbootstrapped_instance"] = True
              extra["zitadel_reset_confirmation"] = "RESET-ZITADEL-DATABASE"
          extra_file = folder / "extra.json"
          extra_file.touch(mode=0o600)
          extra_file.write_text(json.dumps(extra))

      # The IAM wrapper owns PostgreSQL setup and imports deploy_zitadel_docker.yaml,
      # limited to the single declared host.
      - name: Deploy ZITADEL with Playbooks
        if: ${{ inputs.service_stage == 'deploy' }}
        working-directory: playbooks
        env:
          ACCESS_FILE: ${{ steps.access.outputs.access_file }}
        run: |
          set -euo pipefail
          access_dir="$(dirname "${ACCESS_FILE}")"
          python3 -m pip install --disable-pip-version-check --quiet ansible hvac psycopg2-binary
          ansible-galaxy collection install community.hashi_vault community.postgresql community.docker
          ping_output="$(ansible -i "${access_dir}/inventory.json" all --limit "${NODE_NAME}" -b -m ping)"
          grep -Fq 'SUCCESS' <<<"${ping_output}" || { echo 'IAM host did not match a reachable inventory target' >&2; exit 1; }
          export POSTGRESQL_DEPLOY_MODE=compose POSTGRESQL_CONTAINER_NAME=postgresql-svc-plus
          export WEB_SAAS_POSTGRES_PASSWORD="${POSTGRESQL_ADMIN_PASSWORD}"
          export ZITADEL_DATABASE_POSTGRES_ADMIN_PASSWORD="${POSTGRESQL_ADMIN_PASSWORD}"
          export OPEN_PLATFORM_DEPLOY_ONLY=false
          ansible-playbook -i "${access_dir}/inventory.json" deploy_iam_domain.yml \
            --limit "${NODE_NAME}" -e "@${access_dir}/extra.json"

      # Stack, bootstrap, Caddy and TLS discovery on the host, then the public
      # endpoint; on failure the role prints read-only host evidence.
      - name: Verify ZITADEL on the IAM host
        if: ${{ inputs.service_stage == 'deploy' }}
        working-directory: playbooks-operations
        env:
          ACCESS_FILE: ${{ steps.access.outputs.access_file }}
        run: |
          set -euo pipefail
          ansible-playbook -i "$(dirname "${ACCESS_FILE}")/inventory.json" zitadel_operations.yml \
            -e zitadel_operation=verify_host -e "zitadel_operations_target=${NODE_NAME}" \
            -e "zitadel_operations_domain=${DOMAIN}"
          printf '### ZITADEL server\n\n- Project: `%s`\n- Node: `%s`\n- Domain: `%s`\n- Service and OIDC discovery: passed\n' \
            "${PROJECT_ID}" "${NODE_NAME}" "${DOMAIN}" >> "${GITHUB_STEP_SUMMARY}"

      - name: Close temporary SSH access to the IAM VM
        if: ${{ always() && inputs.service_stage == 'deploy' && steps.access.outcome != 'skipped' }}
        run: ./iac_modules/scripts/pipeline/gcp-temporary-ssh-access.sh close
        env:
          GCP_PROJECT_ID: ${{ needs.declaration.outputs.project }}
          ACCESS_RULE_NAME: zitadel-ssh-${{ github.run_id }}-${{ github.run_attempt }}
          ACCESS_DIR: ${{ runner.temp }}/zitadel-access
