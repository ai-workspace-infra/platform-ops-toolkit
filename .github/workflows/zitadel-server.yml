name: ZITADEL server

on:
  workflow_dispatch:
    inputs:
      deploy_action:
        description: 'Independent IAM Terraform state action'
        type: choice
        required: true
        default: plan
        options: [none, plan, apply]
      service_stage:
        description: 'deploy bootstraps host prerequisites and Doco-CD GitOps; verify checks OIDC only'
        type: choice
        required: true
        default: none
        options: [none, deploy, verify]
      provider_manifest:
        description: 'Reviewed Shared IAM GitOps resource declaration'
        type: string
        default: resources/svc.plus/shared/gcp/open-platform-shared-iam.yaml
        required: true
      gitops_repo_ref:
        description: 'Reviewed GitOps ref'
        type: string
        default: main
        required: true
      iac_ref:
        description: 'Reviewed IaC ref'
        type: string
        default: main
        required: true
      playbooks_ref:
        description: 'Reviewed Playbooks ref'
        type: string
        default: main
        required: true
      vault_addr:
        description: 'Vault service address'
        type: string
        default: https://vault.svc.plus
        required: true
      dns_action:
        description: 'DNS action: none keeps the current record; update points iam.svc.plus to the declared VM'
        type: choice
        required: true
        default: none
        options: [none, update]
      cloudflare_zone_id:
        description: 'Optional Cloudflare zone ID override; otherwise resolve the active zone from iam.svc.plus'
        type: string
        required: false
        default: ''
      confirm_dns_change:
        description: 'Required acknowledgement for the public iam.svc.plus DNS update'
        type: boolean
        required: true
        default: false

permissions:
  contents: read
  id-token: write

concurrency:
  group: zitadel-server-${{ inputs.provider_manifest }}
  cancel-in-progress: false

jobs:
  declaration:
    name: Resolve Shared IAM declaration
    runs-on: ubuntu-latest
    outputs:
      account: ${{ steps.resolve.outputs.account }}
      project: ${{ steps.resolve.outputs.project }}
      node: ${{ steps.resolve.outputs.node }}
      zone: ${{ steps.resolve.outputs.zone }}
      network: ${{ steps.resolve.outputs.network }}
      domain: ${{ steps.resolve.outputs.domain }}
      gitops_sha: ${{ steps.resolve.outputs.gitops_sha }}
      zitadel_image: ${{ steps.resolve.outputs.zitadel_image }}
      zitadel_login_image: ${{ steps.resolve.outputs.zitadel_login_image }}
      doco_cd_image: ${{ steps.resolve.outputs.doco_cd_image }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: ai-workspace-infra/gitops
          ref: ${{ inputs.gitops_repo_ref }}
          path: gitops
          persist-credentials: false
      - run: python3 -m pip install 'pyyaml==6.0.2'
      - name: Resolve node identity and validate operations
        id: resolve
        run: python3 .github/scripts/service-deploy/resolve_zitadel.py
        env:
          MANIFEST: ${{ inputs.provider_manifest }}
          DEPLOY_ACTION: ${{ inputs.deploy_action }}
          SERVICE_STAGE: ${{ inputs.service_stage }}

      - name: Validate DNS action
        env:
          DNS_ACTION: ${{ inputs.dns_action }}
          CLOUDFLARE_ZONE_ID: ${{ inputs.cloudflare_zone_id }}
          CONFIRM_DNS_CHANGE: ${{ inputs.confirm_dns_change }}
          SERVICE_STAGE: ${{ inputs.service_stage }}
        run: |
          set -euo pipefail
          case "${DNS_ACTION}" in
            none) ;;
            update)
              [[ "${SERVICE_STAGE}" == deploy ]] || {
                echo 'dns_action=update requires service_stage=deploy' >&2
                exit 1
              }
              [[ "${CONFIRM_DNS_CHANGE}" == true ]] || {
                echo 'dns_action=update requires confirm_dns_change=true' >&2
                exit 1
              }
              if [[ -n "${CLOUDFLARE_ZONE_ID}" && ! "${CLOUDFLARE_ZONE_ID}" =~ ^[a-f0-9]{32}$ ]]; then
                echo 'cloudflare_zone_id must be empty or a 32-character hexadecimal zone ID' >&2
                exit 1
              fi
              ;;
            *) echo "unsupported dns_action=${DNS_ACTION}" >&2; exit 1 ;;
          esac

  infrastructure:
    name: Terraform | independent Shared IAM state
    needs: declaration
    if: ${{ inputs.deploy_action != 'none' }}
    uses: ./.github/workflows/gcp-iac-pipeline.yml
    with:
      deploy_action: ${{ inputs.deploy_action }}
      vault_env_path: shared
      github_environment: prod
      gcp_account_id: ${{ needs.declaration.outputs.account }}
      gcp_resource_manifest: ${{ inputs.provider_manifest }}
      gitops_repo_ref: ${{ needs.declaration.outputs.gitops_sha }}
      iac_ref: ${{ inputs.iac_ref }}
    secrets: inherit

  dns:
    name: DNS | ${{ needs.declaration.outputs.domain }}
    needs: [declaration, infrastructure]
    if: ${{ always() && !cancelled() && needs.declaration.result == 'success' && (needs.infrastructure.result == 'success' || (inputs.deploy_action == 'none' && needs.infrastructure.result == 'skipped')) && inputs.dns_action == 'update' }}
    runs-on: ubuntu-latest
    environment: prod
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Authenticate GCP through GitHub OIDC and Vault
        uses: ./.github/actions/configure-gcp-oidc
        with:
          environment: shared
          credential_environment: shared
          account_id: ${{ needs.declaration.outputs.account }}
          vault_addr: ${{ inputs.vault_addr }}
          vault_role: github-actions-platform-ops-toolkit-shared-zitadel
          load_state_contract: 'false'
      - name: Install Google Cloud CLI
        uses: google-github-actions/setup-gcloud@v2
      - name: Point IAM DNS to declared VM
        env:
          PROJECT_ID: ${{ needs.declaration.outputs.project }}
          NODE_NAME: ${{ needs.declaration.outputs.node }}
          NODE_ZONE: ${{ needs.declaration.outputs.zone }}
          DOMAIN: ${{ needs.declaration.outputs.domain }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_DNS_API_TOKEN }}
          CLOUDFLARE_ZONE_ID_INPUT: ${{ inputs.cloudflare_zone_id }}
        run: |
          set -euo pipefail
          : "${CLOUDFLARE_API_TOKEN:?CLOUDFLARE_DNS_API_TOKEN must be configured in the prod environment}"
          target_ip="$(gcloud compute instances describe "${NODE_NAME}" \
            --project="${PROJECT_ID}" --zone="${NODE_ZONE}" \
            --format='value(networkInterfaces[0].accessConfigs[0].natIP)')"
          [[ "${target_ip}" =~ ^([0-9]{1,3}\.){3}[0-9]{1,3}$ ]] || {
            echo 'declared IAM VM has no valid public IPv4 address' >&2
            exit 1
          }
          if [[ -n "${CLOUDFLARE_ZONE_ID_INPUT}" ]]; then
            zone_id="${CLOUDFLARE_ZONE_ID_INPUT}"
          else
            zone_name="${DOMAIN#*.}"
            zones="$(curl --fail --silent --show-error --retry 3 \
              -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
              "https://api.cloudflare.com/client/v4/zones?name=${zone_name}&status=active&per_page=20")"
            zone_id="$(jq -er '.result | if length == 1 then .[0].id else error("expected exactly one active Cloudflare zone") end' <<<"${zones}")"
          fi
          response="$(curl --fail --silent --show-error --retry 3 \
            -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
            -H 'Content-Type: application/json' \
            "https://api.cloudflare.com/client/v4/zones/${zone_id}/dns_records?type=A&name=${DOMAIN}&per_page=100" \
            )"
          [[ "$(jq -r '.success' <<<"${response}")" == true ]] || {
            echo 'Cloudflare DNS lookup failed' >&2
            exit 1
          }
          record_count="$(jq -r '.result | length' <<<"${response}")"
          payload="$(jq -n --arg name "${DOMAIN}" --arg ip "${target_ip}" \
            '{type:"A",name:$name,content:$ip,ttl:60,proxied:false}')"
          case "${record_count}" in
            0)
              curl --fail --silent --show-error --retry 3 -X POST \
                -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
                -H 'Content-Type: application/json' -d "${payload}" \
                "https://api.cloudflare.com/client/v4/zones/${zone_id}/dns_records" \
                | jq -e '.success == true' >/dev/null
              ;;
            1)
              record_id="$(jq -r '.result[0].id' <<<"${response}")"
              curl --fail --silent --show-error --retry 3 -X PUT \
                -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
                -H 'Content-Type: application/json' -d "${payload}" \
                "https://api.cloudflare.com/client/v4/zones/${zone_id}/dns_records/${record_id}" \
                | jq -e '.success == true' >/dev/null
              ;;
            *)
              echo "Cloudflare returned ${record_count} A records for ${DOMAIN}; refusing an ambiguous update" >&2
              exit 1
              ;;
          esac
          for attempt in $(seq 1 18); do
            if [[ "$(dig +short "${DOMAIN}" A | tr -d '\r' | grep -Fx "${target_ip}" || true)" == "${target_ip}" ]]; then
              echo "${DOMAIN} resolves to the declared IAM VM"
              exit 0
            fi
            sleep 5
          done
          echo "DNS update accepted but ${DOMAIN} did not resolve to ${target_ip} within 90 seconds" >&2
          exit 1

  service:
    name: ZITADEL | ${{ inputs.service_stage }}
    needs: [declaration, infrastructure, dns]
    if: ${{ always() && !cancelled() && needs.declaration.result == 'success' && (needs.infrastructure.result == 'success' || (inputs.deploy_action == 'none' && needs.infrastructure.result == 'skipped')) && (needs.dns.result == 'success' || (inputs.dns_action == 'none' && needs.dns.result == 'skipped')) && inputs.service_stage != 'none' }}
    runs-on: ubuntu-latest
    environment: prod
    timeout-minutes: 20
    env:
      VAULT_ADDR: ${{ inputs.vault_addr }}
      VAULT_ENV_PATH: shared
      PROJECT_ID: ${{ needs.declaration.outputs.project }}
      NODE_NAME: ${{ needs.declaration.outputs.node }}
      NODE_ZONE: ${{ needs.declaration.outputs.zone }}
      NETWORK_NAME: ${{ needs.declaration.outputs.network }}
      DOMAIN: ${{ needs.declaration.outputs.domain }}
      SERVICE_STAGE: ${{ inputs.service_stage }}
      ZITADEL_GITOPS_URL: https://github.com/ai-workspace-infra/gitops.git
      ZITADEL_GITOPS_SHA: ${{ needs.declaration.outputs.gitops_sha }}
      ZITADEL_IMAGE: ${{ needs.declaration.outputs.zitadel_image }}
      ZITADEL_LOGIN_IMAGE: ${{ needs.declaration.outputs.zitadel_login_image }}
      ZITADEL_DOCO_CD_IMAGE: ${{ needs.declaration.outputs.doco_cd_image }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/checkout@v4
        if: ${{ inputs.service_stage == 'deploy' }}
        with:
          repository: ai-workspace-infra/playbooks
          ref: ${{ inputs.playbooks_ref }}
          path: playbooks
          persist-credentials: false
      - name: Authenticate GCP through GitHub OIDC and Vault
        if: ${{ inputs.service_stage == 'deploy' }}
        id: auth
        uses: ./.github/actions/configure-gcp-oidc
        with:
          environment: shared
          credential_environment: shared
          account_id: ${{ needs.declaration.outputs.account }}
          vault_addr: ${{ inputs.vault_addr }}
          vault_role: github-actions-platform-ops-toolkit-shared-zitadel
          load_state_contract: 'false'
      - name: Install Google Cloud CLI
        if: ${{ inputs.service_stage == 'deploy' }}
        uses: google-github-actions/setup-gcloud@v2
      - name: Read IAM and database credentials
        if: ${{ inputs.service_stage == 'deploy' }}
        uses: hashicorp/vault-action@v4
        with:
          url: ${{ inputs.vault_addr }}
          method: jwt
          role: github-actions-platform-ops-toolkit-shared-zitadel
          jwtGithubAudience: vault
          exportToken: true
          secrets: |
            kv/data/shared/iam masterkey | ZITADEL_MASTERKEY ;
            kv/data/shared/iam `zitadel-admin@iam.svc.plus` | ZITADEL_ADMIN_PASSWORD ;
            kv/data/shared/iam login_session_cookie_secret | ZITADEL_LOGIN_SESSION_COOKIE_SECRET ;
            kv/data/shared/databases postgres_root_password | POSTGRESQL_ADMIN_PASSWORD ;
            kv/data/shared/databases zitadel_pg_password | ZITADEL_PG_PASSWORD
      - name: Deploy or verify ZITADEL
        run: bash .github/scripts/service-deploy/zitadel.sh
        env:
          AUTH_PROJECT_ID: ${{ steps.auth.outputs.project_id }}
