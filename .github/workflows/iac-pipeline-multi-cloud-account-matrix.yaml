name: Compatibility / iac-pipeline-multi-cloud-account-matrix
'on':
  workflow_dispatch:
    inputs:
      deploy_action:
        type: choice
        options:
          - plan
          - apply
          - destroy
        default: plan
      project:
        description: "\u73AF\u5883(\u9879\u76EE) / Project (Base Domain)"
        type: string
        default: ''
        required: false
      vault_env_path:
        description: Vault environment (e.g. sit, uat, prod)
        type: choice
        options:
          - sit
          - uat
          - prod
        default: sit
      cloud_provider:
        description: "\u670D\u52A1\u5546 / Cloud Provider"
        type: choice
        required: true
        options:
          - aws-cloud
          - gcp-cloud
          - azure-cloud
          - vultr-vps
      state_account:
        description: Canonical state account segment
        type: string
        required: false
        default: ''
      components_json:
        description: "\u8D26\u53F7\u5C42\u7EA7\u7EC4\u4EF6\u9009\u62E9 (JSON\u6570\u7EC4\u683C\u5F0F\uFF0C\u5982 [\"vpc\",\"role\"])"
        type: string
        default: '[]'
      gitops_repo_name:
        description: GitOps repository (URL or owner/repo)
        type: string
        default: ''
        required: false
      gitops_repo_ref:
        description: GitOps repo ref (branch/tag/sha) to use
        type: string
        default: ''
        required: false
      gcp_account_id:
        description: GCP account identifier used for Vault JWT/WIF authentication
        type: string
        default: ''
        required: false
      gcp_resource_manifest:
        description: Optional GCP GitOps manifest path
        type: string
        default: ''
      gcp_iac_ref:
        description: Pinned iac_modules ref used for GCP
        type: string
        default: ''
        required: false
      target_manifest:
        description: Reviewed IaCPipelineTargets path; missing/ambiguous legacy identity fails closed
        type: string
        required: false
        default: ''
      iac_ref:
        description: Owner code/module revision
        type: string
        required: false
        default: ''
      gitops_ref:
        description: Fixed declaration revision or explicitly selected ref
        type: string
        required: false
        default: ''
  workflow_call:
    inputs:
      deploy_action:
        type: string
        required: false
        default: plan
      project:
        type: string
        required: false
        default: ''
      vault_env_path:
        type: string
        required: false
        default: sit
      cloud_provider:
        type: string
        required: true
      state_account:
        type: string
        required: false
        default: ''
      components_json:
        type: string
        required: false
        default: '[]'
      gitops_repo_name:
        type: string
        required: false
        default: ''
      gitops_repo_ref:
        type: string
        required: false
        default: ''
      gcp_account_id:
        type: string
        required: false
        default: ''
      gcp_resource_manifest:
        type: string
        required: false
        default: ''
      gcp_iac_ref:
        type: string
        required: false
        default: ''
      target_manifest:
        description: Reviewed IaCPipelineTargets path; missing/ambiguous legacy identity fails closed
        type: string
        required: false
        default: ''
      iac_ref:
        description: Owner code/module revision
        type: string
        required: false
        default: ''
      gitops_ref:
        description: Fixed declaration revision or explicitly selected ref
        type: string
        required: false
        default: ''
  push:
    branches:
      - main
      - release/**
    paths:
      - terraform-hcl-standard/**
      - .github/workflows/iac-pipeline-multi-cloud-account-matrix.yaml
  pull_request:
    paths:
      - terraform-hcl-standard/**
      - .github/workflows/iac-pipeline-multi-cloud-account-matrix.yaml
permissions:
  contents: read
  id-token: write
  actions: read
jobs:
  static-check:
    if: github.event_name == 'push' || github.event_name == 'pull_request'
    uses: ./.github/workflows/iac-self-check-matrix.yml
    with:
      action: check
    secrets: inherit
  resolve:
    runs-on: ubuntu-latest
    outputs:
      target_manifest: ${{ steps.normalize.outputs.target_manifest }}
      selectors: ${{ steps.normalize.outputs.selectors }}
      action: ${{ steps.normalize.outputs.action }}
      environment: ${{ steps.normalize.outputs.environment }}
      gitops_sha: ${{ steps.normalize.outputs.gitops_sha }}
      iac_sha: ${{ steps.normalize.outputs.iac_sha }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: ai-workspace-infra/iac_modules
          ref: ${{ inputs.iac_ref || inputs.gcp_iac_ref || 'be8456282f7495e098170e0894e742605a94dae6' }}
          path: iac_modules
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: ai-workspace-infra/gitops
          ref: ${{ inputs.gitops_ref || inputs.gitops_repo_ref || '4e052f34675a218df0179677088266c6e7f57f6c' }}
          path: gitops
          persist-credentials: false
      - id: normalize
        uses: ./iac_modules/.github/actions/iac-legacy-inputs
        with:
          inputs-json: ${{ toJSON(inputs) }}
          stage: account
          provider: ''
          iac-root: ${{ github.workspace }}/iac_modules
          gitops-root: ${{ github.workspace }}/gitops
    if: github.event_name != 'push' && github.event_name != 'pull_request'
  pipeline:
    needs: resolve
    if: ${{ !cancelled() && needs.resolve.result == 'success' }}
    uses: ./.github/workflows/iac-pipeline-multi-cloud-master.yaml
    with:
      action: ${{ needs.resolve.outputs.action }}
      environment: ${{ needs.resolve.outputs.environment }}
      target_manifest: ${{ needs.resolve.outputs.target_manifest }}
      gitops_ref: ${{ needs.resolve.outputs.gitops_sha }}
      iac_ref: ${{ needs.resolve.outputs.iac_sha }}
      stage_scope: account
      bootstrap_mode: verify
      selectors: ${{ needs.resolve.outputs.selectors }}
      correlation_id: ${{ github.run_id }}:${{ github.run_attempt }}:compat
    secrets: inherit
