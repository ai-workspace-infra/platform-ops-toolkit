name: Open Platform Orchestrator

# Shared open-platform infrastructure has an independent lifecycle from the
# UAT business matrix.  This workflow owns the shared Terraform states and
# then delegates service stages to the existing Vault/Observability workflows.
# It intentionally has no destroy operation: the shared platform is persistent.
on:
  workflow_dispatch:
    inputs:
      operation:
        description: "Shared platform action: validate, apply infrastructure, deploy/upgrade services, or migrate data"
        type: choice
        required: true
        default: plan
        options: [plan, apply, deploy, upgrade, migrate]
      target_services:
        description: "Shared services to reconcile after infrastructure"
        type: choice
        required: true
        default: all
        options: [all, vault, observability, iam]
      deploy_tag:
        description: "Immutable UAT daily-build tag for service deployment"
        type: string
        required: false
        default: ""
      gitops_repo_ref:
        description: "Reviewed GitOps ref"
        type: string
        required: true
        default: main
      iac_ref:
        description: "Reviewed iac_modules ref"
        type: string
        required: true
        default: main
      playbooks_ref:
        description: "Reviewed playbooks ref for Vault stages"
        type: string
        required: true
        default: main
      vault_addr:
        description: "Vault service address used by delegated service workflows"
        type: string
        required: true
        default: https://vault.svc.plus
      gcp_account_id:
        description: "Concrete shared GCP project/account ID"
        type: string
        required: true
        default: open-platform-shared
      vault_service_stage:
        description: "Optional Vault stage; migrate-auto is required for an explicit migration"
        type: choice
        required: true
        default: none
        options: [none, node-preflight, node-process-metrics, vault-raft-verify, vault-service-verify, migrate-auto]
      vault_confirm:
        description: "Explicit confirmation passed to the selected Vault service stage"
        type: string
        required: false
        default: ""
      observability_migration_mode:
        description: "Observability historical migration mode; none for ordinary deploy/upgrade"
        type: choice
        required: true
        default: none
        options: [none, baseline, final]
      observability_source_ip:
        description: "Retired Observability source IPv4; required for explicit history migration"
        type: string
        required: false
        default: ""
      observability_target_ip_override:
        description: "Existing Observability target IPv4; set only when migration should skip target deployment"
        type: string
        required: false
        default: ""
      observability_confirm_source_writers_paused:
        description: "Confirm source writers are paused before a final Observability sync"
        type: boolean
        required: true
        default: false
      observability_confirm_target_historical_queries:
        description: "Confirm historical Observability queries match after baseline restore"
        type: boolean
        required: true
        default: false
      observability_confirm_history_omission:
        description: "Accept omission of historical Observability data when no migration is selected"
        type: boolean
        required: true
        default: false
      zitadel_dns_action:
        description: "ZITADEL IAM DNS: none keeps the record; update points iam.svc.plus to the Shared IAM VM"
        type: choice
        required: true
        default: none
        options: [none, update]
      zitadel_cloudflare_zone_id:
        description: "Cloudflare zone ID for iam.svc.plus; required when zitadel_dns_action=update"
        type: string
        required: false
        default: ""
      zitadel_confirm_dns_change:
        description: "Acknowledge the public iam.svc.plus DNS update"
        type: boolean
        required: true
        default: false

permissions:
  actions: write
  contents: read
  id-token: write

concurrency:
  group: open-platform-orchestrator-${{ inputs.gcp_account_id }}
  cancel-in-progress: false

jobs:
  contract:
    name: Validate shared platform contract
    runs-on: ubuntu-latest
    outputs:
      terraform_action: ${{ steps.contract.outputs.terraform_action }}
    steps:
      - uses: actions/checkout@v4
      - id: contract
        env:
          OPERATION: ${{ inputs.operation }}
          TARGET_SERVICES: ${{ inputs.target_services }}
          DEPLOY_TAG: ${{ inputs.deploy_tag }}
          VAULT_STAGE: ${{ inputs.vault_service_stage }}
          OBS_MIGRATION: ${{ inputs.observability_migration_mode }}
          OBS_SOURCE_IP: ${{ inputs.observability_source_ip }}
          ACCOUNT: ${{ inputs.gcp_account_id }}
        run: |
          set -euo pipefail
          [[ "${ACCOUNT}" =~ ^[a-z][a-z0-9-]{4,28}[a-z0-9]$ ]] || { echo 'invalid shared GCP account/project id' >&2; exit 1; }
          [[ "${OPERATION}" != destroy ]] || { echo 'shared open-platform never supports destroy' >&2; exit 1; }
          if [[ "${OPERATION}" == deploy || "${OPERATION}" == upgrade ]]; then
            [[ "${DEPLOY_TAG}" =~ ^(uat-)?daily-build-[0-9]{4}\.[0-9]{2}\.[0-9]{2}(-r[1-9][0-9]*)?$ ]] || { echo 'deploy/upgrade requires an immutable daily-build tag' >&2; exit 1; }
          elif [[ "${OPERATION}" == migrate && "${OBS_MIGRATION}" != none ]]; then
            [[ "${DEPLOY_TAG}" =~ ^(uat-)?daily-build-[0-9]{4}\.[0-9]{2}\.[0-9]{2}(-r[1-9][0-9]*)?$ ]] || { echo 'observability migration requires an immutable target daily-build tag' >&2; exit 1; }
            [[ "${OBS_SOURCE_IP}" =~ ^([0-9]{1,3}\.){3}[0-9]{1,3}$ ]] || { echo 'observability migration requires an explicit source IPv4' >&2; exit 1; }
          else
            [[ -z "${DEPLOY_TAG}" ]] || { echo 'deploy_tag is only valid for deploy or upgrade' >&2; exit 1; }
          fi
          if [[ "${OPERATION}" == migrate ]]; then
            [[ "${VAULT_STAGE}" == migrate-auto || "${OBS_MIGRATION}" != none ]] || { echo 'migrate requires an explicit Vault or Observability migration stage' >&2; exit 1; }
          else
            [[ "${VAULT_STAGE}" == none && "${OBS_MIGRATION}" == none ]] || { echo 'migration controls require operation=migrate' >&2; exit 1; }
          fi
          case "${OPERATION}" in plan) echo 'terraform_action=plan' >> "${GITHUB_OUTPUT}" ;; *) echo 'terraform_action=apply' >> "${GITHUB_OUTPUT}" ;; esac

  vault-iac:
    name: Terraform | shared Vault state
    needs: contract
    if: ${{ inputs.target_services == 'all' || inputs.target_services == 'vault' }}
    uses: ./.github/workflows/gcp-iac-pipeline.yml
    with:
      deploy_action: ${{ needs.contract.outputs.terraform_action }}
      vault_env_path: shared
      github_environment: prod
      gcp_account_id: ${{ inputs.gcp_account_id }}
      gitops_repo_ref: ${{ inputs.gitops_repo_ref }}
      iac_ref: ${{ inputs.iac_ref }}
      gcp_resource_manifest: resources/svc.plus/shared/gcp/open-platform-shared-vault.yaml
    secrets: inherit

  observability-iac:
    name: Terraform | shared Observability state
    # Keep the three shared Terraform states independently addressable, while
    # making the default `target_services=all` path deterministic: Vault first,
    # then Observability, then IAM. A single-service rerun may still skip the
    # preceding state.
    needs: [contract, vault-iac]
    if: ${{ always() && needs.contract.result == 'success' && (inputs.target_services == 'all' || inputs.target_services == 'observability') && (inputs.target_services != 'all' || needs.vault-iac.result == 'success') }}
    uses: ./.github/workflows/gcp-iac-pipeline.yml
    with:
      deploy_action: ${{ needs.contract.outputs.terraform_action }}
      vault_env_path: shared
      github_environment: prod
      gcp_account_id: ${{ inputs.gcp_account_id }}
      gitops_repo_ref: ${{ inputs.gitops_repo_ref }}
      iac_ref: ${{ inputs.iac_ref }}
      gcp_resource_manifest: resources/svc.plus/shared/gcp/open-platform-shared-observability.yaml
    secrets: inherit

  iam-iac:
    name: Terraform | shared IAM state
    needs: [contract, observability-iac]
    if: ${{ always() && needs.contract.result == 'success' && (inputs.target_services == 'all' || inputs.target_services == 'iam') && (inputs.target_services != 'all' || needs.observability-iac.result == 'success') }}
    uses: ./.github/workflows/gcp-iac-pipeline.yml
    with:
      deploy_action: ${{ needs.contract.outputs.terraform_action }}
      vault_env_path: shared
      github_environment: prod
      gcp_account_id: ${{ inputs.gcp_account_id }}
      gitops_repo_ref: ${{ inputs.gitops_repo_ref }}
      iac_ref: ${{ inputs.iac_ref }}
      gcp_resource_manifest: resources/svc.plus/shared/gcp/open-platform-shared-iam.yaml
    secrets: inherit

  services:
    name: Delegate shared service stage
    needs: [contract, vault-iac, observability-iac, iam-iac]
    if: ${{ always() && needs.contract.result == 'success' && (inputs.operation == 'deploy' || inputs.operation == 'upgrade' || inputs.operation == 'migrate') && (needs.vault-iac.result == 'success' || needs.vault-iac.result == 'skipped') && (needs.observability-iac.result == 'success' || needs.observability-iac.result == 'skipped') && (needs.iam-iac.result == 'success' || needs.iam-iac.result == 'skipped') && (inputs.target_services == 'all' || inputs.target_services == 'vault' || inputs.target_services == 'observability' || inputs.target_services == 'iam') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Dispatch and wait for shared service workflows
        env:
          GH_TOKEN: ${{ github.token }}
          VAULT_STAGE: ${{ inputs.vault_service_stage }}
          VAULT_CONFIRM: ${{ inputs.vault_confirm }}
          OPERATION: ${{ inputs.operation }}
          GITOPS_REF: ${{ inputs.gitops_repo_ref }}
          IAC_REF: ${{ inputs.iac_ref }}
          PLAYBOOKS_REF: ${{ inputs.playbooks_ref }}
          VAULT_ADDR: ${{ inputs.vault_addr }}
          DEPLOY_TAG: ${{ inputs.deploy_tag }}
          OBS_MIGRATION: ${{ inputs.observability_migration_mode }}
          OBS_SOURCE_IP: ${{ inputs.observability_source_ip }}
          OBS_TARGET_IP: ${{ inputs.observability_target_ip_override }}
          OBS_WRITERS_PAUSED: ${{ inputs.observability_confirm_source_writers_paused }}
          OBS_HISTORY_VERIFIED: ${{ inputs.observability_confirm_target_historical_queries }}
          OBS_HISTORY_OMITTED: ${{ inputs.observability_confirm_history_omission }}
          ZITADEL_DNS_ACTION: ${{ inputs.zitadel_dns_action }}
          ZITADEL_ZONE_ID: ${{ inputs.zitadel_cloudflare_zone_id }}
          ZITADEL_CONFIRM_DNS: ${{ inputs.zitadel_confirm_dns_change }}
          TARGET_SERVICES: ${{ inputs.target_services }}
        run: |
          set -euo pipefail
          # Only read-only GitHub API calls are retried. A transient 5xx or
          # rate-limit answer says nothing about the child run, but used to fail
          # this parent while the child kept running. The dispatch POST itself is
          # never retried: a 5xx after an accepted dispatch would start a second
          # deployment.
          poll_interval="${CHILD_POLL_INTERVAL_SECONDS:-30}"
          max_read_failures="${CHILD_MAX_READ_FAILURES:-10}"
          dispatch_and_wait() {
            local workflow="$1" label="$2" payload="$3" started run_id="" workflow_id=""
            local state status conclusion last_status="" read_failures=0
            started="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
            for _ in $(seq 1 5); do
              workflow_id="$(gh workflow list --repo "${GITHUB_REPOSITORY}" --all --json id,path \
                --jq ".[] | select(.path == \".github/workflows/${workflow}\") | .id" 2>/dev/null | head -n 1 || true)"
              [[ -n "${workflow_id}" ]] && break
              sleep 2
            done
            [[ -n "${workflow_id}" ]] || { echo "::error::Could not resolve workflow id for ${workflow}" >&2; exit 1; }
            gh api --method POST "repos/${GITHUB_REPOSITORY}/actions/workflows/${workflow_id}/dispatches" --input - <<<"${payload}" >/dev/null
            for _ in $(seq 1 60); do
              run_id="$(gh run list --repo "${GITHUB_REPOSITORY}" --workflow "${workflow}" --event workflow_dispatch --limit 50 --json databaseId,createdAt,headBranch --jq "[.[] | select(.headBranch == \"main\" and .createdAt >= \"${started}\")] | sort_by(.createdAt) | last | .databaseId // empty" 2>/dev/null || true)"
              [[ -n "${run_id}" ]] && break
              sleep 2
            done
            [[ -n "${run_id}" ]] || { echo "::error::Could not locate ${workflow} run for ${label}" >&2; exit 1; }
            echo "${label}: dispatched ${workflow} run ${run_id}"
            while :; do
              if state="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${run_id}" --jq '[.status, (.conclusion // "")] | @tsv' 2>/dev/null)"; then
                read_failures=0
                status="${state%%$'\t'*}"
                conclusion="${state#*$'\t'}"
                [[ "${status}" == "${last_status}" ]] || echo "${label}: ${workflow} run ${run_id} is ${status}"
                last_status="${status}"
                if [[ "${status}" == completed ]]; then
                  [[ "${conclusion}" == success ]] || {
                    echo "::error::${label}: ${workflow} run ${run_id} concluded ${conclusion:-without a conclusion}" >&2
                    exit 1
                  }
                  break
                fi
              else
                read_failures=$((read_failures + 1))
                (( read_failures < max_read_failures )) || {
                  echo "::error::${label}: could not read ${workflow} run ${run_id} status ${read_failures} times in a row" >&2
                  exit 1
                }
                echo "::warning::${label}: could not read ${workflow} run ${run_id} status (${read_failures}/${max_read_failures}); retrying"
              fi
              sleep "${poll_interval}"
            done
            echo "${label}: ${workflow} run ${run_id} succeeded"
          }

          if [[ "${TARGET_SERVICES}" == all || "${TARGET_SERVICES}" == vault ]]; then
            stage="${VAULT_STAGE}"
            if [[ "${OPERATION}" != migrate && "${stage}" == none ]]; then stage=node-preflight; fi
            if [[ "${stage}" != none ]]; then
              vault_payload="$(jq -n \
                --arg ref main --arg stage "${stage}" --arg confirm "${VAULT_CONFIRM}" \
                --arg gitops "${GITOPS_REF}" --arg iac "${IAC_REF}" --arg playbooks "${PLAYBOOKS_REF}" \
                '{ref:$ref,inputs:{cloud_provider:"gcp-cloud",deploy_action:"none",service_stage:$stage,confirm:$confirm,gitops_repo_ref:$gitops,service_manifest:"resources/svc.plus/shared/vault/server.yaml",provider_manifest:"resources/svc.plus/shared/gcp/open-platform-shared-vault.yaml",iac_ref:$iac,playbooks_ref:$playbooks}}')"
              dispatch_and_wait vault-server.yml "Vault ${stage}" "${vault_payload}"
            fi
          fi

          if [[ "${TARGET_SERVICES}" == all || "${TARGET_SERVICES}" == iam ]] &&
             [[ "${OPERATION}" == deploy || "${OPERATION}" == upgrade ]]; then
            zitadel_payload="$(jq -n \
              --arg ref main --arg dns_action "${ZITADEL_DNS_ACTION}" \
              --arg zone_id "${ZITADEL_ZONE_ID}" --arg confirm_dns "${ZITADEL_CONFIRM_DNS}" \
              --arg gitops "${GITOPS_REF}" --arg iac "${IAC_REF}" --arg playbooks "${PLAYBOOKS_REF}" \
              --arg vault_addr "${VAULT_ADDR}" \
              '{ref:$ref,inputs:{deploy_action:"none",service_stage:"deploy",provider_manifest:"resources/svc.plus/shared/gcp/open-platform-shared-iam.yaml",gitops_repo_ref:$gitops,iac_ref:$iac,playbooks_ref:$playbooks,vault_addr:$vault_addr,dns_action:$dns_action,cloudflare_zone_id:$zone_id,confirm_dns_change:($confirm_dns == "true")}}')"
            dispatch_and_wait zitadel-server.yml "ZITADEL deploy" "${zitadel_payload}"
          fi

          if [[ "${TARGET_SERVICES}" == all || "${TARGET_SERVICES}" == observability ]]; then
            if [[ "${OPERATION}" != migrate || "${OBS_MIGRATION}" != none ]]; then
              observability_action=deploy
              [[ -n "${OBS_TARGET_IP}" ]] && observability_action=skip
              observability_payload="$(jq -n \
                --arg ref main --arg action "${observability_action}" --arg tag "${DEPLOY_TAG}" \
                --arg source_ref "${GITOPS_REF}" --arg source_ip "${OBS_SOURCE_IP}" --arg target_ip "${OBS_TARGET_IP}" \
                --arg migration "${OBS_MIGRATION}" --arg writers "${OBS_WRITERS_PAUSED}" \
                --arg history "${OBS_HISTORY_VERIFIED}" --arg omitted "${OBS_HISTORY_OMITTED}" \
                '{ref:$ref,inputs:{deploy_env:"uat",target_platform:"shared-gcp",gcp_account_id:"open-platform-shared",gcp_resource_manifest:"resources/svc.plus/shared/gcp/open-platform-shared-observability.yaml",deployment_action:$action,instance_plan:"2C4G",deploy_tag:$tag,source_ref:$source_ref,mcp_services:"none",source_ip:$source_ip,target_ip_override:$target_ip,verify_existing_target:false,migration_mode:$migration,data_components:"all",confirm_source_writers_paused:($writers == "true"),confirm_target_historical_queries:($history == "true"),confirm_history_omission:($omitted == "true"),dns_action:"none",confirm_dns_change:false}}')"
              dispatch_and_wait observability-server.yml "Observability ${OBS_MIGRATION:-none}" "${observability_payload}"
            fi
          fi
