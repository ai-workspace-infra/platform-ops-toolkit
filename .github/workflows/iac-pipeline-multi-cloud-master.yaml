name: Multi-cloud IaC Pipeline
'on':
  workflow_dispatch:
    inputs:
      action:
        description: check/plan/apply/destroy
        type: choice
        required: false
        default: plan
        options:
          - check
          - plan
          - apply
          - destroy
      environment:
        description: sit/uat/prod/shared
        type: choice
        required: true
        options:
          - sit
          - uat
          - prod
          - shared
      target_manifest:
        description: GitOps IaCPipelineTargets path; no implicit target fallback
        type: string
        required: true
      gitops_ref:
        description: Resolved once to a full declaration SHA
        type: string
        default: 4e052f34675a218df0179677088266c6e7f57f6c
        required: false
      iac_ref:
        description: Owner actions and modules from one resolved SHA
        type: string
        default: be8456282f7495e098170e0894e742605a94dae6
        required: false
      stage_scope:
        description: all/bootstrap/account/resources
        type: choice
        default: resources
        required: false
        options:
          - all
          - bootstrap
          - account
          - resources
      bootstrap_mode:
        description: verify/reconcile
        type: choice
        default: verify
        required: false
        options:
          - verify
          - reconcile
      correlation_id:
        description: Root caller correlation
        type: string
        default: ''
        required: false
      selectors:
        description: Optional legacy identity selectors as JSON; cannot override GitOps
        type: string
        default: '{}'
        required: false
  workflow_call:
    inputs:
      action:
        description: check/plan/apply/destroy
        type: string
        required: false
        default: plan
      environment:
        description: sit/uat/prod/shared
        type: string
        required: true
      target_manifest:
        description: GitOps IaCPipelineTargets path; no implicit target fallback
        type: string
        required: true
      gitops_ref:
        description: Resolved once to a full declaration SHA
        type: string
        default: 4e052f34675a218df0179677088266c6e7f57f6c
        required: false
      iac_ref:
        description: Owner actions and modules from one resolved SHA
        type: string
        default: be8456282f7495e098170e0894e742605a94dae6
        required: false
      stage_scope:
        description: all/bootstrap/account/resources
        type: string
        default: resources
        required: false
      bootstrap_mode:
        description: verify/reconcile
        type: string
        default: verify
        required: false
      correlation_id:
        description: Root caller correlation
        type: string
        default: ''
        required: false
      selectors:
        description: Optional legacy identity selectors as JSON; cannot override GitOps
        type: string
        default: '{}'
        required: false
    outputs:
      result:
        description: result
        value: ${{ jobs.summary.outputs.result }}
      gitops_sha:
        description: gitops_sha
        value: ${{ jobs.summary.outputs.gitops_sha }}
      iac_sha:
        description: iac_sha
        value: ${{ jobs.summary.outputs.iac_sha }}
      receipt_artifact_id:
        description: receipt_artifact_id
        value: ${{ jobs.summary.outputs.receipt_artifact_id }}
      receipt_sha256:
        description: receipt_sha256
        value: ${{ jobs.summary.outputs.receipt_sha256 }}
      inventory_artifact_id:
        description: inventory_artifact_id
        value: ${{ jobs.summary.outputs.inventory_artifact_id }}
      deploy_matrix:
        description: deploy_matrix
        value: ${{ jobs.summary.outputs.deploy_matrix }}
permissions:
  contents: read
  id-token: write
  actions: read
jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      gitops_sha: ${{ steps.targets.outputs.gitops_sha }}
      iac_sha: ${{ steps.targets.outputs.iac_sha }}
      targets: ${{ steps.targets.outputs.targets }}
      github_environment: ${{ steps.targets.outputs.github_environment }}
      contract_sha256: ${{ steps.targets.outputs.contract_sha256 }}
      correlation_id: ${{ steps.targets.outputs.correlation_id }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: ai-workspace-infra/iac_modules
          ref: ${{ inputs.iac_ref }}
          path: iac_modules
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: ai-workspace-infra/gitops
          ref: ${{ inputs.gitops_ref }}
          path: gitops
          persist-credentials: false
      - id: targets
        uses: ./iac_modules/.github/actions/iac-targets
        with:
          iac-root: ${{ github.workspace }}/iac_modules
          gitops-root: ${{ github.workspace }}/gitops
          target-manifest: ${{ inputs.target_manifest }}
          environment: ${{ inputs.environment }}
          action: ${{ inputs.action }}
          stage-scope: ${{ inputs.stage_scope }}
          bootstrap-mode: ${{ inputs.bootstrap_mode }}
          gitops-ref: ${{ inputs.gitops_ref }}
          iac-ref: ${{ inputs.iac_ref }}
          correlation-id: ${{ inputs.correlation_id }}
          selectors: ${{ inputs.selectors }}
          contract-file: ${{ runner.temp }}/iac-contract/context.json
      - uses: ./iac_modules/.github/actions/iac-self-check
        with:
          iac-root: ${{ github.workspace }}/iac_modules
          gitops-root: ${{ github.workspace }}/gitops
          providers: aws-cloud,azure-cloud,vultr-vps,gcp-cloud,ucloud,akamai-cloud
          report-file: ${{ runner.temp }}/iac-contract/static-check.json
      - uses: actions/upload-artifact@v4
        with:
          name: iac-contract-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/iac-contract
          if-no-files-found: error
          retention-days: 7
  bootstrap:
    needs:
      - prepare
    if: ${{ !cancelled() && needs.prepare.result == 'success' && (inputs.action == 'plan' || inputs.action == 'apply') && (inputs.stage_scope
      == 'all' || inputs.stage_scope == 'bootstrap') }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.prepare.outputs.targets) }}
    uses: ./.github/workflows/iac-pipeline-multi-cloud-stages.yaml
    with:
      stage: bootstrap
      action: ${{ inputs.action }}
      target_id: ${{ matrix.target_id }}
      environment: ${{ inputs.environment }}
      gitops_sha: ${{ needs.prepare.outputs.gitops_sha }}
      iac_sha: ${{ needs.prepare.outputs.iac_sha }}
      contract_sha256: ${{ needs.prepare.outputs.contract_sha256 }}
      dependency_stages: ''
      provider: ${{ matrix.provider }}
      lock_key: ${{ matrix.lock_key }}
    secrets: inherit
  account:
    needs:
      - prepare
      - bootstrap
    if: ${{ !cancelled() && needs.prepare.result == 'success' && (inputs.action == 'plan' || inputs.action == 'apply') && (inputs.stage_scope
      == 'all' || inputs.stage_scope == 'account') && (needs.bootstrap.result == 'success' || (needs.bootstrap.result == 'skipped' && inputs.stage_scope
      != 'all')) }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.prepare.outputs.targets) }}
    uses: ./.github/workflows/iac-pipeline-multi-cloud-stages.yaml
    with:
      stage: account
      action: ${{ inputs.action }}
      target_id: ${{ matrix.target_id }}
      environment: ${{ inputs.environment }}
      gitops_sha: ${{ needs.prepare.outputs.gitops_sha }}
      iac_sha: ${{ needs.prepare.outputs.iac_sha }}
      contract_sha256: ${{ needs.prepare.outputs.contract_sha256 }}
      dependency_stages: bootstrap
      provider: ${{ matrix.provider }}
      lock_key: ${{ matrix.lock_key }}
    secrets: inherit
  resources:
    needs:
      - prepare
      - bootstrap
      - account
    if: ${{ !cancelled() && needs.prepare.result == 'success' && (inputs.action == 'plan' || inputs.action == 'apply') && (inputs.stage_scope
      == 'all' || inputs.stage_scope == 'resources') && (needs.bootstrap.result == 'success' || (needs.bootstrap.result == 'skipped' && inputs.stage_scope
      != 'all')) && (needs.account.result == 'success' || (needs.account.result == 'skipped' && inputs.stage_scope != 'all')) }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.prepare.outputs.targets) }}
    uses: ./.github/workflows/iac-pipeline-multi-cloud-stages.yaml
    with:
      stage: resources
      action: ${{ inputs.action }}
      target_id: ${{ matrix.target_id }}
      environment: ${{ inputs.environment }}
      gitops_sha: ${{ needs.prepare.outputs.gitops_sha }}
      iac_sha: ${{ needs.prepare.outputs.iac_sha }}
      contract_sha256: ${{ needs.prepare.outputs.contract_sha256 }}
      dependency_stages: bootstrap,account
      provider: ${{ matrix.provider }}
      lock_key: ${{ matrix.lock_key }}
    secrets: inherit
  destroy-resources:
    needs:
      - prepare
    if: ${{ !cancelled() && needs.prepare.result == 'success' && inputs.action == 'destroy' && (inputs.stage_scope == 'all' || inputs.stage_scope
      == 'resources') }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.prepare.outputs.targets) }}
    uses: ./.github/workflows/iac-pipeline-multi-cloud-stages.yaml
    with:
      stage: resources
      action: ${{ inputs.action }}
      target_id: ${{ matrix.target_id }}
      environment: ${{ inputs.environment }}
      gitops_sha: ${{ needs.prepare.outputs.gitops_sha }}
      iac_sha: ${{ needs.prepare.outputs.iac_sha }}
      contract_sha256: ${{ needs.prepare.outputs.contract_sha256 }}
      dependency_stages: ''
      provider: ${{ matrix.provider }}
      lock_key: ${{ matrix.lock_key }}
    secrets: inherit
  destroy-account:
    needs:
      - prepare
      - destroy-resources
    if: ${{ !cancelled() && needs.prepare.result == 'success' && inputs.action == 'destroy' && (inputs.stage_scope == 'all' || inputs.stage_scope
      == 'account') && (needs.destroy-resources.result == 'success' || (needs.destroy-resources.result == 'skipped' && inputs.stage_scope != 'all'))
      }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.prepare.outputs.targets) }}
    uses: ./.github/workflows/iac-pipeline-multi-cloud-stages.yaml
    with:
      stage: account
      action: ${{ inputs.action }}
      target_id: ${{ matrix.target_id }}
      environment: ${{ inputs.environment }}
      gitops_sha: ${{ needs.prepare.outputs.gitops_sha }}
      iac_sha: ${{ needs.prepare.outputs.iac_sha }}
      contract_sha256: ${{ needs.prepare.outputs.contract_sha256 }}
      dependency_stages: resources
      provider: ${{ matrix.provider }}
      lock_key: ${{ matrix.lock_key }}
    secrets: inherit
  destroy-bootstrap:
    needs:
      - prepare
      - destroy-resources
      - destroy-account
    if: ${{ !cancelled() && needs.prepare.result == 'success' && inputs.action == 'destroy' && (inputs.stage_scope == 'all' || inputs.stage_scope
      == 'bootstrap') && (needs.destroy-resources.result == 'success' || (needs.destroy-resources.result == 'skipped' && inputs.stage_scope !=
      'all')) && (needs.destroy-account.result == 'success' || (needs.destroy-account.result == 'skipped' && inputs.stage_scope != 'all')) }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.prepare.outputs.targets) }}
    uses: ./.github/workflows/iac-pipeline-multi-cloud-stages.yaml
    with:
      stage: bootstrap
      action: ${{ inputs.action }}
      target_id: ${{ matrix.target_id }}
      environment: ${{ inputs.environment }}
      gitops_sha: ${{ needs.prepare.outputs.gitops_sha }}
      iac_sha: ${{ needs.prepare.outputs.iac_sha }}
      contract_sha256: ${{ needs.prepare.outputs.contract_sha256 }}
      dependency_stages: resources,account
      provider: ${{ matrix.provider }}
      lock_key: ${{ matrix.lock_key }}
    secrets: inherit
  summary:
    if: ${{ always() }}
    needs:
      - prepare
      - bootstrap
      - account
      - resources
      - destroy-resources
      - destroy-account
      - destroy-bootstrap
    runs-on: ubuntu-latest
    outputs:
      result: ${{ steps.summary.outputs.result }}
      gitops_sha: ${{ steps.summary.outputs.gitops_sha }}
      iac_sha: ${{ steps.summary.outputs.iac_sha }}
      receipt_sha256: ${{ steps.summary.outputs.receipt_sha256 }}
      deploy_matrix: ${{ steps.summary.outputs.deploy_matrix }}
      receipt_artifact_id: ${{ steps.receipt.outputs.artifact-id }}
      inventory_artifact_id: ${{ steps.receipt.outputs.artifact-id }}
    steps:
      - name: Fail closed when preparation failed
        if: needs.prepare.result != 'success'
        run: |-
          echo "::error::IaC preparation failed or was cancelled; resource execution is blocked."
          exit 1
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: ai-workspace-infra/iac_modules
          ref: ${{ needs.prepare.outputs.iac_sha }}
          path: iac_modules
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: ai-workspace-infra/gitops
          ref: ${{ needs.prepare.outputs.gitops_sha }}
          path: gitops
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: iac-contract-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/iac-contract
      - uses: actions/download-artifact@v4
        with:
          pattern: iac-stage-${{ github.run_id }}-${{ github.run_attempt }}-*
          path: ${{ runner.temp }}/iac-evidence
          merge-multiple: false
      - id: summary
        uses: ./iac_modules/.github/actions/iac-summary
        with:
          target-contract-file: ${{ runner.temp }}/iac-contract/context.json
          iac-root: ${{ github.workspace }}/iac_modules
          gitops-root: ${{ github.workspace }}/gitops
          evidence-dir: ${{ runner.temp }}/iac-evidence
          needs-json: ${{ toJSON(needs) }}
          output-dir: ${{ runner.temp }}/iac-summary
      - id: receipt
        uses: actions/upload-artifact@v4
        with:
          name: iac-summary-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/iac-summary
          if-no-files-found: error
          retention-days: 7
