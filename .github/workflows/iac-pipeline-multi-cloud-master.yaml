name: Multi Cloud Master Pipeline

on:
  push:
    branches: [main]
    paths:
    - '.github/workflows/iac-pipeline-multi-cloud-master.yaml'
  workflow_dispatch:
    inputs:
      deploy_action:
        description: "Deployment action"
        type: choice
        options: [plan, apply, destroy]
        default: plan
      run_landingzone:
        description: "Run LandingZone Baseline"
        type: boolean
        default: true
      run_account:
        description: "Run Account Matrix"
        type: boolean
        default: true
      run_resources:
        description: "Run Resources Matrix"
        type: boolean
        default: true
      project:
        description: "环境(项目) / Project (Base Domain, e.g. svc.plus, onwalk.net)"
        type: string
        default: svc.plus
      vault_env_path:
        description: "环境 / Vault Environment (e.g. sit, uat, prod)"
        type: choice
        options: [sit, uat, prod]
        default: sit
      cloud_provider:
        description: "服务商 / Cloud Provider (必选, 无默认值 —— 决定 terraform 模块目录、config 路径与 backend key, 选错等于部署到错误目标)"
        type: choice
        required: true
        options: [aws-cloud, gcp-cloud, azure-cloud, vultr-vps]
      accounts_components:
        description: "账号层级组件选择 (逗号分隔)"
        type: string
        default: 'vpc,role'
      resources_components:
        description: "资源层级组件选择 (逗号分隔)"
        type: string
        default: 's3,ec2'
      gitops_repo_name:
        description: "GitOps repository (URL or owner/repo)"
        type: string
        default: https://github.com/cloud-neutral-workshop/gitops.git
      gitops_repo_ref:
        description: "GitOps repo ref (branch/tag/sha) to use"
        type: string
        default: main

permissions:
  id-token: write
  contents: read

jobs:
  prepare-matrix:
    runs-on: ubuntu-latest
    outputs:
      account_components: ${{ steps.parse.outputs.account }}
      resources_components: ${{ steps.parse.outputs.resources }}
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - id: parse
      env:
        INPUT_RESOURCES_COMPONENTS_____S3_EC2_: ${{ inputs.resources_components || 's3,ec2' }}
        INPUT_ACCOUNTS_COMPONENTS_____VPC_ROLE_: ${{ inputs.accounts_components || 'vpc,role' }}
      run: |-
        .github/scripts/iac-pipeline-multi-cloud-master_prepare-matrix_step-0.sh

  landingzone:
    needs: prepare-matrix
    if: ${{ inputs.run_landingzone != false }}
    uses: ./.github/workflows/iac-pipeline-multi-cloud-landingzone-baseline.yaml
    with:
      # push (this file's own change) 走的是空 inputs 上下文, || 'apply' 会让
      # 那条路径悄悄用 apply 建资源。三个子 workflow 自己对 push/PR 的默认值
      # 都是 'plan' (workflow_dispatch 的 deploy_action 选项 default 也是
      # plan), 这里跟它们保持一致, 也保持这个文件自身声明的默认值一致。
      deploy_action: ${{ inputs.deploy_action || 'plan' }}
      project: ${{ inputs.project || 'svc.plus' }}
      vault_env_path: ${{ inputs.vault_env_path || 'sit' }}
      cloud_provider: ${{ inputs.cloud_provider }}
      gitops_repo_name: ${{ inputs.gitops_repo_name || 'https://github.com/cloud-neutral-workshop/gitops.git' }}
      gitops_repo_ref: ${{ inputs.gitops_repo_ref || 'main' }}
    secrets: inherit

  account:
    needs: [landingzone, prepare-matrix]
    if: |
      always() &&
      needs.prepare-matrix.result == 'success' &&
      (inputs.run_account != false) &&
      (needs.landingzone.result == 'success' || needs.landingzone.result == 'skipped')
    uses: ./.github/workflows/iac-pipeline-multi-cloud-account-matrix.yaml
    with:
      deploy_action: ${{ inputs.deploy_action || 'plan' }}
      project: ${{ inputs.project || 'svc.plus' }}
      vault_env_path: ${{ inputs.vault_env_path || 'sit' }}
      cloud_provider: ${{ inputs.cloud_provider }}
      components_json: ${{ needs.prepare-matrix.outputs.account_components }}
      gitops_repo_name: ${{ inputs.gitops_repo_name || 'https://github.com/cloud-neutral-workshop/gitops.git' }}
      gitops_repo_ref: ${{ inputs.gitops_repo_ref || 'main' }}
    secrets: inherit

  resources:
    needs: [account, prepare-matrix]
    if: |
      always() &&
      needs.prepare-matrix.result == 'success' &&
      (inputs.run_resources != false) &&
      (needs.account.result == 'success' || needs.account.result == 'skipped')
    uses: ./.github/workflows/iac-pipeline-multi-cloud-resources-matrix.yaml
    with:
      deploy_action: ${{ inputs.deploy_action || 'plan' }}
      project: ${{ inputs.project || 'svc.plus' }}
      vault_env_path: ${{ inputs.vault_env_path || 'sit' }}
      cloud_provider: ${{ inputs.cloud_provider }}
      components_json: ${{ needs.prepare-matrix.outputs.resources_components }}
      gitops_repo_name: ${{ inputs.gitops_repo_name || 'https://github.com/cloud-neutral-workshop/gitops.git' }}
      gitops_repo_ref: ${{ inputs.gitops_repo_ref || 'main' }}
    secrets: inherit
