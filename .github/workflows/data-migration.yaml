name: Data Migration Pipeline

on:
  workflow_call:
    inputs:
      vault_env_path:
        description: "Vault environment path (sit, uat, prod)"
        required: false
        default: "sit"
        type: string
      runner_type:
        description: "Runner environment (ubuntu-latest or self-hosted)"
        required: false
        default: "ubuntu-latest"
        type: string
      toolkit_ref:
        description: "platform-ops-toolkit Git Ref"
        required: false
        default: "main"
        type: string
      infra_ref:
        description: "playbooks Git Ref"
        required: false
        default: "main"
        type: string
      toolkit_action:
        description: "Toolkit action (e.g. migrate, backup, restore)"
        required: false
        default: "migrate"
        type: string
      migration_scope:
        description: "accounts = migratectl accounts data, site = domain-driven site migration"
        required: false
        default: "accounts"
        type: string
      accounts_dry_run:
        description: "accounts scope: preview only, never write to the target DB"
        required: false
        default: true
        type: boolean
      accounts_ref:
        description: "accounts repository Git Ref used to build migratectl"
        required: false
        default: "main"
        type: string
      accounts_transport:
        description: "ssh = run migratectl on each host (fallback); direct = runner connects to both databases"
        required: false
        default: "ssh"
        type: string
      accounts_source_host:
        description: "ssh transport: PROD source host"
        required: false
        default: "console.svc.plus"
        type: string
      accounts_target_host:
        description: "ssh transport: UAT target host"
        required: false
        default: "console-uat.onwalk.net"
        type: string
      accounts_email_filter:
        description: "ssh transport: only migrate accounts whose email matches this keyword (empty = all)"
        required: false
        default: ""
      site_target_domains:
        description: "site scope: 目标域名列表 (逗号分隔)"
        required: false
        default: "web-saas"
        type: string
      site_source_host:
        description: "site scope: 源主机名"
        required: false
        default: "web-saas"
        type: string
      site_env_suffix:
        description: "site scope: 目标环境后缀 (如 -uat)"
        required: false
        default: "-uat"
        type: string
      site_target_domain_base:
        description: "site scope: 目标基础域名 (如 onwalk.net)"
        required: false
        default: "onwalk.net"
        type: string
      site_source_domain_base:
        description: "site scope: 源基础域名 (如 svc.plus)"
        required: false
        default: "svc.plus"
        type: string
  workflow_dispatch:
    inputs:
      vault_env_path:
        description: "Vault 环境路径 (sit, uat, prod)，用于动态 secrets 读写"
        required: true
        default: "sit"
        type: choice
        options:
        - sit
        - uat
        - prod
      runner_type:
        description: "选择 Runner 环境"
        required: true
        default: "ubuntu-latest"
        type: choice
        options:
        - ubuntu-latest
        - self-hosted
      toolkit_ref:
        description: "platform-ops-toolkit 仓库的 Git Ref"
        required: false
        default: "main"
        type: string
      infra_ref:
        description: "playbooks 仓库的 Git Ref"
        required: false
        default: "main"
        type: string
      toolkit_action:
        description: "执行动作 (migrate, backup, restore)，仅 migration_scope=site 时生效"
        required: true
        default: "migrate"
        type: choice
        options: [migrate, backup, restore]
      migration_scope:
        description: "迁移范围：accounts = migratectl 账号数据迁移；site = 按站点域名驱动的整站迁移"
        required: true
        default: "accounts"
        type: choice
        options: [accounts, site]
      accounts_dry_run:
        description: "accounts 范围：只做 dry-run 预览，绝不写入目标库"
        required: false
        default: true
        type: boolean
      accounts_ref:
        description: "构建 migratectl 所用的 accounts 仓库 Git Ref"
        required: false
        default: "main"
        type: string
      accounts_transport:
        description: "ssh = 在两端主机各自本机跑 migratectl（fallback，无需数据库对外暴露）；direct = runner 直连数据库（需 runner 能到达两端 PostgreSQL）"
        required: false
        default: "ssh"
        type: choice
        options: [ssh, direct]
      accounts_source_host:
        description: "ssh 传输：PROD 源主机"
        required: false
        default: "console.svc.plus"
        type: string
      accounts_target_host:
        description: "ssh 传输：UAT 目标主机"
        required: false
        default: "console-uat.onwalk.net"
        type: string
      accounts_email_filter:
        description: "ssh 传输：只迁移邮箱匹配该关键字的账号（留空=全量）。首次演练建议填一个测试账号"
        required: false
      site_target_domains:
        description: "site scope: 目标域名列表 (逗号分隔)"
        required: false
        default: "web-saas"
        type: string
      site_source_host:
        description: "site scope: 源主机名"
        required: false
        default: "web-saas"
        type: string
      site_env_suffix:
        description: "site scope: 目标环境后缀 (如 -uat, 留空表示同级)"
        required: false
        default: "-uat"
        type: string
      site_target_domain_base:
        description: "site scope: 目标基础域名 (如 onwalk.net)"
        required: false
        default: "onwalk.net"
        type: string
      site_source_domain_base:
        description: "site scope: 源基础域名 (如 svc.plus)"
        required: false
        default: "svc.plus"
        type: string

permissions:
  contents: read
  id-token: write

concurrency:
  group: data-migration-${{ github.ref_name }}
  cancel-in-progress: false

env:
  VAULT_ADDR: https://vault.svc.plus

jobs:
  # ---------------------------------------------------------------------------
  # accounts scope: the migratectl one-way incremental migration described in
  # docs/data_migration/accounts_prod_to_uat_migration_guide.md
  #
  # Two transports, because neither database is reachable as a PostgreSQL
  # endpoint from a hosted runner -- the only public ports (PROD 5433 / UAT
  # 15433) are stunnel TLS listeners that a libpq client cannot speak to:
  #
  #   ssh     migratectl runs on each host, inside the PostgreSQL container's
  #           netns. Needs no database password (pg_hba grants `trust` on the
  #           container loopback) but does need root SSH on both hosts.
  #   direct  migratectl runs on the runner against two DSNs from Vault. Needs a
  #           runner that can reach both databases, and keeps the pipeline's only
  #           PROD credential a SELECT-only one.
  # ---------------------------------------------------------------------------
  accounts_data_migration:
    name: Migrate Accounts Data (PROD -> UAT)
    if: ${{ (inputs.migration_scope || 'accounts') == 'accounts' }}
    runs-on: ${{ inputs.runner_type || 'ubuntu-latest' }}
    env:
      VAULT_ROLE: github-actions-platform-ops-toolkit-${{ inputs.vault_env_path || 'sit' }}
      VAULT_KV_ENV: kv/data/${{ inputs.vault_env_path || 'sit' }}/accounts-migration
    steps:
    - name: Checkout repository
      uses: actions/checkout@v7
      with:
        ref: ${{ inputs.toolkit_ref || 'main' }}

    # Cheap, database-free gate: if the anti-foolishness assertions themselves
    # are broken there is no point reaching for credentials. Both transports are
    # checked regardless of which one runs -- they cost seconds.
    - name: Verify safeguard assertions
      run: .github/scripts/tests/accounts_data_migration_safeguard_test.sh

    - name: Verify SSH transport safeguard assertions
      run: .github/scripts/tests/accounts_data_migration_ssh_safeguard_test.sh

    - name: Checkout accounts service
      uses: actions/checkout@v7
      with:
        repository: ai-workspace-services/accounts
        ref: ${{ inputs.accounts_ref || 'main' }}
        path: accounts

    - name: Setup Go
      uses: actions/setup-go@v6
      with:
        go-version-file: accounts/go.mod
        cache-dependency-path: accounts/go.sum

    # One binary drives both ends on purpose: the snapshot carries a schemaHash
    # taken from the binary's embedded schema.sql, and import rejects a snapshot
    # whose hash differs. Building once is what keeps export and import agreeing.
    - name: Build migratectl
      run: .github/scripts/data-migration_accounts_build-migratectl.sh

    # ---- ssh transport -------------------------------------------------------
    - name: Load SSH key from Vault
      id: vault_ssh
      if: ${{ (inputs.accounts_transport || 'ssh') == 'ssh' }}
      uses: hashicorp/vault-action@v4
      with:
        url: ${{ env.VAULT_ADDR }}
        role: ${{ env.VAULT_ROLE }}
        method: jwt
        jwtGithubAudience: vault
        secrets: |
          kv/data/CICD/${{ inputs.vault_env_path || 'sit' }} SSH_PRIVATE_DEPLOY_KEY_B64 | VAULT_ANSIBLE_SSH_KEY_B64 ;

    - name: Configure SSH Key
      if: ${{ (inputs.accounts_transport || 'ssh') == 'ssh' }}
      env:
        VAULT_ANSIBLE_SSH_KEY_B64: ${{ steps.vault_ssh.outputs.VAULT_ANSIBLE_SSH_KEY_B64 }}
      run: .github/scripts/platform-ops_data_migration_configure-ssh-key.sh

    - name: Run accounts migration over SSH (dry_run=${{ inputs.accounts_dry_run }})
      if: ${{ (inputs.accounts_transport || 'ssh') == 'ssh' }}
      env:
        MIGRATION_SOURCE_HOST: ${{ inputs.accounts_source_host || 'console.svc.plus' }}
        MIGRATION_TARGET_HOST: ${{ inputs.accounts_target_host || 'console-uat.onwalk.net' }}
        MIGRATION_EMAIL_FILTER: ${{ inputs.accounts_email_filter }}
        MIGRATECTL_BIN: ${{ github.workspace }}/bin/migratectl
        DRY_RUN: ${{ inputs.accounts_dry_run && 'true' || 'false' }}
      run: .github/scripts/accounts_data_migration_ssh.sh

    # ---- direct transport ----------------------------------------------------
    - name: Load migration DSNs from Vault
      id: vault
      if: ${{ (inputs.accounts_transport || 'ssh') == 'direct' }}
      uses: hashicorp/vault-action@v4
      with:
        url: ${{ env.VAULT_ADDR }}
        role: ${{ env.VAULT_ROLE }}
        method: jwt
        jwtGithubAudience: vault
        secrets: |
          ${{ env.VAULT_KV_ENV }} MIGRATION_SOURCE_DSN | MIGRATION_SOURCE_DSN ;
          ${{ env.VAULT_KV_ENV }} MIGRATION_TARGET_DSN | MIGRATION_TARGET_DSN ;

    - name: Assert migration credentials are present
      if: ${{ (inputs.accounts_transport || 'ssh') == 'direct' }}
      env:
        MIGRATION_SOURCE_DSN: ${{ steps.vault.outputs.MIGRATION_SOURCE_DSN }}
        MIGRATION_TARGET_DSN: ${{ steps.vault.outputs.MIGRATION_TARGET_DSN }}
      run: .github/scripts/data-migration_accounts_assert-credentials.sh

    - name: Run accounts migration (dry_run=${{ inputs.accounts_dry_run }})
      if: ${{ (inputs.accounts_transport || 'ssh') == 'direct' }}
      env:
        MIGRATION_SOURCE_DSN: ${{ steps.vault.outputs.MIGRATION_SOURCE_DSN }}
        MIGRATION_TARGET_DSN: ${{ steps.vault.outputs.MIGRATION_TARGET_DSN }}
        MIGRATECTL_BIN: ${{ github.workspace }}/bin/migratectl
        SNAPSHOT_FILE: ${{ runner.temp }}/account-prod-snapshot.yaml
        DRY_RUN: ${{ inputs.accounts_dry_run && 'true' || 'false' }}
      run: .github/scripts/accounts_data_migration.sh

  data_migration:
    name: Migrate Site Data (Source -> Target)
    if: ${{ (inputs.migration_scope || 'accounts') == 'site' }}
    runs-on: ${{ inputs.runner_type || 'ubuntu-latest' }}
    env:
      ANSIBLE_HOST_KEY_CHECKING: "False"
      ANSIBLE_SSH_ARGS: "-o IdentityFile=~/.ssh/id_deploy -o StrictHostKeyChecking=no"
      VAULT_ROLE: github-actions-platform-ops-toolkit-${{ inputs.vault_env_path || 'sit' }}
      VAULT_KV_BASE: kv/data/CICD/${{ inputs.vault_env_path || 'sit' }}
    steps:
    - name: Download CMDB
      uses: actions/download-artifact@v8
      continue-on-error: true
      with:
        name: platform-ops-toolkit-cmdb
        path: cmdb

    - name: Checkout repository
      uses: actions/checkout@v7
      with:
        ref: ${{ inputs.toolkit_ref || 'main' }}

    - name: Checkout playbooks
      uses: actions/checkout@v7
      with:
        repository: ai-workspace-infra/playbooks
        ref: ${{ inputs.infra_ref || 'main' }}
        path: playbooks

    - name: Install Ansible
      run: ${{ github.workspace }}/.github/scripts/common_install_ansible.sh

    - name: Load Vault secrets for SSH
      id: vault
      uses: hashicorp/vault-action@v4
      with:
        url: ${{ env.VAULT_ADDR }}
        method: jwt
        role: ${{ env.VAULT_ROLE }}
        jwtGithubAudience: vault
        ignoreNotFound: true
        secrets: |
          ${{ env.VAULT_KV_BASE }} SSH_PRIVATE_DEPLOY_KEY_B64 | ANSIBLE_SSH_KEY_B64 ;
          ${{ env.VAULT_KV_BASE }} TF_STATE_BUCKET     | MIGRATION_S3_BUCKET ;
          ${{ env.VAULT_KV_BASE }} TF_STATE_ACCESS_KEY | MIGRATION_S3_ACCESS_KEY ;
          ${{ env.VAULT_KV_BASE }} TF_STATE_SECRET_KEY | MIGRATION_S3_SECRET_KEY ;
          ${{ env.VAULT_KV_BASE }} TF_STATE_REGION     | MIGRATION_S3_REGION ;
          ${{ env.VAULT_KV_BASE }} TF_STATE_ENDPOINT   | MIGRATION_S3_ENDPOINT ;

    - name: Configure SSH Key
      run: |-
        ${{ github.workspace }}/.github/scripts/platform-ops_data_migration_configure-ssh-key.sh

    - name: Export migration credentials
      run: |
        echo "VAULT_TOKEN=${{ steps.vault.outputs.vault_token }}"                       >> "$GITHUB_ENV"
        echo "MIGRATION_S3_BUCKET=${{ steps.vault.outputs.MIGRATION_S3_BUCKET }}"       >> "$GITHUB_ENV"
        echo "MIGRATION_S3_ACCESS_KEY=${{ steps.vault.outputs.MIGRATION_S3_ACCESS_KEY }}" >> "$GITHUB_ENV"
        echo "MIGRATION_S3_SECRET_KEY=${{ steps.vault.outputs.MIGRATION_S3_SECRET_KEY }}" >> "$GITHUB_ENV"
        echo "MIGRATION_S3_REGION=${{ steps.vault.outputs.MIGRATION_S3_REGION }}"       >> "$GITHUB_ENV"
        echo "MIGRATION_S3_ENDPOINT=${{ steps.vault.outputs.MIGRATION_S3_ENDPOINT }}"   >> "$GITHUB_ENV"

    - name: Run Toolkit Action (${{ inputs.toolkit_action || 'migrate' }})
      env:
        PROVISION_TOOLKIT_ACTION: ${{ inputs.toolkit_action || 'migrate' }}
        PROVISION_TARGET_DOMAINS: ${{ inputs.site_target_domains || 'web-saas' }}
        PROVISION_SOURCE_HOST: ${{ inputs.site_source_host || 'web-saas' }}
        PROVISION_ENV_SUFFIX: ${{ inputs.site_env_suffix || '-uat' }}
        PROVISION_TARGET_DOMAIN_BASE: ${{ inputs.site_target_domain_base || 'onwalk.net' }}
        PROVISION_SOURCE_DOMAIN_BASE: ${{ inputs.site_source_domain_base || 'svc.plus' }}
      run: |-
        ${{ github.workspace }}/.github/scripts/platform-ops_data_migration_run-toolkit-action-needs-provision-outputs-toolkit-action.sh
