name: Data Migration Pipeline
on:
  workflow_dispatch:
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Configure SSH Key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.DEPLOY_PRIVATE_KEY }}" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
      - name: Run SQL Command
        run: |
          ssh -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -i ~/.ssh/id_deploy ubuntu@console-uat.onwalk.net << 'INNER_EOF'
            docker exec accounts-db psql -U postgres -d accounts -c "SELECT uuid, username, role, mfa_enabled FROM users WHERE role = 'root' OR username LIKE 'admin%';"
          INNER_EOF
